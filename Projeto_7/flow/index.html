* {
  box-sizing:border-box
}

html,body,#root {
  min-height:100%;
  margin:0
}

body {
  min-width:320px;
  background:linear-gradient(180deg,#eaf0f6 0,#f5f7fa 280px,#eef2f6 100%)
}

button,input {
  font:inherit
}

button:focus-visible,input:focus-visible {
  outline:3px solid rgba(184,137,50,.28);

.app-loading {
  min-height:calc(100vh - 68px);
  display:grid;
  place-items:center;
  color:#667085
}

.toolbar {
  min-height:68px;
  height:auto;
  background:#10233f;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  gap:20px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 14px rgba(16,35,63,.2)
}

.toolbar__brand {
  display:flex;
  align-items:center;
  gap:11px;
  min-width:230px
}

.toolbar__brand>div {
  display:flex;
  flex-direction:column
}

.toolbar__brand small {
  color:#b9c8da;
  font-size:11px;
  margin-top:2px
}

.toolbar__mark {
  width:36px;
  height:36px;
  border-radius:10px;
  background:#fff;
  color:#10233f;
  display:grid;
  place-items:center;
  font-weight:800
}

.toolbar__actions {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  flex-wrap:wrap
}

.toolbar button {
  border:1px solid rgba(255,255,255,.2);
  background:#173c6b;
  color:#fff;
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
  font:inherit;
  font-size:12px
}

.toolbar button:hover:not(:disabled) {
  background:#20528f
}

.toolbar button:disabled {
  opacity:.4;
  cursor:not-allowed
}

.save-status {
  font-size:11px;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.12)
}

.save-status--error {
  background:#7f1d1d
}

.save-status--saving {
  background:#6b4c16
}

.edition-status {color:#c8d4e3; font-size:11px; white-space:nowrap}

.toolbar__modes {display:flex; gap:2px; padding:2px; border:1px solid rgba(255,255,255,.25); border-radius:8px; background:rgba(0,0,0,.12)}
.toolbar__modes button {border:0; background:transparent}
.toolbar__modes button.is-active {background:#fff; color:#10233f}

@media(max-width:900px) {
  .toolbar {
    height:auto;
    align-items:flex-start;
    padding:12px;
    flex-direction:column
  }

  .toolbar__actions {
    justify-content:flex-start
  }

  .save-status {
    order:-1
  }

}

.flow-canvas {
  width: min(1020px, calc(100% - 32px));
  margin: 24px auto 80px;
}

.flow-canvas__heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}

.flow-canvas__heading span {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #667085;
}

.flow-canvas__heading h1 {
  font-size: 25px;
  margin: 3px 0 0;
  color: #10233f;
}

.flow-canvas__heading p {
  max-width: 420px;
  margin: 0;
  color: #667085;
  font-size: 12px;
  text-align: right;
}

@media (max-width: 780px) {
  .flow-canvas {
    width: min(calc(100% - 16px), 1020px);
    margin-top: 14px;
  }

  .flow-canvas__heading {
    align-items: flex-start;
    flex-direction: column;
  }

  .flow-canvas__heading p {
    text-align: left;
  }
}

.flow-sequence {
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.flow-sequence--nested {
  padding: 4px 2px 2px;
}

.flow-sequence__slot {
  display: flex;
  flex-direction: column;
}

.insert-divider {
  height: 22px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.insert-divider__line {
  position: absolute;
  left: 32px;
  right: 32px;
  height: 1px;
  background: #d9e1eb;
  opacity: .45;
}

.insert-divider__actions {
  position: relative;
  display: flex;
  gap: 5px;
  opacity: 0;
  transform: translateY(-1px);
  transition: .15s;
}

.insert-divider:hover .insert-divider__actions,
.insert-divider:focus-within .insert-divider__actions {
  opacity: 1;
}

.insert-divider__actions button {
  border: 1px solid #b8c6d8;
  background: #fff;
  color: #173c6b;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 10px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(16, 35, 63, .08);
}

.sortable-node {
  position: relative;
  border-radius: 14px;
  transition: opacity .15s, box-shadow .15s;
}

.sortable-node.is-dragging {
  opacity: .42;
}

.sortable-node.is-target {
  box-shadow: 0 0 0 3px rgba(23, 60, 107, .12);
}

.empty-sequence {
  min-height: 92px;
  border: 1px dashed #aebed1;
  border-radius: 11px;
  background: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 9px;
  color: #667085;
  font-size: 11px;
  padding: 14px;
}

.empty-sequence.is-target {
  border-color: #173c6b;
  background: #edf4fc;
}

.empty-sequence > div {
  display: flex;
  gap: 6px;
}

.empty-sequence button {
  border: 1px solid #c9d4e1;
  background: #fff;
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 10px;
  cursor: pointer;
}

@media (max-width: 780px) {
  .insert-divider__actions {
    opacity: .5;
  }
}
.insert-divider--completed .insert-divider__line{background:#2f8a55;height:3px}.insert-divider--completed::before{content:'✓';position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:9px;color:#2f8a55;background:#eef8f2;border-radius:999px;padding:1px 4px}

.flow-card {
  min-height: 82px;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: center;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid #dbe3ee;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(16, 35, 63, .06);
}

.flow-card--flow {
  border-left: 4px solid #b88932;
}

.drag-handle {
  border: 0;
  background: #eef2f6;
  color: #667085;
  border-radius: 8px;
  width: 30px;
  height: 38px;
  cursor: grab;
  font-size: 16px;
  letter-spacing: -4px;
}

.drag-handle:active {
  cursor: grabbing;
}

.flow-card__body {
  min-width: 0;
  padding: 0 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}

.flow-card__body > strong {
  font-size: 14px;
  color: #172033;
}

.flow-card__body > small {
  font-size: 10px;
  color: #667085;
  overflow: hidden;
  text-overflow: ellipsis;
}

.flow-card__meta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #667085;
}

.kind-badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 3px 6px;
  font-size: 9px;
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: .04em;
}

.kind-badge--screen {
  background: #e7eef8;
  color: #173c6b;
}

.kind-badge--flow {
  background: #f5ead4;
  color: #795819;
}

.flow-card__actions,
.branch-card__actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.flow-card__actions button,
.branch-card__actions button {
  border: 1px solid #d5deea;
  background: #fff;
  border-radius: 7px;
  padding: 6px 8px;
  font-size: 10px;
  cursor: pointer;
}

.flow-card__actions button:hover,
.branch-card__actions button:hover {
  background: #f3f6fa;
}

.flow-card__actions .danger,
.branch-card__actions .danger {
  color: #a11b32;
}

@media (max-width: 780px) {
  .flow-card {
    grid-template-columns: 38px 1fr;
  }

  .flow-card__actions {
    grid-column: 1 / -1;
    margin-top: 8px;
    justify-content: flex-start;
    padding-left: 48px;
  }
}
.flow-card--status-definido{border-color:#62b480;box-shadow:0 4px 16px rgba(47,138,85,.12)}.flow-card--status-consolidado{border-color:#2f8a55;border-width:2px;box-shadow:0 4px 18px rgba(47,138,85,.18)}.definition-badge{margin-left:auto;font-size:8px;font-weight:850;background:#eef2f6;border-radius:999px;padding:3px 5px}.flow-card--status-definido .definition-badge,.flow-card--status-consolidado .definition-badge{background:#dff5e7;color:#24643e}


.flow-card__states{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}.flow-card__states>span{font-size:9px;color:#667085}.flow-card__states>b{font-size:9px;font-weight:700;color:#344054;background:#eef2f6;border-radius:999px;padding:3px 6px}

.branch-card {
  overflow: visible;
  background: #fff;
  border: 1px solid #bdcbdc;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(16, 35, 63, .06);
}

.branch-card__header {
  min-height: 58px;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: #f8fbff;
  border-radius: 14px 14px 0 0;
  border-bottom: 1px solid #dbe3ee;
}

.drag-handle--branch {
  background: #dce8f6;
}

.branch-card__header > div:nth-child(2) {
  display: flex;
  align-items: center;
  min-width: 0;
}

.branch-card__header strong {
  font-size: 13px;
  color: #10233f;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kind-badge--branch {
  background: #e9f4eb;
  color: #24613a;
  margin-right: 7px;
}

.branch-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 9px 10px;
  background: #fff;
  overflow: hidden;
}

.branch-tabs button {
  border: 1px solid #d7e0eb;
  background: #f5f7fa;
  border-radius: 8px 8px 0 0;
  padding: 7px 10px;
  font-size: 10px;
  color: #475467;
  cursor: pointer;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.branch-tabs button.is-active {
  background: #10233f;
  color: #fff;
  border-color: #10233f;
}

.branch-tabs small {
  display: inline-grid;
  place-items: center;
  margin-left: 6px;
  min-width: 17px;
  height: 17px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .18);
  font-size: 9px;
}

.branch-card__content {
  padding: 8px 12px 12px;
  background: #fff;
  border-radius: 0 0 14px 14px;
}

@media (max-width: 780px) {
  .branch-card__header {
    grid-template-columns: 38px 1fr;
  }

  .branch-card__actions {
    grid-column: 1 / -1;
    justify-content: flex-start;
    padding-left: 46px;
  }
}

.picker-search {
  position:sticky;
  top:-18px;
  background:#fff;
  padding:0 0 14px;
  z-index:2
}

.picker-search input {
  width:100%;
  border:1px solid #cfd8e5;
  border-radius:10px;
  padding:12px 14px;
  font:inherit;
  outline:none
}

.picker-search input:focus {
  border-color:#173c6b;
  box-shadow:0 0 0 3px rgba(23,60,107,.1)
}

.picker-groups {
  display:flex;
  flex-direction:column;
  gap:20px
}

.picker-group h3 {
  font-size:13px;
  color:#667085;
  margin:0 0 8px;
  text-transform:uppercase;
  letter-spacing:.04em
}

.picker-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:8px
}

.picker-item {

function mountPreview(screenId){const surface=$('previewRoot');const comps=V[screenId];if(!surface||!comps){if(surface)surface.textContent='Componente visual não encontrado no catálogo.';return}const component=Object.values(comps)[0];const els=component?.estrutura?.html?.elementos||{};const cssRules=Object.values(component?.estrutura?.css?.regras||{}).map(x=>typeof x==='string'?x:CSS_BASE+(x.suffix||''));const shadow=surface.attachShadow({mode:'open'});const sty=document.createElement('style');sty.textContent=`:host{display:block;min-height:100%;--primary:#10233f;--primary-soft:#173c6b;--gold:#b88932;--page:#eef2f6;--surface:#fff;--line:#dbe3ee;--text:#172033;--muted:#667085;font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif}*{box-sizing:border-box}body{margin:0}`+'\n'+cssRules.join('\n');shadow.append(sty);
 const nodes=new Map(),frag=document.createDocumentFragment();const records=Object.entries(els).sort((a,b)=>(Number(a[1].ordem||0)-Number(b[1].ordem||0)));for(const [id,spec] of records){let parent=nodes.get(spec.paiRef)||frag;let node;if(spec.tag==='#text')node=document.createTextNode(spec.texto||'');else if(!/^[a-z][a-z0-9-]*$/i.test(spec.tag||'')||['script','iframe','object','embed','link','meta','base'].includes(spec.tag))continue;else{node=document.createElement(spec.tag);for(const [name,value] of Object.entries(spec.atributos||{})){if(/^on/i.test(name)||name==='srcdoc'||name==='formaction')continue;if((name==='href'||name==='src')&&/^\s*javascript:/i.test(value||''))continue;try{node.setAttribute(name,String(value))}catch(e){}}if(spec.texto&&spec.tag!=='#text')node.append(document.createTextNode(spec.texto))}parent.append(node);nodes.set(id,node)}shadow.append(frag);

function syncEntry(r,oldDest){if(oldDest?.tipo==='tela'&&M[oldDest.ref])M[oldDest.ref].navegacao.entradas=(M[oldDest.ref].navegacao.entradas||[]).filter(x=>x.relacaoRef!==r.id);if(r.destino?.tipo==='tela'&&M[r.destino.ref]){const list=M[r.destino.ref].navegacao.entradas||=[];list.push({relacaoRef:r.id,origem:clone(r.origem),destino:clone(r.destino),fonte:'edicao_explicita'})}}
function saveScreen(){const id=val('screenSelect'),group=val('groupSelect'),section=sectionList().find(g=>g.id===group);if(!M[id]||!section){toast('Seleção inválida',true);return}commit(()=>{const target=occurrences().filter(o=>o.group===group),all=target.map(o=>o.order),newNo=uid('no'),t=M[id];t.classificacao.jornadas.push({id:uid('part_advogado'),jornada:{id:'advogado',nome:'Advogado',ordem:2},subjornada:{id:section.id,nome:section.name,ordem:section.order},ordemTela:(all.length?Math.max(...all):0)+1,ocorrenciaNo:newNo,condicaoRef:null,contexto:{descricao:'Participação adicionada explicitamente no editor',branch:null,pendente:true}})},'Ocorrência adicionada sem conexão automática');modal=null;paint()}
function reorder(no,direction=1,target=null){const occ=occurrences(),o=occ.find(x=>x.no===no);if(!o)return;const group=occ.filter(x=>x.group===o.group);const i=group.findIndex(x=>x.no===no);let j=target?group.findIndex(x=>x.no===target):i+direction;if(j<0||j>=group.length||i===j){if(target)toast('Arraste apenas dentro da mesma sub-jornada',true);return}commit(()=>{const reordered=group.slice(),[item]=reordered.splice(i,1);reordered.splice(j,0,item);let start=Math.min(...group.map(x=>x.order));reordered.forEach((x,index)=>{x.p.ordemTela=start+index})},'Ordem de exibição atualizada; relações preservadas')}
function deleteOccurrence(no){const o=findOcc(no);if(!o)return;let count=inbound(no).length+outbound(no).length;if(count){toast('Há '+count+' relações ligadas a este nó. Edite ou remova-as explicitamente antes.',true);return}if(!confirm('Remover participação '+no+'? Nenhuma rota será criada ou alterada.'))return;commit(()=>{M[o.screenId].classificacao.jornadas=M[o.screenId].classificacao.jornadas.filter(x=>x.ocorrenciaNo!==no)},'Participação removida')}
function saveRelation(){const edit=modal?.type==='editRelation',old=edit?RId(modal.id):null,srcNo=edit?old?.r.origem?.noRef:val('relSource'),dstNo=val('relDest'),src=findNode(srcNo),dst=findNode(dstNo);if(!src||!dst){toast('Selecione dois nós existentes',true);return}const tipo=val('relType'),label=val('relLabel'),option=val('relOption'),cond=val('relCondition'),element=val('relElement'),evt=val('relEvent'),act=val('relAction');if(srcNo===dstNo&&!confirm('A relação aponta para o mesmo nó. Criar assim mesmo?'))return;
 commit(()=>{let owner=src.owner,r,oldDest=null;
 if(edit){r=old.r;oldDest=clone(r.destino)}else{r={id:'rel.editor.'+uid('r'),tipo:'continuar',origem:endpoint(srcNo),destino:endpoint(dstNo),opcao:null,rotulo:null,descricao:null,gatilho:{instanciaRef:null,elementoRef:null,eventoRef:null,acaoRef:null},condicaoRef:null,parametros:{},comportamento:{},ordem:Math.max(0,...relationList().map(x=>Number(x.r.ordem||0)))+1,participacaoRef:src.partId||null,prioridade:null};M[owner].navegacao.relacoes.push(r)}
 r.destino=endpoint(dstNo);r.tipo=tipo;r.rotulo=label||null;r.opcao=option||null;r.condicaoRef=cond||null;r.gatilho={instanciaRef:r.gatilho?.instanciaRef||null,elementoRef:element||null,eventoRef:evt||null,acaoRef:act||null};syncEntry(r,oldDest);
 },edit?'Relação alterada nos contratos':'Relação declarada e entradas sincronizadas');modal=null;paint()}
function removeRelation(id){const info=RId(id);if(!info)return;const branchRefs=branches().filter(x=>x.b.alternativas?.some(a=>a.relacaoRef===id));if(branchRefs.length){toast('Relação usada por '+branchRefs.length+' bifurcação(ões). Desvincule a alternativa antes de remover.',true);return}if(!confirm('Remover relação '+id+' e seu espelho de entrada?'))return;commit(()=>{M[info.owner].navegacao.relacoes=M[info.owner].navegacao.relacoes.filter(r=>r.id!==id);let dst=info.r.destino;if(dst?.tipo==='tela'&&M[dst.ref])M[dst.ref].navegacao.entradas=(M[dst.ref].navegacao.entradas||[]).filter(e=>e.relacaoRef!==id)},'Relação removida dos dois lados')}
function addAlternative(){if(!modal||!['addBranch','editBranch'].includes(modal.type))return;const no=modal.type==='editBranch'?getBranch(modal.owner,modal.id)?.origemNoRef:modal.no;const rr=outbound(no).map(x=>x.r);let id=uid('altform');const wrap=$('newAltRows');if(!wrap)return;const div=document.createElement('div');div.className='alt-form';div.innerHTML=`<span>+</span><input data-alt-label="${esc(id)}" placeholder="Rótulo da alternativa" aria-label="Rótulo"><select data-alt-ref="${esc(id)}"><option value="">Selecione uma relação existente</option>${rr.map(r=>`<option value="${esc(r.id)}">${esc(r.rotulo||r.opcao||r.tipo)} → ${esc(noun(r.destino?.noRef))}</option>`).join('')}</select><button data-act="dropAlternative" data-alt="${esc(id)}">×</button>`;wrap.append(div)}
function saveBranch(){const edit=modal?.type==='editBranch',old=edit?getBranch(modal.owner,modal.id):null,no=old?.origemNoRef||modal?.no,src=findNode(no);if(!src){toast('Nó de origem não encontrado',true);return}const labels=[...document.querySelectorAll('[data-alt-label]')],refs=new Map([...document.querySelectorAll('[data-alt-ref]')].map(e=>[e.dataset.altRef,e.value]));const alts=labels.map(e=>({id:e.dataset.altLabel,rotulo:e.value.trim()||'Alternativa',valor:e.value.trim()||e.dataset.altLabel,relacaoRef:refs.get(e.dataset.altLabel)||null,ordem:0,condicaoRef:null,prioridade:null})).filter(x=>x.relacaoRef);if(new Set(alts.map(x=>x.relacaoRef)).size<alts.length){toast('Uma mesma relação não deve ser vinculada a duas alternativas da mesma bifurcação',true);return}let invalid=alts.find(x=>RId(x.relacaoRef)?.r.origem?.noRef!==no);if(invalid){toast('Uma alternativa aponta para relação de outra origem',true);return}
 const title=val('branchTitle'),tipo=val('branchType'),criteria=val('branchCriterion');commit(()=>{const b=edit?old:{id:'bif.editor.'+uid('b'),origemNoRef:no,titulo:'',tipo:'decisao',criterioRef:null,alternativas:[],fallbackRelacaoRef:null};b.titulo=title||'Bifurcação';b.tipo=tipo;b.criterioRef=criteria||null;b.alternativas=alts.map((a,i)=>({...a,ordem:i+1,id:edit&&old?.alternativas?.find(x=>x.id===a.id)?a.id:uid('alt')}));if(!edit)M[src.owner].navegacao.bifurcacoes.push(b)},'Bifurcação gravada com relações explícitas');modal=null;paint()}
function delBranch(owner,id){const b=getBranch(owner,id);if(!b)return;if(!confirm('Remover somente a declaração de bifurcação? As relações existentes serão preservadas.'))return;commit(()=>{M[owner].navegacao.bifurcacoes=M[owner].navegacao.bifurcacoes.filter(x=>x.id!==id)},'Bifurcação removida; relações preservadas')}
function gotoNode(no){if(!no)return;modal=null;const node=findNode(no);if(!node){toast('Referência não encontrada: '+no,true);return}if(mode!=='jornada'){mode='jornada';paint()}else renderModal();const element=[...document.querySelectorAll('[data-jump]')].find(el=>el.getAttribute('data-jump')===no);if(!element){toast('Nó declarado, mas sem cartão nesta jornada: '+no,true);return}let det=element.closest('details');if(det)det.open=true;element.scrollIntoView({behavior:'smooth',block:'center'});element.classList.add('flash-target');setTimeout(()=>element.classList.remove('flash-target'),1800)}

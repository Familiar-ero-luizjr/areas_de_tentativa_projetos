<section data-conteudo id="analiseRequisitos"><template>
<main><div class="top"><div><div class="eyebrow">AdvogadoJá Plus / Análise</div><h1 id="title"></h1><p class="muted" id="subtitle"></p></div><div class="actions"><button id="importBtn">Importar JSON</button><button id="exportBtn">Exportar JSON</button><button id="newBtn" class="primary">+ Novo registro</button></div></div><div class="summary" id="summary"></div><div class="notice" id="notice"></div><section class="panel"><div class="filters"><input id="search" type="search" placeholder="Buscar ID, descrição ou origem…" aria-label="Buscar"><select id="profile" aria-label="Perfil"><option value="">Todos os perfis</option></select><select id="status" aria-label="Situação"><option value="">Todas as situações</option></select><select id="topic" aria-label="Assunto"><option value="">Todos os assuntos</option></select><button class="small" id="clear">Limpar</button></div><div id="content"></div><div class="footer"><span id="result"></span><button id="exportView" class="small">Exportar seção</button></div></section><p id="saveState" class="outline save-state">Dados do módulo · V1 · Em definição</p></main>
<input type="file" id="file" accept=".json,application/json" hidden><dialog id="editor"><form id="editForm"><div class="modalhead"><h2 id="editTitle">Registro</h2><button type="button" id="close" class="small" aria-label="Fechar">✕</button></div><div class="modalbody"><div class="cols"><label>Identificador<input id="eid" readonly></label><label>Tipo<select id="ekind" required></select></label></div><label>Descrição<textarea id="edesc" required></textarea></label><div class="cols"><label>Perfil<select id="eprofile" required></select></label><label>Situação<select id="estatus" required></select></label></div><label>Assunto<input id="etopic" list="topics" required><datalist id="topics"></datalist></label><label>Origem<textarea id="esource" required></textarea></label><label>Referências relacionadas (IDs separados por vírgulas)<input id="erefs" placeholder="DEF-001, DEF-004" list="refOptions"><datalist id="refOptions"></datalist></label><div id="refPreview" class="linklist"></div><label>Observações<textarea id="enotes"></textarea></label><div class="error" id="editError" role="alert"></div></div><div class="modalfoot"><button type="button" id="deleteBtn" class="danger" style="margin-right:auto">Excluir</button><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary">Salvar registro</button></div></form></dialog><dialog id="importDialog"><div class="modalhead"><h2>Importar JSON</h2><button class="small" id="importClose">✕</button></div><div class="modalbody"><p id="importInfo"></p><p class="muted" style="margin-top:10px">Mesclar atualiza somente os IDs presentes no arquivo e preserva os demais registros. Substituir troca toda a base e requer um arquivo completo.</p><p class="error" id="importError"></p></div><div class="modalfoot"><button id="merge">Mesclar por ID</button><button id="replace" class="danger">Substituir base</button></div></dialog><div id="toast" role="status" hidden></div>
</template></section>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdvogadoJá Plus — Telas</title><link rel="stylesheet" href="estilo.css"></head><body><main class="work"><div id="screenView"><button class="journey-return" hidden="" id="backJourneys" type="button">‹ Voltar à lista de jornadas</button><h1 id="title"></h1><div class="meta" id="meta"></div><div class="tabs" role="tablist"><button class="active" data-tab="visual" role="tab">Visualização</button><button data-tab="json" role="tab">JSON</button><button data-tab="doc" role="tab">Documento da tela</button></div><section class="panel" id="visual"><div class="toolbar"><label>Estado<select id="state"></select></label><label id="mockLabel">Cenário<select id="mock"></select></label><label>Contexto<select id="context"></select></label><label>Formato<select id="size"><option value="mobile">Celular</option><option value="desktop">Desktop</option></select></label><button id="reset">Restaurar simulação</button></div><div class="preview-area"><div class="phone" id="phone"><iframe id="frame" sandbox="allow-same-origin" title="Visualização gerada pelo contrato JSON"></iframe></div></div><div class="notice" id="status" role="status">Visual gerado pelo JSON. Dados e navegação simulados.</div></section><section class="panel" hidden="" id="json"><div class="toolbar"><button id="copy">Copiar JSON</button><button class="primary" id="export">Exportar JSON da tela</button><button id="exportAll">Exportar coleção completa</button></div><textarea aria-label="JSON completo da tela" class="jsonbox" id="jsonText" readonly="" spellcheck="false"></textarea><div class="notice" id="jsonStatus">Inclui Layout Base e componentes usados. Recursos de imagem incorporados ao próprio JSON.</div></section><section class="panel doc" hidden="" id="doc"></section></div></main><script src="motor.js" defer></script></body></html>

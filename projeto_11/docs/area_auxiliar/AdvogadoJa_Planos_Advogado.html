<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planos do Advogado | AdvogadoJá Plus</title><style>
:root{--navy:#0b2835;--navy2:#163b4b;--gold:#b68c39;--goldlight:#f7efde;--ink:#172c36;--muted:#60717b;--line:#dce4e7;--paper:#fff;--bg:#edf1f3;--green:#267a62;--shadow:0 12px 36px #142c3910}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #be9c54;outline-offset:3px}.app{max-width:760px;margin:auto;background:#f8fafb;min-height:100dvh;box-shadow:var(--shadow);display:flex;flex-direction:column}.header{background:var(--navy);color:white;padding:20px 24px 26px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font-size:23px;font-weight:750;letter-spacing:-.8px}.brand b{color:#dab45e}.iconbtn{background:none;color:inherit;border:0;padding:7px;display:grid;place-items:center;border-radius:8px}.iconbtn:hover{background:#ffffff18}.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:700;color:#d5b66f;text-transform:uppercase;margin:0 0 6px}h1{font-size:27px;line-height:1.2;margin:0 0 8px;letter-spacing:-.6px}.header p:last-child{margin:0;color:#c9d8de;font-size:13px}main{padding:18px 22px 24px;flex:1}.tabs{display:flex;background:#e9eef0;border-radius:12px;padding:4px;gap:3px;margin-bottom:18px}.tab{flex:1;min-width:0;background:none;border:0;border-radius:9px;padding:10px 4px;color:var(--muted);font-weight:650;font-size:12px}.tab[aria-selected=true]{background:white;color:var(--navy);box-shadow:0 2px 6px #102c3614}.intro{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.intro h2{font-size:17px;margin:0}.intro p{font-size:12px;color:var(--muted);margin:3px 0 0}.linkbtn{background:none;border:0;color:#806020;font-size:12px;font-weight:700;white-space:nowrap;padding:7px 0}.cards{display:grid;gap:14px}.plan{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 3px 9px #172c3605}.plan.gold{border-color:#c8a963}.plan.student{border-color:#b6d9cd}.plan .label{font-size:10px;font-weight:750;letter-spacing:.7px;color:#806020;display:block;margin-bottom:6px}.plan.student .label{color:var(--green)}.plan h3{font-size:21px;line-height:1.25;margin:0 0 4px;letter-spacing:-.4px}.desc{color:var(--muted);font-size:13px;margin:0 0 12px}.price{font-size:25px;font-weight:750;letter-spacing:-.65px;line-height:1.2}.price small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}.plan hr{border:0;border-top:1px solid var(--line);margin:16px 0 12px}.features{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}.features li{display:flex;align-items:flex-start;gap:9px;font-size:13px}.check{flex:none;color:var(--green);font-weight:bold}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border-radius:9px;border:1px solid var(--navy);background:var(--navy);color:white;font-size:13px;font-weight:700;text-decoration:none}.btn.outline{background:white;color:var(--navy);border-color:#becbd1}.btn.full{width:100%}.btn:hover{filter:brightness(.94)}.btn:disabled{opacity:.5;cursor:not-allowed}.footnote{color:var(--muted);font-size:11px;margin:16px 2px 0}.bottom{background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 8px max(12px,env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:2}.navitem{border:0;background:none;display:grid;justify-items:center;gap:4px;color:var(--muted);font-size:10px;min-width:60px;padding:3px}.navitem.active{color:#967024;font-weight:750}.empty{text-align:center;background:white;border:1px dashed var(--line);border-radius:14px;padding:36px 20px;color:var(--muted)}.empty .icon{width:40px;height:40px;color:#8c9fa8}.empty h3{color:var(--ink);margin:10px 0 6px}.empty p{font-size:13px;margin:0 auto 20px;max-width:350px}.status{font-size:11px;font-weight:650;color:var(--green);background:#eaf5ef;border-radius:5px;padding:3px 7px}.history{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}.history p{margin:3px 0;font-size:13px;color:var(--muted)}.notice{background:#f7efde;border:1px solid #e5d5ae;padding:11px 13px;border-radius:9px;font-size:12px;color:#66501d;margin:14px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.actions .btn{flex:1}.modal{border:0;border-radius:16px;width:min(620px,calc(100% - 24px));max-height:85dvh;max-width:100%;padding:0;box-shadow:0 20px 70px #0b28354d;color:var(--ink)}.modal::backdrop{background:#0a202bb0}.modalhead{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:white;padding:15px 20px;position:sticky;top:0;z-index:1}.modalhead h2{font-size:17px;margin:0}.modalbody{padding:20px;overflow-wrap:anywhere}.modalbody h3{font-size:15px;margin:20px 0 7px}.modalbody ul{padding-left:20px;font-size:13px}.modalbody li{margin:4px 0}.modalbody p{font-size:13px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#edf2f4}label{display:block;font-size:13px;margin:9px 0}input[type=text]{display:block;width:100%;border:1px solid #b9c9cf;border-radius:8px;padding:10px;font:inherit;margin:5px 0 10px}input[type=checkbox]{accent-color:var(--navy)}.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:max-content;max-width:90vw;background:var(--navy);color:white;padding:12px 17px;border-radius:9px;z-index:5;font-size:13px;box-shadow:var(--shadow)}[hidden]{display:none!important}@media(max-width:480px){main{padding:15px 14px 20px}.header{padding:16px 18px 22px}.plan{padding:16px}.price{font-size:23px}.brand{font-size:21px}.intro h2{font-size:16px}.modalbody{padding:16px}}
</style></head><body><div class="app"><header class="header"><div class="top"><button class="iconbtn" id="menu" aria-label="Menu"></button><div class="brand">AdvogadoJá<b>+</b></div><button class="iconbtn" id="bell" aria-label="Notificações"></button></div><p class="eyebrow">Perfil Advogado · Protótipo</p><h1>Planos e benefícios</h1><p>Conheça os planos disponíveis para seu perfil.</p></header><main><div class="tabs" role="tablist" aria-label="Planos"><button class="tab" role="tab" data-tab="disponiveis" aria-selected="true">Disponíveis</button><button class="tab" role="tab" data-tab="meus" aria-selected="false">Meus planos</button><button class="tab" role="tab" data-tab="historico" aria-selected="false">Histórico</button></div><section id="content" aria-live="polite"></section><p class="footnote">Protótipo funcional · baseado na seção 13 do MD · preços sem periodicidade confirmada · propostas sujeitas à aprovação. Nenhuma contratação ou cobrança real é realizada.</p></main><nav class="bottom" aria-label="Navegação principal" id="bottom"></nav></div><dialog class="modal" id="modal"><div class="modalhead"><h2 id="modalTitle"></h2><button class="iconbtn" id="close" aria-label="Fechar">✕</button></div><div class="modalbody" id="modalBody"></div></dialog><div class="toast" id="toast" role="status" hidden></div><script>
const plans=[{"id": "ouro", "name": "Ouro / Executivo", "label": "INDIVIDUAL · PROPOSTA DO CONTRATANTE", "price": "R$ 49,90", "desc": "1 advogado", "features": ["Demandas de clientes", "Chat em tempo real (WhatsApp)", "Suporte SAC", "Perfil profissional e áreas de atuação", "Localização profissional", "Disponibilidade e modalidades de atendimento", "Agenda", "Home profissional", "Gestão de solicitações e atendimentos", "Contatos liberados após aceite", "WhatsApp e ligação após aceite", "Avaliações profissionais", "Notificações"], "benefits": ["Seguro de vida", "Seguro de acidentes pessoais", "Telemedicina", "Suporte — SAC"], "requirements": ["Perfil Advogado", "OAB validada para funcionalidades profissionais protegidas"], "note": "Preço informado sem periodicidade definida. A associação das demais funcionalidades do inventário é proposta.", "summary": ["Demandas de clientes", "Chat em tempo real / WhatsApp", "Suporte SAC", "Seguro de vida e acidentes", "Telemedicina"]}, {"id": "plus", "name": "Advogado Plus", "label": "COMPOSIÇÃO PROPOSTA", "price": "Valor a definir", "desc": "Produtividade e aperfeiçoamento profissional.", "features": ["Funcionalidades do Ouro / Executivo", "Inteligência artificial para advogados", "Agentes de busca de jurisprudências", "Acesso à plataforma de aperfeiçoamento profissional"], "benefits": ["Seguro de vida", "Seguro de acidentes pessoais", "Telemedicina", "Suporte — SAC"], "requirements": ["Perfil Advogado", "OAB validada para funcionalidades profissionais protegidas"], "note": "O nome foi mencionado pelo contratante. A associação de IA, aperfeiçoamento e benefícios do Ouro é proposta, não aprovada.", "summary": ["Funcionalidades profissionais", "Inteligência artificial", "Pesquisa de jurisprudências", "Aperfeiçoamento profissional"]}, {"id": "sociedade", "name": "Ouro / Sociedade", "label": "COLETIVO · PROPOSTA DO CONTRATANTE", "price": "A partir de R$ 139,90", "desc": "2 ou mais advogados", "features": ["Funcionalidades do Ouro / Executivo", "Cadastro e gestão do escritório", "Vinculação de advogados", "Visualização da equipe jurídica", "Convites de novos advogados", "Distribuição interna de solicitações"], "benefits": ["Seguro de vida", "Seguro de acidentes pessoais", "Telemedicina", "Suporte — SAC"], "requirements": ["Perfil Advogado", "OAB validada para funcionalidades profissionais protegidas"], "note": "Valor inicial e benefícios informados. Recursos de Escritório são associação proposta. Quantidade incluída, periodicidade, permissões e cobertura individual a definir.", "summary": ["Benefícios do Ouro / Executivo", "Área Escritório — proposta", "Gestão da equipe — proposta", "Distribuição de solicitações — proposta"]}, {"id": "estudante", "name": "Plano Estudante", "label": "TRANSVERSAL · REQUISITOS DEFINIDOS", "price": "Valor a definir", "desc": "Aprendizado e formação acadêmica.", "features": ["Dados acadêmicos", "Envio e acompanhamento de documentação escolar", "Catálogo e detalhes dos cursos", "Conteúdos educacionais autorizados", "Meus cursos e meus acessos", "Gestão e histórico da assinatura"], "benefits": ["Acesso a cursos gratuitos"], "requirements": ["Perfil Cliente ou Advogado", "Comprovação de vínculo estudantil, como matrícula", "Não exige OAB para contratação"], "note": "Não libera automaticamente funções profissionais protegidas. Valor da assinatura e demais limites ainda não definidos.", "summary": ["Cursos gratuitos", "Área educacional", "Não exige OAB para contratação", "Comprovação estudantil obrigatória"]}],role="advogado";const icons={menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',home:'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>',list:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9zM9 11h6M9 15h6"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M15 15h3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',history:'<path d="M3 12a9 9 0 1 1 3 7M3 6v6h6M12 7v5l4 2"/>'};const ico=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[n]||''}</svg>`;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='disponiveis',subscriptions={},history=[];const key='advogadoja-demo-planos-'+role;try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){subscriptions=saved.subscriptions||{};history=saved.history||[]}}catch{}function save(){try{localStorage.setItem(key,JSON.stringify({subscriptions,history}))}catch{}}function record(p,status){subscriptions[p.id]=status;history.unshift({name:p.name,status,date:new Date().toLocaleString('pt-BR')});save();render()};function showToast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('toast').hidden=true,3000)}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;if(!$('modal').open)$('modal').showModal()}function closeModal(){$('modal').close()}$('close').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});const checks=items=>`<ul class="features">${items.map(x=>`<li><span class="check">✓</span><span>${esc(x)}</span></li>`).join('')}</ul>`;const bullets=items=>items.length?`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>A definir.</p>';function price(p){return `<div class="price">${esc(p.price)}</div>`}function planCard(p){let status=subscriptions[p.id];return `<article class="plan ${p.id==='estudante'?'student':p.id==='essencial'?'':'gold'}"><span class="label">${esc(p.label)}</span><h3>${esc(p.name)}</h3><p class="desc">${esc(p.desc)}</p>${price(p)}${status?`<p><span class="status">${esc(status)}</span></p>`:''}<hr>${checks(p.summary)}<button class="btn outline full" data-act="detail" data-id="${p.id}">Ver detalhes</button></article>`}function selectTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));render()};function render(){let el=$('content');if(tab==='disponiveis'){el.innerHTML=`<div class="intro"><div><h2>Planos disponíveis</h2><p>Escolha uma modalidade de acesso.</p></div><button class="linkbtn" data-act="compare">Comparar planos</button></div><div class="cards">${plans.map(planCard).join('')}</div>`}else if(tab==='meus'){let active=plans.filter(p=>subscriptions[p.id]);el.innerHTML=`<div class="intro"><div><h2>Meus planos</h2><p>Assinaturas e benefícios · simulação</p></div></div>${active.length?`<div class="cards">${active.map(p=>`<article class="plan"><h3>${esc(p.name)}</h3><p><span class="status">${esc(subscriptions[p.id])}</span></p>${checks(p.summary)}<button class="btn outline full" data-act="detail" data-id="${p.id}">Gerenciar plano</button></article>`).join('')}</div>`:`<div class="empty">${ico('wallet')}<h3>Nenhum plano registrado</h3><p>Os planos simulados serão exibidos aqui, com suas situações e benefícios.</p><button class="btn outline" data-act="available">Consultar planos disponíveis</button></div>`}`}else{el.innerHTML=`<div class="intro"><div><h2>Histórico de assinaturas</h2><p>Movimentações realizadas nesta simulação.</p></div>${history.length?'<button class="linkbtn" data-act="reset">Limpar simulação</button>':''}</div>${history.length?history.map(h=>`<article class="history"><strong>${esc(h.name)}</strong><p>${esc(h.date)}</p><span class="status">${esc(h.status)}</span></article>`).join(''):`<div class="empty">${ico('history')}<h3>Sem movimentações</h3><p>Contratações, ativações e cancelamentos simulados aparecerão aqui.</p></div>`}`}}function detail(p){let s=subscriptions[p.id];modal(p.name,`<span class="label">${esc(p.label)}</span><p>${esc(p.desc)}</p>${price(p)}<h3>Funcionalidades</h3>${bullets(p.features)}<h3>Benefícios</h3>${bullets(p.benefits)}<h3>Requisitos e condições</h3>${bullets(p.requirements)}<h3>Limites e periodicidade</h3><p>A definir, exceto a capacidade expressamente informada.</p><div class="notice">${esc(p.note)}</div>${s?`<p>Situação simulada: <strong>${esc(s)}</strong></p>`:''}<div class="actions">${s==='Ativa'?`<button class="btn outline" data-act="cancel" data-id="${p.id}">Simular cancelamento</button>`:s==='Em validação acadêmica'?`<button class="btn" data-act="validate" data-id="${p.id}">Simular validação</button><button class="btn outline" data-act="cancel" data-id="${p.id}">Cancelar solicitação</button>`:`<button class="btn" data-act="contract" data-id="${p.id}">${s==='Cancelada'?'Simular reativação':'Simular contratação'}</button>`}<button class="btn outline" data-act="close">Voltar</button></div>`)}function contract(p){modal('Simular contratação',`<p><strong>${esc(p.name)}</strong> · ${esc(p.price)}</p><div class="notice">Ambiente de demonstração. Não insira dados reais nem documentos. Não há cobrança, envio de arquivos ou validação efetiva.</div>${p.id==='estudante'?'<h3>Comprovação estudantil</h3><label><input type="checkbox" id="school"> Simular envio de comprovante de matrícula</label><p>A solicitação ficará em validação acadêmica até a aprovação simulada.</p>':'<p>As validações profissionais e permissões permanecem independentes da assinatura.</p>'}<label><input type="checkbox" id="accept"> Concordo em prosseguir apenas com a simulação.</label><div class="actions"><button class="btn" data-act="confirm" data-id="${p.id}">Confirmar simulação</button><button class="btn outline" data-act="detail" data-id="${p.id}">Voltar</button></div>`)}function compare(){modal('Comparar planos',`<div class="tablewrap"><table><thead><tr><th>Plano</th><th>Valor</th><th>Destaques</th></tr></thead><tbody>${plans.map(p=>`<tr><td><strong>${esc(p.name)}</strong><br>${esc(p.label)}</td><td>${esc(p.price)}</td><td>${p.summary.map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></div><div class="notice">A distribuição de funcionalidades é preliminar. Consulte os detalhes para identificar propostas e requisitos informados.</div>`)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let p=plans.find(x=>x.id===b.dataset.id);switch(b.dataset.act){case'detail':detail(p);break;case'compare':compare();break;case'available':closeModal();selectTab('disponiveis');break;case'close':closeModal();break;case'contract':contract(p);break;case'confirm':if(!$('accept').checked||p.id==='estudante'&&!$('school').checked){showToast('Marque as condições da simulação.');return}record(p,p.id==='estudante'?'Em validação acadêmica':'Ativa');closeModal();selectTab('meus');showToast('Simulação registrada.');break;case'validate':record(p,'Ativa');closeModal();selectTab('meus');showToast('Validação acadêmica simulada.');break;case'cancel':modal('Cancelar simulação',`<p>Cancelar o registro simulado de ${esc(p.name)}?</p><div class="actions"><button class="btn" data-act="cancelconfirm" data-id="${p.id}">Confirmar</button><button class="btn outline" data-act="detail" data-id="${p.id}">Voltar</button></div>`);break;case'cancelconfirm':record(p,'Cancelada');closeModal();showToast('Cancelamento simulado.');break;case'reset':modal('Limpar simulação','<p>Remover todos os registros locais desta tela?</p><button class="btn" data-act="resetconfirm">Limpar registros</button>');break;case'resetconfirm':subscriptions={};history=[];save();render();closeModal();break;}});$('menu').innerHTML=ico('menu');$('bell').innerHTML=ico('bell');$('menu').onclick=()=>modal('Menu','<div class="actions"><button class="btn" data-act="available">Planos disponíveis</button><button class="btn outline" data-act="close">Voltar</button></div><p>As demais telas do aplicativo não estão incluídas neste protótipo.</p>');$('bell').onclick=()=>modal('Notificações','<p>Nenhuma notificação nesta demonstração.</p>');$('bottom').innerHTML=[['home','Início'],['list','Solicitações'],['wallet','Planos'],['user','Perfil']].map(([i,n])=>`<button class="navitem ${i==='wallet'?'active':''}" data-nav="${i}" ${i==='wallet'?'aria-current="page"':''}>${ico(i)}${n}</button>`).join('');$('bottom').onclick=e=>{let b=e.target.closest('[data-nav]');if(!b)return;if(b.dataset.nav==='wallet')selectTab('disponiveis');else showToast('Tela fora do escopo deste protótipo.')};render();
</script></body></html>

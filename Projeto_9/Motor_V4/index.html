<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdvogadoJá · Motor V4 Modular</title><link rel="stylesheet" href="motor.css"></head><body>
<header class="top"><div class="brand"><div class="brand-logo">AJ</div><div><h1>Motor V4 · AdvogadoJá</h1><p>Biblioteca · Contratos mínimos · Visualização — dados externos compartilhados</p></div></div><nav aria-label="Módulos"><button class="nav-tab active" data-app="biblioteca">▤ Biblioteca</button><button class="nav-tab" data-app="contratos">◇ Contratos mínimos</button><button class="nav-tab" data-app="visualizacao">▣ Visualização</button></nav></header>
<main class="shell"><iframe class="frame" id="moduleFrame" title="Módulo do Motor V4" src="Biblioteca/index.html"></iframe><p class="meta">O Motor não armazena telas em suas pastas. Dados externos: <code>../Dados_Motor_V4/</code>. Exportações ZIP são downloads independentes.</p></main>
<script src="motor.js"></script><script>
(function(){const frame=document.getElementById('moduleFrame'),pages={biblioteca:'Biblioteca/index.html',contratos:'Contratos_minimos/index.html',visualizacao:'Visualizacao/index.html'};
function activate(id){if(!pages[id])return;document.querySelectorAll('[data-app]').forEach(b=>{b.classList.toggle('active',b.dataset.app===id);b.setAttribute('aria-pressed',String(b.dataset.app===id))});frame.src=pages[id];if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id)}
document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>activate(b.dataset.app));window.addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.data?.ajMotor==='navigate')activate(event.data.module)});activate(pages[location.hash.slice(1)]?location.hash.slice(1):'biblioteca');})();
</script></body></html>

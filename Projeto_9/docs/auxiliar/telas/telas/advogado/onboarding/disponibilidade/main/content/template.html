<div class="registration__shell"><div class="registration__intro"><p class="eyebrow">{{content.onboarding_profissional_6_de_8}}</p><h1>{{content.disponibilidade_inicial}}</h1><p>{{content.configure_como_voce_deseja_aparecer_para_novas_solicitacoes}}</p></div><div class="progress"><span style="width:75%"></span></div><form class="form-card" data-professional-form><div class="select-field"><label for="pro-work-mode">{{content.forma_principal_de_atendimento}}</label><select id="pro-work-mode" data-pro-field="workMode" required><option value="">{{content.selecionar}}</option><option value="online">{{content.online}}</option><option value="presencial">{{content.presencial}}</option><option value="hibrido">{{content.hibrido}}</option></select></div><div class="select-field"><label for="pro-radius">{{content.raio_para_atendimento_presencial}}</label><select id="pro-radius" data-pro-field="serviceRadiusKm"><option value="">{{content.selecionar_2}}</option><option value="5">{{content.texto_5_km}}</option><option value="10">{{content.texto_10_km}}</option><option value="20">{{content.texto_20_km}}</option><option value="30">{{content.texto_30_km}}</option><option value="50">{{content.texto_50_km}}</option><option value="100">{{content.texto_100_km}}</option></select></div><div class="toggle-grid"><label class="toggle-card"><span><strong>{{content.disponivel_agora}}</strong><small>{{content.controla_o_estado_operacional_inicial_do_perfil}}</small></span><input type="checkbox" data-pro-field="available"></label><label class="toggle-card"><span><strong>{{content.contato_prioritario}}</strong><small>{{content.permitir_solicitacoes_dessa_modalidade}}</small></span><input type="checkbox" data-pro-field="priorityContactActive"></label><label class="toggle-card"><span><strong>{{content.consultoria}}</strong><small>{{content.permitir_solicitacoes_de_consultoria}}</small></span><input type="checkbox" data-pro-field="consultationActive"></label></div><div class="form-actions"><button class="secondary-action" type="button" data-goto="advogado.onboarding.perfil_profissional">{{content.voltar}}</button><button class="button" type="submit" data-next="escritorio.onboarding.vinculo_escritorio">{{content.continuar}}</button></div><p class="form-status" aria-live="polite"></p></form></div>

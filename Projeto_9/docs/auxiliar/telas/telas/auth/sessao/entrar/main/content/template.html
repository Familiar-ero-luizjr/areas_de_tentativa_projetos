<div class="login__shell"><div class="login__brand"><div class="mark"><img src="{{_assetBase}}brand_symbol.svg" alt="{{content.advogadoja_alt}}"></div><h1>{{content.entre_na_sua_conta}}</h1><p>{{content.acesse_sua_jornada_na_plataforma}}</p></div><form class="card" id="login-form"><div class="field"><input id="email" type="email" placeholder=" " required><label for="email">{{content.e_mail}}</label></div><div class="field"><input id="password" type="password" placeholder=" " required><label for="password">{{content.senha}}</label></div><a class="help" href="#">{{content.esqueci_minha_senha}}</a><button class="button" type="submit">{{content.entrar}}</button><div class="divider">{{content.ou}}</div><button class="secondary" type="button">{{content.continuar_com_google}}</button><button class="secondary" type="button">{{content.continuar_com_apple}}</button><p class="signup">{{content.ainda_nao_tem_conta}} <button class="link-button" type="button" data-goto="auth.cadastro.tipo_conta">{{content.criar_uma_conta}}</button></p><p class="status" aria-live="polite"></p></form></div>

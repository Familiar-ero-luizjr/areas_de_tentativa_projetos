<div class="registration__shell"><div class="registration__intro"><p class="eyebrow">{{content.dados_pessoais}}</p><h1>{{content.contato}}</h1><p>{{content.informacoes_privadas_usadas_para_identificacao_e_comunicacao_da_}}</p></div><div class="progress" aria-label="{{content.etapa_3_de_7_aria_label}}"><span style="width:42.855%"></span></div><form class="form-card" data-registration-form><div class="field"><input id="reg-email" name="email" type="email" placeholder=" " autocomplete="email" data-reg-field="email" required><label for="reg-email">{{content.e_mail}}</label></div><div class="field"><input id="reg-phone" name="phoneE164" type="tel" placeholder=" " autocomplete="tel" inputmode="tel" data-reg-field="phoneE164" required><label for="reg-phone">{{content.telefone_com_ddi}}</label></div><div class="form-note"><strong>{{content.privacidade}}</strong><span>{{content.telefone_e_e_mail_nao_sao_exibidos_publicamente_por_padrao}}</span></div><div class="form-actions"><button class="secondary-action" type="button" data-goto="auth.cadastro.identificacao">{{content.voltar}}</button><button class="button" type="submit" data-next="auth.cadastro.endereco">{{content.continuar}}</button></div><p class="form-status" aria-live="polite"></p></form></div>

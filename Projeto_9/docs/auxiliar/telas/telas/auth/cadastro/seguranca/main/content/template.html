<div class="registration__shell"><div class="registration__intro"><p class="eyebrow">{{content.criar_conta}}</p><h1>{{content.acesso_e_seguranca}}</h1><p>{{content.defina_a_senha_da_conta_vinculada_ao_e_mail_informado}}</p></div><div class="progress" aria-label="{{content.etapa_5_de_7_aria_label}}"><span style="width:71.425%"></span></div><form class="form-card" data-registration-form><div class="field"><input id="reg-password" name="password" type="password" placeholder=" " autocomplete="new-password" data-reg-field="password" minlength="8" required><label for="reg-password">{{content.senha}}</label></div><div class="field"><input id="reg-password-confirm" name="passwordConfirmation" type="password" placeholder=" " autocomplete="new-password" data-reg-field="passwordConfirmation" minlength="8" required><label for="reg-password-confirm">{{content.confirmar_senha}}</label></div><div class="form-note"><strong>{{content.conta}}</strong><span>{{content.o_tipo_escolhido_no_inicio_do_cadastro_sera_salvo_junto_a_conta_}}</span></div><div class="form-actions"><button class="secondary-action" type="button" data-goto="auth.cadastro.endereco">{{content.voltar}}</button><button class="button" type="submit" data-next="auth.cadastro.consentimentos">{{content.continuar}}</button></div><p class="form-status" aria-live="polite"></p></form></div>

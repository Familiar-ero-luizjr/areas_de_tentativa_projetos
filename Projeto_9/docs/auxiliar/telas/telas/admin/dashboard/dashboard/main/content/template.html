<main class="op-shell">
        
        
        <div class="op-hero"><h1>{{content.operacao_da_plataforma}}</h1><p>{{content.painel_administrativo_interno}}</p></div>
<div class="op-grid" style="grid-template-columns:repeat(3,1fr)"><div class="op-card" style="text-align:center"><h2>{{content.valor_0}}</h2><p>{{content.oab_pendentes}}</p></div><div class="op-card" style="text-align:center"><h2>{{content.valor_0_2}}</h2><p>{{content.perfis_em_moderacao}}</p></div><div class="op-card" style="text-align:center"><h2>{{content.valor_0_3}}</h2><p>{{content.denuncias_abertas}}</p></div></div>
<div class="op-grid two">
<button class="op-action" type="button" data-goto="admin.oab.validacao_oab"><span><strong>{{content.validacao_oab}}</strong><small>{{content.fila_de_documentos}}</small></span></button>
<button class="op-action" type="button" data-goto="admin.perfis.moderacao_perfis"><span><strong>{{content.moderacao_de_perfil}}</strong><small>{{content.perfis_profissionais_pendentes}}</small></span></button>
<button class="op-action" type="button" data-goto="admin.denuncias.denuncias"><span><strong>{{content.denuncias}}</strong><small>{{content.relatos_abertos}}</small></span></button>
<button class="op-action" type="button" data-goto="admin.assinaturas.assinaturas"><span><strong>{{content.assinaturas}}</strong><small>{{content.estados_de_assinatura}}</small></span></button>
<button class="op-action" type="button" data-goto="admin.logs.logs_operacionais"><span><strong>{{content.logs_operacionais}}</strong><small>{{content.trilha_de_auditoria}}</small></span></button>
</div>
        <div class="op-toast" role="status" aria-live="polite"></div>
      </main>

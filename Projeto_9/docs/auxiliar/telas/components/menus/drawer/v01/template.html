<aside class="prototype-drawer" data-overlay-root aria-hidden="true">
  <button class="drawer-backdrop" type="button" data-action="drawer.close" aria-label="{{content.fechar_menu_aria_label}}"></button>
  <div class="drawer-panel">
    <div class="drawer-top">
      <div class="drawer-identity">
        <div class="drawer-avatar">{{avatar}}</div>
        <div class="drawer-profile"><strong>{{name}}</strong><small>{{subtitle}}</small></div>
      </div>
    </div>
    {{#if showOnline}}<button class="drawer-online" type="button" data-action="online.toggle" data-online-root>
      <span class="online-dot"></span><span class="drawer-online-copy"><strong data-online-status>{{content.online}}</strong><small data-online-copy>{{content.recebendo_novas_solicitacoes}}</small></span><i class="online-switch"><b></b></i>
    </button>{{/if}}
    <nav class="drawer-nav" data-professional-menu aria-label="{{content.menu_principal_aria_label}}">
      {{#each items}}<button type="button" data-menu-target="{{goto}}" data-goto="{{goto}}" data-professional-capability="{{capability}}"><svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon}}"></path></svg><span>{{label}}</span></button>{{/each}}
    </nav>
    <div class="drawer-footer">
      <div class="drawer-footer-top">
        <button class="drawer-logout" type="button" data-goto="{{logoutGoto}}"><svg class="drawer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"></path></svg><span>{{logoutLabel}}</span></button>
        <small>{{footer}}</small>
      </div>
      <button class="drawer-emergency" type="button" data-action="emergency.mock">{{emergencyLabel}}</button>
    </div>
  </div>
</aside>

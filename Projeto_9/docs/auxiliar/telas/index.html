<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="component-registry" content="./components/__registry__.json">
<meta name="asset-base" content="./assets/">
<title>Advogado Já · Catálogo de telas</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#0e1627;--line:#26324a;--text:#e9eefc;--muted:#92a0bd;--accent:#7aa2ff;--ok:#5fd38d;--warn:#f0c56a;--bad:#ff7b88}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}a{color:inherit}.catalog-wrap{max-width:1380px;margin:auto;padding:22px}.catalog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.catalog-head h1{font-size:20px;margin:0 0 6px}.catalog-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:11px;white-space:nowrap}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tools input,.tools select,.tools button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:9px 10px}.tools input{min-width:260px;flex:1}.tools button{cursor:pointer}.tools button:hover{border-color:var(--accent)}.note{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 13px;color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.card{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:12px;display:grid;gap:7px}.card strong{font-size:13px}.card small{color:var(--muted);overflow-wrap:anywhere}.card .feature{font-size:10px;color:var(--accent)}.card a{display:inline-block;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:7px 9px;text-align:center;font-size:12px}.card a:hover{border-color:var(--accent)}.validation{display:none;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:10px 0 14px;font-size:12px;white-space:pre-wrap}.validation.show{display:block}.validation.ok{border-color:#28513b;color:var(--ok)}.validation.bad{border-color:#5a2931;color:var(--bad)}.screen-error{max-width:680px;margin:60px auto;padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}.screen-error p{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
const app=document.querySelector('#app');
const params=new URL(location.href).searchParams;
const screenKey=(params.get('screen')||'').trim();
if(location.protocol==='file:'){
  app.innerHTML='<div class="screen-error"><h1>Abra por um servidor estático</h1><p>Este pacote usa módulos ES e fetch para os fragmentos visuais. Publique no Netlify ou execute um servidor local e abra somente <code>index.html</code>.</p></div>';
}else if(screenKey){
  app.innerHTML='<div id="screen-root"></div>';
  await import('./engine/screen-engine.js?v=4');
}else{
  await bootCatalog();
}
async function bootCatalog(){
  const cat=await fetch('./catalogo/catalogo_master.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Catálogo não encontrado');return r.json()});
  const screens=Object.values(cat.entities?.screens||{}).sort((a,b)=>String(a.identity?.feature||'').localeCompare(String(b.identity?.feature||''))||(a.identity?.order??999)-(b.identity?.order??999)||String(a.identity?.name||'').localeCompare(String(b.identity?.name||'')));
  app.innerHTML=`<main class="catalog-wrap"><div class="catalog-head"><div><h1>Catálogo Mestre · Telas</h1><p>O Catálogo Mestre define composição, dados, rotas e engenharia. As pastas físicas guardam somente fontes visuais.</p></div><span class="badge">${screens.length} telas · ${Object.keys(cat.entities?.components||{}).length} componentes</span></div><div class="tools"><input id="search" type="search" placeholder="Buscar tela, ID ou rota"><select id="feature"><option value="">Todas as áreas</option></select><button id="validate">Validar todas</button></div><div class="note"><b>Ponto único de entrada:</b> use sempre este <code>index.html</code>. Cada tela é aberta como <code>?screen=ID_DA_TELA</code> e montada pela engine a partir do catálogo.</div><div id="validation" class="validation"></div><section id="grid" class="grid"></section></main>`;
  const features=[...new Map(screens.map(s=>[s.identity?.feature,s.identity?.featureLabel||s.identity?.feature])).entries()].filter(x=>x[0]);
  document.querySelector('#feature').insertAdjacentHTML('beforeend',features.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join(''));
  const search=document.querySelector('#search'),feature=document.querySelector('#feature'),grid=document.querySelector('#grid');
  const render=()=>{const q=search.value.trim().toLowerCase(),f=feature.value;grid.innerHTML=screens.filter(s=>(!f||s.identity?.feature===f)&&(!q||`${s.identity?.id} ${s.identity?.name} ${s.contract?.route}`.toLowerCase().includes(q))).map(s=>`<article class="card"><span class="feature">${esc(s.identity?.featureLabel||s.identity?.feature||'')}</span><strong>${esc(s.identity?.name||s.identity?.id)}</strong><small>${esc(s.identity?.id)}</small><small>${esc(s.contract?.route||'')}</small><a href="./index.html?screen=${encodeURIComponent(s.identity.id)}">Abrir tela</a></article>`).join('')};
  search.oninput=render;feature.onchange=render;render();
  document.querySelector('#validate').onclick=()=>validateAll(cat,screens);
}
async function validateAll(cat,screens){
 const box=document.querySelector('#validation');box.className='validation show';box.textContent='Validando…';let ok=0;const errors=[];
 for(const s of screens){
   const cfg=s.engineering?.screenConfig;let valid=!!cfg?.screen?.key;
   for(const [slot,list] of Object.entries(cfg?.composition||{}))for(const entry of list||[]){
     let base,manifest;
     if(entry.ref){const c=cat.entities?.components?.[entry.ref];if(!c){errors.push(`${s.identity.id}: componente ausente ${entry.ref}`);valid=false;continue}base=c.render?.basePath;manifest=c.render?.manifest}
     else{const c=s.render?.localComponents?.[entry.id];if(!c){errors.push(`${s.identity.id}: componente local ausente ${entry.id}`);valid=false;continue}base=c.render?.basePath;manifest=c.render?.manifest}
     if(manifest?.id&&manifest.id!==entry.id){errors.push(`${s.identity.id}: id divergente ${entry.id}`);valid=false}
     try{const r=await fetch('./'+base+'/template.html',{cache:'no-store'});if(!r.ok){errors.push(`${s.identity.id}: template ausente ${base}`);valid=false}}catch(e){errors.push(`${s.identity.id}: falha ${base}`);valid=false}
   }
   if(valid)ok++;
 }
 const assetWarning=cat.resources?.assets?.files?.includes('assets/welcome_professionals.png')?'':'\nAviso: welcome_professionals.png não existe no pacote original; a tela monta, mas essa imagem permanece ausente.';
 box.className='validation show '+(errors.length?'bad':'ok');box.textContent=`${ok}/${screens.length} telas estruturalmente válidas.${errors.length?'\n'+errors.slice(0,20).join('\n'):''}${errors.length>20?'\n… '+(errors.length-20)+' erros adicionais':''}${assetWarning}`;
}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
</script>
</body>
</html>

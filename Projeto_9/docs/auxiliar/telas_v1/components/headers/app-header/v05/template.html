<header class="app-header">
  <button class="app-menu-button" type="button" data-action="drawer.open" aria-label="{{menuLabel}}">
    <span></span><span></span><span></span>
  </button>
  <div class="app-brand">
    <img src="{{_assetBase}}brand_symbol.svg" alt="" /><strong>{{brand}}</strong>
  </div>
  <button class="app-notification-button" type="button" data-goto="notificacoes.lista.notificacoes" aria-label="{{content.notificacoes_aria_label}}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
    <span class="app-notification-badge" aria-label="{{content.texto_3_notificacoes_nao_lidas_aria_label}}">{{content.valor_3}}</span>
  </button>
</header>

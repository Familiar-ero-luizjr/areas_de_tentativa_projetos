<div class="registration__shell"><div class="registration__intro"><p class="eyebrow">{{content.subfluxo_escritorio}}</p><h1>{{content.dados_do_escritorio}}</h1><p>{{content.o_advogado_que_cria_o_escritorio_sera_o_responsavel_proprietario}}</p></div><form class="form-card" data-office-form><div class="field"><input id="office-name" type="text" placeholder=" " data-office-field="name" required><label for="office-name">{{content.nome_do_escritorio}}</label></div><div class="field"><input id="office-cnpj" type="text" placeholder=" " inputmode="numeric" data-office-field="cnpj" required><label for="office-cnpj">{{content.cnpj}}</label></div><div class="field-grid two"><div class="field"><input id="office-email" type="email" placeholder=" " data-office-field="email" required><label for="office-email">{{content.e_mail}}</label></div><div class="field"><input id="office-phone" type="tel" placeholder=" " data-office-field="phone" required><label for="office-phone">{{content.telefone}}</label></div></div><div class="field"><input id="office-address" type="text" placeholder=" " data-office-field="address" required><label for="office-address">{{content.logradouro}}</label></div><div class="field-grid two"><div class="field"><input id="office-address-number" type="text" placeholder=" " data-office-field="addressNumber" required><label for="office-address-number">{{content.numero}}</label></div><div class="field"><input id="office-zip" type="text" placeholder=" " inputmode="numeric" data-office-field="zipCode" required><label for="office-zip">{{content.cep}}</label></div></div><div class="field-grid two"><div class="field"><input id="office-neighborhood" type="text" placeholder=" " data-office-field="neighborhood" required><label for="office-neighborhood">{{content.bairro}}</label></div><div class="field"><input id="office-district" type="text" placeholder=" " data-office-field="district"><label for="office-district">{{content.distrito}}</label></div></div><div class="field-grid two"><div class="field"><input id="office-city" type="text" placeholder=" " data-office-field="city" required><label for="office-city">{{content.cidade}}</label></div><div class="select-field"><label for="office-uf">{{content.uf}}</label><select id="office-uf" data-office-field="uf" required><option value="">{{content.selecionar}}</option><option value="AC">{{content.ac}}</option><option value="AL">{{content.al}}</option><option value="AP">{{content.ap}}</option><option value="AM">{{content.am}}</option><option value="BA">{{content.ba}}</option><option value="CE">{{content.ce}}</option><option value="DF">{{content.df}}</option><option value="ES">{{content.es}}</option><option value="GO">{{content.go}}</option><option value="MA">{{content.ma}}</option><option value="MT">{{content.mt}}</option><option value="MS">{{content.ms}}</option><option value="MG">{{content.mg}}</option><option value="PA">{{content.pa}}</option><option value="PB">{{content.pb}}</option><option value="PR">{{content.pr}}</option><option value="PE">{{content.pe}}</option><option value="PI">{{content.pi}}</option><option value="RJ">{{content.rj}}</option><option value="RN">{{content.rn}}</option><option value="RS">{{content.rs}}</option><option value="RO">{{content.ro}}</option><option value="RR">{{content.rr}}</option><option value="SC">{{content.sc}}</option><option value="SP">{{content.sp}}</option><option value="SE">{{content.se}}</option><option value="TO">{{content.to}}</option></select></div></div><div class="form-actions"><button class="secondary-action" type="button" data-goto="escritorio.onboarding.vinculo_escritorio">{{content.voltar}}</button><button class="button" type="submit" data-next="advogado.onboarding.revisao_profissional">{{content.continuar}}</button></div><p class="form-status" aria-live="polite"></p></form></div>

<div class="registration__shell"><div class="registration__intro"><p class="eyebrow">{{content.onboarding_profissional_1_de_8}}</p><h1>{{content.dados_academicos}}</h1><p>{{content.informe_sua_formacao_estes_dados_compoem_o_cadastro_profissional}}</p></div><div class="progress"><span style="width:12.5%"></span></div><form class="form-card" data-professional-form><div class="field"><input id="pro-education-institution" type="text" placeholder=" " data-pro-field="educationInstitution" required><label for="pro-education-institution">{{content.instituicao_de_ensino}}</label></div><div class="field"><input id="pro-education-city" type="text" placeholder=" " data-pro-field="educationInstitutionCity" required><label for="pro-education-city">{{content.cidade_da_instituicao}}</label></div><div class="field"><input id="pro-education-course" type="text" placeholder=" " data-pro-field="educationCourse" required><label for="pro-education-course">{{content.curso}}</label></div><div class="field-grid two"><div class="field"><input id="pro-graduation-year" type="number" min="1950" max="2100" placeholder=" " inputmode="numeric" data-pro-field="graduationYear" required><label for="pro-graduation-year">{{content.ano_de_conclusao}}</label></div><div class="field"><input id="pro-specialization" type="text" placeholder=" " data-pro-field="specialization"><label for="pro-specialization">{{content.especializacao_opcional}}</label></div></div><div class="form-actions"><button class="secondary-action" type="button" data-goto="auth.cadastro.concluido">{{content.voltar}}</button><button class="button" type="submit" data-next="advogado.onboarding.dados_profissionais">{{content.continuar}}</button></div><p class="form-status" aria-live="polite"></p></form></div>

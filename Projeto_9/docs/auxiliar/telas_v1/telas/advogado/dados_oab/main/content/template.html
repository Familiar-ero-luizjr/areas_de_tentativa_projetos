<div class="registration__shell"><div class="registration__intro"><p class="eyebrow">{{content.onboarding_profissional_3_de_8}}</p><h1>{{content.dados_da_oab}}</h1><p>{{content.os_dados_e_a_evidencia_documental_poderao_passar_por_validacao}}</p></div><div class="progress"><span style="width:37.5%"></span></div><form class="form-card" data-professional-form><div class="field"><input id="pro-oab-number" type="text" placeholder=" " data-pro-field="oabNumber" required><label for="pro-oab-number">{{content.numero_da_oab}}</label></div><div class="field-grid two"><div class="select-field"><label for="pro-oab-uf">{{content.uf_da_oab}}</label><select id="pro-oab-uf" data-pro-field="oabUf" required><option value="">{{content.selecionar}}</option><option value="AC">{{content.ac}}</option><option value="AL">{{content.al}}</option><option value="AP">{{content.ap}}</option><option value="AM">{{content.am}}</option><option value="BA">{{content.ba}}</option><option value="CE">{{content.ce}}</option><option value="DF">{{content.df}}</option><option value="ES">{{content.es}}</option><option value="GO">{{content.go}}</option><option value="MA">{{content.ma}}</option><option value="MT">{{content.mt}}</option><option value="MS">{{content.ms}}</option><option value="MG">{{content.mg}}</option><option value="PA">{{content.pa}}</option><option value="PB">{{content.pb}}</option><option value="PR">{{content.pr}}</option><option value="PE">{{content.pe}}</option><option value="PI">{{content.pi}}</option><option value="RJ">{{content.rj}}</option><option value="RN">{{content.rn}}</option><option value="RS">{{content.rs}}</option><option value="RO">{{content.ro}}</option><option value="RR">{{content.rr}}</option><option value="SC">{{content.sc}}</option><option value="SP">{{content.sp}}</option><option value="SE">{{content.se}}</option><option value="TO">{{content.to}}</option></select></div><div class="select-field"><label for="pro-oab-type">{{content.tipo_de_inscricao}}</label><select id="pro-oab-type" data-pro-field="oabType" required><option value="">{{content.selecionar_2}}</option><option value="advogado">{{content.advogado}}</option><option value="estagiario">{{content.estagiario}}</option><option value="suplementar">{{content.suplementar}}</option></select></div></div><label class="upload-field"><span><strong>{{content.documento_da_oab}}</strong><small>{{content.foto_ou_pdf_para_validacao}}</small></span><span class="upload-button">{{content.escolher_arquivo}}</span><input id="pro-oab-document" type="file" accept="image/jpeg,image/png,application/pdf" data-pro-file="oabDocument"><em data-pro-file-name>{{content.nenhum_arquivo_selecionado}}</em></label><div class="form-actions"><button class="secondary-action" type="button" data-goto="advogado.onboarding.dados_profissionais">{{content.voltar}}</button><button class="button" type="submit" data-next="advogado.onboarding.areas_atuacao">{{content.continuar}}</button></div><p class="form-status" aria-live="polite"></p></form></div>

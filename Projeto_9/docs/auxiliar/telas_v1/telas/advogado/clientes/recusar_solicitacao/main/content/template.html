<main class="op-shell">
        
        
        <form class="op-card op-form" data-prototype-form data-success-message="Recusa registrada na simulação.">
<h2>{{content.informe_o_motivo}}</h2><label>{{content.motivo}}<select required><option value="">{{content.selecione_uma_opcao}}</option><option>{{content.nao_atuo_nesta_materia}}</option><option>{{content.indisponibilidade_de_agenda}}</option><option>{{content.conflito_de_interesse}}</option><option>{{content.outro_motivo}}</option></select></label>
<button class="button" type="submit">{{content.confirmar_recusa}}</button><button class="op-secondary" type="button" data-goto="advogado.clientes.detalhe_solicitacao">{{content.voltar}}</button></form>
        <div class="op-toast" role="status" aria-live="polite"></div>
      </main>

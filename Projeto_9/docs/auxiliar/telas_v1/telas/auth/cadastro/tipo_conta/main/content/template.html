<div class="registration__shell"><div class="registration__intro"><p class="eyebrow">{{content.criar_conta}}</p><h1>{{content.como_voce_vai_usar_o_advogadoja}}</h1><p>{{content.o_cadastro_de_dados_pessoais_e_o_mesmo_para_todos_esta_escolha_d}}</p></div><div class="progress" aria-label="{{content.etapa_1_de_7_aria_label}}"><span style="width:14.285%"></span></div><form class="form-card" data-registration-form><fieldset class="choice-group"><legend>{{content.tipo_de_conta}}</legend><label class="choice-card"><input type="radio" name="accountType" value="cliente" data-reg-field="accountType" required><span><strong>{{content.cliente}}</strong><small>{{content.quero_encontrar_e_entrar_em_contato_com_profissionais}}</small></span><b aria-hidden="true">›</b></label><label class="choice-card"><input type="radio" name="accountType" value="advogado" data-reg-field="accountType" required><span><strong>{{content.advogado}}</strong><small>{{content.quero_criar_meu_perfil_profissional_e_receber_solicitacoes}}</small></span><b aria-hidden="true">›</b></label></fieldset><div class="form-note"><strong>{{content.administrador}}</strong><span>{{content.o_acesso_administrativo_nao_e_criado_pelo_cadastro_publico_ele_e}}</span></div><div class="form-actions"><button class="secondary-action" type="button" data-goto="auth.sessao.entrar">{{content.voltar}}</button><button class="button" type="submit" data-next="auth.cadastro.identificacao">{{content.continuar}}</button></div><p class="form-status" aria-live="polite"></p></form></div>

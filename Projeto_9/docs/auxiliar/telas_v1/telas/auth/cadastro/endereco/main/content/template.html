<div class="registration__shell"><div class="registration__intro"><p class="eyebrow">{{content.dados_pessoais}}</p><h1>{{content.endereco}}</h1><p>{{content.endereco_residencial_associado_a_conta_localizacao_precisa_conti}}</p></div><div class="progress" aria-label="{{content.etapa_4_de_7_aria_label}}"><span style="width:57.14%"></span></div><form class="form-card" data-registration-form><div class="field"><input id="reg-zip" name="zipCode" type="text" placeholder=" " autocomplete="postal-code" inputmode="numeric" data-reg-field="zipCode" required><label for="reg-zip">{{content.cep}}</label></div><div class="field"><input id="reg-address" name="address" type="text" placeholder=" " autocomplete="address-line1" data-reg-field="address" required><label for="reg-address">{{content.logradouro}}</label></div><div class="field-grid"><div class="field"><input id="reg-number" name="addressNumber" type="text" placeholder=" " autocomplete="address-line2" data-reg-field="addressNumber" required><label for="reg-number">{{content.numero}}</label></div><div class="field"><input id="reg-complement" name="complement" type="text" placeholder=" " data-reg-field="complement"><label for="reg-complement">{{content.complemento}}</label></div></div><div class="field-grid"><div class="field"><input id="reg-neighborhood" name="neighborhood" type="text" placeholder=" " data-reg-field="neighborhood" required><label for="reg-neighborhood">{{content.bairro}}</label></div><div class="field"><input id="reg-district" name="district" type="text" placeholder=" " data-reg-field="district"><label for="reg-district">{{content.distrito}}</label></div></div><div class="field"><input id="reg-city" name="city" type="text" placeholder=" " autocomplete="address-level2" data-reg-field="city" required><label for="reg-city">{{content.cidade}}</label></div><div class="field-grid"><div class="select-field"><label for="reg-uf">{{content.uf}}</label><select id="reg-uf" name="uf" autocomplete="address-level1" data-reg-field="uf" required><option value="">{{content.selecionar}}</option><option>{{content.ac}}</option><option>{{content.al}}</option><option>{{content.ap}}</option><option>{{content.am}}</option><option>{{content.ba}}</option><option>{{content.ce}}</option><option>{{content.df}}</option><option>{{content.es}}</option><option>{{content.go}}</option><option>{{content.ma}}</option><option>{{content.mt}}</option><option>{{content.ms}}</option><option>{{content.mg}}</option><option>{{content.pa}}</option><option>{{content.pb}}</option><option>{{content.pr}}</option><option>{{content.pe}}</option><option>{{content.pi}}</option><option>{{content.rj}}</option><option>{{content.rn}}</option><option>{{content.rs}}</option><option>{{content.ro}}</option><option>{{content.rr}}</option><option>{{content.sc}}</option><option>{{content.sp}}</option><option>{{content.se}}</option><option>{{content.to}}</option></select></div><div class="select-field"><label for="reg-country">{{content.pais}}</label><select id="reg-country" name="country" data-reg-field="country"><option value="BR">{{content.brasil}}</option></select></div></div><div class="form-actions"><button class="secondary-action" type="button" data-goto="auth.cadastro.contato">{{content.voltar}}</button><button class="button" type="submit" data-next="auth.cadastro.seguranca">{{content.continuar}}</button></div><p class="form-status" aria-live="polite"></p></form></div>

<div class="registration__shell"><div class="registration__intro"><p class="eyebrow">{{content.dados_pessoais}}</p><h1>{{content.identificacao}}</h1><p>{{content.este_bloco_e_comum_para_cliente_e_advogado}}</p></div><div class="progress" aria-label="{{content.etapa_2_de_7_aria_label}}"><span style="width:28.57%"></span></div><form class="form-card" data-registration-form><div class="field"><input id="reg-name" name="name" type="text" placeholder=" " autocomplete="given-name" data-reg-field="name" required><label for="reg-name">{{content.nome}}</label></div><div class="field"><input id="reg-surname" name="surname" type="text" placeholder=" " autocomplete="family-name" data-reg-field="surname" required><label for="reg-surname">{{content.sobrenome}}</label></div><div class="field"><input id="reg-username" name="username" type="text" placeholder=" " autocomplete="username" data-reg-field="username" required><label for="reg-username">{{content.nome_de_usuario}}</label></div><div class="field"><input id="reg-cpf" name="cpf" type="text" placeholder=" " inputmode="numeric" autocomplete="off" data-reg-field="cpf" required><label for="reg-cpf">{{content.cpf}}</label></div><div class="field"><input id="reg-birthday" name="birthday" type="date" placeholder=" " autocomplete="bday" data-reg-field="birthday" required><label for="reg-birthday">{{content.data_de_nascimento}}</label></div><div class="select-field"><label for="reg-gender">{{content.genero}}</label><select id="reg-gender" name="gender" data-reg-field="gender" required><option value="">{{content.selecionar}}</option><option value="feminino">{{content.feminino}}</option><option value="masculino">{{content.masculino}}</option><option value="nao-informar">{{content.prefiro_nao_informar}}</option></select></div><label class="upload-field"><span><strong>{{content.foto_de_perfil}}</strong><small>{{content.opcional_jpg_ou_png}}</small></span><span class="upload-button">{{content.escolher_foto}}</span><input id="reg-photo" type="file" accept="image/jpeg,image/png" data-reg-file="profilePhoto"><em data-file-name>{{content.nenhum_arquivo_selecionado}}</em></label><div class="form-actions"><button class="secondary-action" type="button" data-goto="auth.cadastro.tipo_conta">{{content.voltar}}</button><button class="button" type="submit" data-next="auth.cadastro.contato">{{content.continuar}}</button></div><p class="form-status" aria-live="polite"></p></form></div>

<main class="op-shell client-legacy__content">
        
        
        <div class="op-card client-profile">
        <div class="client-avatar">{{content.mo}}</div>
        <div><h3>{{content.mariana_oliveira}}</h3><p>{{content.cliente_sao_paulo_sp}}</p></div>
        <span class="status-chip ok">{{content.ativo}}</span>
      </div>
      <div class="op-card">
        <div class="meta-list">
          <div class="meta-row"><span>{{content.nome}}</span><strong>{{content.mariana_oliveira_2}}</strong></div>
          <div class="meta-row"><span>{{content.e_mail}}</span><strong>{{content.mariana_email_com}}</strong></div>
          <div class="meta-row"><span>{{content.telefone}}</span><strong>{{content.texto_11_98888_1010}}</strong></div>
          <div class="meta-row"><span>{{content.cidade_uf}}</span><strong>{{content.sao_paulo_sp}}</strong></div>
        </div>
        <div class="op-buttons">
          <button class="op-secondary" type="button" data-action-message="Edição de dados simulada no protótipo.">{{content.editar_dados}}</button>
          <button class="op-secondary" type="button" data-goto="cliente.onboarding.preferencias_contato">{{content.preferencias_de_contato}}</button>
          <button class="op-secondary" type="button" data-action-message="Solicitação de exclusão simulada no protótipo.">{{content.excluir_conta}}</button>
        </div>
      </div>
        <div class="op-toast" role="status" aria-live="polite"></div>
      </main>

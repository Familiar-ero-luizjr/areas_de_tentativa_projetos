<main class="context-shell"><button class="context-back" type="button" data-goto="cliente.configuracao.suporte">{{content.suporte}}</button><div class="context-head"><h1>{{content.falar_com_o_suporte}}</h1><p>{{content.envie_uma_solicitacao_para_a_equipe_de_suporte}}</p></div><form class="context-panel context-form" data-prototype-form><label class="context-field"><span>{{content.assunto}}</span><select><option>{{content.acesso_e_conta}}</option><option>{{content.busca_de_profissionais}}</option><option>{{content.solicitacoes_e_contatos}}</option><option>{{content.avaliacao}}</option><option>{{content.denuncia_de_conduta}}</option><option>{{content.outro}}</option></select></label><label class="context-field"><span>{{content.mensagem}}</span><textarea required placeholder="{{content.descreva_sua_duvida_ou_problema_placeholder}}"></textarea></label><div class="context-actions"><button class="context-secondary" type="button" data-goto="cliente.configuracao.suporte">{{content.cancelar}}</button><button class="context-primary" type="submit">{{content.enviar_chamado}}</button></div></form><div class="op-toast" role="status" aria-live="polite"></div></main>

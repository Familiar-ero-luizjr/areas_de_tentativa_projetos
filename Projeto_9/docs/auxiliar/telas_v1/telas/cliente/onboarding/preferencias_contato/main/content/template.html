<div class="registration__shell">
        <div class="registration__intro"><p class="eyebrow">{{content.onboarding_do_cliente}}</p><h1>{{content.como_prefere_ser_contatado}}</h1><p>{{content.essas_preferencias_orientam_o_contato_depois_que_um_profissional}}</p></div>
        <form class="form-card" data-client-onboarding-form>
          <div class="client-chip-row">
            <button class="client-chip active" type="button" data-client-toggle>{{content.whatsapp}}</button>
            <button class="client-chip" type="button" data-client-toggle>{{content.ligacao}}</button>
            <button class="client-chip" type="button" data-client-toggle>{{content.e_mail}}</button>
          </div>
          <div class="field"><input id="client-best-time" type="text" value="18h às 21h"><label for="client-best-time">{{content.melhor_horario}}</label></div>
          <div class="form-note"><strong>{{content.privacidade}}</strong><span>{{content.os_dados_de_contato_so_sao_compartilhados_apos_o_profissional_ac}}</span></div>
          <div class="op-buttons"><button class="button" type="submit" data-next="cliente.onboarding.concluido">{{content.salvar_preferencias}}</button></div>
          <p class="form-status" aria-live="polite"></p>
        </form>
      </div>

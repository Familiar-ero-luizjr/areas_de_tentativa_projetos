<main class="op-shell client-legacy__content requests-page">
  <section class="requests-summary" aria-labelledby="requests-title">
    <div>
      <h2 id="requests-title">{{content.minhas_solicitacoes}}</h2>
      <p>{{content.acompanhe_solicitacoes_pendentes_aceitas_e_recusadas}}</p>
    </div>
    <span class="requests-total" data-request-total>{{content.valor_4}}</span>
  </section>

  <div class="op-tabs requests-tabs" role="tablist" aria-label="{{content.filtrar_solicitacoes_aria_label}}">
    <button class="active" type="button" data-request-tab="all">{{content.todas}} <span data-tab-count="all">{{content.valor_4_2}}</span></button>
    <button type="button" data-request-tab="pending">{{content.pendentes}} <span data-tab-count="pending">{{content.valor_2}}</span></button>
    <button type="button" data-request-tab="accepted">{{content.aceitas}} <span data-tab-count="accepted">{{content.valor_1}}</span></button>
    <button type="button" data-request-tab="declined">{{content.recusadas}} <span data-tab-count="declined">{{content.valor_1_2}}</span></button>
  </div>

  <div class="requests-list" data-request-list>
    <button class="request-card" type="button" data-request-state="pending" data-request-id="AJ-1042" data-goto="cliente.profissionais.detalhe_solicitacao">
      <span class="request-main"><strong>{{content.criminal}}</strong><small>{{content.contato_prioritario_hoje_14_20}}</small></span>
      <span class="request-side"><span class="status-chip status-pending">{{content.pendente}}</span><small>{{content.aj_1042}}</small></span>
      <span class="request-chevron" aria-hidden="true">›</span>
    </button>
    <button class="request-card" type="button" data-request-state="pending" data-request-id="AJ-1029" data-goto="cliente.profissionais.detalhe_solicitacao">
      <span class="request-main"><strong>{{content.civel}}</strong><small>{{content.consultoria_16_09_09_10}}</small></span>
      <span class="request-side"><span class="status-chip status-pending">{{content.pendente_2}}</span><small>{{content.aj_1029}}</small></span>
      <span class="request-chevron" aria-hidden="true">›</span>
    </button>
    <button class="request-card" type="button" data-request-state="accepted" data-request-id="AJ-1038" data-goto="cliente.profissionais.detalhe_solicitacao">
      <span class="request-main"><strong>{{content.familia}}</strong><small>{{content.consultoria_ontem_18_45}}</small></span>
      <span class="request-side"><span class="status-chip status-accepted">{{content.aceita}}</span><small>{{content.aj_1038}}</small></span>
      <span class="request-chevron" aria-hidden="true">›</span>
    </button>
    <button class="request-card" type="button" data-request-state="declined" data-request-id="AJ-1032" data-goto="cliente.profissionais.detalhe_solicitacao">
      <span class="request-main"><strong>{{content.trabalhista}}</strong><small>{{content.contato_prioritario_17_09_11_05}}</small></span>
      <span class="request-side"><span class="status-chip status-declined">{{content.recusada}}</span><small>{{content.aj_1032}}</small></span>
      <span class="request-chevron" aria-hidden="true">›</span>
    </button>
  </div>

  <div class="op-empty requests-empty" data-request-empty hidden>
    <strong>{{content.nenhuma_solicitacao_neste_estado}}</strong>
    <span>{{content.as_solicitacoes_aparecerao_aqui_conforme_o_andamento}}</span>
  </div>
  <div class="op-toast" role="status" aria-live="polite"></div>
</main>

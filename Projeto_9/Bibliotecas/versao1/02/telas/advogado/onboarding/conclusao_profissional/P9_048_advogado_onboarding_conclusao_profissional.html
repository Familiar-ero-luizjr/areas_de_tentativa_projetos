    for(const [id,data] of entries){const parent=data?.paiRef;if(parent&&byKey.has(parent)&&parent!==id){if(!children.has(parent))children.set(parent,[]);children.get(parent).push([id,data]);}}
    for(const list of children.values())list.sort((a,b)=>(Number(a[1].ordem)||0)-(Number(b[1].ordem)||0));
    const recursing=new Set();
    function build(id,svg=false){
      if(recursing.has(id))throw Error('Ciclo em elemento '+id+' / '+inst);
      recursing.add(id);

    }

    const top=entries.filter(([id,d])=>!d.paiRef||!byKey.has(d.paiRef)||id===d.paiRef);
    top.sort((a,b)=>(a[0]===rootRef?-1:b[0]===rootRef?1:(Number(a[1].ordem)||0)-(Number(b[1].ordem)||0)));
    const nodes=top.map(([id])=>build(id));
    if(!nodes.length)warnings.push('Sem elementos: '+inst+' / '+(def?.identidade?.id||'?'));

  function canonicalAxes(def){
    if(!def)return {};
    if(!def.estados)return def.estrutura?.estadosVisuais||{};

      if(!axis||!axis.opcoes)continue;

        const elements={};

          const m=elements[t.ref]||{classesAdicionar:[],classesRemover:[],atributos:{}};

          elements[t.ref]=m;

        entries[choice]={elementos:elements};
      }
      out[dim]={inicial:axis.inicial,opcoes:entries};
    }

  }

  function baseStates(inst){const axes=canonicalAxes(definitions[instances[inst]]);const selected=composition[inst]?.estados||composition[inst]?.estadoVisual||{};const result={};
    for(const [axis,details] of Object.entries(axes)){const choice=selected[axis]??details.inicial; if(details.opcoes?.[choice])result[axis]=choice;else warnings.push('Estado desconhecido em '+inst+': '+axis+'/'+choice);}
    return result;
  }
  function applyStates(inst){const def=definitions[instances[inst]];const axes=canonicalAxes(def);const elements=perInstance.get(inst)||new Map();const options=stateByInstance.get(inst)||{};
    const affected=new Set();for(const axis of Object.values(axes))for(const option of Object.values(axis.opcoes||{}))for(const ref of Object.keys(option.elementos||{}))affected.add(ref);

      const base=el.__visualBase;for(const a of Array.from(el.attributes))el.removeAttribute(a.name);for(const [k,v] of base.attrs)el.setAttribute(k,v);if(!el.childElementCount)el.textContent=base.text;

  try{
    const allStyles=[`:root{${Object.entries(info.estrutura?.css?.tokens||{}).map(([k,v])=>k+':'+v+';').join('')}}`,...Object.values(info.estrutura?.css?.regras||{})];
    const items=Object.entries(instances).map(([inst,ref],i)=>({inst,ref,index:i,order:Number(composition[inst]?.ordem)||0}));
    for(const item of items){const def=definitions[item.ref];if(!def){warnings.push('Definição ausente: '+item.ref);continue;}
      allStyles.push(...Object.values(def.estrutura?.css?.regras||{}));createTree(def,item.inst);stateByInstance.set(item.inst,baseStates(item.inst));}
    const css=document.createElement('style');css.textContent=allStyles.join('\n').replace(/:host\b/g,':root');document.head.append(css);
    const inserted=new Set(),first=info.estrutura?.html?.raizRef||items[0]?.inst;
    function place(item){if(inserted.has(item.inst))return true;

            const parentInst=items.find(x=>x.inst===parentRef);
            if(parentInst&&!inserted.has(parentInst.inst))place(parentInst);
            target=allElements.get(parentRef)||instanceRoots.get(parentRef)?.[0];}
          if(target)parent=target;else warnings.push('Pai não encontrado: '+parentRef+' / '+item.inst);
        }

  const declared=info.navegacao?.destinosDeclarados||[];
  function currentDrawer(){return Object.keys(instances).find(k=>k.includes('drawer')||definitions[instances[k]]?.classificacao?.categoria==='menu');}
  function closeDrawer(){const inst=currentDrawer();if(inst&&setVisualState(inst,'painel','fechado'))return;
    document.querySelectorAll('.prototype-drawer,.drawer,[data-overlay-root]').forEach(el=>{el.classList.remove('open','is-open');el.setAttribute('aria-hidden','true');});}

    const el=ev.target.closest?.('button,a,[data-action],[data-goto]');if(!el)return;

})();

<script id="aj-canonical-layout-runtime">
(()=>{'use strict';
const el=document.getElementById('aj-layout-canonical-data');if(!el)return;
const cfg=JSON.parse(el.textContent),role=cfg.perfil,kind=cfg.contexto.tipo;
const def=cfg.componentes.menu?.estados||{};
const defaults={};for(const [axis,v] of Object.entries(def))defaults[axis]=v.inicial;
let state={...defaults},attached=false,menuRoot=null,headerRoot=null,titleRoot=null;
function roots(){let header=null,title=null,menu=null;
 const sec=document.querySelector('#screen-root [data-section-id="app-header"]');
 const sTitle=document.querySelector('#screen-root [data-section-id="titlebar"]');
 const sMenu=document.querySelector('#screen-root [data-section-id="drawer"]');
 header=sec?.shadowRoot?.querySelector('[data-aj-canonical="layout.header.app"]')||document.querySelector('[data-aj-canonical="layout.header.app"]');

}
const notify=msg=>{let x=document.getElementById('aj-layout-preview-message');if(!x){x=document.createElement('div');x.id='aj-layout-preview-message';x.setAttribute('role','status');Object.assign(x.style,{position:'fixed',bottom:'12px',left:'50%',transform:'translateX(-50%)',maxWidth:'95vw',zIndex:'99999',borderRadius:'10px',background:'#173c6b',color:'#fff',padding:'9px 14px',font:'12px system-ui',boxShadow:'0 5px 15px #0005'});document.body.append(x);}x.textContent=msg;clearTimeout(x._t);x._t=setTimeout(()=>x?.remove(),2800);};
function change(axis,v){if(!def[axis]?.opcoes?.[v])return false;state[axis]=v;render();const pane=document.getElementById('aj-layout-state-controls');if(pane){const select=pane.querySelector('[data-aj-axis="'+axis+'"]');if(select)select.value=v;}return true;}
function render(){({header:headerRoot,title:titleRoot,menu:menuRoot}=roots());if(!menuRoot)return;
 menuRoot.classList.toggle('open',state.painel==='aberto');menuRoot.setAttribute('aria-hidden',state.painel==='aberto'?'false':'true');

 menuRoot.setAttribute('data-plano',state.planoEstudante||'sem_plano');menuRoot.setAttribute('data-oab',state.acessoOab||'enabled');menuRoot.setAttribute('data-disponibilidade',state.disponibilidade||'online');menuRoot.setAttribute('data-vinculo-escritorio',state.vinculoEscritorio||'sem_escritorio');menuRoot.setAttribute('data-permissao',state.permissao||'gestor');
 const online=state.disponibilidade!=='offline';let root=menuRoot.querySelector('[data-aj-online-label]');if(root)root.textContent=online?'Online':'Offline';root=menuRoot.querySelector('[data-aj-online-copy]');if(root)root.textContent=online?'Recebendo novas solicitações':'Pausado para novas solicitações';
 menuRoot.querySelectorAll('[data-aj-caret]').forEach(node=>{node.textContent=(node.dataset.ajCaret==='estudante'?state.grupoEstudante:state.grupoEscritorio)==='aberto'?'▾':'▸';});
 const title=cfg.componentes.titlebar?.props?.titulo||'Início';
 const isHome=title==='Início';
 if(titleRoot?.querySelector('[data-aj-title]'))titleRoot.querySelector('[data-aj-title]').textContent=role==='cliente'&&state.grupoEstudante==='aberto'&&isHome?'Estudante':role==='advogado'&&state.grupoEscritorio==='aberto'&&isHome?'Escritório':title;
}
function bind(){const r=roots();if(!r.header&&!r.menu)return false;if(kind==='autenticado'&&!r.menu)return false;const eventRoot=r.menu?.getRootNode()||document; if(attached)return true;attached=true;
 const handle=(event)=>{
  const btn=event.target?.closest?.('[data-action],[data-aj-toggle],[data-aj-route]');if(!btn)return;
  const action=btn.dataset.action,toggle=btn.dataset.ajToggle,dest=btn.dataset.ajRoute;
  if(action==='drawer.open'){event.preventDefault();event.stopImmediatePropagation();change('painel','aberto');return;}
  if(action==='drawer.close'){event.preventDefault();event.stopImmediatePropagation();change('painel','fechado');return;}
  if(toggle){event.preventDefault();event.stopImmediatePropagation();if(toggle==='estudante')change('grupoEstudante',state.grupoEstudante==='aberto'?'fechado':'aberto');else if(toggle==='escritorio')change('grupoEscritorio',state.grupoEscritorio==='aberto'?'fechado':'aberto');else if(toggle==='disponibilidade')change('disponibilidade',state.disponibilidade==='online'?'offline':'online');return;}
  if(dest){event.preventDefault();event.stopImmediatePropagation();const locked=btn.hasAttribute('data-aj-protegido')&&state.planoEstudante!=='ativo';const restricted=btn.getAttribute('data-aj-oab-only')==='enabled'&&state.acessoOab==='restricted';const office=btn.hasAttribute('data-aj-requer-escritorio')&&state.vinculoEscritorio!=='ativo';const perm=btn.getAttribute('data-aj-admin-only')==='gestor'&&state.permissao!=='gestor';notify(locked?'Plano Estudante não ativo: área protegida.':restricted?'Validação da OAB necessária.':office?'Vínculo ativo com Escritório necessário.':perm?'Permissão de gestor necessária.':'Destino registrado: '+dest+' (sem navegação nesta biblioteca).');change('painel','fechado');return;}
 };
 document.addEventListener('click',handle,true);if(r.header?.getRootNode()!==document)r.header.getRootNode().addEventListener('click',handle,true);if(r.menu?.getRootNode()!==document&&r.menu?.getRootNode()!==r.header?.getRootNode())r.menu.getRootNode().addEventListener('click',handle,true);
 document.addEventListener('keydown',event=>{if(event.key==='Escape')change('painel','fechado')});
 render();installInspector();return true;
}
function installInspector(){if(kind!=='autenticado'||!cfg.componentes.menu||document.getElementById('aj-layout-study-toggle'))return;
 const toggle=document.createElement('button');toggle.id='aj-layout-study-toggle';toggle.type='button';toggle.textContent='⚙ Estados do layout';Object.assign(toggle.style,{position:'fixed',right:'10px',bottom:'10px',zIndex:'9995',padding:'7px 10px',font:'600 10px system-ui',background:'#10233f',color:'#fff',border:'1px solid #9bb0d2',borderRadius:'99px',cursor:'pointer'});
 const panel=document.createElement('div');panel.id='aj-layout-state-controls';panel.hidden=true;Object.assign(panel.style,{position:'fixed',right:'10px',bottom:'48px',zIndex:'9995',width:'min(280px,90vw)',maxHeight:'57vh',overflowY:'auto',background:'#fff',color:'#10233f',padding:'14px',border:'1px solid #cbd6e5',borderRadius:'11px',font:'12px system-ui',boxShadow:'0 12px 35px #0003'});
 const h=document.createElement('strong');h.textContent='Estados canônicos · layout';panel.append(h);
 for(const [axis,details] of Object.entries(def)){if(axis==='painel')continue;const row=document.createElement('label');Object.assign(row.style,{display:'grid',gap:'3px',marginTop:'10px'});const t=document.createElement('span');t.textContent=axis;const select=document.createElement('select');select.dataset.ajAxis=axis;Object.assign(select.style,{width:'100%',padding:'7px',borderRadius:'6px',border:'1px solid #bdcce0'});for(const v of Object.keys(details.opcoes)){const o=document.createElement('option');o.value=v;o.textContent=v;select.append(o);}select.value=state[axis];select.addEventListener('change',()=>change(axis,select.value));row.append(t,select);panel.append(row);}
 toggle.addEventListener('click',()=>panel.hidden=!panel.hidden);document.body.append(toggle,panel);
}
window.__advogadojaLayoutCanonico={getEstado:()=>({...state}),setEstado:change,getContrato:()=>cfg};
if(!bind()){window.addEventListener('modular-screen:ready',bind,{once:true});const observer=new MutationObserver(()=>{if(bind())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true});setTimeout(()=>observer.disconnect(),6000);}
})();
</script>

<script>
'use strict';
(function(){
  const info=JSON.parse(document.getElementById('view-data').textContent);
  const mount=document.getElementById('app-root');
  const warning=document.getElementById('warnings');
  const notification=document.getElementById('navigation-tip');
  const composition=info.estrutura?.html?.composicao||{};
  const definitions=info.definicoes||{};
  const instances=info.instancias||{};
  const warnings=[];
  const perInstance=new Map();
  const allElements=new Map();
  const instanceRoots=new Map();
  const stateByInstance=new Map();
  const voids=new Set(['input','img','hr','br','meta','link','area','source','wbr']);
  const deny=new Set(['script','iframe','object','embed','meta','link','base','style']);

  const $=s=>document.querySelector(s);
  function showMessage(s){notification.hidden=false;notification.textContent=s;clearTimeout(window.__notice);window.__notice=setTimeout(()=>notification.hidden=true,3400)}
  function createTree(def,inst){
    const html=def?.estrutura?.html||{}, entries=Object.entries(html.elementos||{});
    const children=new Map(), byKey=new Map(entries), registry=new Map();
    for(const [id,data] of entries){const parent=data?.paiRef;if(parent&&byKey.has(parent)&&parent!==id){if(!children.has(parent))children.set(parent,[]);children.get(parent).push([id,data]);}}
    for(const list of children.values())list.sort((a,b)=>(Number(a[1].ordem)||0)-(Number(b[1].ordem)||0));
    const recursing=new Set();
    function build(id,svg=false){
      if(recursing.has(id))throw Error('Ciclo em elemento '+id+' / '+inst);
      recursing.add(id);
      const data=byKey.get(id)||{},tag=String(data.tag||'div');let el;
      if(tag==='#text')el=document.createTextNode(String(data.texto??''));
      else if(!/^[a-z][\w:-]*$/i.test(tag)||deny.has(tag.toLowerCase()))el=document.createTextNode('');
      else{
        const isSvg=svg||svgTags.has(tag);el=isSvg?document.createElementNS('http://www.w3.org/2000/svg',tag):document.createElement(tag);
        const attrs=data.atributos||{};
        const pairs=Array.isArray(attrs)?attrs.map(a=>[a.nome,a.valor]):Object.entries(attrs);
        for(const [k,value] of pairs){
          const key=String(k),v=String(value??'');
          if(!/^[a-z_:][\w:.-]*$/i.test(key)||/^on/i.test(key)||['srcdoc','is'].includes(key.toLowerCase()))continue;
          if(['href','src','xlink:href','action','formaction'].includes(key.toLowerCase())&&/^(javascript|data:text\/html):/i.test(v.trim()))continue;
          try{el.setAttribute(key,v)}catch(e){}
        }
        if(typeof data.texto==='string'&&data.texto)el.appendChild(document.createTextNode(data.texto));
        if(!voids.has(tag.toLowerCase()))for(const [child] of children.get(id)||[])el.appendChild(build(child,isSvg));
      }
      if(el.nodeType===1)el.__instanceOrder=Number(data.ordem)||0;
      registry.set(id,el);
      if(!allElements.has(id))allElements.set(id,el);
      recursing.delete(id);return el;
    }
    const rootRef=html.raizRef;
    const top=entries.filter(([id,d])=>!d.paiRef||!byKey.has(d.paiRef)||id===d.paiRef);
    top.sort((a,b)=>(a[0]===rootRef?-1:b[0]===rootRef?1:(Number(a[1].ordem)||0)-(Number(b[1].ordem)||0)));
    const nodes=top.map(([id])=>build(id));
    if(!nodes.length)warnings.push('Sem elementos: '+inst+' / '+(def?.identidade?.id||'?'));
    perInstance.set(inst,registry);
    instanceRoots.set(inst,nodes);
    return nodes;
  }

  function canonicalAxes(def){
    if(!def)return {};
    if(!def.estados)return def.estrutura?.estadosVisuais||{};
    const out={};
    for(const [dim,axis] of Object.entries(def.estados)){
      if(!axis||!axis.opcoes)continue;
      const entries={};
      for(const [choice,option] of Object.entries(axis.opcoes)){
        const elements={};
        for(const t of option.alvos||[]){if(t.tipo!=="elemento")continue;
          const m=elements[t.ref]||{classesAdicionar:[],classesRemover:[],atributos:{}};
          for(const [name,on] of Object.entries(t.classes||{}))(on?m.classesAdicionar:m.classesRemover).push(name);
          Object.assign(m.atributos,t.atributos||{});
          if(Object.prototype.hasOwnProperty.call(t,"texto"))m.texto=t.texto;
          elements[t.ref]=m;
        }
        entries[choice]={elementos:elements};
      }
      out[dim]={inicial:axis.inicial,opcoes:entries};
    }
    return out;
  }

  function baseStates(inst){const axes=canonicalAxes(definitions[instances[inst]]);const selected=composition[inst]?.estados||composition[inst]?.estadoVisual||{};const result={};
    for(const [axis,details] of Object.entries(axes)){const choice=selected[axis]??details.inicial; if(details.opcoes?.[choice])result[axis]=choice;else warnings.push('Estado desconhecido em '+inst+': '+axis+'/'+choice);}
    return result;
  }
  function applyStates(inst){const def=definitions[instances[inst]];const axes=canonicalAxes(def);const elements=perInstance.get(inst)||new Map();const options=stateByInstance.get(inst)||{};
    const affected=new Set();for(const axis of Object.values(axes))for(const option of Object.values(axis.opcoes||{}))for(const ref of Object.keys(option.elementos||{}))affected.add(ref);
    for(const ref of affected){const el=elements.get(ref);if(!el||el.nodeType!==1)continue;if(!el.__visualBase){el.__visualBase={attrs:Array.from(el.attributes).map(a=>[a.name,a.value]),text:el.textContent}};
      const base=el.__visualBase;for(const a of Array.from(el.attributes))el.removeAttribute(a.name);for(const [k,v] of base.attrs)el.setAttribute(k,v);if(!el.childElementCount)el.textContent=base.text;
    }
    for(const [axis,details] of Object.entries(axes)){
      const selection=options[axis]??details.inicial;const option=details.opcoes?.[selection];if(!option)continue;
      for(const [ref,mod] of Object.entries(option.elementos||{})){
        const el=elements.get(ref);if(!el||el.nodeType!==1){warnings.push('Estado '+axis+' não encontra elemento '+ref);continue;}
        if(mod.classesAdicionar)for(const n of mod.classesAdicionar)el.classList.add(n);
        if(mod.classesRemover)for(const n of mod.classesRemover)el.classList.remove(n);
        for(const [k,v] of Object.entries(mod.atributos||{})){if(/^on/i.test(k))continue;if(v==null)el.removeAttribute(k);else el.setAttribute(k,String(v));}

    stateByInstance.set(inst,{...(stateByInstance.get(inst)||{}),[axis]:value});applyStates(inst);return true;}
  try{
    const allStyles=[`:root{${Object.entries(info.estrutura?.css?.tokens||{}).map(([k,v])=>k+':'+v+';').join('')}}`,...Object.values(info.estrutura?.css?.regras||{})];
    const items=Object.entries(instances).map(([inst,ref],i)=>({inst,ref,index:i,order:Number(composition[inst]?.ordem)||0}));
    for(const item of items){const def=definitions[item.ref];if(!def){warnings.push('Definição ausente: '+item.ref);continue;}
      allStyles.push(...Object.values(def.estrutura?.css?.regras||{}));createTree(def,item.inst);stateByInstance.set(item.inst,baseStates(item.inst));}
    const css=document.createElement('style');css.textContent=allStyles.join('\n').replace(/:host\b/g,':root');document.head.append(css);
    const inserted=new Set(),first=info.estrutura?.html?.raizRef||items[0]?.inst;
    function place(item){if(inserted.has(item.inst))return true;
      let parent=mount;
      if(item.inst!==first){const parentRef=composition[item.inst]?.paiRef;
        if(parentRef){let target=allElements.get(parentRef);if(!target){
            const parentInst=items.find(x=>x.inst===parentRef);
            if(parentInst&&!inserted.has(parentInst.inst))place(parentInst);
            target=allElements.get(parentRef)||instanceRoots.get(parentRef)?.[0];}
          if(target)parent=target;else warnings.push('Pai não encontrado: '+parentRef+' / '+item.inst);
        }
      }
      for(const el of instanceRoots.get(item.inst)||[]){el.__instanceOrder=item.order;const before=Array.from(parent.childNodes).find(x=>(x.__instanceOrder??-Infinity)>item.order);parent.insertBefore(el,before||null);}
      inserted.add(item.inst);return true;}
    items.sort((a,b)=>a.inst===first?-1:b.inst===first?1:a.order-b.order||a.index-b.index);
    for(const item of items)place(item);
    for(const item of items)applyStates(item.inst);
    if(!mount.childNodes.length)throw Error('Nenhum componente renderizável');
  }catch(err){warnings.push('Falha na montagem: '+err.message);mount.textContent='A estrutura não pôde ser montada. Verifique os contratos JSON.';}
  const declared=info.navegacao?.destinosDeclarados||[];
  function currentDrawer(){return Object.keys(instances).find(k=>k.includes('drawer')||definitions[instances[k]]?.classificacao?.categoria==='menu');}
  function closeDrawer(){const inst=currentDrawer();if(inst&&setVisualState(inst,'painel','fechado'))return;
    document.querySelectorAll('.prototype-drawer,.drawer,[data-overlay-root]').forEach(el=>{el.classList.remove('open','is-open');el.setAttribute('aria-hidden','true');});}
  function openDrawer(){const inst=currentDrawer();if(inst&&setVisualState(inst,'painel','aberto'))return;
    const el=$('.prototype-drawer')||$('[data-overlay-root]')||$('.drawer');if(el){el.classList.add('open');el.setAttribute('aria-hidden','false');}}
  document.addEventListener('click',ev=>{
    const el=ev.target.closest?.('button,a,[data-action],[data-goto]');if(!el)return;
    const action=el.getAttribute('data-action')||'';
    if(action==='drawer.open'||el.matches('.app-menu-button,[aria-label="Abrir menu"]')){ev.preventDefault();openDrawer();return;}
    if(action==='drawer.close'||el.matches('.drawer-backdrop,[aria-label="Fechar menu"]')){ev.preventDefault();closeDrawer();return;}
    if(el.matches('.aj-menu__switch[role="switch"]')){ev.preventDefault();const inst=currentDrawer();if(inst){const v=stateByInstance.get(inst)?.disponibilidade||'online';setVisualState(inst,'disponibilidade',v==='online'?'offline':'online');}return;}
    let elementId=null,instanceId=null;
    for(const [inst,reg] of perInstance){for(const [ref,node] of reg){if(node===el){elementId=ref;instanceId=inst;break;}}if(instanceId)break;}
    const destination=declared.find(d=>d.instanciaRef===instanceId&&d.elementoRef===elementId)?.destinoRef
      ||declared.find(d=>!d.instanciaRef&&d.elementoRef===elementId)?.destinoRef
      ||el.getAttribute('data-goto')||el.getAttribute('href');
    if(destination&&destination!=='#'){ev.preventDefault();showMessage('Destino declarado: '+destination+' · navegação desativada');return;}
    if(el.hasAttribute('data-demo-action')){ev.preventDefault();showMessage('Ação demonstrativa: '+el.getAttribute('data-demo-action'));return;}
    if(el.matches('button,a'))ev.preventDefault();
  });
  document.addEventListener('submit',e=>{e.preventDefault();showMessage('Envio demonstrativo · nenhum dado foi enviado');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
  window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.type!=='advogadoja.visualState')return;setVisualState(e.data.instance,e.data.axis,e.data.value)});
  if(warnings.length){warning.textContent=Array.from(new Set(warnings)).join(' · ');warning.hidden=false;}
  window.__advogadojaPreview={setVisualState,instances,stateByInstance};
})();

window.addEventListener('message',e=>{if(e.data?.type==='aj.v4.access'){const el=document.querySelector('.app');if(el)el.dataset.professionalAccess=e.data.value}});

</script>

<script id="aj-canonical-layout-runtime">

function change(axis,v){if(!def[axis]?.opcoes?.[v])return false;state[axis]=v;render();const pane=document.getElementById('aj-layout-state-controls');if(pane){const select=pane.querySelector('[data-aj-axis="'+axis+'"]');if(select)select.value=v;}return true;}

 const online=state.disponibilidade!=='offline';let root=menuRoot.querySelector('[data-aj-online-label]');if(root)root.textContent=online?'Online':'Offline';root=menuRoot.querySelector('[data-aj-online-copy]');if(root)root.textContent=online?'Recebendo novas solicitações':'Pausado para novas solicitações';
 menuRoot.querySelectorAll('[data-aj-caret]').forEach(node=>{node.textContent=(node.dataset.ajCaret==='estudante'?state.grupoEstudante:state.grupoEscritorio)==='aberto'?'▾':'▸';});

 const isHome=title==='Início';

  if(action==='drawer.close'){event.preventDefault();event.stopImmediatePropagation();change('painel','fechado');return;}
  if(toggle){event.preventDefault();event.stopImmediatePropagation();if(toggle==='estudante')change('grupoEstudante',state.grupoEstudante==='aberto'?'fechado':'aberto');else if(toggle==='escritorio')change('grupoEscritorio',state.grupoEscritorio==='aberto'?'fechado':'aberto');else if(toggle==='disponibilidade')change('disponibilidade',state.disponibilidade==='online'?'offline':'online');return;}
  if(dest){event.preventDefault();event.stopImmediatePropagation();const locked=btn.hasAttribute('data-aj-protegido')&&state.planoEstudante!=='ativo';const restricted=btn.getAttribute('data-aj-oab-only')==='enabled'&&state.acessoOab==='restricted';const office=btn.hasAttribute('data-aj-requer-escritorio')&&state.vinculoEscritorio!=='ativo';const perm=btn.getAttribute('data-aj-admin-only')==='gestor'&&state.permissao!=='gestor';notify(locked?'Plano Estudante não ativo: área protegida.':restricted?'Validação da OAB necessária.':office?'Vínculo ativo com Escritório necessário.':perm?'Permissão de gestor necessária.':'Destino registrado: '+dest+' (sem navegação nesta biblioteca).');change('painel','fechado');return;}
 };
 document.addEventListener('click',handle,true);if(r.header?.getRootNode()!==document)r.header.getRootNode().addEventListener('click',handle,true);if(r.menu?.getRootNode()!==document&&r.menu?.getRootNode()!==r.header?.getRootNode())r.menu.getRootNode().addEventListener('click',handle,true);

function installInspector(){if(kind!=='autenticado'||!cfg.componentes.menu||document.getElementById('aj-layout-study-toggle'))return;
 const toggle=document.createElement('button');toggle.id='aj-layout-study-toggle';toggle.type='button';toggle.textContent='⚙ Estados do layout';Object.assign(toggle.style,{position:'fixed',right:'10px',bottom:'10px',zIndex:'9995',padding:'7px 10px',font:'600 10px system-ui',background:'#10233f',color:'#fff',border:'1px solid #9bb0d2',borderRadius:'99px',cursor:'pointer'});

    for(const item of items)place(item);
    for(const item of items)applyStates(item.inst);

  const declared=info.navegacao?.destinosDeclarados||[];
  function currentDrawer(){return Object.keys(instances).find(k=>k.includes('drawer')||definitions[instances[k]]?.classificacao?.categoria==='menu');}
  function closeDrawer(){const inst=currentDrawer();if(inst&&setVisualState(inst,'painel','fechado'))return;

  const action=btn.dataset.action,toggle=btn.dataset.ajToggle,dest=btn.dataset.ajRoute;
  if(action==='drawer.open'){event.preventDefault();event.stopImmediatePropagation();change('painel','aberto');return;}
  if(action==='drawer.close'){event.preventDefault();event.stopImmediatePropagation();change('painel','fechado');return;}
  if(toggle){event.preventDefault();event.stopImmediatePropagation();if(toggle==='estudante')change('grupoEstudante',state.grupoEstudante==='aberto'?'fechado':'aberto');else if(toggle==='escritorio')change('grupoEscritorio',state.grupoEscritorio==='aberto'?'fechado':'aberto');else if(toggle==='disponibilidade')change('disponibilidade',state.disponibilidade==='online'?'offline':'online');return;}
  if(dest){event.preventDefault();event.stopImmediatePropagation();const locked=btn.hasAttribute('data-aj-protegido')&&state.planoEstudante!=='ativo';const restricted=btn.getAttribute('data-aj-oab-only')==='enabled'&&state.acessoOab==='restricted';const office=btn.hasAttribute('data-aj-requer-escritorio')&&state.vinculoEscritorio!=='ativo';const perm=btn.getAttribute('data-aj-admin-only')==='gestor'&&state.permissao!=='gestor';notify(locked?'Plano Estudante não ativo: área protegida.':restricted?'Validação da OAB necessária.':office?'Vínculo ativo com Escritório necessário.':perm?'Permissão de gestor necessária.':'Destino registrado: '+dest+' (sem navegação nesta biblioteca).');change('painel','fechado');return;}
 };
 document.addEventListener('click',handle,true);if(r.header?.getRootNode()!==document)r.header.getRootNode().addEventListener('click',handle,true);if(r.menu?.getRootNode()!==document&&r.menu?.getRootNode()!==r.header?.getRootNode())r.menu.getRootNode().addEventListener('click',handle,true);
 document.addEventListener('keydown',event=>{if(event.key==='Escape')change('painel','fechado')});
 render();installInspector();return true;
}
function installInspector(){if(kind!=='autenticado'||!cfg.componentes.menu||document.getElementById('aj-layout-study-toggle'))return;
 const toggle=document.createElement('button');toggle.id='aj-layout-study-toggle';toggle.type='button';toggle.textContent='⚙ Estados do layout';Object.assign(toggle.style,{position:'fixed',right:'10px',bottom:'10px',zIndex:'9995',padding:'7px 10px',font:'600 10px system-ui',background:'#10233f',color:'#fff',border:'1px solid #9bb0d2',borderRadius:'99px',cursor:'pointer'});
 const panel=document.createElement('div');panel.id='aj-layout-state-controls';panel.hidden=true;Object.assign(panel.style,{position:'fixed',right:'10px',bottom:'48px',zIndex:'9995',width:'min(280px,90vw)',maxHeight:'57vh',overflowY:'auto',background:'#fff',color:'#10233f',padding:'14px',border:'1px solid #cbd6e5',borderRadius:'11px',font:'12px system-ui',boxShadow:'0 12px 35px #0003'});
 const h=document.createElement('strong');h.textContent='Estados canônicos · layout';panel.append(h);
 for(const [axis,details] of Object.entries(def)){if(axis==='painel')continue;const row=document.createElement('label');Object.assign(row.style,{display:'grid',gap:'3px',marginTop:'10px'});const t=document.createElement('span');t.textContent=axis;const select=document.createElement('select');select.dataset.ajAxis=axis;Object.assign(select.style,{width:'100%',padding:'7px',borderRadius:'6px',border:'1px solid #bdcce0'});for(const v of Object.keys(details.opcoes)){const o=document.createElement('option');o.value=v;o.textContent=v;select.append(o);}select.value=state[axis];select.addEventListener('change',()=>change(axis,select.value));row.append(t,select);panel.append(row);}
 toggle.addEventListener('click',()=>panel.hidden=!panel.hidden);document.body.append(toggle,panel);
}
window.__advogadojaLayoutCanonico={getEstado:()=>({...state}),setEstado:change,getContrato:()=>cfg};
if(!bind()){window.addEventListener('modular-screen:ready',bind,{once:true});const observer=new MutationObserver(()=>{if(bind())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true});setTimeout(()=>observer.disconnect(),6000);}
})();

<script>
// Adaptador independente de rede: todos os fragmentos, estilos, dados e
// manifestos utilizados por esta tela já estão incorporados no próprio HTML.
(function(){
  'use strict';
  const embedded=JSON.parse(document.getElementById('v1-embedded-bundle').textContent);
  window.__V1_SCREEN__=embedded.metadata;
  window.__SCREEN_CONTEXT__={
    key:embedded.metadata.key,
    configUrl:'./__catalog_screen__.json',
    screenBaseUrl:'./__src/'+embedded.metadata.origin+'/'
  };
  function makeResponse(value,asJson){
    return new Response(asJson?JSON.stringify(value):String(value),{status:200,headers:{'Content-Type':asJson?'application/json;charset=utf-8':'text/plain;charset=utf-8'}});
  }
  window.fetch=function(file){
    let url;
    try{ url=new URL(file instanceof URL?file.href:typeof file==='string'?file:file.url,location.href); }
    catch(error){return Promise.reject(error);}
    const path=decodeURIComponent(url.pathname);
    if(path.endsWith('/__catalog_screen__.json'))return Promise.resolve(makeResponse(embedded.config,true));
    if(path.endsWith('/__catalog_data__.json'))return Promise.resolve(makeResponse(embedded.data,true));
    if(path.endsWith('/__src/components/__registry__.json'))return Promise.resolve(makeResponse(embedded.registry,true));
    const marker='/__src/';const at=path.lastIndexOf(marker);
    if(at!==-1){
      const id=path.slice(at+marker.length);
      if(Object.prototype.hasOwnProperty.call(embedded.files,id))return Promise.resolve(makeResponse(embedded.files[id],false));
    }
    return Promise.resolve(new Response('Recurso não incluído neste HTML autocontido: '+path,{status:404,headers:{'Content-Type':'text/plain;charset=utf-8'}}));
  };
  window.addEventListener('modular-screen:ready',function(event){
    const diagnostics=window.ModularScreen?.getDiagnostics?.()||[];
    if(diagnostics.length)console.warn('V1 - composição com avisos:',diagnostics);
  });
})();
</script>
<script>
const ROOT = document.querySelector('#screen-root');
const SCREEN_URL=new URL(window.__SCREEN_CONTEXT__.configUrl,location.href);
const SCREEN_BASE_URL=new URL(window.__SCREEN_CONTEXT__.screenBaseUrl,location.href);
const SECTION_BASE_URL=new URL('./__src/engine/section-base.css',location.href);
const STANDARD_SLOTS = Object.freeze(['header','main','navigation','menu','modal','popup','alert']);
const PAGE_URL = new URL(location.href);
const PROTOTYPE_MODE = PAGE_URL.searchParams.get('mode') === 'prototype';
const PROFESSIONAL_ACCESS_STATES = Object.freeze(['restricted','enabled']);
const runtime = { config:null, sectionBaseCss:'', sections:new Map(), state:{}, diagnostics:[], shell:null, toastTimer:null };
boot().catch(showBootError);

async function boot(){
  ROOT.innerHTML='<div class="screen-loading">Montando tela…</div>';
  const [baseConfig, sectionBaseCss] = await Promise.all([fetchJson(SCREEN_URL), fetchText(SECTION_BASE_URL)]);
  const baseErrors = validateScreenConfig(baseConfig);
  if(baseErrors.length) throw new Error('configuração de tela inválida: '+baseErrors.join(' | '));

  const config=baseConfig;
  runtime.config=config;
  runtime.data=await loadScreenData(config);
  runtime.sectionBaseCss=sectionBaseCss;
  runtime.state=structuredClone(config.state||{});
  runtime.state.professionalAccess=resolveInitialProfessionalAccess();
  applyScreenMetadata(config);
  buildRuntimeShell();

  for(const entry of flattenComposition(config.composition||{})){
    try{ await mountSection(entry); }
    catch(error){ handleSectionFailure(entry,error); }
  }

  applyProfessionalAccess();
  refreshOnlineBindings();
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAllOverlays(); });
  if(PROTOTYPE_MODE)window.addEventListener('message',handlePrototypeMessage);
  window.ModularScreen=Object.freeze({
    getConfig:()=>structuredClone(runtime.config),getData:()=>structuredClone(runtime.data||{}),
    getState:()=>structuredClone(runtime.state),
    listSections:()=>[...runtime.sections.keys()],
    getDiagnostics:()=>structuredClone(runtime.diagnostics),
    getStructure:()=>[...runtime.sections.values()].map(s=>({id:s.id,kind:s.manifest.kind||null,slot:s.slot,order:s.entry.order??null,source:s.entry.source||s.entry.ref})),
    setProfessionalAccess:value=>setProfessionalAccess(value,'runtime-api'),
    emit:dispatchScreenEvent
  });
  window.dispatchEvent(new CustomEvent('modular-screen:ready',{detail:{screen:config.screen,feature:config.screen?.feature||null,slots:STANDARD_SLOTS,sections:window.ModularScreen.getStructure(),state:window.ModularScreen.getState()}}));
}

function resolveInitialProfessionalAccess(){
  const queryValue=PAGE_URL.searchParams.get('professionalAccess');
  if(PROTOTYPE_MODE&&PROFESSIONAL_ACCESS_STATES.includes(queryValue))return queryValue;
  const configured=runtime.state.professionalAccess;
  if(PROFESSIONAL_ACCESS_STATES.includes(configured))return configured;
  const dataValue=runtime.data?.runtime?.professionalAccess?.resolvedState;
  if(PROFESSIONAL_ACCESS_STATES.includes(dataValue))return dataValue;
  return 'enabled';
}
function handlePrototypeMessage(event){
  if(event.source!==window.parent||event.origin!==location.origin)return;
  const message=event.data;
  if(!message||message.source!=='advogadoja-prototype'||message.type!=='professional-access')return;
  setProfessionalAccess(message.value,'prototype-message');
}
function setProfessionalAccess(value,source='runtime'){
  if(!PROFESSIONAL_ACCESS_STATES.includes(value))return false;
  if(runtime.state.professionalAccess===value){applyProfessionalAccess();return true;}
  runtime.state.professionalAccess=value;
  applyProfessionalAccess();
  dispatchScreenEvent('state.change',{key:'professionalAccess',value,source});
  return true;
}
function isProfessionalRestricted(){return runtime.state.professionalAccess==='restricted'}
function professionalCapabilities(access=runtime.state.professionalAccess){const enabled=access==='enabled';return{canActProfessionally:enabled,canReceiveRequests:enabled,canToggleOnline:enabled,canValidateOab:!enabled}}
function applyProfessionalAccess(){
  const restricted=isProfessionalRestricted(),capabilities=professionalCapabilities();
  document.body.dataset.professionalAccess=runtime.state.professionalAccess;
  if(runtime.shell)runtime.shell.dataset.professionalAccess=runtime.state.professionalAccess;
  setSectionVisible('online-status',capabilities.canToggleOnline);
  setSectionVisible('actions',capabilities.canReceiveRequests);
  const hero=runtime.sections.get('hero');
  if(hero)hero.shadow.querySelectorAll('[data-professional-state]').forEach(node=>{node.hidden=node.getAttribute('data-professional-state')!==(restricted?'restricted':'enabled')});
  const drawer=runtime.sections.get('drawer');
  if(drawer){
    drawer.shadow.querySelectorAll('[data-professional-capability]').forEach(node=>{const capability=node.getAttribute('data-professional-capability');node.hidden=Boolean(capability)&&capabilities[capability]!==true});
    drawer.shadow.querySelectorAll('[data-online-root]').forEach(node=>{node.hidden=!capabilities.canToggleOnline});
  }
  refreshOnlineBindings();
}
function setSectionVisible(id,visible){
  const section=runtime.sections.get(id);if(!section)return;
  section.host.hidden=!visible;
  section.host.setAttribute('aria-hidden',visible?'false':'true');
}

function validateScreenConfig(config){
  const errors=[];
  if(!isPlainObject(config)) return ['raiz precisa ser objeto'];
  if(!config.screen?.key) errors.push('screen.key é obrigatório');
  if(!isPlainObject(config.composition)) errors.push('composition precisa ser objeto');
  const ids=new Set();
  for(const [group,list] of Object.entries(config.composition||{})){
    if(!STANDARD_SLOTS.includes(group)){errors.push('grupo desconhecido: '+group);continue}
    if(!Array.isArray(list)){errors.push('composition.'+group+' precisa ser array');continue}
    for(const entry of list){
      if(!entry?.id) errors.push(group+': item sem id'); else if(ids.has(entry.id)) errors.push('id duplicado: '+entry.id); else ids.add(entry.id);
      const shared=entry?.sourceType==='shared'||Boolean(entry?.ref);
      if(shared){if(typeof entry.ref!=='string'||!entry.ref.trim()) errors.push((entry?.id||group)+': ref compartilhada inválida');}
      else if(!isSafeLocalSource(entry?.source)) errors.push((entry?.id||group)+': source local inválido');
      if(entry?.slot&&entry.slot!==group) errors.push((entry?.id||group)+': slot explícito deve coincidir com '+group);
    }
  }
  return errors;
}
function isSafeLocalSource(source){if(typeof source!=='string'||!source.trim())return false;const normalized=source.trim().replaceAll('\\','/');if(normalized.startsWith('/')||normalized.startsWith('./')||normalized.includes('://')||normalized.includes('?')||normalized.includes('#'))return false;const parts=normalized.split('/');return!parts.some(part=>!part||part==='.'||part==='..')&&parts.every(part=>/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(part))}

function flattenComposition(composition){
  const entries=[]; let idx=0;
  for(const slotName of STANDARD_SLOTS){
    const list=composition?.[slotName]; if(!Array.isArray(list)) continue;
    for(const entry of list){
      if(!entry||entry.enabled===false) continue;
      entries.push({...entry,slot:slotName,__configIndex:idx++});
    }
  }
  return entries.sort((a,b)=>STANDARD_SLOTS.indexOf(a.slot)-STANDARD_SLOTS.indexOf(b.slot)||normalizeOrder(a.order)-normalizeOrder(b.order)||a.__configIndex-b.__configIndex);
}

function buildRuntimeShell(){
  const preset=runtime.config.layout?.preset||'mobile-first-adaptive';
  ROOT.innerHTML=`<div class="screen-runtime" data-screen-runtime data-layout-preset="${escapeHtml(preset)}">
    <div class="screen-slot screen-slot--header" data-slot="header"></div>
    <div class="screen-layout" data-screen-layout>
      <nav class="screen-slot screen-slot--navigation" data-slot="navigation" aria-label="Navegação da tela"></nav>
      <main class="screen-slot screen-slot--main" data-slot="main"></main>
    </div>
    <div class="screen-slot screen-slot--menu" data-slot="menu"></div>
    <div class="screen-slot screen-slot--modal" data-slot="modal"></div>
    <div class="screen-slot screen-slot--popup" data-slot="popup"></div>
    <div class="screen-slot screen-slot--alert" data-slot="alert"></div>
  </div>`;
  runtime.shell=ROOT.querySelector('[data-screen-runtime]');
}

async function loadScreenData(config){
  if(!config?.dataRef)return {components:{}};
  const dataUrl=new URL(config.dataRef,SCREEN_URL);let data=await fetchJson(dataUrl);
  return data&&typeof data==='object'?data:{components:{}};
}
function applyScreenMetadata(config){
  document.title=runtime.data?.meta?.documentTitle||config.screen?.title||config.screen?.name||'Tela modular';
  document.body.dataset.screenKey=config.screen?.key||'';
  for(const [name,value] of Object.entries(config.theme||{})){

 const launcher=el('button');launcher.id='aj-lab-launch';launcher.type='button';launcher.textContent='⚙ Estados';document.body.append(launcher);
 const panel=el('aside');panel.id='aj-lab-panel';panel.hidden=true;
 panel.innerHTML='<h3>Estados interativos</h3><p>Alterne a situação para ver como mudam o conteúdo e as opções do menu. Estados propostos são editáveis.</p><label for="aj-lab-select">Cenário</label><select id="aj-lab-select"></select><div class="aj-lab-row"><button type="button" id="aj-lab-menu">☰ Ver menu do estado</button><button type="button" id="aj-lab-close">Fechar</button></div>';
 document.body.append(panel);const select=panel.querySelector('select');for(const s of scenarios){const opt=el('option','',s.label);opt.value=s.id;select.append(opt)}select.value=sel.id;select.onchange=()=>chooseScenario(select.value);
 launcher.onclick=()=>panel.hidden=!panel.hidden;panel.querySelector('#aj-lab-close').onclick=()=>panel.hidden=true;panel.querySelector('#aj-lab-menu').onclick=openMenu;
 live=el('span');launcher.append(live);launcher.childNodes[0].textContent='⚙ ';
 document.addEventListener('click',e=>{const b=e.target.closest?.('.app-menu-button,[data-action="drawer.open"]');if(!b)return;if(CFG.profile!=='estudante'&&CFG.isProfessionalHome&&!!window.ModularScreen)return; // V1 native validated menu is already dynamic
 e.stopImmediatePropagation();e.preventDefault();openMenu();},true);
 window.addEventListener('message',e=>{if(!e.data||e.data.type!=='aj-set-scenario')return;chooseScenario(e.data.id)});
 window.addEventListener('modular-screen:ready',configureInterface);
 configureInterface();

 setTimeout(configureInterface,500);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();

})();
</script>

<script id="aj-canonical-layout-runtime">
(()=>{'use strict';
const el=document.getElementById('aj-layout-canonical-data');if(!el)return;
const cfg=JSON.parse(el.textContent),role=cfg.perfil,kind=cfg.contexto.tipo;
const def=cfg.componentes.menu?.estados||{};
const defaults={};for(const [axis,v] of Object.entries(def))defaults[axis]=v.inicial;
let state={...defaults},attached=false,menuRoot=null,headerRoot=null,titleRoot=null;
function roots(){let header=null,title=null,menu=null;
 const sec=document.querySelector('#screen-root [data-section-id="app-header"]');
 const sTitle=document.querySelector('#screen-root [data-section-id="titlebar"]');
 const sMenu=document.querySelector('#screen-root [data-section-id="drawer"]');
 header=sec?.shadowRoot?.querySelector('[data-aj-canonical="layout.header.app"]')||document.querySelector('[data-aj-canonical="layout.header.app"]');
 title=sTitle?.shadowRoot?.querySelector('[data-aj-canonical="layout.header.title"]')||document.querySelector('[data-aj-canonical="layout.header.title"]');

const notify=msg=>{let x=document.getElementById('aj-layout-preview-message');if(!x){x=document.createElement('div');x.id='aj-layout-preview-message';x.setAttribute('role','status');Object.assign(x.style,{position:'fixed',bottom:'12px',left:'50%',transform:'translateX(-50%)',maxWidth:'95vw',zIndex:'99999',borderRadius:'10px',background:'#173c6b',color:'#fff',padding:'9px 14px',font:'12px system-ui',boxShadow:'0 5px 15px #0005'});document.body.append(x);}x.textContent=msg;clearTimeout(x._t);x._t=setTimeout(()=>x?.remove(),2800);};

function render(){({header:headerRoot,title:titleRoot,menu:menuRoot}=roots());if(!menuRoot)return;
 menuRoot.classList.toggle('open',state.painel==='aberto');menuRoot.setAttribute('aria-hidden',state.painel==='aberto'?'false':'true');
 menuRoot.setAttribute('data-estudante-menu',state.grupoEstudante||'fechado');menuRoot.setAttribute('data-escritorio-menu',state.grupoEscritorio||'fechado');
 menuRoot.setAttribute('data-plano',state.planoEstudante||'sem_plano');menuRoot.setAttribute('data-oab',state.acessoOab||'enabled');menuRoot.setAttribute('data-disponibilidade',state.disponibilidade||'online');menuRoot.setAttribute('data-vinculo-escritorio',state.vinculoEscritorio||'sem_escritorio');menuRoot.setAttribute('data-permissao',state.permissao||'gestor');
 const online=state.disponibilidade!=='offline';let root=menuRoot.querySelector('[data-aj-online-label]');if(root)root.textContent=online?'Online':'Offline';root=menuRoot.querySelector('[data-aj-online-copy]');if(root)root.textContent=online?'Recebendo novas solicitações':'Pausado para novas solicitações';
 menuRoot.querySelectorAll('[data-aj-caret]').forEach(node=>{node.textContent=(node.dataset.ajCaret==='estudante'?state.grupoEstudante:state.grupoEscritorio)==='aberto'?'▾':'▸';});
 const title=cfg.componentes.titlebar?.props?.titulo||'Início';
 const isHome=title==='Início';
 if(titleRoot?.querySelector('[data-aj-title]'))titleRoot.querySelector('[data-aj-title]').textContent=role==='cliente'&&state.grupoEstudante==='aberto'&&isHome?'Estudante':role==='advogado'&&state.grupoEscritorio==='aberto'&&isHome?'Escritório':title;
}
function bind(){const r=roots();if(!r.header&&!r.menu)return false;if(kind==='autenticado'&&!r.menu)return false;const eventRoot=r.menu?.getRootNode()||document; if(attached)return true;attached=true;
 const handle=(event)=>{
  const btn=event.target?.closest?.('[data-action],[data-aj-toggle],[data-aj-route]');if(!btn)return;
  const action=btn.dataset.action,toggle=btn.dataset.ajToggle,dest=btn.dataset.ajRoute;
  if(action==='drawer.open'){event.preventDefault();event.stopImmediatePropagation();change('painel','aberto');return;}
  if(action==='drawer.close'){event.preventDefault();event.stopImmediatePropagation();change('painel','fechado');return;}
  if(toggle){event.preventDefault();event.stopImmediatePropagation();if(toggle==='estudante')change('grupoEstudante',state.grupoEstudante==='aberto'?'fechado':'aberto');else if(toggle==='escritorio')change('grupoEscritorio',state.grupoEscritorio==='aberto'?'fechado':'aberto');else if(toggle==='disponibilidade')change('disponibilidade',state.disponibilidade==='online'?'offline':'online');return;}
  if(dest){event.preventDefault();event.stopImmediatePropagation();const locked=btn.hasAttribute('data-aj-protegido')&&state.planoEstudante!=='ativo';const restricted=btn.getAttribute('data-aj-oab-only')==='enabled'&&state.acessoOab==='restricted';const office=btn.hasAttribute('data-aj-requer-escritorio')&&state.vinculoEscritorio!=='ativo';const perm=btn.getAttribute('data-aj-admin-only')==='gestor'&&state.permissao!=='gestor';notify(locked?'Plano Estudante não ativo: área protegida.':restricted?'Validação da OAB necessária.':office?'Vínculo ativo com Escritório necessário.':perm?'Permissão de gestor necessária.':'Destino registrado: '+dest+' (sem navegação nesta biblioteca).');change('painel','fechado');return;}
 };
 document.addEventListener('click',handle,true);if(r.header?.getRootNode()!==document)r.header.getRootNode().addEventListener('click',handle,true);if(r.menu?.getRootNode()!==document&&r.menu?.getRootNode()!==r.header?.getRootNode())r.menu.getRootNode().addEventListener('click',handle,true);
 document.addEventListener('keydown',event=>{if(event.key==='Escape')change('painel','fechado')});

}
function installInspector(){if(kind!=='autenticado'||!cfg.componentes.menu||document.getElementById('aj-layout-study-toggle'))return;
 const toggle=document.createElement('button');toggle.id='aj-layout-study-toggle';toggle.type='button';toggle.textContent='⚙ Estados do layout';Object.assign(toggle.style,{position:'fixed',right:'10px',bottom:'10px',zIndex:'9995',padding:'7px 10px',font:'600 10px system-ui',background:'#10233f',color:'#fff',border:'1px solid #9bb0d2',borderRadius:'99px',cursor:'pointer'});
 const panel=document.createElement('div');panel.id='aj-layout-state-controls';panel.hidden=true;Object.assign(panel.style,{position:'fixed',right:'10px',bottom:'48px',zIndex:'9995',width:'min(280px,90vw)',maxHeight:'57vh',overflowY:'auto',background:'#fff',color:'#10233f',padding:'14px',border:'1px solid #cbd6e5',borderRadius:'11px',font:'12px system-ui',boxShadow:'0 12px 35px #0003'});

 toggle.addEventListener('click',()=>panel.hidden=!panel.hidden);document.body.append(toggle,panel);
}
window.__advogadojaLayoutCanonico={getEstado:()=>({...state}),setEstado:change,getContrato:()=>cfg};
if(!bind()){window.addEventListener('modular-screen:ready',bind,{once:true});const observer=new MutationObserver(()=>{if(bind())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true});setTimeout(()=>observer.disconnect(),6000);}
})();
</script>

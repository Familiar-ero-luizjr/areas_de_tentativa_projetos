          const matchesType = type === "todos" || el.dataset.type === type;

            professionalAreas.includes(area),

          const matchesArea = !effectiveAreas.length || overlap > 0;
          const matchesRadius = Number(el.dataset.km) <= radiusKm;
          const visible = matchesType && matchesArea && matchesRadius;

      function dispatchScreenEvent(type, detail = {}) {

      function renderTemplate(template, data) {
        let output = template;
        const eachRe = /{{#each\s+([\w.$-]+)}}([\s\S]*?){{\/each}}/g;
        let guard = 0;
        while (eachRe.test(output) && guard++ < 50) {
          eachRe.lastIndex = 0;
          output = output.replace(eachRe, (_, path, block) => {
            const items = getPath(data, path);
            if (!Array.isArray(items)) return "";
            return items
              .map((item, index) =>
                renderTemplate(block, {
                  ...data,
                  ...(isPlainObject(item) ? item : { value: item }),
                  $index: index,
                  $value: item,
                }),
              )
              .join("");
          });
        }
        output = output.replace(
          /{{#if\s+([\w.$-]+)}}([\s\S]*?){{\/if}}/g,
          (_, path, block) =>
            getPath(data, path) ? renderTemplate(block, data) : "",
        );
        return output.replace(/{{\s*([\w.$-]+)\s*}}/g, (_, path) =>
          escapeHtml(getPath(data, path) ?? ""),
        );
      }
      function getPath(obj, path) {
        if (path === "$value") return obj.$value;
        if (path === "$index") return obj.$index;
        return String(path)
          .split(".")
          .reduce((acc, key) => (acc == null ? undefined : acc[key]), obj);
      }
      function deepMerge(base, patch) {
        if (!isPlainObject(base) || !isPlainObject(patch))
          return structuredClone(patch);
        for (const [key, value] of Object.entries(patch)) {
          if (isPlainObject(value) && isPlainObject(base[key]))
            base[key] = deepMerge(base[key], value);
          else base[key] = structuredClone(value);
        }
        return base;
      }
      function isPlainObject(v) {
        return v != null && typeof v === "object" && !Array.isArray(v);
      }
      function normalizeOrder(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : 1000;
      }
      function escapeHtml(v) {
        return String(v)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
      async function fetchJson(url) {
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) throw new Error(`${r.status} ao carregar ${url.pathname}`);
        return r.json();
      }
      async function fetchText(url) {
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) throw new Error(`${r.status} ao carregar ${url.pathname}`);
        return r.text();
      }
      async function fetchOptionalText(url) {
        const r = await fetch(url, { cache: "no-store" });
        if (r.status === 404) return "";
        if (!r.ok) throw new Error(`${r.status} ao carregar ${url.pathname}`);
        return r.text();
      }
      function normalizeDir(p) {
        return p.endsWith("/") ? p : `${p}/`;
      }
      function camelToKebab(v) {
        return v.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`);
      }
      function cssEscape(v) {
        return window.CSS?.escape
          ? CSS.escape(v)
          : String(v).replace(/["\\]/g, "\\$&");
      }
      function toDatasetKey(v) {
        return v
          .replace(/-([a-z])/g, (_, c) => c.toUpperCase())
          .replace(/^./, (c) => c.toUpperCase());
      }

      }

              html += cardHead(
                "Estudante",
                "Minha área de estudos",
                "Acesse seus cursos, acompanhe sua assinatura e gerencie os dados acadêmicos.",

              break;
            case "academicos":
              html += cardHead(
                "Estudante · Dados acadêmicos",

              break;
            case "assinatura":

                "Consulte o status e gerencie sua assinatura sem sair da conta Cliente.",
              );
              html += `<div class="aj-study-status aj-study-status--${s.tone}">${badge(s.title, s.tone)}<strong>${escape(s.label)}</strong><p>${escape(s.detail)}</p><div class="aj-study-actions">${action("Ver histórico", "historico", true)}${!isActive() ? action(state.plan === "pendente" ? "Ver planos disponíveis" : "Contratar ou reativar", "planos") : action("Ver meus cursos", "meus")}</div></div>`;

            case "historico":
              html += cardHead(
                "Estudante · Assinatura",
                "Histórico da assinatura",
                "Histórico de pagamentos e renovações do Cliente.",
              );
              html += `<div class="aj-study-status"><strong>Sem lançamentos reais nesta demonstração</strong><p>O histórico será preenchido pelo serviço de assinatura quando integrado.</p>${action("Voltar à assinatura", "assinatura", true)}</div>`;
              break;
          }
          state.panel.innerHTML = html;
        }
        function render() {
          if (!state.content) return;
          renderMenu();
          const student = state.view !== "cliente";
          state.content
            .querySelectorAll('screen-section[data-slot="main"]')
            .forEach((el) => {
              el.hidden = student;
            });
          state.panel.hidden = !student;
          if (student) renderStudentView();
        }
        window.addEventListener("modular-screen:ready", init, { once: true });
      })();
    </script>

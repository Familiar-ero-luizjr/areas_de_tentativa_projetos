  box-shadow: 0 4px 14px rgba(16,35,63,.18);
}
.app-menu-button {
  width: 40px;
  height: 40px;
  display: grid;
  place-content: center;
  gap: 4px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #fff;
  cursor: pointer;
}
.app-menu-button span {
  width: 20px;
  height: 2px;
  border-radius: 9px;
  background: currentColor;
}
.app-brand {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  letter-spacing: -.02em;
}
.app-brand img {
  width: 27px;
  height: 27px;
  object-fit: contain;
  filter: brightness(0) invert(1);
}
.app-role {
  font-size: 10px;
  font-weight: 800;
  opacity: .8;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.app-titlebar {
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  color: var(--primary);
  font-size: 13px;
}
.op-shell {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: 22px 16px 36px;
}
.op-shell > .eyebrow {
  margin: 0 0 7px;
}
.op-intro {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
}
.op-hero {
  margin-bottom: 14px;
  padding: 19px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--primary), var(--primary-soft));
  color: #fff;
}
.op-hero h1 {
  margin: 0;
  font-size: 24px;
  line-height: 1.15;
}
.op-hero p {
  margin: 7px 0 0;
  color: #dce7f4;
  line-height: 1.5;
}
.op-card {
  margin-bottom: 12px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #fff;
}
.op-card h2, .op-card h3 {
  margin: 0;
  color: var(--primary);
}
.op-card h2 { font-size: 18px; }
.op-card h3 { font-size: 15px; }
.op-card p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}
.op-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.op-action {
  width: 100%;
  min-height: 78px;
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 14px 15px;
  background: #fff;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.op-action strong, .op-action small { display: block; }
.op-action strong { color: var(--primary); font-size: 14px; }
.op-action small { margin-top: 4px; color: var(--muted); line-height: 1.35; }
.op-action::after {
  content: "›";
  color: var(--gold);
  font-size: 24px;
  font-weight: 800;
}
.online-card {
  display: flex;
  gap: 12px;
  align-items: center;
  border-color: #a8dfc8;
  background: #f1fbf6;
}
.online-card.is-offline {
  border-color: var(--line);
  background: #f8fafc;
}
.online-dot {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #15945e;
  box-shadow: 0 0 0 4px rgba(21,148,94,.12);
}
.is-offline .online-dot {
  background: #98a2b3;
  box-shadow: none;
}
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  border-radius: 999px;
  padding: 6px 9px;
  background: #edf3fa;
  color: var(--primary);
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
}
.status-chip.waiting { background: #fff4d9; color: #7a5400; }
.status-chip.ok { background: #e5f7ee; color: #08744e; }
.status-chip.danger { background: #feeceb; color: #b42318; }
.op-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-bottom: 12px;
}
.op-tabs button {
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: var(--muted);
  font-weight: 800;
  cursor: pointer;
}
.op-tabs button.active {
  border-color: var(--primary);
  background: var(--primary);
  color: #fff;
}
.meta-list {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}
.meta-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding-top: 9px;
  border-top: 1px solid #edf0f4;
  font-size: 12px;
}
.meta-row span { color: var(--muted); }
.meta-row strong { color: var(--primary); text-align: right; }
.op-buttons {
  display: grid;
  gap: 9px;
  margin-top: 14px;
}
.op-buttons.inline {
  grid-template-columns: 1fr 1fr;
}
.op-secondary, .op-danger {
  min-height: 48px;
  border-radius: 12px;
  padding: 12px 14px;
  font-weight: 800;
  cursor: pointer;
}
.op-secondary {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--primary);
}
.op-danger {
  border: 1px solid #f1b6b2;
  background: #fff5f4;
  color: #b42318;
}
.op-empty {
  padding: 28px 16px;
  border: 1px dashed #cbd5e1;
  border-radius: 14px;
  background: #f8fafc;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}
.op-form {
  display: grid;
  gap: 12px;
}
.op-form label {
  display: grid;
  gap: 6px;
  color: var(--primary);
  font-size: 11px;
  font-weight: 800;
}
.op-form input, .op-form select, .op-form textarea {
  width: 100%;
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 12px;
  background: #fff;
  color: var(--text);
  font: inherit;
}
.op-form textarea { min-height: 110px; resize: vertical; }
.switch-row {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #edf0f4;
}
.switch-row:last-child { border-bottom: 0; }
.switch-row strong, .switch-row small { display: block; }
.switch-row small { margin-top: 3px; color: var(--muted); font-size: 11px; }
.prototype-switch {
  position: relative;
  width: 46px;
  height: 26px;
  flex: 0 0 auto;
  border: 0;
  border-radius: 999px;
  background: #15945e;
  cursor: pointer;
}
.prototype-switch::after {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  content: "";
  box-shadow: 0 2px 5px rgba(0,0,0,.18);
}
.prototype-switch.is-offline { background: #cbd5e1; }
.prototype-switch.is-offline::after { right: 23px; }
.day-list {
  display: grid;
  gap: 7px;
}
.day-list label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 49px;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 12px;
  background: #fff;
  color: var(--primary);
  font-weight: 800;
}
.day-list input { width: 19px; height: 19px; accent-color: var(--primary); }
.radius-value {
  margin: 4px 0 14px;
  color: var(--primary);
  text-align: center;
  font-size: 38px;
  font-weight: 900;
}
.radius-value small { font-size: 14px; color: var(--muted); }
.profile-head {
  display: flex;
  gap: 13px;
  align-items: center;
}
.profile-avatar {
  width: 58px;
  height: 58px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 18px;
  background: #dfe8f3;
  color: var(--primary);
  font-weight: 900;
}
.bottom-nav {
  position: fixed;
  z-index: 10;
  right: 0;
  bottom: 0;
  left: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(12px);
}
.bottom-nav button {
  min-height: 64px;
  border: 0;
  padding: 7px 3px;
  background: transparent;
  color: #778195;
  font-size: 9px;
  font-weight: 800;
  cursor: pointer;
}
.bottom-nav button.active {
  color: var(--primary);
  background: #f0f5fb;
}
.prototype-drawer {
  position: fixed;
  z-index: 40;
  inset: 0;
  display: none;
}
.prototype-drawer.open { display: block; }
.drawer-backdrop {
  position: absolute;
  inset: 0;
  width: 100%;
  border: 0;
  background: rgba(7,16,30,.55);
}
.drawer-panel {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: min(88vw, 360px);
  overflow: auto;
  padding: 18px 14px 22px;
  background: linear-gradient(180deg, #10233f, #0a1b32);
  color: #fff;
  box-shadow: 12px 0 28px rgba(0,0,0,.28);
}
.drawer-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 5px 18px;
}
.drawer-identity {
  display: flex;
  gap: 11px;
  align-items: center;
}
.drawer-identity strong, .drawer-identity small { display: block; }
.drawer-identity small {
  margin-top: 3px;
  color: #aebdd0;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .08em;
}
.drawer-avatar {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border: 1px solid #ffffff33;
  border-radius: 50%;
  background: #ffffff14;
  font-weight: 900;
}
.drawer-close {
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
}
.drawer-online {
  width: 100%;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
  border: 1px solid #ffffff1f;
  border-radius: 13px;
  padding: 12px;
  background: #ffffff0d;
  color: #fff;
  text-align: left;
  cursor: pointer;
}
.drawer-online strong, .drawer-online small { display: block; }
.drawer-online small { margin-top: 2px; color: #aebdd0; font-size: 10px; }
.online-switch {
  position: relative;
  width: 42px;
  height: 24px;
  border-radius: 999px;
  background: #15945e;
}
.online-switch b {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
}
.drawer-online.is-offline .online-switch { background: #64748b; }
.drawer-online.is-offline .online-switch b { right: 21px; }
.drawer-nav {
  display: grid;
  gap: 3px;
  margin-top: 12px;
}
.drawer-nav button, .drawer-footer button {
  min-height: 44px;
  border: 0;
  border-radius: 10px;
  padding: 10px 12px;
  background: transparent;
  color: #f8fafc;
  text-align: left;
  font-weight: 700;
  cursor: pointer;
}
.drawer-nav button:hover, .drawer-footer button:hover { background: #ffffff10; }
.drawer-footer {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid #ffffff1a;
}
.drawer-footer small {
  display: block;
  padding: 8px 12px 0;
  color: #8190a5;
}
.op-toast {
  position: fixed;
  z-index: 50;
  left: 50%;
  bottom: 82px;
  max-width: calc(100vw - 32px);
  transform: translate(-50%, 16px);
  border-radius: 999px;
  padding: 10px 14px;
  background: #111827;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: .2s ease;
}
.op-toast.show { opacity: 1; transform: translate(-50%, 0); }
.is-operational .open-index { bottom: 82px; }

@media (min-width: 720px) {
  .op-shell { padding: 28px 22px 52px; }
  .op-grid.two { grid-template-columns: 1fr 1fr; }
  .bottom-nav {
    left: 50%;
    width: min(720px, 100%);
    transform: translateX(-50%);
    border-right: 1px solid var(--line);
    border-left: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    overflow: hidden;
  }
}

/* ===== cliente.css ===== */
/*
  Cliente + fluxo pós-login.
  A linguagem visual abaixo reaproveita a estrutura que funcionava melhor no
  protótipo antigo: cartões simples, hierarquia curta, espaçamento mobile-first
  e ações sem transformar a Home em painel de atalhos.
*/

.client-legacy {
  --client-primary: #10233f;
  --client-primary-2: #173c6b;
  --client-gold: #b88932;
  --client-gold-soft: #fff4db;
  --client-bg: #eef2f6;
  --client-surface: #ffffff;
  --client-soft: #f8fafc;
  --client-line: #dbe3ee;
  --client-text: #172033;
  --client-muted: #667085;
  --client-ok: #0f8f62;
  --client-ok-bg: #def7ec;
  background: var(--client-bg);
}

.client-legacy .client-legacy__content {
  min-height: calc(100dvh - 112px);
  background: var(--client-bg);
}

.client-legacy .op-card,
.client-legacy .op-action {
  border: 1px solid var(--client-line);
  border-radius: 14px;
  background: var(--client-surface);
  box-shadow: 0 4px 12px rgba(15, 23, 42, .035);
}

.client-legacy .op-card {
  padding: 16px;
  margin-bottom: 12px;
}

.client-legacy .op-action {
  width: 100%;
  min-height: 72px;
  margin: 0 0 12px;
  padding: 14px 16px;
  color: var(--client-text);
  text-align: left;
}

.client-legacy .op-action strong,
.client-legacy .op-action small {
  display: block;
}

.client-legacy .op-action strong {
  margin-bottom: 4px;
  color: var(--client-text);
  font-size: 15px;
  font-weight: 800;
}

.client-legacy .op-action small {
  color: var(--client-muted);
  font-size: 12px;
  line-height: 1.4;
  font-weight: 600;
}

.client-home-head {
  margin-bottom: 18px;
}

.client-home-head h1 {
  margin: 0 0 8px;
  color: var(--client-primary);
  font-size: 24px;
  line-height: 1.15;
}

.client-home-head p {
  margin: 0;
  color: var(--client-muted);
  font-size: 14px;
  line-height: 1.5;
}

.client-home-action {
  width: 100%;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 12px;
  align-items: center;
  margin-bottom: 12px;
  padding: 16px;
  border: 1px solid var(--client-line);
  border-radius: 14px;
  background: var(--client-surface);
  color: var(--client-text);
  text-align: left;
  box-shadow: 0 4px 12px rgba(15, 23, 42, .035);
  cursor: pointer;
}

.client-home-action .iconbox {
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  border-radius: 13px;
  background: #e7f0ff;
  color: var(--client-primary);
  font-weight: 900;
}

.client-home-action.consultoria .iconbox {
  background: var(--client-gold-soft);
  color: var(--client-gold);
}

.client-home-action .txt b,
.client-home-action .txt small {
  display: block;
}

.client-home-action .txt b {
  margin-bottom: 4px;
  font-size: 15px;
  font-weight: 800;
}

.client-home-action .txt small {
  color: var(--client-muted);
  font-size: 12px;
  line-height: 1.4;
  font-weight: 600;
}

.client-home-action .chev {
  color: var(--client-primary);
  font-size: 24px;
  line-height: 1;
}

.client-notice {
  margin-top: 12px;
  padding: 13px 14px;
  border: 1px solid #ead6a9;
  border-radius: 12px;
  background: #fff8e8;
  color: #70510b;
  font-size: 12px;
  line-height: 1.45;
}

.client-map {
  position: relative;
  min-height: 210px;
  overflow: hidden;
  margin-bottom: 14px;
  border: 1px solid var(--client-line, #dbe3ee);
  border-radius: 14px;
  background:
    linear-gradient(90deg, rgba(16,35,63,.06) 1px, transparent 1px) 0 0/36px 36px,
    linear-gradient(rgba(16,35,63,.06) 1px, transparent 1px) 0 0/36px 36px,
    #eaf0f6;
}
.client-map::before,
.client-map::after {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50% 50% 50% 0;
  background: #10233f;
  box-shadow: 0 4px 10px rgba(16,35,63,.2);
  content: "";
  transform: rotate(-45deg);
}
.client-map::before { left: 34%; top: 35%; }
.client-map::after { right: 25%; top: 48%; background: #b88932; }

.client-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.client-chip {
  border: 1px solid #dbe3ee;
  border-radius: 999px;
  padding: 8px 11px;
  background: #fff;
  color: #10233f;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}
.client-chip.active {
  border-color: #10233f;
  background: #10233f;
  color: #fff;
}

.client-timeline {
  display: grid;
  gap: 12px;
  margin: 16px 0;
}
.client-step {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  align-items: center;
  color: #667085;
  font-size: 12px;
}
.client-step span:first-child {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 50%;
  background: #e7edf4;
  color: #10233f;
  font-size: 10px;
  font-weight: 900;
}
.client-step.done span:first-child {
  background: #def7ec;
  color: #0f8f62;
}

.client-profile {
  display: grid;
  grid-template-columns: 48px 1fr auto;
  gap: 12px;
  align-items: center;
}
.client-avatar {
  display: grid;
  width: 48px;
  height: 48px;
  place-items: center;
  border-radius: 13px;
  background: #e7f0ff;
  color: #10233f;
  font-weight: 900;
}

/* Fluxo pós-login: mesma lógica visual da tela "Caminho do login" do protótipo antigo. */
.login-flow {
  --login-flow-content-max: 560px;
  min-height: 100dvh;
  background: #eef2f6;
  color: #172033;
}
.login-flow__bar {
  min-height: calc(64px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  padding-left: max(18px, env(safe-area-inset-left));
  padding-right: max(18px, env(safe-area-inset-right));
  display: flex;
  align-items: center;
  gap: 10px;
  background: #10233f;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
}
.login-flow__bar img {
  width: 23px;
  height: 23px;
}
.login-flow__content {
  width: min(calc(100% - 40px), var(--login-flow-content-max));
  margin-inline: auto;
  padding: 20px 0 32px;
}
.login-flow__content h1 {
  margin: 0 0 10px;
  color: #10233f;
  font-size: 24px;
  line-height: 1.15;
}
.login-flow__subcopy {
  margin: 0 0 18px;
  color: #667085;
  font-size: 14px;
  line-height: 1.5;
}
.login-flow .role-choice {
  margin-bottom: 12px;
  padding: 14px;
  border: 1px solid #dbe3ee;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 4px 12px rgba(15,23,42,.035);
}
.login-flow .role-choice-head {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 12px;
  align-items: center;
  margin-bottom: 12px;
}
.login-flow .mini-icon {
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  border-radius: 13px;
  background: #e7f0ff;
  color: #10233f;
  font-weight: 900;
}
.login-flow .mini-icon.gold { background: #fff4db; color: #b88932; }
.login-flow .mini-icon.ok { background: #def7ec; color: #0f8f62; }
.login-flow .title {
  margin-bottom: 4px;
  color: #172033;
  font-size: 15px;
  font-weight: 800;
}
.login-flow .muted {
  color: #667085;
  font-size: 12px;
  line-height: 1.35;
  font-weight: 600;
}
.login-flow .role-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.login-flow .role-actions.single {
  grid-template-columns: 1fr;
}
.login-flow .role-actions button {
  min-height: 38px;
  border: 1px solid #10233f;
  border-radius: 10px;
  padding: 8px 10px;
  background: #10233f;
  color: #fff;
  font: inherit;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .03em;
  cursor: pointer;
}
.login-flow .role-actions button + button {
  background: transparent;
  color: #10233f;
}
@media (min-width: 700px) {

 if(titleRoot?.querySelector('[data-aj-title]'))titleRoot.querySelector('[data-aj-title]').textContent=role==='cliente'&&state.grupoEstudante==='aberto'&&isHome?'Estudante':role==='advogado'&&state.grupoEscritorio==='aberto'&&isHome?'Escritório':title;
}
function bind(){const r=roots();if(!r.header&&!r.menu)return false;if(kind==='autenticado'&&!r.menu)return false;const eventRoot=r.menu?.getRootNode()||document; if(attached)return true;attached=true;
 const handle=(event)=>{
  const btn=event.target?.closest?.('[data-action],[data-aj-toggle],[data-aj-route]');if(!btn)return;
  const action=btn.dataset.action,toggle=btn.dataset.ajToggle,dest=btn.dataset.ajRoute;
  if(action==='drawer.open'){event.preventDefault();event.stopImmediatePropagation();change('painel','aberto');return;}
  if(action==='drawer.close'){event.preventDefault();event.stopImmediatePropagation();change('painel','fechado');return;}
  if(toggle){event.preventDefault();event.stopImmediatePropagation();if(toggle==='estudante')change('grupoEstudante',state.grupoEstudante==='aberto'?'fechado':'aberto');else if(toggle==='escritorio')change('grupoEscritorio',state.grupoEscritorio==='aberto'?'fechado':'aberto');else if(toggle==='disponibilidade')change('disponibilidade',state.disponibilidade==='online'?'offline':'online');return;}
  if(dest){event.preventDefault();event.stopImmediatePropagation();const locked=btn.hasAttribute('data-aj-protegido')&&state.planoEstudante!=='ativo';const restricted=btn.getAttribute('data-aj-oab-only')==='enabled'&&state.acessoOab==='restricted';const office=btn.hasAttribute('data-aj-requer-escritorio')&&state.vinculoEscritorio!=='ativo';const perm=btn.getAttribute('data-aj-admin-only')==='gestor'&&state.permissao!=='gestor';notify(locked?'Plano Estudante não ativo: área protegida.':restricted?'Validação da OAB necessária.':office?'Vínculo ativo com Escritório necessário.':perm?'Permissão de gestor necessária.':'Destino registrado: '+dest+' (sem navegação nesta biblioteca).');change('painel','fechado');return;}
 };
 document.addEventListener('click',handle,true);if(r.header?.getRootNode()!==document)r.header.getRootNode().addEventListener('click',handle,true);if(r.menu?.getRootNode()!==document&&r.menu?.getRootNode()!==r.header?.getRootNode())r.menu.getRootNode().addEventListener('click',handle,true);
 document.addEventListener('keydown',event=>{if(event.key==='Escape')change('painel','fechado')});
 render();installInspector();return true;
}
function installInspector(){if(kind!=='autenticado'||!cfg.componentes.menu||document.getElementById('aj-layout-study-toggle'))return;
 const toggle=document.createElement('button');toggle.id='aj-layout-study-toggle';toggle.type='button';toggle.textContent='⚙ Estados do layout';Object.assign(toggle.style,{position:'fixed',right:'10px',bottom:'10px',zIndex:'9995',padding:'7px 10px',font:'600 10px system-ui',background:'#10233f',color:'#fff',border:'1px solid #9bb0d2',borderRadius:'99px',cursor:'pointer'});
 const panel=document.createElement('div');panel.id='aj-layout-state-controls';panel.hidden=true;Object.assign(panel.style,{position:'fixed',right:'10px',bottom:'48px',zIndex:'9995',width:'min(280px,90vw)',maxHeight:'57vh',overflowY:'auto',background:'#fff',color:'#10233f',padding:'14px',border:'1px solid #cbd6e5',borderRadius:'11px',font:'12px system-ui',boxShadow:'0 12px 35px #0003'});
 const h=document.createElement('strong');h.textContent='Estados canônicos · layout';panel.append(h);
 for(const [axis,details] of Object.entries(def)){if(axis==='painel')continue;const row=document.createElement('label');Object.assign(row.style,{display:'grid',gap:'3px',marginTop:'10px'});const t=document.createElement('span');t.textContent=axis;const select=document.createElement('select');select.dataset.ajAxis=axis;Object.assign(select.style,{width:'100%',padding:'7px',borderRadius:'6px',border:'1px solid #bdcce0'});for(const v of Object.keys(details.opcoes)){const o=document.createElement('option');o.value=v;o.textContent=v;select.append(o);}select.value=state[axis];select.addEventListener('change',()=>change(axis,select.value));row.append(t,select);panel.append(row);}
 toggle.addEventListener('click',()=>panel.hidden=!panel.hidden);document.body.append(toggle,panel);
}
window.__advogadojaLayoutCanonico={getEstado:()=>({...state}),setEstado:change,getContrato:()=>cfg};
if(!bind()){window.addEventListener('modular-screen:ready',bind,{once:true});const observer=new MutationObserver(()=>{if(bind())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true});setTimeout(()=>observer.disconnect(),6000);}
})();

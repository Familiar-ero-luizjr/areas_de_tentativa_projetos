<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fluxo | Motor V2 autocontido · AdvogadoJá+</title>
    <style>
      :root {
        --navy: #10233f;
        --navy2: #173c6b;
        --gold: #b88932;
        --ink: #18283e;
        --muted: #667894;
        --line: #d8e2ee;
        --paper: #f0f4f9;
        --blue: #3b71a7;
        --green: #277346;
        --warn: #9c6215;
        --red: #bd2742;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font:
          14px/1.45 Inter,
          ui-sans-serif,
          "Segoe UI",
          Arial,
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #84bbfe;
        outline-offset: 2px;
      }
      .toolbar {
        position: sticky;
        z-index: 25;
        top: 0;
        background: var(--navy);
        color: #fff;
        box-shadow: 0 2px 14px #10233f33;
        min-height: 68px;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        flex-wrap: wrap;
      }
      .toolbar__brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 198px;
      }
      .toolbar__brand > div {
        display: flex;
        flex-direction: column;
      }
      .toolbar__brand strong {
        font-size: 16px;
      }
      .toolbar__brand small {
        color: #b9c8da;
        font-size: 11px;
      }
      .toolbar__mark {
        border-radius: 10px;
        width: 36px;
        height: 36px;
        display: grid;
        place-content: center;
        color: var(--navy);
        background: #fff;
        font-size: 17px;
        font-weight: 900;
      }
      .toolbar__actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 7px;
      }
      .toolbar button {
        color: #fff;
        background: #173c6b;
        border: 1px solid #ffffff36;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        white-space: nowrap;
      }
      .toolbar button:hover:not(:disabled) {
        background: #28568a;
      }
      .toolbar button.is-important {
        background: #edf4ff;
        color: #153c72;
        border-color: #edf4ff;
        font-weight: 700;
      }
      .toolbar .save-status {
        font-size: 11px;
        padding: 5px 8px;
        background: #ffffff23;
        border-radius: 99px;
        white-space: nowrap;
      }
      .toolbar .substatus {
        color: #bdcbdf;
        font-size: 11px;
        white-space: nowrap;
      }
      .flow-canvas {
        max-width: 1080px;
        margin: 0 auto;
        padding: 30px 18px 120px;
      }
      .flow-canvas__heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 18px;
      }
      .flow-canvas__heading span {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #7686a1;
      }
      .flow-canvas__heading h1 {
        font-size: 25px;
        line-height: 1.2;
        color: var(--navy);
        margin: 5px 0 0;
      }
      .flow-canvas__heading p {
        max-width: 355px;
        color: #70829a;
        text-align: right;
        font-size: 12px;
        margin: 0;
      }
      .quickbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 13px 0 25px;
      }
      .pill {
        background: #fff;
        border: 1px solid var(--line);
        color: #58708e;
        border-radius: 30px;
        padding: 5px 10px;
        font-size: 11px;
      }
      .pill strong {
        color: var(--navy);
      }
      .quickbar .stretch {
        flex: 1;
      }
      .compact-btn {
        padding: 7px 11px;
        background: white;
        border: 1px solid #cfdaea;
        border-radius: 8px;
        color: var(--navy2);
        font-size: 12px;
      }
      .compact-btn:hover {
        background: #edf4ff;
      }
      #graph {
        display: grid;
        gap: 0;
      }
      .sequence-slot {
        position: relative;
      }
      .connector {
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        color: #8194b0;
      }
      .connector:before {
        content: "";
        width: 1px;
        height: 100%;
        background: #cadae9;
        position: absolute;
        top: 0;
      }
      .connector:after {
        content: "";
        position: absolute;
        bottom: 2px;
        border: solid #99afc6;
        border-width: 0 1.5px 1.5px 0;
        padding: 3px;
        transform: rotate(45deg);
      }
      .connector span {
        position: relative;
        background: var(--paper);
        padding: 0 10px;
        font-size: 10px;
        display: none;
      }
      .screen-card,
      .branch-card {
        border: 1px solid #d3dfed;
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 4px 14px #0b234312;
        overflow: hidden;
      }
      .screen-card {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 13px 12px;
        min-height: 82px;
      }
      .screen-card.selected {
        border-color: #5489cf;
        box-shadow:
          0 0 0 2px #699ee82a,
          0 4px 14px #0b234312;
      }
      .screen-card.is-active {
        border-color: #2e9167;
        box-shadow: 0 0 0 2px #40ae7e38;
      }
      .drag-handle {
        border: 0;
        background: #edf1f6;
        border-radius: 9px;
        min-width: 29px;
        max-width: 29px;
        min-height: 36px;
        display: grid;
        place-content: center;
        color: #8191a7;
        letter-spacing: 2px;
        cursor: grab;
      }
      .screen-card .screen-detail {
        flex: 1;
        min-width: 0;
      }
      .eyebrow {
        font-size: 10px;
        color: #718198;
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tag {
        border-radius: 999px;
        padding: 2px 6px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.015em;
        background: #e8f0fd;
        color: #274d80;
      }
      .tag.branch {
        background: #e4f3e9;
        color: #255b3f;
      }
      .tag.warn {
        background: #fff3dc;
        color: #895a16;
      }
      .screen-name {
        font-weight: 800;
        font-size: 14px;
        margin: 2px 0 0;
        overflow-wrap: anywhere;
        color: #19283d;
      }
      .screen-key {
        font-size: 11px;
        color: #7a8ba3;
        overflow-wrap: anywhere;
      }
      .card-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px;
      }
      .card-actions button {
        font-size: 11px;
        border: 1px solid #cedbe9;
        background: #fff;
        border-radius: 7px;
        color: #33465d;
        padding: 6px 8px;
      }
      .card-actions button:hover {
        background: #eff5fd;
      }
      .card-actions button.danger {
        color: #b01e38;
      }
      .card-actions button.primary {
        background: #eaf2ff;
        border-color: #bcd0f3;
        color: #214d88;
      }
      .branch-card {
        margin: 10px 0 8px;
      }
      .branch-card__title {
        background: #f7faff;
        padding: 11px 14px;
        border-bottom: 1px solid #d3dfed;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .branch-card__title strong {
        flex: 1;
        font-size: 13px;
      }
      .branch-card__body {
        padding: 9px;
      }
      .branch-tabs {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
        margin: 0 0 11px;
      }
      .branch-tabs button {
        padding: 8px 10px;
        border: 1px solid #d5e1ed;
        border-radius: 8px 8px 0 0;
        background: #f4f7fb;
        color: #56687f;
        font-size: 11px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .branch-tabs button.active {
        background: #10233f;
        color: #fff;
        border-color: #10233f;
      }
      .branch-tabs small {
        padding: 2px 5px;
        background: #fff3;
        border-radius: 20px;
      }
      .connection-summary {
        border: 1px solid #dfe8f1;
        border-radius: 10px;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .connection-summary strong {
        font-size: 13px;
        color: var(--navy);
      }
      .connection-summary small {
        color: #667894;
      }
      .connection-summary button {
        border: 1px solid var(--line);
        background: #fff;
        padding: 6px 9px;
        border-radius: 7px;
        color: #254d7c;
        font-size: 11px;
      }
      .connection-summary strong.warning {
        color: #9a651d;
      }
      .branch-card footer {
        display: flex;
        gap: 7px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .linkline {
        font-size: 11px;
        color: #526a86;
        background: #f8fafc;
        border-radius: 8px;
        padding: 6px 9px;
        margin-top: 8px;
      }
      .empty {
        background: #fff;
        border: 1px dashed #b6c9dc;
        border-radius: 14px;
        padding: 36px;
        text-align: center;
        color: #657b97;
      }
      .empty h3 {
        color: var(--navy);
        margin: 0 0 8px;
      }
      .empty p {
        margin: 0 0 16px;
      }
      .insert-row {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 26px;
        opacity: 0.28;
        transition: 0.16s;
      }
      .insert-row:hover,
      .insert-row:focus-within {
        opacity: 1;
      }
      .insert-row button {
        border: 1px dashed #a6bcd5;
        background: #eef4fb;
        border-radius: 99px;
        color: #245280;
        font-size: 12px;
        padding: 2px 15px;
      }
      .detail-panel {
        position: fixed;
        z-index: 40;
        top: 69px;
        right: 0;
        bottom: 0;
        width: min(410px, 100vw);
        overflow: auto;
        background: white;
        border-left: 1px solid #d8e2ee;
        box-shadow: -8px 0 35px #10233f25;
        transform: translateX(102%);
        transition: transform 0.18s;
      }
      .detail-panel.open {
        transform: translateX(0);
      }
      .detail-head {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
      }
      .detail-head h2 {
        font-size: 16px;
        margin: 2px 0;
      }
      .detail-content {
        padding: 15px 18px;
      }
      .detail-content h3 {
        font-size: 12px;
        color: #45627f;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 23px 0 9px;
      }
      .detail-content p {
        font-size: 12px;
        color: #596b7e;
      }
      .kv {
        display: grid;
        grid-template-columns: 106px 1fr;
        gap: 9px;
        font-size: 12px;
        border-bottom: 1px solid #edf1f6;
        padding: 8px 0;
      }
      .kv span:first-child {
        color: #7d8aa0;
      }
      .kv span:last-child {
        overflow-wrap: anywhere;
      }
      .relation {
        padding: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 9px;
        margin: 7px 0;
        font-size: 12px;
      }
      .relation strong {
        display: block;
        color: #243c5b;
      }
      .relation small {
        display: block;
        color: #6c8097;
        margin-top: 3px;
      }
      .mini-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .mini-row button {
        background: #f4f7fb;
        border: 1px solid #d3dfec;
        border-radius: 7px;
        padding: 5px 8px;
        font-size: 11px;
        color: #254d7c;
      }
      .detail-content ul {
        margin: 0;
        padding-left: 18px;
        font-size: 12px;
        color: #647a93;
      }
      .x-btn {
        border: 1px solid #d9e2ee;
        background: #fff;
        border-radius: 8px;
        color: #536984;
        padding: 5px 9px;
      }
      .modal-root {
        position: fixed;
        z-index: 80;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #07172bc0;
      }
      .modal-root.open {
        display: flex;
      }
      .modal {
        width: min(640px, 100%);
        max-height: min(90vh, 980px);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 65px #0004;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .modal.wide {
        width: min(950px, 100%);
      }
      .modal header {
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .modal h2 {
        font-size: 17px;
        margin: 0;
      }
      .modal .modal-body {
        padding: 19px;
        overflow: auto;
        min-height: 0;
      }
      .modal footer {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        border-top: 1px solid var(--line);
        padding: 12px 18px;
      }
      .modal footer button,
      .form-btn {
        padding: 9px 15px;
        border: 1px solid #cad6e4;
        border-radius: 9px;
        background: #f7faff;
        color: var(--navy2);
      }
      .modal footer button.main,
      .form-btn.main {
        background: var(--navy2);
        border-color: var(--navy2);
        color: #fff;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12px;
        color: #62748c;
        margin-bottom: 12px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid #cad8e7;
        border-radius: 9px;
        padding: 9px 11px;
        background: #fff;
        color: #203754;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .field .hint {
        font-size: 11px;
        color: #8899ab;
      }
      .dialog-note {
        background: #eef5ff;
        border-left: 3px solid #779acb;
        color: #405e80;
        border-radius: 5px;
        padding: 10px 13px;
        font-size: 12px;
        margin: 0 0 14px;
      }
      .list-items {
        display: grid;
        gap: 6px;
        max-height: 50vh;
        overflow: auto;
      }
      .pick-item {
        width: 100%;
        border: 1px solid #d9e3ed;
        background: #fff;
        border-radius: 9px;
        padding: 11px;
        text-align: left;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .pick-item:hover {
        background: #f3f7fc;
      }
      .pick-item small {
        display: block;
        color: #7a8ca5;
      }
      .chip {
        font-size: 10px;
        color: #2c6599;
        border-radius: 99px;
        background: #e6f2ff;
        padding: 3px 7px;
      }
      .vars-grid {
        display: grid;
        gap: 8px;
      }
      .var-item {
        border: 1px solid #e1e9f3;
        border-radius: 9px;
        padding: 9px;
        display: grid;
        grid-template-columns: 1.1fr 0.6fr 1.2fr auto;
        gap: 6px;
        align-items: center;
      }
      .var-item input,
      .var-item select {
        border: 1px solid #d3deeb;
        border-radius: 6px;
        padding: 6px;
        width: 100%;
        min-width: 0;
      }
      .var-item button {
        border: 1px solid #eed9de;
        background: #fff0f2;
        border-radius: 7px;
        color: #a32d41;
        padding: 6px 9px;
      }
      .notice {
        position: fixed;
        bottom: 19px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: #172f4d;
        color: #fff;
        padding: 11px 16px;
        border-radius: 10px;
        box-shadow: 0 9px 25px #0004;
        font-size: 12px;
        max-width: 90vw;
        display: none;
      }
      .notice.show {
        display: block;
      }
      .preview-frame {
        width: 100%;
        height: min(72vh, 820px);
        border: 1px solid #dce5ef;
        border-radius: 10px;
        background: #e8eef6;
      }
      .muted {
        color: #697c96;
      }
      .warning-text {
        color: #a26317;
      }
      .error-text {
        color: #b42a47;
      }
      .inset {
        background: #f6f9fd;
        border: 1px solid #dae4f0;
        border-radius: 9px;
        padding: 10px;
      }
      .inline-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .hidden {
        display: none !important;
      }
      @media (max-width: 850px) {
        .toolbar {
          padding: 9px 12px;
        }
        .toolbar__brand {
          min-width: unset;
        }
        .flow-canvas {
          padding: 20px 9px 90px;
        }
        .flow-canvas__heading {
          display: block;
        }
        .flow-canvas__heading p {
          text-align: left;
          margin-top: 6px;
        }
        .screen-card {
          gap: 9px;
        }
        .card-actions {
          max-width: 175px;
        }
        .card-actions button {
          padding: 5px;
        }
        .field-row {
          grid-template-columns: 1fr;
        }
        .var-item {
          grid-template-columns: 1fr 85px 1fr auto;
        }
      }
      @media (max-width: 510px) {
        .toolbar__actions {
          justify-content: flex-start;
        }
        .screen-card {
          flex-wrap: wrap;
        }
        .card-actions {
          width: 100%;
          max-width: none;
          justify-content: flex-end;
          margin-left: 35px;
        }
        .flow-canvas__heading h1 {
          font-size: 22px;
        }
        .branch-tabs {
          overflow: auto;
          flex-wrap: nowrap;
        }
        .detail-panel {
          top: 0;
        }
        .modal-root {
          padding: 7px;
        }
        .modal-body {
          padding: 12px !important;
        }
      }
      .path-nested {
        padding: 0 0 0 28px;
        margin: 0 0 15px;
        border-left: 1px solid #cbd8e8;
      }
      .reference-note {
        background: #eaf2fc;
        border: 1px dashed #9aafd0;
        border-radius: 9px;
        color: #325273;
        padding: 12px;
        margin: 10px 0;
        font-size: 12px;
      }
      .reference-note button {
        margin-left: 8px;
      }
      .edge-caption {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 7px;
      }
      .edge-caption button {
        margin-left: auto;
      }
      .independent-title {
        margin: 34px 0 12px;
        border-top: 1px dashed #b1c7dc;
        padding-top: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 9px;
      }
      .independent-title strong {
        color: #263d5a;
      }
      .independent-title small {
        color: #7285a1;
      }
      .independent-path {
        margin-bottom: 18px;
        border-left: 3px solid #d6e1ec;
        padding-left: 12px;
      }

      /* FIDELIDADE VISUAL: CSS original do Fluxo V1, preservado integralmente. */
      .toolbar {
        color: #fff;
        z-index: 100;
        background: #10233f;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        height: auto;
        min-height: 68px;
        padding: 10px 20px;
        display: flex;
        position: sticky;
        top: 0;
        box-shadow: 0 2px 14px #10233f33;
      }
      .toolbar__brand {
        align-items: center;
        gap: 11px;
        min-width: 230px;
        display: flex;
      }
      .toolbar__brand > div {
        flex-direction: column;
        display: flex;
      }
      .toolbar__brand small {
        color: #b9c8da;
        margin-top: 2px;
        font-size: 11px;
      }
      .toolbar__mark {
        color: #10233f;
        background: #fff;
        border-radius: 10px;
        place-items: center;
        width: 36px;
        height: 36px;
        font-weight: 800;
        display: grid;
      }
      .toolbar__actions {
        flex-wrap: wrap;
        justify-content: flex-end;
        align-items: center;
        gap: 7px;
        display: flex;
      }
      .toolbar button {
        color: #fff;
        cursor: pointer;
        font: inherit;
        background: #173c6b;
        border: 1px solid #fff3;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
      }
      .toolbar button:hover:not(:disabled) {
        background: #20528f;

        if (candidates.some((c) => conditionMatch(c) === null))
          return showNotice(
            "Existem condições pendentes; defina as variáveis antes de continuar.",
          );
        showNotice(
          "Nenhuma condição verdadeira. Ajuste as variáveis ou selecione uma saída.",
        );
      }
      function clearSim() {
        active = null;
        trace = [];
        draw();
      }
      function showValidation() {
        const r = validation();
        openModal(
          "Validação do fluxo",
          `<p class="dialog-note">Verificação estrutural da edição atual. Uma bifurcação não precisa ser cadastrada: ela é derivada das saídas.</p><h3>${r.errors.length} erros</h3>${r.errors.length ? "<ul>" + r.errors.map((s) => `<li class="error-text">${esc(s)}</li>`).join("") + "</ul>" : "<p>Nenhum erro estrutural encontrado.</p>"}<h3>${r.warnings.length} avisos</h3>${r.warnings.length ? "<ul>" + r.warnings.map((s) => `<li class="warning-text">${esc(s)}</li>`).join("") + "</ul>" : "<p>Nenhum aviso.</p>"}<h3>Simulação</h3><p>Início: <strong>${esc(nameOf(doc.fluxo.inicio))}</strong>. Ponto atual: <strong>${esc(active ? nameOf(active) : "não iniciada")}</strong>. ${trace.length} passos.</p>`,
          `<button data-action="modal-close">Fechar</button>`,
          { wide: false },
        );
      }
      function download(name, s) {
        const blob = new Blob([s], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 3500);
      }
      function exportDoc() {
        const out = portableDoc(doc);
        download(
          "advogadoja-fluxo-projecao.json",
          JSON.stringify(out, null, 2),
        );
        showNotice(
          "JSON exportado: navegação distribuída por tela, sem seção fluxo na raiz.",
        );
      }
      let importMode = "replace";
      async function importFile(file) {
        if (!file) return;
        try {
          const data = JSON.parse(await file.text());
          if (importMode === "catalog-refresh") {
            updateCatalogOnly(data);
            return;
          }
          const converted = normalize(data);
          if (
            !confirm(
              `Importar ${file.name}? Isso substitui a edição atual neste navegador. O catálogo e as conexões anteriores só ficam disponíveis se você os exportou.`,
            )
          )
            return;
          try {
            localStorage.setItem(BACKUP_KEY, JSON.stringify(portableDoc(doc)));
          } catch {}
          setDoc(
            converted,
            data.format ? "projeção V1 convertida" : "JSON importado",
          );
          showNotice(
            `Importação concluída: ${Object.keys(doc.catalogo.telas).length} telas, ${doc.fluxo.conexoes.length} conexões.`,
          );
        } catch (e) {
          console.error(e);
          showNotice("Importação rejeitada: " + e.message);
        } finally {
          by("fileInput").value = "";
          importMode = "replace";
        }
      }
      function staticPreview(key, state) {
        const s = doc.catalogo.telas[key];
        if (!s) return "<!doctype html><p>Tela não encontrada no catálogo.</p>";
        const nodes = s.estrutura?.html?.composicao,
          components = doc.catalogo.componentes;
        if (!nodes || !Object.keys(nodes).length)
          return `<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>body{font:14px system-ui;padding:28px;color:#345;background:#f4f7fb}</style><h2>${esc(nameOf(key))}</h2><p>Este catálogo fornece a identidade da tela, mas não traz estrutura HTML/CSS para a prévia.</p><code>${esc(key)}</code></html>`;
        const tmp = document.implementation.createHTMLDocument("preview");
        const allRefs = {};
        const css = [];
        const rules = s.estrutura?.css?.regras || {},
          tokens = s.estrutura?.css?.tokens || {};
        css.push(
          ":root{" +
            Object.entries(tokens)
              .map(([k, v]) => `${k}:${v}`)
              .join(";") +
            "}",
        );
        css.push(...Object.values(rules).filter((x) => typeof x === "string"));
        function mkComp(ref) {
          const comp = components[ref];
          if (!comp) {
            const el = tmp.createElement("div");
            el.textContent = "Componente não encontrado: " + ref;
            el.style.color = "#b22";
            return { root: el, refs: {} };
          }
          const html = comp.estrutura?.html || {},
            elements = html.elementos || {},
            local = {},
            svgTags = new Set([
              "svg",
              "path",
              "circle",
              "rect",
              "g",
              "line",
              "polyline",
              "polygon",
              "ellipse",
              "text",
              "defs",
              "linearGradient",
              "stop",
            ]);
          css.push(
            ...Object.values(comp.estrutura?.css?.regras || {}).filter(
              (x) => typeof x === "string",
            ),
          );
          for (const [eid, d] of Object.entries(elements)) {
            const el = svgTags.has(d.tag)
              ? tmp.createElementNS("http://www.w3.org/2000/svg", d.tag)
              : tmp.createElement(d.tag || "div");
            for (const [attr, value] of Object.entries(d.atributos || {})) {
              if (/^on/i.test(attr) || attr === "srcdoc") continue;
              try {
                el.setAttribute(attr, String(value));
              } catch {}
            }
            if (d.texto) el.textContent = d.texto;
            local[eid] = el;
          }
          const sorted = Object.keys(elements).sort(
            (a, b) => (elements[a].ordem || 0) - (elements[b].ordem || 0),
          );
          const roots = [];
          for (const eid of sorted) {
            const d = elements[eid],
              el = local[eid];
            if (d.paiRef && local[d.paiRef]) local[d.paiRef].appendChild(el);
            else roots.push(el);
          }
          let root =
            local[html.raizRef] || roots[0] || tmp.createElement("div");
          for (const e of roots) {
            if (e !== root) root.appendChild(e);
          }
          Object.assign(allRefs, local);
          return { root, refs: local };
        }
        const sorted = Object.entries(nodes).sort(
          (a, b) => (a[1].ordem || 0) - (b[1].ordem || 0),
        );
        let root = null;
        for (const [alias, spec] of sorted) {
          const comp = mkComp(spec.componenteRef);
          if (!root) {
            root = comp.root;
          } else {
            const parent = allRefs[spec.paiRef] || root;
            parent.appendChild(comp.root);
          }
          allRefs[alias] = comp.root;
        }
        if (!root) return "<p>Sem componentes.</p>";
        const app = root.matches?.(".app") ? root : root.querySelector(".app");
        if (app) app.setAttribute("data-professional-access", state);
        if (state === "restricted") {
          const hero = tmp.querySelector(".home-access-card");
          if (hero) hero.hidden = false;
        }
        const htmlCSS = css.join("\n");
        const safeCSS = htmlCSS.replace(/<\/style/gi, "<\\/style");
        const safeHTML = root.outerHTML;
        return (
          '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' +
          safeCSS +
          "</style></head><body>" +
          safeHTML +
          `<script>document.addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;const a=b.dataset.action||'';if(a==='drawer.open'){const x=document.querySelector('.prototype-drawer');if(x){x.classList.add('open');x.setAttribute('aria-hidden','false')}}else if(a==='drawer.close'){const x=document.querySelector('.prototype-drawer');if(x){x.classList.remove('open');x.setAttribute('aria-hidden','true')}}else if(a==='online.toggle'){b.classList.toggle('is-offline');const s=b.querySelector('.online-copy strong');if(s)s.textContent=b.classList.contains('is-offline')?'Offline':'Online';}else if(a==='route.close'){document.querySelector('.route-modal')?.classList.remove('open');}else if(b.classList.contains('request-card')){const m=document.querySelector('.route-modal');if(m){m.classList.add('open');m.setAttribute('aria-hidden','false');}}});<\/script>` +
          "</body></html>"
        );
      }
      function preview(key) {
        selected = key;
        previewState =
          doc.fluxo.variaveis.professionalAccess === "restricted"
            ? "restricted"
            : "enabled";
        const render = () => {
          const frame = by("previewIframe");
          if (frame) frame.srcdoc = staticPreview(key, previewState);
        };
        openModal(
          "Visualização · " + nameOf(key),
          `<div class="inline-actions" style="justify-content:space-between;margin:0 0 10px"><div><button class="form-btn" id="stateEnabled">OAB validada</button><button class="form-btn" id="stateRestricted">OAB pendente</button></div><small class="muted">Prévia composta exclusivamente dos JSONs do catálogo</small></div><iframe id="previewIframe" title="Prévia da tela" class="preview-frame" sandbox="allow-scripts allow-forms"></iframe>`,
          `<button data-action="modal-close">Fechar</button>`,
          { wide: true },
        );
        by("stateEnabled").addEventListener("click", () => {
          previewState = "enabled";
          render();
        });
        by("stateRestricted").addEventListener("click", () => {
          previewState = "restricted";
          render();
        });
        render();
      }
      function toolsDialog() {
        const r = validation(),
          f = doc.fluxo;
        openModal(
          "Ferramentas do motor",
          `<p class="dialog-note">O editor conserva a visualização da V1. As conexões são salvas em <code>catalogo.telas[id].navegacao</code>, nunca numa seção <code>fluxo</code> na raiz.</p><div class="kv"><span>Telas usadas</span><span>${f.telasUsadas.length} / ${Object.keys(doc.catalogo.telas).length} no catálogo</span></div><div class="kv"><span>Conexões</span><span>${f.conexoes.length}</span></div><div class="kv"><span>Bifurcações</span><span>${f.telasUsadas.filter((k) => outgoing(k).length > 1).length}</span></div><div class="kv"><span>Pendências</span><span>${r.errors.length + r.warnings.length}</span></div><div class="inline-actions" style="margin:20px 0"><button class="form-btn" id="openVarsTool">Variáveis</button><button class="form-btn" id="openValidationTool">Validar</button><button class="form-btn" id="startSimulationTool">Iniciar simulação</button><button class="form-btn" id="nextSimulationTool">Próxima saída</button><button class="form-btn" id="clearSimulationTool">Limpar caminho</button></div><p>Para definir saídas, clique no corpo de uma tela e escolha <strong>+ Criar conexão</strong>. As bifurcações surgem automaticamente.</p>`,
          `<button data-action="modal-close">Fechar</button>`,
        );
        const attach = (id, fn) => {
          by(id).onclick = () => {
            closeModal();
            fn();
          };
        };
        attach("openVarsTool", varsDialog);
        attach("openValidationTool", showValidation);
        attach("startSimulationTool", simulateStart);
        attach("nextSimulationTool", simulateNext);
        attach("clearSimulationTool", clearSim);
      }
      function openBranchEditor(key) {
        const edges = outgoing(key);
        openModal(
          "Editar bifurcação · " + nameOf(key),
          `<p class="dialog-note">Esta bifurcação é calculada pelas saídas da tela, não é um nó separado. Edite uma saída ou adicione outra.</p><div class="list-items">${edges.map((c) => `<div class="relation"><strong>${esc(c.rotulo || c.saida)} → ${esc(nameOf(c.para))}</strong><small>${esc(c.id)} · ${esc(whenStr(c))}</small><div class="mini-row"><button data-action="edit-edge" data-id="${esc(c.id)}">Editar</button><button data-action="delete-edge" data-id="${esc(c.id)}">Desconectar</button></div></div>`).join("")}</div><div class="mini-row"><button data-action="connect" data-key="${esc(key)}">+ Adicionar saída</button><button data-action="inspect" data-key="${esc(key)}">Campos da tela</button></div>`,
          `<button data-action="modal-close">Fechar</button>`,
        );
      }
      function removeBranch(key) {
        const edges = outgoing(key);
        if (!edges.length) return;
        if (
          !confirm(
            `Remover todas as ${edges.length} saídas de ${nameOf(key)}? As telas serão preservadas no catálogo.`,
          )
        )
          return;
        edit((f) => {
          f.conexoes = f.conexoes.filter((c) => c.de !== key);
        });
        showNotice("Bifurcação removida. As telas permanecem disponíveis.");
      }
      function initialFromReference() {
        const d = extractLegacyGraph(LEGACY_REFERENCE),
          original = copy(DEFAULT_CATALOG);
        // Mantém componentes da biblioteca atual; as telas de referência ausentes são só identidades.
        for (const [key, entry] of Object.entries(d.catalogo.telas))
          if (!original.catalogo.telas[key])
            original.catalogo.telas[key] = entry;
        original.fluxo = d.fluxo;
        // Garantir a referência inicial canônica mesmo que a projeção V1 esteja incompleta.
        original.fluxo.inicio = "auth.inicializacao.splash";
        return original;
      }
      function restoreBackup() {
        try {
          const data = localStorage.getItem(BACKUP_KEY);
          if (!data)
            return showNotice("Não há uma cópia anterior para restaurar.");
          if (
            !confirm(
              "Restaurar a cópia anterior? As edições atuais serão substituídas.",
            )
          )
            return;
          setDoc(JSON.parse(data), "cópia de segurança restaurada");
          showNotice("Cópia anterior restaurada.");
        } catch (e) {
          showNotice("Não foi possível restaurar: " + e.message);
        }
      }
      function updateCatalogOnly(input) {
        if (!input?.catalogo?.telas || !input?.catalogo?.componentes)
          throw Error(
            "Informe um JSON com catalogo.telas e catalogo.componentes.",
          );
        const old = portableDoc(doc),
          next = copy(input);
        next.catalogo.telas = { ...old.catalogo.telas, ...next.catalogo.telas };
        // Preserva as conexões existentes, associando-as às novas definições de tela por ID.
        for (const [key, t] of Object.entries(old.catalogo.telas))
          if (t.navegacao && next.catalogo.telas[key])
            next.catalogo.telas[key].navegacao = copy(t.navegacao);
        next.catalogo.componentes = {
          ...old.catalogo.componentes,
          ...next.catalogo.componentes,
        };
        localStorage.setItem(BACKUP_KEY, JSON.stringify(old));
        setDoc(next, "catálogo atualizado");
        showNotice("Catálogo atualizado sem remover as conexões por ID.");
      }
      function actionRun(action, button) {
        const key = button.dataset.key,
          idx = Number(button.dataset.index),
          eid = button.dataset.id;
        switch (action) {
          case "modal-close":
            closeModal();
            break;
          case "inspect":
            selectScreen(key);
            break;
          case "preview":
            preview(key);
            break;
          case "connect":
            makeConnect(key);
            break;
          case "edit-edge":
            makeConnect(null, eid);
            break;
          case "delete-edge":
            deleteConnection(eid);
            break;
          case "remove-screen":
            removeScreen(key);
            break;
          case "move-up":
            doMove(key, -1);
            break;
          case "move-down":
            doMove(key, 1);
            break;
          case "simulate-edge":
            simulateEdge(eid);
            break;
          case "switch-tab":
            tabState[key] = eid;
            draw();
            break;
          case "edit-branch":
            openBranchEditor(key);
            break;
          case "remove-branch":
            removeBranch(key);
            break;
          case "tools":
            toolsDialog();
            break;
          case "add-at":
            addScreen(idx);
            break;
          case "pick-screen": {
            const i = doc.fluxo.telasUsadas.indexOf(key);
            if (i >= 0) {
              closeModal();
              selectScreen(key);
              showNotice("Tela já está no fluxo; use a referência existente.");
              return;
            }
            edit((f) => {
              if (idx < 0) f.telasUsadas.push(key);
              else f.telasUsadas.splice(idx, 0, key);
              if (!f.inicio) f.inicio = key;
            });
            closeModal();
            break;
          }
          case "var-add":
            addVar();
            break;
          case "var-remove":
            button.closest(".var-item")?.remove();
            break;
        }
      }
      function bind() {
        document.body.addEventListener("click", (e) => {
          const button = e.target.closest("[data-action]");
          if (button) {
            actionRun(button.dataset.action, button);
            return;
          }
        });
        document.body.addEventListener("keydown", (e) => {
          if (
            (e.key === "Enter" || e.key === " ") &&
            e.target.matches(".flow-card__body")
          ) {
            e.preventDefault();
            selectScreen(e.target.dataset.key);
          }
        });
        by("modalClose").onclick = closeModal;
        by("closeDetail").onclick = closeDetail;
        by("modalRoot").addEventListener("click", (e) => {
          if (e.target === by("modalRoot")) closeModal();
        });
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeModal();
            closeDetail();
          }
          if (
            (e.ctrlKey || e.metaKey) &&
            !e.shiftKey &&
            e.key.toLowerCase() === "z" &&
            !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)
          ) {
            e.preventDefault();
            undo();
          }
        });
        by("undoBtn").onclick = undo;
        by("redoBtn").onclick = redo;
        by("toolsBtn").onclick = toolsDialog;
        by("emptyBtn").onclick = () => {
          if (
            !confirm(
              "Criar fluxo vazio? O catálogo será mantido. A cópia anterior será preservada para Restaurar.",
            )
          )
            return;
          try {
            localStorage.setItem(BACKUP_KEY, JSON.stringify(portableDoc(doc)));
          } catch {}
          edit((f) => {
            f.inicio = null;
            f.telasUsadas = [];
            f.conexoes = [];
          });
        };
        by("exportBtn").onclick = exportDoc;
        by("importBtn").onclick = () => {
          importMode = "replace";
          by("fileInput").click();
        };
        by("fileInput").onchange = (e) => importFile(e.target.files[0]);
        by("generateBtn").onclick = () => {
          if (
            !confirm(
              "Gerar pelo fluxo de referência V1? Isso substitui a edição atual e sinaliza as regras ausentes como pendentes.",
            )
          )
            return;
          try {
            localStorage.setItem(BACKUP_KEY, JSON.stringify(portableDoc(doc)));
          } catch {}
          setDoc(initialFromReference(), "referência V1 convertida");
          showNotice(
            "Referência V1 carregada. Condições não definidas permanecem pendentes.",
          );
        };
        by("createBtn").onclick = () => addScreen(-1);
        by("updateBtn").onclick = () => {
          importMode = "catalog-refresh";
          by("fileInput").click();
        };
        by("restoreBtn").onclick = restoreBackup;
        by("homeBtn").onclick = (e) => {
          e.preventDefault();
          showNotice(
            "O módulo é autocontido: a página inicial do construtor não está incluída.",
          );
        };
        let dragged = null;
        by("graph").addEventListener("dragstart", (e) => {
          const card = e.target.closest("[data-drag]");
          if (card) {
            dragged = card.dataset.drag;
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", dragged);
          }
        });
        by("graph").addEventListener("dragover", (e) => {
          if (e.target.closest("[data-card]")) e.preventDefault();
        });
        by("graph").addEventListener("drop", (e) => {
          const card = e.target.closest("[data-card]");
          if (!card || !dragged) return;
          e.preventDefault();
          const to = card.dataset.card,
            from = dragged;
          dragged = null;
          const i = doc.fluxo.telasUsadas.indexOf(from),
            j = doc.fluxo.telasUsadas.indexOf(to);
          if (i < 0 || j < 0 || i === j) return;
          edit((f) => {
            const [node] = f.telasUsadas.splice(i, 1);
            f.telasUsadas.splice(j, 0, node);
          });
          showNotice(
            "Organização visual atualizada. Conexões por ID preservadas.",
          );
        });
      }
      function initialize() {
        bind();
        let stored = null;
        try {
          stored = localStorage.getItem(STORE_KEY);
        } catch {}
        if (stored) {
          try {
            setDoc(JSON.parse(stored), "trabalho local", false);
            by("saveStatus").textContent = "Salvo localmente";
            return;
          } catch (e) {
            console.warn(e);
          }
        }
        setDoc(initialSplashOnly(), "Splash inicial");
      }
      initialize();
    </script>
  </body>
</html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdvogadoJá · Workspace Independente</title><style>:root{font:14px/1.4 Inter,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f2f6fb;color:#1b3048}.top{min-height:62px;background:#10233f;color:white;display:flex;align-items:center;gap:15px;padding:10px 20px;flex-wrap:wrap}.logo{background:#2375a9;border-radius:8px;padding:9px;font-weight:800}.brand{display:flex;flex-direction:column;min-width:155px}.brand b{font-size:16px}.brand small{font-size:10px;color:#b6cce0;letter-spacing:.6px}.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.nav button{border:1px solid #3e5a77;color:#e5eff9;border-radius:8px;background:#1b3654;padding:9px 12px;cursor:pointer}.nav button.active,.nav button:hover{background:#287eaa;color:white}.frame{width:100%;height:calc(100vh - 62px);border:0;display:block}.hint{margin-left:auto;font-size:11px;color:#b7cadb}@media(max-width:900px){.frame{height:calc(100vh - 110px)}.hint{display:none}}</style></head><body><header class="top"><div class="logo">AJ</div><div class="brand"><b>AdvogadoJá</b><small>WORKSPACE NORMALIZADO</small></div><nav class="nav"><button data-target="BANCO" class="active">Banco</button><button data-target="FLUXO">Fluxo</button><button data-target="JORNADAS">Jornadas</button><button data-target="PROTOTIPO">Protótipo</button></nav><span class="hint">Cada módulo usa apenas seu próprio JSON</span></header><iframe class="frame" id="m" src="./BANCO/index.html?embed=1" title="Módulo selecionado"></iframe><script>document.querySelector('.nav').onclick=e=>{const b=e.target.closest('button[data-target]');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#m').src='./'+b.dataset.target+'/index.html?embed=1'}</script></body></html>

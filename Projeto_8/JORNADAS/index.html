idth:100%;height:100%;border:0;background:white}.rel-list{display:flex;flex-wrap:wrap;gap:6px}.rel-list button{font-size:11px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.screen-card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;box-shadow:0 6px 20px #203e5a08}.screen-card-head,.screen-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px}.screen-card-head{font-size:10px;font-weight:650;color:#51708b;border-bottom:1px solid #e2ebf1}.screen-card-foot{flex-direction:column;align-items:start;gap:2px;border-top:1px solid #e2ebf1}.screen-card-foot strong{font-size:13px}.screen-card-foot code{font-size:10px}.text-button,.cell-link{border:0;background:transparent;color:#096d9d;padding:3px;font-size:11px;text-align:left}.frame-mini{position:relative;width:195px;height:335px;margin:12px auto;border:5px solid #22364d;border-radius:23px;overflow:hidden;background:white}.frame-mini.desktop{width:235px;height:220px;border-radius:8px}.frame-mini iframe{width:390px;height:670px;transform:scale(.5);transform-origin:top left;pointer-events:none}.frame-mini.desktop iframe{width:800px;height:740px;transform:scale(.29375)}.cover-button{position:absolute;inset:0;border:0;border-radius:0;background:transparent;cursor:zoom-in}.cover-button:hover{background:#147baa10}.load-more{text-align:center;padding:25px}.subnav,.segmented{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}.subnav button,.segmented button{font-size:12px;padding:9px 12px}.subnav .selected,.segmented .selected,.fork .selected{background:#dff2fa;border-color:#69b4d2;color:#146489;font-weight:700}.table-wrap{overflow:auto;max-width:100%;background:white;border:1px solid #dce5ed;border-radius:13px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:11px 12px;border-bottom:1px solid #e7edf3;text-align:left;vertical-align:top}th{background:#f7fafc;color:#3e5970;white-space:nowrap}td code{font-size:10px}.status-pending{background:#fff3dd;border-radius:5px;padding:4px 6px;color:#946412;font-size:10px}.empty{background:white;border:1px dashed #c9d8e5;border-radius:14px;padding:45px 22px;text-align:center;color:#668094}.empty b{font-size:18px;color:#213f5e}.empty p{max-width:650px;margin:12px auto 20px}.prototype-split{grid-template-columns:minmax(350px,1fr) minmax(240px,320px)}.center-col{display:flex;flex-direction:column;align-items:center;min-width:0}.prototype-heading{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;width:min(100%,770px);padding:6px 0}.prototype-frame{height:600px;max-width:410px;margin:12px auto}.prototype-frame.desktop{max-width:760px;height:530px}.actions-bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0 12px}.actions-bar button{font-size:11px}.facts{display:grid;gap:10px}.facts>div{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding-bottom:8px}.facts b{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#8595a5}.facts span{font-size:12px}.fork{border:1px solid #ecd7ad;background:#fffaf1;border-radius:10px;padding:12px;display:flex;gap:6px;flex-direction:column;margin-top:15px}.fork button{font-size:11px;text-align:left}.modal-cover{position:fixed;inset:0;z-index:80;background:#101f35b8;display:none;align-items:center;justify-content:center;padding:20px}.modal{width:min(98vw,1080px);max-height:95vh;overflow:hidden;background:#fff;border-radius:15px;box-shadow:0 24px 80px #0005;display:flex;flex-direction:column}.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head b{font-size:15px}.modal-head button{font-size:20px;border:0}.modal-body{padding:18px;overflow:auto}.modal-body .bigjson{max-height:67vh}.modal-actions{margin-bottom:10px;display:flex;gap:7px}.preview-modal{display:grid;grid-template-columns:1fr 1fr;gap:15px}.preview-modal .preview-frame{margin:0 auto}.modal-meta{min-width:0}.form{display:grid;gap:13px;max-width:550px}.form label{display:grid;gap:5px;color:#425b6d;font-size:12px}.form input,.form select{border:1px solid #cbd9e5;border-radius:8px;padding:10px;width:100%;max-width:100%}.form button[type="submit"]{background:#166e9d;color:white;justify-self:start;border:0;padding:12px 16px}.loader-error{max-width:670px;margin:10vh auto;background:white;padding:32px;border-radius:16px;border:1px solid var(--line)}.loader-error input{margin:16px 0}.muted{color:#8a9eb0}

html,body{height:100%}body{overflow:hidden}
.work{height:calc(100dvh - 64px);min-height:0}
#sidebar{height:100%;overflow-y:auto}
#main{padding:0!important;position:relative;min-height:0;overflow:hidden;height:100%}
.module-view{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper);display:none}
.module-view.active{display:block}
.nav-item[aria-current="page"]{background:#294b6e;font-weight:700;box-shadow:inset 3px 0 #1c9bca}
.nav-sub{margin-left:17px}.catalog-loading{color:#b7cce1;font-size:11px;padding:9px 13px}
.status-live{font-size:11px;color:#bfd2e3}

</style></head>
<body><header id="topbar">
 <div class="head-left"><button class="menu-toggle" id="mobileMenu" aria-label="Abrir menu">☰</button><span class="brand-mark">AJ</span><div class="head-brand"><b>AdvogadoJá</b><small>WORKSPACE · MÓDULO AUTÔNOMO</small></div></div>
 <div class="head-actions"><span id="saveStatus" class="save-status">Snapshot local</span><button class="head-btn" id="importButton">Importar JSON</button><button class="head-btn primary" id="exportButton">Exportar JSON</button></div>
</header><div class="work"><aside id="sidebar" aria-label="Navegação do módulo Jornadas">
 <div class="nav-caption">MÓDULO</div><div class="nav-title">Jornadas</div><div class="nav-hint" id="moduleCount">Carregando dados locais…</div>
 <nav class="nav-tree" aria-label="Submódulos">
  <div class="nav-item-wrap" style="--level:0"><button type="button" class="nav-item active" data-view="fields" aria-current="page"><span class="nav-ico">≡</span><span class="nav-label">Campos utilizados</span></button></div>
  <div class="nav-item-wrap" style="--level:0"><button type="button" class="nav-item" data-view="presentation"><span class="nav-ico">▦</span><span class="nav-label">Apresentações de jornadas</span></button>
   <div class="nav-sub" id="journeyMenu"><div class="catalog-loading">Lendo jornadas declaradas…</div></div></div>
 </nav><div class="side-note"><b>Dados locais</b><span>Cada submódulo usa exclusivamente seu próprio <code>documento.json</code>.</span></div>
</aside><main id="main">
 <iframe class="module-view active" id="frame-fields" title="Campos utilizados das Jornadas" src="campos_utilizados/index.html?embed=1"></iframe>
 <iframe class="module-view" id="frame-presentation" title="Apresentações de Jornadas" src="apresentacoes_jornadas/index.html?embed=1"></iframe>
</main></div><input id="importFile" type="file" accept=".json,application/json" hidden>
<script>
(()=>{'use strict';
 const $=s=>document.querySelector(s),frames={fields:$('#frame-fields'),presentation:$('#frame-presentation')};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let active='fields',ready={fields:false,presentation:false},journeys=[],selected='';
 const message=(which,obj)=>frames[which].contentWindow?.postMessage(obj,'*');
 function activate(which,journeyId,updateHash=true){
  if(!frames[which])return;
  active=which;
  Object.entries(frames).forEach(([id,f])=>f.classList.toggle('active',id===which));
  document.querySelectorAll('[data-view]').forEach(b=>{const on=b.dataset.view===which;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  document.querySelectorAll('[data-journey]').forEach(b=>{const on=which==='presentation'&&journeyId===b.dataset.journey;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(which==='presentation'&&journeyId){selected=journeyId;message('presentation',{type:'aj.jornadas.selecionar',id:journeyId})}
  if(updateHash)history.replaceState(null,'','#'+(which==='fields'?'campos':'jornadas'+(journeyId?':'+encodeURIComponent(journeyId):'')));
  $('#sidebar').classList.remove('open');
 }
 function renderJourneys(){
  const area=$('#journeyMenu');
  if(!journeys.length){area.innerHTML='<div class="catalog-loading">Nenhuma jornada classificada</div>';return}
  area.innerHTML=journeys.map(j=>'<div class="nav-item-wrap" style="--level:1"><button type="button" class="nav-item" data-journey="'+esc(j.id)+'"><span class="nav-ico">·</span><span class="nav-label">'+esc(j.name)+'</span><span class="pill">'+j.count+'</span></button></div>').join('');
 }
 document.addEventListener('click',e=>{
  const view=e.target.closest('[data-view]');const journey=e.target.closest('[data-journey]');
  if(view){activate(view.dataset.view);return}
  if(journey){activate('presentation',journey.dataset.journey);return}
 });
 $('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
 $('#importButton').addEventListener('click',()=>$('#importFile').click());
 $('#importFile').addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{const content=await file.text();const obj=JSON.parse(content);if(obj.modulo?.toUpperCase()!=='JORNADAS'||!obj.telas)throw Error('JSON inválido para Jornadas');message(active,{type:'aj.jornadas.importar',conteudo:content})}catch(err){alert(err.message)}
  e.target.value='';
 });
 $('#exportButton').addEventListener('click',()=>message(active,{type:'aj.jornadas.exportar'}));
 window.addEventListener('message',e=>{
  const who=e.source===frames.fields.contentWindow?'fields':e.source===frames.presentation.contentWindow?'presentation':null;
  if(!who||!e.data||typeof e.data!=='object')return;
  if(e.data.type==='aj.jornadas.estado'){
    ready[who]=true;
    if(who==='presentation'){
      journeys=Array.isArray(e.data.jornadas)?e.data.jornadas:[];
      $('#moduleCount').textContent=e.data.telas+' telas no snapshot independente';
      renderJourneys();
      if(selected)message('presentation',{type:'aj.jornadas.selecionar',id:selected});
    }
    if(who===active)$('#saveStatus').textContent=e.data.alteracoes?'Alterações não exportadas':'Snapshot local';
  }else if(e.data.type==='aj.jornadas.arquivo'){
    const blob=new Blob([e.data.conteudo],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=e.data.nome||'jornadas_documento.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);$('#saveStatus').textContent='Exportado nesta sessão';
  }else if(e.data.type==='aj.jornadas.erro'){alert(e.data.mensagem)}
 });
 let hash=decodeURIComponent(location.hash.slice(1));
 if(hash.startsWith('jornadas')){const id=hash.includes(':')?hash.slice(hash.indexOf(':')+1):'';activate('presentation',id,false)}
 else activate('fields',null,false);
})();
</script></body></html>

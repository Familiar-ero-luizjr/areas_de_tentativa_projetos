<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdvogadoJá · Guia</title><style>
:root{--navy:#10233f;--gold:#c39c51;--bg:#f5f7fa;--line:#dbe3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.65 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#233249}header{background:linear-gradient(115deg,#10233f,#1a3c62);color:white;padding:19px 25px;border-bottom:4px solid var(--gold)}header h1{font-size:22px;margin:0}header p{margin:3px 0 9px;color:#cdd9e7;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{background:white;color:#10233f;border:1px solid #d4dee9;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1440px;margin:auto;min-height:calc(100vh - 115px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px 12px}aside details>summary{cursor:pointer;font-weight:750;color:#17334e;padding:9px}aside nav{display:grid;gap:3px}aside button{display:block;width:100%;border:0;background:transparent;padding:9px 11px;text-align:left;color:#4b5c70;border-radius:7px;font-size:12px;cursor:pointer}aside button.active{background:#e8eff8;color:#123b68;font-weight:800}article{padding:30px clamp(18px,4vw,55px);max-width:1040px;min-width:0}article h1{font-size:25px}article h2{font-size:19px;margin-top:0}article p,article li{line-height:1.7}article pre{background:#12233c;color:#e9f0f8;border-radius:8px;overflow:auto;padding:13px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}article code{background:#edf2f7;padding:1px 4px;border-radius:4px;font-size:12px}article pre code{background:none}article table{border-collapse:collapse;width:100%;font-size:12px;display:block;overflow:auto}article th,article td{padding:8px 10px;border:1px solid #dbe3ee;text-align:left}article th{background:#eaf0f7}blockquote{border-left:3px solid var(--gold);padding:8px 16px;margin:16px 0;background:#fff}a{color:#1c5d9b}.notice{color:#64748b;font-size:12px}input[type=file]{display:none}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}aside nav{max-height:230px;overflow:auto}article{padding:20px}}</style></head><body><header><h1>Guia · busca e resolução de identidade</h1><p>Documento de referência preservado em seções JSON editáveis.</p><div class="actions"><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><button id="toggle">Abrir/recolher índice</button></div></header><div class="shell"><aside><details id="side" open><summary>Seções do guia</summary><nav id="toc"></nav></details></aside><article id="article"><p>Carregando documento.json…</p></article></div><input id="file" type="file" accept=".json,application/json"><script src="app.js" defer></script></body></html>

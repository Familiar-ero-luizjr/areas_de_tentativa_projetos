<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdvogadoJá · Montagem de Telas</title><style>
:root{--navy:#10233f;--gold:#c39c51;--line:#dce4ed;--white:#fff;--bg:#f3f6f9}*{box-sizing:border-box}body{font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:var(--bg);color:#203047}header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:15px max(18px,calc((100vw - 1380px)/2));background:var(--navy);color:white;border-bottom:3px solid var(--gold)}.brand{font-weight:800;font-size:16px;margin-right:auto}.tabs{display:flex;gap:7px}.tab{border:1px solid #627a9b;border-radius:8px;padding:10px 16px;background:transparent;color:white;cursor:pointer;font-weight:750}.tab.active{background:white;color:var(--navy);border-color:white}.description{margin:0;padding:8px 20px;font-size:12px;color:#64748b;background:#fff;border-bottom:1px solid var(--line)}iframe{display:block;width:100%;height:calc(100vh - 109px);border:0;background:white}@media(max-width:600px){.brand{width:100%}header{padding:12px}.tab{padding:8px 11px}iframe{height:calc(100vh - 145px)}}</style></head><body>
<header><div class="brand">AdvogadoJá · MONTAGEM_TELAS</div><nav class="tabs" aria-label="Menu principal"><button class="tab" data-page="GUIA/index.html">A · Guia</button><button class="tab active" data-page="MONTAGEM/index.html">B · Montagem</button></nav></header>
<p class="description" id="description">Montagem: telas, componentes, contratos, edição e exportação JSON.</p>
<iframe id="workspace" title="Ambiente de montagem" src="MONTAGEM/index.html"></iframe><script>
const frame=document.getElementById('workspace'); const desc=document.getElementById('description');
document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');frame.src=btn.dataset.page;desc.textContent=btn.dataset.page.startsWith('GUIA')?'Guia: pesquisa e resolução de identidades, com índice de seções.':'Montagem: telas, componentes, contratos, edição e exportação JSON.';}));
</script></body></html>

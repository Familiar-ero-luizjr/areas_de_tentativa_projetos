:root{--navy:#112541;--navy2:#172f51;--accent:#2264d4;--muted:#64748b;--bg:#f5f7fb;--ink:#17263d;--line:#e2e8f0;--surface:#fff;--header-h:62px;--nav-w:302px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app-header{height:var(--header-h);position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 22px;box-shadow:0 2px 9px rgba(7,23,48,.12)}.logo{width:30px;height:30px;display:grid;place-items:center;background:linear-gradient(150deg,#3c7ddd,#0e3972);border:1px solid #658bb9;border-radius:9px;font-size:14px;font-weight:900;flex:none}.title-wrap{min-width:0;display:flex;align-items:baseline;gap:12px;overflow:hidden}.app-title{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.app-subtitle{font-size:11px;color:#adbed9;white-space:nowrap}.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}.btn{border-radius:7px;padding:7px 12px;background:white;border:1px solid var(--line);color:#243a57;font-size:12px;font-weight:700;transition:background .15s,border .15s}.btn:hover{background:#eef3fb}.btn:focus-visible,.nav-link:focus-visible,.icon-btn:focus-visible,.link-btn:focus-visible{outline:3px solid #7caaff;outline-offset:2px}.btn.header-btn{background:transparent;border-color:#627998;color:white}.btn.header-btn:hover{background:#294768}.btn.header-primary{background:#fff;color:#123256;border-color:white}.btn.header-primary:hover{background:#e9f0ff}.icon-btn{width:35px;height:35px;display:grid;place-items:center;background:transparent;border:1px solid #637a9b;color:white;border-radius:7px;font-size:18px}.icon-btn:hover{background:#294768}.menu-toggle{display:grid}.main-layout.nav-collapsed{grid-template-columns:0 minmax(0,1fr)}.main-layout.nav-collapsed .sidebar{d <script>window.__DOCUMENTO_BASE_EMBEDDED={"schema":"advogadoja.documento.secoes.v1","version":"1.0","title":"Direção Canônica do Workspace, Módulos, Telas e Contratos JSON — V5 (decisões recuperadas)","introMarkdown":"# AdvogadoJá — Direção do Workspace e Padrão Funcional dos Módulos\n\n**Versão:** 5.0 · **Data-base:** 11/11/2026 · **Status:** direção de trabalho para validação progressiva.\n\nEste documento começa pelo **index e organização dos módulos**, passa pelas funcionalidades e interfaces e só depois aborda contratos JSON e motores. Não conserva formatos históricos por obrigação e não transforma exemplos de implementação em padrão aprovado.\n\n**Eixo principal:** **Workspace único → módulos e subitens → interfaces e funcionalidades → dados e relações explícitas → JSON final → motores.**\n\n**Separação essencial:** o JSON descreve telas, componentes e vínculos necessários; este documento orienta o Workspace, menus, módulos, decisões de UX, homologação e políticas gerais.\n\n> **Consolidação de 11/11/2026:** esta edição recupera decisões explicitadas nos arquivos de contrato modular e de Home, separando **decisões registradas**, **modelos em avaliação** e **exemplos documentais**. O modelo recuperado coloca o ID da tela na chave raiz `<telaId>` e distingue `tela.componentes` das definições externas em `componentes`. A Direção do Workspace permanece prioritária e o motor permanece posterior à definição funcional.\n\n> As imagens/capturas do shell e das funcionalidades serão anexadas quando disponíveis. Os esquemas textuais das primeiras seções já definem a hierarquia e os comportamentos esperados.","sections":[{"id":"sec-0041","title":"Direção geral — finalidade, prioridades e estrutura desejada","markdown":"**[DIREÇÃO DEFINIDA]** O ambiente AdvogadoJá é um **Workspace modular único** para compreender, organizar e definir o produto. A prioridade de agora é **a experiência de trabalho e as funcionalidades de cada módulo**: o que aparece, o que o usuário consegue fazer, quais informações precisa consultar e quais alterações registra. **Motor, adaptadores, migração de arquivos e otimizações técnicas vêm depois.**\n\n### Decisões de direção\n\n1. **Um index central, um padrão de navegação.** O `index` oferece cabeçalho e menu lateral comuns, uma área de conteúdo ampla e os controles gerais indispensáveis. Não replica a estrutura inteira de cada ferramenta dentro do Workspace.\n2. **Módulos agrupam funções relacionadas.** Banco, Contrato JSON/Catálogo, Fluxo, Jornadas e Protótipos são domínios de trabalho. *Campos utilizados* e *visualização/edição funcional* são subitens do mesmo módulo quando dizem respeito ao mesmo domínio; não viram aplicativos autônomos por conveniência.\n3. **Os módulos podem ter quantos subitens precisarem.** Jornadas e roteiros de apresentação podem ser acrescentados dinamicamente; seu número **não é fixado no HTML nem em uma lista rígida do menu**.\n4. **Um shell visual consistente, conteúdo próprio.** Cabeçalho, menu, espaçamentos estruturais e comportamento de navegação são comuns; árvore de dados, galeria, fluxograma, simulador e editor de banco conservam interfaces adequadas às suas funções.\n5. **Eliminar duplicidade, não capacidade.** Cabeçalhos e barras de navegação internos que repetem o shell serão integrados, retirados ou realocados, mas **nenhuma ação essencial poderá desaparecer**. Uma tela principal deve receber o máximo possível de espaço útil.\n6. **Identidades e relações explícitas.** O sistema lê IDs, participação em jornadas, sequência, referência de telas e relações declaradas. Não deve deduzir vínculos de nomes, posições visuais ou semelhanças.\n7. **Sem fidelidade obrigatória a experiências antigas.** Referências anteriores explicam o objetivo e podem fornecer ideias, mas não são normativas. O documento descreve o **padrão de chegada**, não uma obrigação de conservar caminhos, cabeçalhos, CSS, motores ou estruturas intermediárias.\n8. **A especificação fica separada dos dados.** Diretrizes de UX, políticas gerais de organização, decisões, imagens do editor e histórico de homologação pertencem à documentação. O JSON de tela precisa conter apenas definições efetivamente necessárias para montagem e funcionamento, sem redundância ornamental.\n\n**Ordem obrigatória do trabalho:** **(1)** definir funcionalidades de tela e de módulo → **(2)** posicionar ações, controles, estados e visualizações → **(3)** estabelecer os dados/IDs/relacionamentos necessários → **(4)** revisar os JSONs → **(5)** adaptar ou construir os motores.\n\n**[PENDENTE]** Validar o menu final e a composição responsiva com imagens de referência. Capturas e anexos visuais serão incorporados posteriormente, sem bloquear esta direção estrutural.","group":"direcao","sourceNumber":1},{"id":"sec-0042","title":"Workspace/index — regiões fixas e composição visual","markdown":"### Estrutura de primeiro nível\n\n```text\nINDEX / WORKSPACE\n├── Cabeçalho global\n│   ├── Marca e identificação do ambiente\n│   └── Controles globais realmente comuns\n├── Navegação lateral global\n│   ├── Pesquisa de módulos/subitens (quando útil)\n│   ├── Banco\n│   ├── Contrato JSON / Catálogo\n│   ├── Fluxo\n│   ├── Jornadas\n│   └── Protótipos\n└── Área principal (ocupa todo o espaço disponível)\n    ├── Contexto mínimo: módulo e item ativos\n    ├── Controles contextuais do item ativo\n    └── Conteúdo exclusivo do item ativo\n        ├── consulta de campos / árvore de JSON; OU\n        ├── visualização do Fluxo; OU\n        ├── galeria de Jornadas; OU\n        ├── simulador de Protótipo; OU\n        └── visão do Banco / Contrato\n```\n\n**[DIREÇÃO DEFINIDA]** O index é o ponto de entrada único da navegação: registra os módulos e hospeda a área selecionada. Um módulo não recria a sidebar do Workspace nem seus controles de localização. A troca de subitem não deve desmontar dados não salvos sem aviso.\n\n| Região | Responsabilidade | Limite de conteúdo |\n|---|---|---|\n| **Header global** | Marca, contexto do ambiente e poucas ações globais comuns | Não replicar barras completas específicas do Fluxo, Jornada ou Protótipo |\n| **Menu lateral** | Módulos e subitens hierárquicos, expansão/recolhimento e seleção atual | Não hospedar formulários extensos, JSONs completos ou ferramentas específicas |\n| **Identificação da área** | Título breve e caminho de navegação opcional e derivado do estado atual | Não guardar breadcrumb redundante dentro de cada JSON de tela |\n| **Barra contextual** | Ações do subitem selecionado: importar/exportar, visualizar, editar etc. | O conjunto depende da funcionalidade real; não impor uma toolbar única de três botões |\n| **Conteúdo principal** | Galeria, fluxograma, tabela/árvore, protótipo ou outra experiência da tarefa | Deve ganhar área útil; não competir com painéis permanentemente abertos sem necessidade |\n| **Painéis temporários** | Filtros avançados, detalhes, cenários, inspeção, propriedades e confirmações | Usar drawer/modal/aba interna quando economizar espaço sem ocultar ações essenciais |\n\n### Layout e experiência\n\n- **Desktop:** sidebar persistente e recolhível, conteúdo com largura fluida; rolagem local para listas grandes e galeria quando necessária.\n- **Tablet/mobile:** menu recolhível acionado por controle visível; a área de trabalho passa a ocupar a largura disponível, mantendo acesso a ações críticas.\n- **Acessibilidade:** foco por teclado, rótulos, seleção ativa, contraste, scroll visível e navegação sem dependência de hover.\n- **Visual geral:** manter uma linguagem comum para shell, mas não forçar que Fluxo, Banco e Protótipo tenham o mesmo arranjo interno.\n- **Imagens futuras:** anexar uma captura do index, uma do menu expandido/recolhido, uma de módulo com dois subitens e uma de módulo com lista dinâmica; registrar tamanho do viewport e qual estado ilustram.\n\n**[PENDENTE]** Cores, medidas exatas e proporções finais serão fixadas quando houver material visual homologado. Números de CSS experimentais não são regras desta direção.","group":"direcao","sourceNumber":2},{"id":"sec-0043","title":"Padrão obrigatório do menu — módulos, subitens e listas dinâmicas","markdown":"**[DIREÇÃO DEFINIDA]** O menu possui **três níveis conceituais**: **módulo → funcionalidade/subitem → item dinâmico**, quando aplicável. O terceiro nível não deve ser acrescentado a todos os módulos artificialmente.\n\n```text\nMÓDULOS\n├── Banco\n│   ├── Campos utilizados\n│   └── Estrutura / modelagem do banco [finalidade a detalhar]\n├── Contrato JSON / Catálogo\n│   ├── Campos utilizados [se fizer sentido]\n│   └── Inspeção / organização de contratos [a detalhar]\n├── Fluxo\n│   ├── Campos utilizados       ← árvore/relatório do contrato\n│   └── Visualização do fluxo   ← caminhos, conexões e prévias\n├── Jornadas\n│   ├── Campos utilizados       ← consulta documental\n│   └── Visualização de jornadas\n│       ├── Advogado            ← identificada na fonte de jornadas\n│       └── [outra jornada]     ← surge quando existir no conjunto carregado\n└── Protótipos\n    ├── Campos utilizados\n    └── Protótipo interativo\n        ├── Navegação livre\n        └── Apresentação de jornadas\n            └── [roteiros existentes]  ← exibidos a partir de seus IDs\n```\n\n*Esquema conceitual, não lista completa de funcionalidades homologadas. Os nomes que dependem de definição futura permanecem indicados como pendentes.*\n\n### Regras do menu\n\n1. **Registro explícito:** cada módulo possui um ID técnico estável, título, ícone opcional, ordem de exibição, subitens e referência para o conteúdo. A presença no menu resulta do registro, não de um HTML duplicado por módulo.\n2. **Subitens com propósito:** *Campos utilizados* exibe os campos e dados do JSON relevantes àquela funcionalidade; *visualização* oferece a interface real de trabalho (não é outro relatório).\n3. **Listas dinâmicas:** Jornadas, subjornadas, roteiros e itens equivalentes são criados a partir de **identidades explícitas do conjunto importado/carregado**, não por regex do nome do arquivo, adivinhação do motor ou botões de menu escritos manualmente.\n4. **Seleção independente de apresentação:** abrir ou fechar um grupo não modifica o JSON da tela; inserir/alterar uma participação de jornada modifica seu dado canônico quando essa operação for oferecida.\n5. **Estado claro:** módulo e subitem ativos visíveis; contagens opcionais, somente quando derivadas de dados reais. Estados vazio, carregando, erro e item ausente têm tratamento explícito.\n6. **Sem duplicação de menus:** navegação interna do módulo só permanece quando for **navegação da própria funcionalidade**. Seletores técnicos, ferramentas e filtros que não são rotas devem ficar na barra contextual ou painel de trabalho.\n7. **Escalabilidade:** dezenas de jornadas ou roteiros não podem criar dezenas de módulos; usar árvore recolhível, pesquisa local e, se necessário, paginação/virtualização.\n8. **Destino e autorização:** seleção de menu referencia um subitem/rota de Workspace declarado. Permissão real é uma regra própria e não deve ser deduzida da ocultação visual do item.\n\n**Regra específica:** o Fluxo reúne **consulta de campos e editor/visualização conectiva**. Jornadas reúne **consulta de campos e galeria por jornada**. Protótipos reúne **consulta de campos e simulador**, com os modos internos apresentados conforme sua natureza. A padronização é da **navegação externa**, não da aparência de todas essas áreas.","group":"direcao","sourceNumber":3},{"id":"sec-0044","title":"Inclusão de um novo módulo no index — contrato de registro e aceitação","markdown":"### O que precisa ser definido antes de inserir um módulo\n\n1. **Identidade e finalidade:** ID estável, nome visível, descrição curta, problema que resolve e quais informações deve mostrar.\n2. **Subitens:** cada subitem com ID, nome, objetivo, operações permitidas, tipo de conteúdo e ordem. Determinar se existe uma lista dinâmica derivada dos dados.\n3. **Visão de trabalho:** componentes visuais, filtros, controles, estados vazio/erro/carregamento e modo responsivo; o formato é ditado pela funcionalidade, não por um motor legado.\n4. **Entradas:** contratos JSON lidos, IDs/referências necessários, eventuais anexos e limites de importação.\n5. **Saídas:** o que é apenas visualização, o que altera os JSONs, o que deve ser exportado e como diferenças/erros são mostrados.\n6. **Integração com o shell:** ações de toolbar que aparecem no conteúdo, painéis temporários, título contextual e comportamento de voltar; não inserir novo cabeçalho global.\n7. **Critérios de aceitação:** navegação, atualização de itens dinâmicos, uso independente, importação/exportação e ausência de regressão visual/funcional.\n\n### Registro conceitual (não é schema de dados de tela)\n\n```json\n{\n  \"id\": \"modulo.fluxo\",\n  \"titulo\": \"Fluxo\",\n  \"ordem\": 30,\n  \"subitens\": [\n    {\"id\": \"fluxo.campos\", \"titulo\": \"Campos utilizados\", \"view\": \"consulta-campos\"},\n    {\"id\": \"fluxo.visualizacao\", \"titulo\": \"Visualização do fluxo\", \"view\": \"editor-fluxo\"}\n  ]\n}\n```\n\n**Esse exemplo é somente a ilustração da declaração de menu/index.** Não cria campos obrigatórios nos contratos JSON de telas e não define um motor. A implementação pode usar outro formato, desde que a identificação e os vínculos permaneçam explícitos.\n\n### O que acontece ao incluir/atualizar\n\n- Ao registrar um módulo, o index apresenta um único item de primeiro nível e seus subitens, segundo a ordem definida.\n- Ao carregar novas jornadas/roteiros, o menu atualiza **apenas os itens dinâmicos relacionados**, sem mexer na definição dos outros módulos.\n- Ao selecionar um subitem, a área principal mostra a interface correspondente e sua barra contextual, sem sobreposição de navegação duplicada.\n- Ao trocar de módulo, alterações ainda não exportadas exigem tratamento explícito. Os módulos no mesmo Workspace podem consumir o mesmo conjunto carregado, mas **não** se presume persistência fora dele.\n- Se um subitem não tiver dados, mostrar estado vazio com orientação útil, não fabricar exemplos como se fossem registros reais.\n\n**[PENDENTE]** Escolher posteriormente se o cadastro de módulos viverá em manifesto, configuração do front-end ou JSON específico do Workspace. **Não misturar esse cadastro com o contrato de uma tela do produto.**","group":"direcao","sourceNumber":4},{"id":"sec-0045","title":"Direção dos dados — o que fica no JSON e o que fica na documentação","markdown":"### Separação de responsabilidades\n\n| Informação | Destino recomendado | Estado |\n|---|---|---|\n| ID da tela, identidade de componente/instância, classificação e participação | Contrato canônico da tela ou objeto de participação identificado | **Base a preservar e avaliar** |\n| Componentes, composição, estado, variante, ação, interação, referência de dado | Contrato funcional/visual pertinente | **Necessário conforme cada caso real** |\n| Relações entre telas, bifurcações, condições, efeitos e destinos | Relações explícitas no contrato/objeto relacionado | **Não inferir** |\n| Cenários de simulação e mocks | Dados de prototipação identificados, separados dos de produção | **A detalhar** |\n| Política geral de construção, convenção de ID, regras de UX, orientação do index | Este documento e fichas de módulo/Workspace | **Não duplicar em cada tela** |\n| Proveniência histórica de conversões, referência a implementação, controle de homologação | Documentos/manifestos de auditoria, quando necessários | **Não obrigar cada tela a carregar isso** |\n| Localização física de arquivo e breadcrumb de interface | Índice/manifesto derivável e estado de navegação | **Evitar redundância no JSON da tela** |\n| HTML de composição e CSS de apresentação | Blocos funcionais da estrutura visual, com escopo distinto | **Avaliar consolidação de `estrutura` e `estilos` sem perda** |\n\n**[DIREÇÃO DEFINIDA]** Não definir agora um conjunto definitivo de 17 campos obrigatório para sempre. A estrutura de `identidade` e `classificacao` já é uma boa base e deve ser respeitada, mas os outros campos serão **avaliados a partir das funcionalidades reais**. Se dois blocos repetem a mesma informação, a equipe pode consolidá-los de maneira explícita e controlada.\n\n**[DECIDIDO]** Os módulos não devem adivinhar informações ausentes: uma tela sem referência de jornada, fluxo ou dado necessário fica como **pendência de especificação**. A troca de dados entre módulos acontece por IDs e contratos explícitos; mecanismos de atualização automática ou importação/exportação serão definidos de acordo com o fluxo de trabalho aprovado.\n\n**Exemplo de trabalho real:** ao definir uma tela de cadastro, registrar o conteúdo visual, a identidade da tela, seu papel na jornada, ações e estados, relações de entrada/saída e campos lógicos usados. O Banco pode depois apresentar quais telas consomem/produzem esses campos e quais operações precisam ser especificadas. A ferramenta não inventa tabela, endpoint ou função apenas a partir do rótulo do botão.\n\n### Disponibilidade de telas entre módulos\n\n**[DIREÇÃO FUNCIONAL]** Quando uma tela for inserida e identificada no **conjunto de trabalho carregado**, sua referência deve ficar disponível aos módulos que a utilizem: a Jornada a apresenta no agrupamento declarado; o Fluxo pode mostrá-la como tela disponível para conexão; o Protótipo pode localizá-la para prévia/simulação. **Disponibilização não equivale a inventar conexões ou simular comportamento indefinido.** A persistência e a propagação para arquivos/sessões externos continuam dependentes de um mecanismo que ainda será escolhido.\n\n\n**[COMPATIBILIZAÇÃO V5]** O registro de decisões já consolidava um **invólucro externo `<telaId> → { tela, componentes }`**. Esse formato e a distinção entre instâncias/definições são bases verificadas a aproveitar; a lista dos blocos internos continua sujeita à revisão por necessidade funcional. Ver seções de contrato recuperado inseridas após a direção inicial.\n","group":"direcao","sourceNumber":5},{"id":"sec-0046","title":"Organização lógica do index, módulos, conteúdos e documentos","markdown":"**[DIREÇÃO DE ESTRUTURA — CONCEITUAL]** A organização física deverá distinguir: **(a) index/shell**, **(b) interfaces e definições de cada módulo**, **(c) dados canônicos de telas/componentes**, **(d) índices derivados**, **(e) documentação e evidências visuais**. Uma mesma informação não deve ter cópias independentes apenas para servir ao menu.\n\n```text\nambiente/\n├── index                  ← entrada do Workspace e área central\n├── workspace/             ← header, sidebar, navegação global, registro modular\n│   └── registro-modulos   ← declara módulos, subitens e fontes de listas dinâmicas\n├── modulos/\n│   ├── fluxo/             ← consulta de campos + visualização/edição de conexões\n│   ├── jornadas/          ← consulta de campos + galeria/lista dinâmica de jornadas\n│   ├── prototipos/        ← consulta de campos + simulação/roteiros\n│   ├── banco/             ← consulta de campos + modelagem de dados\n│   └── contrato-catalogo/ ← inspeção/organização dos contratos\n├── dados/\n│   ├── telas/             ← JSONs de telas, identidade estável\n│   ├── componentes/       ← definições editoriais, quando houver\n│   └── indices/           ← projeções e listas derivadas (não fonte autoritativa)\n├── recursos-visuais/      ← imagens ou recursos realmente compartilhados\n└── documentos/            ← direção, fichas, decisões, capturas e homologação\n```\n\n*Esta árvore apresenta **papéis e responsabilidades**, não nomes de pastas obrigatórios nem uma proposta de motor. A tecnologia final (HTML isolado, aplicação web, componentes etc.) será escolhida depois.*\n\n### Regras de organização\n\n1. **Index não armazena telas:** apenas registra quais módulos/subitens existem, como são selecionados e onde o conteúdo será exibido.\n2. **Módulo não redefine o shell:** pode ter componentes e controles internos próprios, mas não copia o header global ou mantém uma segunda sidebar universal.\n3. **Dados não são layout do editor:** contratos de telas e componentes não carregam configuração de menu do Workspace, posicionamento de toolbars do editor ou textos de direção.\n4. **Índices são derivados:** uma jornada nova aparece no menu pela referência identificada nos dados carregados, não porque alguém acrescentou à mão outro elemento `li` no HTML do index.\n5. **Autocontenção quando útil:** um HTML de demonstração pode embutir CSS/JS/dados e funcionar offline. Isso não obriga a estrutura definitiva a duplicar essas informações em cada módulo.\n6. **Se houver `estrutura` e `estilos`:** manter apenas responsabilidades distintas. CSS pode ficar fisicamente no mesmo contrato ou dividido por escopo, conforme a necessidade aprovada; não adicionar dois campos que gravem a mesma regra.\n7. **Imagens de direção:** associar futuras capturas às fichas do Workspace/módulo, com legenda e estado observado, **não ao JSON da tela como metadado genérico**.\n\n**[PENDENTE]** Definir nomes reais, extensões e o registro de módulos definitivo quando a experiência de navegação e os requisitos de integração estiverem homologados.","group":"direcao","sourceNumber":6},{"id":"sec-0047","title":"Contrato modular — formato macro recuperado e responsabilidades","markdown":"**[CONSOLIDADO NO REGISTRO DE DECISÕES]** O modelo de trabalho possui **um ID estável como chave do objeto de raiz**, com dois blocos dentro dele: `tela` e `componentes`. A chave de raiz identifica a tela; `tela.identidade` guarda atributos descritivos e versão do objeto, **sem repetir o ID** em `tela.identidade.id`.\n\n```json\n{\n  \"advogado.home\": {\n    \"tela\": {\n      \"schema\": \"advogadoja.tela\",\n      \"schemaVersion\": \"0.2.0\",\n      \"identidade\": {},\n      \"classificacao\": {},\n      \"navegacao\": {},\n      \"componentes\": {},\n      \"estrutura\": {\"html\": {}, \"css\": {}}\n    },\n    \"componentes\": {}\n  }\n}\n```\n\n*Esqueleto parcial para evidenciar a hierarquia; **não** omitir campos existentes ao importar/exportar. O valor `0.2.0` é o da Home de demonstração, não uma nova versão homologada para todas as telas.*\n\n| Elemento | Papel declarado | Consequência para os módulos |\n|---|---|---|\n| `<telaId>` | Identidade lógica da tela na raiz | Jornada, Fluxo, Protótipo e Banco devem referenciar a mesma tela por essa chave |\n| `<telaId>.tela` | Metadados, classificação, composição, navegação e demais facetas da tela | Cada subitem consome somente o que precisa, preservando o restante |\n| `<telaId>.tela.componentes` | Referências/configuração de **instâncias** empregadas nessa tela | Não confundir instância com definição de componente |\n| `<telaId>.componentes` | **Definições** dos componentes incluídos no contrato autocontido | Permite reconstruir a tela isoladamente sem adivinhar dependências |\n\n**[OBSERVADO NO MODELO]** O arquivo-base reserva **16 chaves dentro de `tela`**: `schema`, `schemaVersion`, `identidade`, `classificacao`, `navegacao`, `estados`, `acoes`, `dados`, `componentes`, `estrutura`, `estilos`, `variantes`, `interacoes`, `mocks`, `localizacao`, `proveniencia`. Isso é inventário do modelo de trabalho, **não** obrigação de perpetuar as 16 chaves. O bloco `politicas` **não está** nesse modelo: diretrizes gerais pertencem à documentação.\n\n**[DECISÃO DE DIREÇÃO ATUAL]** A V4 mantém a possibilidade de simplificar campos não funcionais. Preservar o que foi decidido sobre *hierarquia e significado* não impede rever campos redundantes como `estilos`, `localizacao` e `proveniencia` depois de validar os casos reais. A revisão deve ser explícita e sem perda de dados úteis.","group":"contrato_recuperado","sourceNumber":7},{"id":"sec-0048","title":"Identidade e classificação — campos já definidos para reutilização","markdown":"**[CONSOLIDADO NO REGISTRO, AINDA MODELO DE TRABALHO]** O bloco `identidade` já possui uma relação clara de campos. No exemplo da Home, ele contém:\n\n```json\n\"identidade\": {\n  \"tipo\": \"tela\",\n  \"namespace\": \"advogado\",\n  \"nome\": \"Home Advogado\",\n  \"nomeExibicao\": \"Início Profissional\",\n  \"descricao\": \"Tela inicial da área profissional do AdvogadoJá.\",\n  \"versao\": \"1.0.0\"\n}\n```\n\n| Campo | Finalidade |\n|---|---|\n| `tipo` | Diferenciar tela, componente e outras naturezas |\n| `namespace` | Agrupamento lógico e busca |\n| `nome` | Nome de referência editorial |\n| `nomeExibicao` | Nome visível ao usuário |\n| `descricao` | Finalidade da tela/componente |\n| `versao` | Versão do **objeto**, distinta de `schemaVersion` |\n\n**[CONSOLIDADO]** `classificacao` distingue domínio, posição funcional, escopo e público. O modelo prevê `dominio`, `moduloRef`, `submoduloRef`, `secao`, `categoria`, `escopo`, `reutilizavel`, `publicoAlvo[]`, `tags[]` e `jornadas[]`.\n\n- `escopo: \"comum\"` **não cria uma jornada chamada Comum**; representa possível reutilização por diferentes jornadas.\n- `publicoAlvo` pode conter **vários perfis**.\n- `tags` ajudam em busca e filtro, não devem substituir IDs nem criar hierarquia artificial.\n- `moduloRef` nesta classificação pertence ao **domínio de produto da tela**, e não é automaticamente o registro de módulos do `index` do Workspace.\n\n**[ALERTA DE COMPATIBILIZAÇÃO]** A V4 ainda descrevia `identidade.id` como chave canônica. Para **esta família de contratos**, o ID da tela está na **chave raiz** e o ID do componente está na **chave do mapa externo `componentes`**. A escolha de suportar outros formatos será feita como compatibilidade explícita; não multiplicar IDs redundantes no padrão de chegada.","group":"contrato_recuperado","sourceNumber":8},{"id":"sec-0049","title":"Participações em jornadas — identificação, ordenação e submenu dinâmico","markdown":"**[CONSOLIDADO NO REGISTRO]** `tela.classificacao.jornadas[]` permite que **uma única tela tenha várias participações** em jornadas/subjornadas, cada uma com ID próprio. A tela não recebe outra identidade só porque reaparece em outro contexto.\n\n```json\n\"jornadas\": [{\n  \"id\": \"part.advogado.home\",\n  \"jornada\": {\"id\": \"advogado\", \"nome\": \"Advogado\", \"ordem\": 2},\n  \"subjornada\": {\"id\": \"home\", \"nome\": \"Home única e capabilities\", \"ordem\": 4},\n  \"ordemTela\": 1,\n  \"ocorrenciaNo\": \"home\",\n  \"condicaoRef\": null\n}]\n```\n\n**Campos e interpretações:**\n\n- `id` identifica a **participação**, não a tela. Assim é possível editar uma participação sem alterar as demais.\n- `jornada.id`/`subjornada.id` representam o agrupamento; `nome` é sua apresentação; `ordem` é a ordenação do agrupamento.\n- `ordemTela` ordena a tela **dentro da participação** e não cria relação de navegação.\n- `ocorrenciaNo` identifica a ocorrência contextual e `condicaoRef` reserva a referência a uma condição, sem embutir a condição nela.\n\n**Aplicação no Workspace:** o módulo **Jornadas → Visualização de jornadas** deriva seus subitens dos `jornada.id` presentes nas telas carregadas e seus agrupamentos de `subjornada.id`, preservando nomes e ordens declarados. **Não deve inferir a jornada pelo nome do arquivo nem confundir sequência editorial com conexões do Fluxo.**\n\n**[EXEMPLO DOCUMENTAL]** `advogado`, `home`, a numeração e as condições da Home são exemplos preenchidos, não declaração de que esses nomes e caminhos já estão homologados no produto.","group":"contrato_recuperado","sourceNumber":9},{"id":"sec-0050","title":"Composição estática — estrutura HTML/CSS e isolamento de visual","markdown":"**[PRINCÍPIO CONSOLIDADO]** `estrutura.html` + `estrutura.css`, com as definições de `componentes` do contrato, **devem bastar para montar a tela estática completa** (seções, hierarquia, ordem, textos, imagens e aparência). A estrutura básica não depende de preencher `dados`, `estados`, `acoes` ou `mocks` para surgir visualmente.\n\n**[MODELO DE TRABALHO]** A Home usa:\n\n- `componentes[componenteId].estrutura.html.raizRef` e `elementos[elementoId]` para descrever os elementos da definição;\n- `tag`, `paiRef`, `ordem`, `atributos`, `texto` como propriedades dos elementos;\n- `componentes[componenteId].estrutura.css.regras` para CSS da definição;\n- `tela.estrutura.html.composicao` para encaixar as instâncias nos nós/slots da tela;\n- `tela.estrutura.css.tokens` e `regras` para propriedades visuais do conjunto.\n\n**[DECISÃO SOBRE RESPONSABILIDADES]** Manter separados: **árvore dos elementos**, **regras CSS**, **referências de instâncias**, **dados e comportamento**. Não impor artificialmente a toda definição uma hierarquia `header → itens → rodapé`. A árvore se define por IDs, pais e ordem; CSS não deve duplicar a árvore inteira.\n\n**[PENDENTE]** A grafia final das chaves internas (`elementos`, `paiRef`, `regras`) e a escolha entre CSS textual e declarativo **não foram homologadas**. `estilos` está vazio no modelo e na Home; sua redundância com `estrutura.css` deve ser decidida a partir de necessidade real, sem assumir duas fontes da mesma regra. O mesmo vale para tokens globais vs tokens por tela e isolamento de CSS do editor/Workspace.","group":"contrato_recuperado","sourceNumber":10},{"id":"sec-0051","title":"Componentes reutilizáveis — identidade, instâncias e edição por escopo","markdown":"**[CONSOLIDADO]** Cada definição de componente tem identidade e classificação próprias, `estrutura.html`, `estrutura.css`, e reserva `dados`, `estados`, `acoes`, `variantes`. **A definição lógica** possui ID estável e pode ser usada em várias telas. **A instância** identifica onde e como aquele componente participa de cada tela.\n\n**Relação observada na Home:**\n\n```json\n{\n  \"tela\": {\n    \"componentes\": {\"instanciasRefs\": {\"screen.drawer\": \"menu.drawer.padrao\"}},\n    \"estrutura\": {\"html\": {\"composicao\": {\n      \"screen.drawer\": {\"componenteRef\": \"menu.drawer.padrao\", \"paiRef\": \"layout.root\", \"slot\": \"menu\", \"ordem\": 40}\n    }}}\n  },\n  \"componentes\": {\n    \"menu.drawer.padrao\": {\n      \"identidade\": {\"tipo\": \"componente\", \"namespace\": \"menu\", \"nome\": \"Menu lateral compartilhado\", \"versao\": \"0.1.0\"},\n      \"estrutura\": {\"html\": {}, \"css\": {}}\n    }\n  }\n}\n```\n\n*Fragmento propositalmente parcial, extraído da família estrutural da Home. As definições integrais têm mais propriedades e conteúdo.*\n\n**[DIREÇÃO FUNCIONAL]** O editor deve distinguir claramente **editar esta instância**, **editar a definição compartilhada** e **editar token visual compartilhado**. Modificações na definição são propagadas de forma **explícita** às telas/contratos incluídos no conjunto de trabalho, preservando personalizações. Não pressupor que arquivos independentes mudam sozinhos.\n\n**[OBSERVADO]** A Home de demonstração possui sete definições/instâncias: layout, cabeçalho, barra de título, introdução, status online, resumo de solicitações e menu lateral. **[NÃO HOMOLOGADO]** A lista é um recorte de teste; não constitui catálogo definitivo de componentes de produto.","group":"contrato_recuperado","sourceNumber":11},{"id":"sec-0052","title":"Navegação, bifurcações e estados — relações sem dedução","markdown":"**[CONSOLIDADO COMO CAPACIDADE]** A navegação precisa representar **entradas, saídas, conexões, decisões, bifurcações e transições entre telas ou estados da mesma tela**, inclusive múltiplos caminhos e contextos. Cada vínculo utiliza IDs de objetos apropriados — nunca nomes de botões, ordem de uma galeria ou coordenadas de um cartão.\n\n**[OBSERVADO NO MODELO DE TRABALHO]** O exemplo estrutura `tela.navegacao` em `rotas[]`, `relacoes[]` e `bifurcacoes[]`. `relacoes[]` discrimina `origem` e `destino` com `tipo`, `ref`, `noRef`, opcional `telaContextoRef`/`portaRef`, além de `gatilho`, `condicaoRef`, `participacaoRef`, `ordem` e `prioridade`. `bifurcacoes[]` declara `alternativas[]` por referência de relação.\n\n**[EXEMPLO DOCUMENTAL]** A Home traz casos de OAB pendente, em validação, habilitada, restrita e desconhecida que levam a **estados distintos da mesma Home**; nem toda alternativa cria outra tela. Também inclui caminhos para solicitações, atendimentos, disponibilidade e configurações, entre outros.\n\n**[NÃO HOMOLOGADO]** A Home registra **21 relações, 2 bifurcações e 1 rota** como demonstração, mas mantém campos de condição sem resolução e rota com status de referência documental. **Não transformar esses caminhos em regra de negócio aprovada**. A sintaxe exata de condições, callbacks, efeitos, fallback, transições, prioridades e a fronteira entre `navegacao`/`estados`/`acoes`/`interacoes` ainda exigem definição funcional.\n\n**Aplicação aos módulos:** Jornada consulta as participações; Fluxo consulta/edita relações declaradas; Protótipo executa apenas a simulação explicitada; Banco examina operações e dados sem inferir tabelas/consultas de uma seta visual.","group":"contrato_recuperado","sourceNumber":12},{"id":"sec-0053","title":"Home do Advogado — caso de teste verificado e limites de aprovação","markdown":"Foram inspecionados os três insumos trazidos para esta consolidação: (1) **modelo de contrato sem dados**, (2) **registro estruturado de decisões**, (3) **Home preenchida como demonstração**. O terceiro arquivo mantém a hierarquia do primeiro, permitindo verificar exemplos reais de preenchimento sem promover comportamentos provisórios a regra.\n\n| Verificação | Resultado na Home de exemplo | Interpretação |\n|---|---:|---|\n| Chave raiz | `advogado.home` | ID lógico sem duplicação em `tela.identidade.id` |\n| Blocos internos | `tela` e `componentes` | Separação entre instâncias da tela e definições |\n| Definições externas de componente | 7 | Amostra de modularização e reúso |\n| Referências de instância | 7 | Uma por região montada nessa Home |\n| Itens de composição da tela | 7 | Ordem/parentesco/slot declarados |\n| Jornadas declaradas | 1 participação | Testa classificação contextual |\n| Relações de navegação | 21 | Exemplifica múltiplos destinos e estados |\n| Bifurcações | 2 | Exemplifica escolhas e condições a detalhar |\n| Rotas | 1 | Referência documental, não rota de produção validada |\n\n**[EVIDÊNCIA]** O campo `situacao` da rota é `referencia_documental_nao_homologada`, e vários `condicaoRef` estão `null`. O uso do exemplo deve, portanto, ser **estrutural**, não confirmação de lógica de sessão, permissões/OAB, telas futuras ou endereços de navegação.\n\n**[DIREÇÃO ATUAL]** A Home é boa tela representativa para confirmar composição, estado e menu, mas não é fundamento único para o schema inteiro. Antes de tornar estruturas obrigatórias, testar ao menos: um cadastro em etapas, tela compartilhada em duas jornadas, decisão de fluxo, protótipo com cenários e dados de Banco.","group":"contrato_recuperado","sourceNumber":13},{"id":"sec-0054","title":"Compatibilização entre V4 e decisões recuperadas — sem perder conteúdo","markdown":"Esta tabela registra correções de leitura incorporadas ao documento. São **ajustes de orientação documental**, não migração do código e nem substituição de JSONs do produto.\n\n| Tema | Como poderia ser entendido na V4 | O que o registro consolidado esclarece | Tratamento nesta versão |\n|---|---|---|---|\n| Identidade de tela | `identidade.id` na própria tela | **ID da tela é chave raiz** `<telaId>`; `tela.identidade` contém metadados | Corrigir referências e exemplos |\n| Componentes | Definições e instâncias no mesmo objeto sob `tela` | `tela.componentes` refere instâncias; **`componentes` externo define componentes** | Ajustar texto e exemplo para a macroestrutura recuperada |\n| Dimensões de contrato | Referências históricas a 17 campos | O modelo recuperado tem **16 chaves em `tela`**, sem `politicas` | Registrar inventário como exemplo, sem obrigatoriedade eterna |\n| HTML e CSS | Campos `estrutura` e `estilos` possivelmente redundantes | **`estrutura.html` + `estrutura.css`** devem montar o estático; `estilos` permanece vazio/pendente | Preservar princípio; avaliar eliminação de redundância |\n| Jornada | Submenu dinâmico sem modelo fino | `classificacao.jornadas[]` tem participação identificada, jornada/subjornada e ordens | Detalhar geração dos subitens sem inferência |\n| Navegação | Relações explicadas em nível alto | `rotas`/`relacoes`/`bifurcacoes` existem como **modelo de trabalho**, não formato homologado | Documentar capacidades + pendências |\n| Localização e proveniência | Preferência por documentos/índices externos | Existiam como **blocos reservados e vazios** | Não apagar informação útil nem torná-los obrigatórios sem caso real |\n| Motor | Poderia direcionar forma do JSON | **Ler IDs e relações declaradas, consumir seletivamente** | Mantida a regra: funcionalidade primeiro |\n\n**[PRIORIDADE DE CONSOLIDAÇÃO]** Qualquer divergência entre um exemplo, a intenção funcional e a definição homologada deve aparecer como **pendência**, nunca ser corrigida silenciosamente no JSON de uma tela. Evitar migração de todos os arquivos apenas porque o documento foi enriquecido.","group":"contrato_recuperado","sourceNumber":14},{"id":"sec-0055","title":"Fontes desta consolidação e próximos testes de especificação","markdown":"### Insumos lidos nesta consolidação\n\n1. `advogadoja_documentacao_estruturada (1).json`: registro de **10 seções** das decisões anteriores. É a principal fonte para distinguir *decidido, exemplo e pendente*.\n2. `advogadoja_contrato_completo_modelo_sem_dados (1).json`: macroestrutura vazia de uma tela com `tela` + `componentes`; **não valida conteúdo obrigatório para todas as telas**.\n3. `advogadoja_home_advogado_completa.json`: demonstra a macroestrutura em um único caso, com componentes, composição, classificação e navegação documental.\n4. `documento (2).json`: Direção V4 preservada como base do Workspace, menus, módulos, fichas e processo de homologação; recebe aqui enriquecimento, não substituição.\n\n### O que deve ser validado antes do schema final\n\n- **Telas reais:** decidir quais telas existem, os componentes visuais, estados e conteúdo; confirmar referências de jornada, incluindo usos em mais de uma jornada.\n- **Jornadas:** inserir/retirar/reordenar participações e gerar menus dinâmicos a partir de IDs e ordens do contrato.\n- **Fluxo:** localizar origem/destino/condição de cada relação e distinguir tela, estado, notificação e bifurcação.\n- **Protótipo:** selecionar mock/cenário e verificar transições e variações da **mesma** tela sem criar contratos duplicados.\n- **Banco:** declarar campos lógicos, origem, entidade, operações e pontos de consulta/gravação por tela; não inventar schema de banco.\n- **Composição:** verificar que a árvore HTML/CSS + componentes gera uma tela estática correta e que o CSS de produto não colide com o CSS do Workspace/editor.\n- **Interoperabilidade:** preservar conteúdo não editado e IDs nas importações/exportações; explicitar conflito e alterações no conjunto de trabalho.\n\n**Status após consolidação:** documentação ampliada; **nenhum motor, componente ou JSON de tela foi modificado**. O objetivo permanece definir funcionalidades dos módulos e das telas **antes** de fechar todos os campos e de implementar os motores.","group":"contrato_recuperado","sourceNumber":15},{"id":"sec-0001","title":"Critérios de decisão, escopo e status","markdown":"Esta seção complementa a **Direção do Workspace** (primeiras cinco seções), estabelecendo o modo de tomar decisões sobre telas, JSONs e interfaces. A documentação deve responder **o que queremos construir e usar**, antes de prescrever código.\n\n**Status de afirmação:**\n\n- **[DIREÇÃO DEFINIDA] / [DECIDIDO]**: objetivo e regra afirmados para o produto.\n- **[OBSERVADO]**: evidência de uma versão examinada; não implica que seu formato deva permanecer.\n- **[PROPOSTO]**: detalhamento para análise e homologação.\n- **[PENDENTE]**: decisão ou verificação em aberto.\n- **[HOMOLOGADO]**: revisão aceita, com caso de uso e evidência funcional/visual.\n\n**Critério de precedência:** decisões funcionais e visuais explícitas nesta direção → requisitos confirmados de telas e módulos → dados/IDs existentes que atendam às necessidades → evidências de implementações experimentais. Nenhuma referência antiga, arquivo auxiliar ou motor de teste tem precedência sobre o padrão de chegada.\n\n**Regra:** não migrar ou reestruturar contratos para acomodar uma implementação, enquanto ainda estamos definindo as funcionalidades. Ajustar o documento e registrar pendências primeiro.","group":"parte1","sourceNumber":16},{"id":"sec-0003","title":"Princípios canônicos","markdown":"1. **[DIREÇÃO DEFINIDA] Definir funcionalidades antes do motor.** Uma especificação descreve o resultado esperado, não a forma atual como o código funciona.\n2. **[DECIDIDO] Identidades explícitas e estáveis.** Tela, componente, instância, relação, estado, ação, cenário e participação podem precisar de ID próprio quando forem referenciados ou editados.\n3. **[DECIDIDO] Sem dedução pelo motor.** Classificação, jornada, ordem, destino, condições e efeitos não devem ser inferidos do título, posição visual ou índice do array.\n4. **[DECIDIDO] Contrato de tela suficiente para renderização isolada.** As definições visuais necessárias à tela devem acompanhar seu JSON ou pacote de exportação aprovado; catálogos editoriais podem facilitar reuso sem criar dependências ocultas.\n5. **[PROPOSTO] Reutilização por identidade.** Mesmo componente lógico mantém ID; personalizações e estados variam por instância/ocorrência.\n6. **[DECIDIDO] Uma visualização por finalidade.** Consultar campos e operar o Fluxo são subitens distintos do mesmo módulo. O mesmo se aplica à consulta e ao trabalho em Jornada ou Protótipo.\n7. **[PROPOSTO] Troca explícita de dados.** Exportar/importar ou atualizar o conjunto de contratos carregados deve preservar informações não editadas; nenhuma sincronização oculta é presumida.\n8. **[PROPOSTO] Evolução compatível.** Alterar campos e versões exige caso concreto, validação de referências e registro de impacto; não perpetuar redundância apenas para conservar um formato experimental.\n9. **[DECIDIDO] Separar dados e direção.** Políticas gerais, provenance histórica, estrutura do Workspace, layout do editor e regras de integração são documentados fora do JSON de tela quando não necessários à execução.\n10. **[DECIDIDO] Área principal como prioridade visual.** Navegação global única, controles contextuais e painéis recolhíveis substituem cabeçalhos e sidebars concorrentes quando suas funções forem preservadas.","group":"parte1","sourceNumber":17},{"id":"sec-0004","title":"Domínios atuais de dados — revisão funcional antes do schema final","markdown":"Este é o **inventário de domínios já considerados**, não um congelamento da quantidade ou obrigatoriedade de campos. `identidade` e `classificacao` são referências iniciais fortes. Os demais precisam ser confirmados contra as funcionalidades de telas e módulos.\n\n| Bloco atualmente considerado | Responsabilidade funcional | Decisão de direção |\n|---|---|---|\n| `schema` / `schemaVersion` | Identificar o contrato e a versão de leitura | Manter se necessário à interoperabilidade |\n| `identidade` | Metadados da tela (tipo, namespace, nome e versão); o **ID canônico fica na chave raiz** do contrato modular | Preservar base de identidade explícita |\n| `classificacao` | Público, domínio, jornada/subjornada, contexto e participação | Preservar referências explícitas, sem motor deduzir |\n| `navegacao` | Entradas, saídas, ligações, condições, bifurcações | Necessário para Fluxo/Protótipo quando houver relações |\n| `estados` | Estados da tela e de suas instâncias | Especificar IDs e condições conforme casos reais |\n| `acoes` / `interacoes` | Eventos, ações, efeitos locais e efeitos de navegação | Evitar dupla declaração do mesmo efeito |\n| `dados` | Campos lógicos, origem, vínculo, persistência e operações | Fundamentar módulo Banco e desenho de requisições |\n| `componentes` | Definições reutilizáveis, instâncias e propriedades | Identidade estável; conteúdo para renderizar a tela |\n| `estrutura` / `estilos` | Montagem/HTML e CSS, escopo de apresentação | **Revisar se a separação duplica dados**; manter separação apenas quando tiver função real |\n| `variantes` | Alternativas declaradas de composição/apresentação | Não confundir com estados de execução |\n| `mocks` | Cenários e resultados simulados | Pertinente ao Protótipo, não a registros de produção |\n| `localizacao` | Caminho físico ou lógico | **Preferir índice/derivação**, evitando redundância por tela |\n| `proveniencia` | Histórico de importações, transformações e revisões | **Preferir registro de auditoria externo** |\n| `politicas` | Regras gerais de construção, resolução e validação | **Preferir documento de direção e especificações**, não duplicação em cada JSON |\n\n**[PENDENTE]** Homologar nomes finais, agrupamentos e versão do contrato **depois** de validar telas reais, os subitens de cada módulo e as informações que eles precisam ler ou editar. Se uma informação nunca é consumida nem define comportamento, não deve ser exigida por inércia.\n\n**[NOTA DE MODELO RECUPERADO]** Dentro da família modular apresentada pelos anexos, `tela.identidade` **não contém `id`**: o ID único é a chave externa. Os exemplos `cliente.home` nas tabelas identificam essa chave de raiz, não um campo interno.\n","group":"parte1","sourceNumber":18},{"id":"sec-0005","title":"Padrão de identidade, referência e composição","markdown":"### 5.1 Identidade lógica x ocorrência\n\n| Entidade | Exemplo ilustrativo | Regra |\n|---|---|---|\n| Tela | `cliente.home` | ID canônico único do contrato |\n| Componente | `menu.drawer.padrao` | Mesmo ID lógico entre telas quando for o mesmo componente |\n| Instância do componente | `cliente.home.inst.menu.drawer.principal` | ID único no contexto da tela; aponta para `componenteRef` |\n| Estado da tela | `cliente.home.estado.padrao` | ID persistente; selecionado explicitamente |\n| Estado do componente | `menu.drawer.padrao.estado.aberto` | Não muda o ID do componente |\n| Variante | `menu.drawer.padrao.variante.reduzido` | Alternativa declarada de apresentação/conteúdo |\n| Interação | `cliente.home.interacao.abrir_menu` | Vincula evento, origem e efeito local |\n| Relação de navegação | `cliente.home.relacao.abrir_solicitacoes` | IDs estáveis para editar conexões sem depender da posição da tela |\n| Cenário de mock | `cliente.home.mock.com_solicitacoes` | Referência a cenário de simulação |\n\n*Todos os IDs acima são **ilustrativos**. Não renomear os IDs existentes para coincidir com estes exemplos.*\n\n### 5.2 Componentes reutilizados\n\n**[CONSOLIDADO NO REGISTRO]** O contrato `<telaId> → { tela, componentes }` separa referências de instância em `tela.componentes` e definições em `componentes` externo. A Home de trabalho usa `tela.componentes.instanciasRefs` e `tela.estrutura.html.composicao`; o contrato fino de estados/props por instância continua pendente.\n\n**[PROPOSTO]** Um componente repetido em várias telas mantém: **seu ID de chave no mapa `componentes`**, contrato de propriedades, nomes de estados/variantes e comportamento básico. Podem variar: `props`, conjunto de itens contextuais, estado inicial, visibilidade, slot e ações habilitadas. Se duas definições com mesmo ID divergem materialmente, a auditoria classifica: **equivalente**, **variante legítima**, **versão diferente** ou **conflito a corrigir**.\n\n**[PROPOSTO]** Não usar o índice de um array (`0`, `1`, `2`) como identidade. A ordem é atributo editável, mas o vínculo entre objetos depende de IDs estáveis.\n\n### 5.3 Estado, variante e dados não são sinônimos\n\n- **Estado:** condição atual, como `aberto`, `fechado`, `carregando`, `vazio`, `erro`.\n- **Variante:** configuração alternativa aprovada, como `padrao`, `compacto` ou `reduzido`.\n- **Dados/props:** conteúdo recebido pela instância: itens do menu, rótulos, contagens, textos e permissões visuais declaradas.\n- **Cenário de mock:** valores simulados que selecionam dados e estados para pré-visualização/teste.\n\n**[PROPOSTO]** O conjunto visível de itens pode depender do estado, perfil, variante ou dados; a relação deve ser explícita em condição/configuração declarada. A regra de autorização de fato não é estabelecida pelo menu visual.","group":"parte1","sourceNumber":19},{"id":"sec-0006","title":"Exemplo consistente de reuso do menu em contrato modular","markdown":"**[EXEMPLO DE MODELO DE TRABALHO]** A Home de demonstração usa um **ID de tela na chave raiz**, um mapa de instâncias dentro de `tela` e as definições no mapa `componentes` externo. Esta representação parcial mostra a relação sem criar uma segunda identidade de tela:\n\n```json\n{\n  \"advogado.home\": {\n    \"tela\": {\n      \"identidade\": {\"tipo\": \"tela\", \"namespace\": \"advogado\", \"nome\": \"Home Advogado\", \"versao\": \"1.0.0\"},\n      \"componentes\": {\"instanciasRefs\": {\"screen.drawer\": \"menu.drawer.padrao\"}},\n      \"estrutura\": {\"html\": {\"composicao\": {\n        \"screen.drawer\": {\"componenteRef\": \"menu.drawer.padrao\", \"paiRef\": \"layout.root\", \"slot\": \"menu\", \"ordem\": 40}\n      }}}\n    },\n    \"componentes\": {\n      \"menu.drawer.padrao\": {\n        \"identidade\": {\"tipo\": \"componente\", \"namespace\": \"menu\", \"nome\": \"Menu lateral compartilhado\", \"versao\": \"0.1.0\"},\n        \"estrutura\": {\"html\": {}, \"css\": {}}\n      }\n    }\n  }\n}\n```\n\n**Não é o JSON integral nem uma nova regra para preenchimento automático:** o exemplo foi reduzido para mostrar a separação `tela.componentes` (instâncias) × `componentes` (definições). As chaves `instanciasRefs`, `composicao`, `paiRef` e `slot` representam o **modelo técnico em avaliação**, não uma obrigação de manter exatamente esses nomes. Em outras telas, `menu.drawer.padrao` deve conservar o ID lógico, mas a instância recebe ID próprio e pode ter dados/estado específicos. O contrato completo da tela real continua autocontido para montagem.","group":"parte1","sourceNumber":20},{"id":"sec-0007","title":"Jornadas — função e limites esperados","markdown":"**Objetivo funcional [DECIDIDO pela conversa]:** organizar, selecionar e apresentar as telas de uma jornada/subjornada em uma sequência documental clara, com prévia visual fiel. **Não confundir sequência editorial da Jornada com conexões editáveis do Fluxo.**\n\n**Leitura principal [PROPOSTO]:** `identidade`, `classificacao`, `estrutura`, `componentes`, `estilos`, `estados`/`variantes` pertinentes e as informações de agrupamento/participação necessárias em `navegacao`. O módulo não precisa executar todas as ações de navegação do contrato.\n\n**Interações permitidas na prévia [DECIDIDO pela conversa]:** mudanças **dentro da mesma tela**, como abrir/fechar menu ou acordeão, alternar aba interna, mostrar itens, revelar informações e mudar estado visual local, quando tais comportamentos estiverem declarados.\n\n**Interações não executadas na prévia [DECIDIDO pela conversa]:** sair para outra tela, chamar rotas reais, persistir operações de negócio, realizar pagamentos ou mudar o fluxo real. Um item de menu pode aparecer e responder visualmente, mas seu destino não é acionado na Jornada.\n\n**Edição de dados [PROPOSTO]:** se a Jornada permitir editar ordem, participação, classificação ou atributos de tela, deve modificar o contrato e exportar os dados alterados. Uma prévia que muda visualmente sem atualizar o JSON **não conta como edição do contrato**.\n\n**[PENDENTE]** Especificar e testar as interações internas autorizadas, sem dependência de um bloqueio ou comportamento específico de implementação prévia.","group":"parte1","sourceNumber":21},{"id":"sec-0008","title":"Fluxo — função e limites esperados","markdown":"**Objetivo funcional [DECIDIDO pela conversa]:** mostrar telas e **conexões editáveis entre elas** (incluindo bifurcações, estados e condições). O Fluxo não é apenas uma apresentação linear parecida com Jornada.\n\n**Leitura principal [PROPOSTO]:** prévia visual via `estrutura` + `componentes` + `estilos`, contexto via `identidade`/`classificacao`, e grafo por `navegacao`, `acoes`, `interacoes`, `estados` e `variantes` quando necessário.\n\n**Operações essenciais [PROPOSTO]:** criar, remover e alterar vínculos, origem/destino, condição, bifurcação e prioridade **somente se representáveis pelo contrato aprovado**; preservar IDs de relações estáveis; mostrar ligações válidas/pendentes; exportar o JSON que reflita as mudanças.\n\n**Separação obrigatória:** posição visual de um cartão de tela no editor não é, por padrão, uma relação de navegação. Mover o cartão no canvas não deve reescrever a semântica do grafo, salvo se uma operação específica definir isso.\n\n**Prévia:** a tela aparece para identificação visual e contextualização; isso não obriga a mostrar todo o JSON ao lado nem a transformar o editor numa Jornada.\n\n**Importação/exportação:** ao reconectar `A → B` para `A → C`, atualizar o(s) vínculo(s) identificado(s) dentro do JSON pertinente à tela/participação. Ao importar depois na Jornada, esta continua sendo uma sequência editorial e pode exibir os novos dados compartilhados **sem se converter em um editor gráfico de fluxo**.\n\n**[PENDENTE]** Precisam de decisão específica as representações de condições compostas, múltiplas ocorrências da mesma tela, transições de estados internos e organização multi-JSON de relações; não fixar o formato por influência do `FLUXO/index.html` atual.","group":"parte1","sourceNumber":22},{"id":"sec-0009","title":"Protótipo — evolução posterior","markdown":"**Objetivo funcional [DECIDIDO pela conversa]:** aproveitar **a mesma estrutura visual usada pela Jornada**, acrescentar **as relações e os efeitos de navegação do Fluxo** e incluir **mocks/cenários** para executar interações simuladas.\n\n**Leitura principal [PROPOSTO]:** todos os conjuntos necessários à prévia, navegação e simulação, em especial `estados`, `acoes`, `interacoes`, `dados` e `mocks`.\n\n**Regras [PROPOSTO]:**\n\n- Cenários têm ID estável, dados declarados, seleção de estados e resultados simulados.\n- Mock é uma *simulação* e não deve sobrescrever a definição canônica de produção ou inventar endpoint real.\n- O Protótipo respeita as conexões identificadas e as condições expressas; na ausência de definição, expõe uma pendência ou um resultado simulado claramente identificado.\n- As variantes visuais e o conjunto de componentes permanecem alinhados com a Jornada; divergências devem ser intencionais e rastreáveis.\n\n**[PENDENTE]** O mecanismo de execução de mocks, transições internas e efeitos colaterais ainda pode ser definido ou revisado; o contrato deve guardar requisitos e relações, **não o código de um motor específico**.","group":"parte1","sourceNumber":23},{"id":"sec-0010","title":"Matriz funcional de consumo de dados por módulo","markdown":"Legenda: **P** = leitura principal; **C** = leitura contextual; **—** = normalmente não utilizado. É uma **matriz funcional provisória**, sujeita à definição fina dos módulos.\n\n| Informação | Jornadas | Fluxo | Protótipo | Banco |\n|---|:---:|:---:|:---:|:---:|\n| Identidade / classificação / participação | P | P | P | C |\n| Estrutura visual / componentes / CSS | P | C (prévia) | P | C (referência de campos visuais) |\n| Navegação / relações / condições | C | P | P | C (impacto em operações) |\n| Estados / variantes / interações locais | C | P | P | C |\n| Ações, vínculos e dados lógicos | C | C | P | P |\n| Cenários de mock / simulação | — | — | P | — |\n| Manifesto de navegação / índices derivados | C | C | C | C |\n\n**Campos utilizados** é uma funcionalidade de inspeção dentro de cada módulo, não um módulo externo; exibe **o que aquela funcionalidade realmente consome**. Informações que a ferramenta não edita devem ser preservadas durante uma troca de contrato, se fizerem parte do conjunto canônico aprovado.","group":"parte1","sourceNumber":24},{"id":"sec-0011","title":"Troca de contratos e alterações entre os módulos","markdown":"**Direção:** os módulos trabalham com objetos e identidades comuns. A forma de compartilhar alterações deve ser **explícita e verificável**, sem exigir que o motor preencha lacunas.\n\n1. **Entrada reconhecida:** importar contratos de tela ou pacote válido, com identidade e versão quando aplicável.\n2. **Edição localizada:** cada módulo altera somente as informações sobre as quais o usuário realmente atuou.\n3. **Preservação:** dados não editados continuam íntegros, inclusive CSS e dados de simulação.\n4. **Referências:** duplicidade de ID, destino não resolvido e versão incompatível geram pendências, não correção silenciosa.\n5. **Múltiplas telas:** mudanças relacionadas podem exigir um pacote de contratos; o manifesto ordena/localiza sem tornar-se uma segunda fonte concorrente.\n6. **Sem sincronização externa presumida:** o mesmo conjunto de trabalho no Workspace pode ser consumido por módulos distintos, mas alterações em arquivos ou sessões independentes precisam de transferência/recarga explícita até que se aprove outro mecanismo.\n7. **Padrão de direção antes do protocolo:** definir quais operações precisam atravessar módulos antes de fixar a forma técnica do transporte.\n\n**[PENDENTE]** Escolher se o index gerencia um pacote de trabalho único ou se cada módulo importa/exporta sua parte. Isso deve ser decidido como fluxo funcional de usuário, não em função de uma implementação prévia.","group":"parte1","sourceNumber":25},{"id":"sec-0012","title":"Evolução progressiva de tipos e estruturas","markdown":"**[PROPOSTO] Procedimento para ampliar um campo:**\n\n1. Registrar **qual caso real** exige a ampliação (por exemplo: o menu tem configurações diversas por estado).\n2. Localizar o bloco correto entre os blocos funcionais definidos, sem criar novo domínio por conveniência.\n3. Identificar se o valor atual deve se tornar **array de objetos com ID** ou outro objeto estruturado.\n4. Distinguir **zero, um ou vários** elementos, ordenação, referências, condições e valores de fallback.\n5. Definir a transformação do formato anterior para o novo e a política para consumidores antigos.\n6. Atualizar `schemaVersion` conforme ruptura/compatibilidade; registrar migração, origem e impacto no glossário.\n7. Validar os cenários reais em Jornada, Fluxo e Protótipo por exportação/importação, sem exigir motores refatorados simultaneamente.\n\n**Exemplo semântico:** em vez de uma propriedade `estado: \"aberto\"` incapaz de representar alternativas, evoluir para uma coleção `estados.itens` com `id`, `nome`, `quando` e referências de composição; a seleção fica em `estadoInicialRef` ou referência contextual. **Não duplicar** uma definição completa do menu para cada estado quando a diferença for somente conteúdo ou visibilidade.\n\n**Regra de compatibilidade:** nunca apagar o campo antigo ou reinterpretá-lo sem uma regra de migração registrada. Não declarar compatibilidade apenas porque o JSON continua sintaticamente válido.","group":"parte1","sourceNumber":26},{"id":"sec-0013","title":"Critérios verificáveis por módulo","markdown":"### Jornada\n\n- Organiza telas por classificação e ordem declaradas, sem inferir sequência de conexões.\n- Renderiza tela fielmente de HTML/estrutura + CSS + componentes do JSON.\n- Permite abrir/fechar menu ou outra interação **interna** declarada.\n- Bloqueia navegação **externa** à prévia e operações reais de negócio.\n- Exporta alterações reais feitas no contrato e preserva todos os demais blocos.\n\n### Fluxo\n\n- Mostra cartões de tela e um grafo de relações distintas da sequência da Jornada.\n- Permite mudar conexões sem alterar identidade de tela/componente.\n- Edição de uma relação atualiza o JSON exportado, com IDs e referências coerentes.\n- Não gera automaticamente um destino ou condição faltante.\n- Importar o contrato modificado em outro módulo mantém a edição, sem requerer sincronização em tempo real.\n\n### Protótipo\n\n- Reutiliza a mesma base visual, configurações de estado e variantes.\n- Executa navegação simulada de acordo com as relações explícitas.\n- Aplica mocks por cenário identificado, sem acessar produção por engano.\n- Preserva o contrato ao exportar; não transforma dados simulados em dados reais.\n\n### Verificações transversais\n\n- Mesmo componente lógico em duas telas possui ID coerente; instâncias possuem IDs distintos.\n- Estados e variantes preservam seus IDs e condições.\n- Ciclo importar/exportar não perde campos desconhecidos do módulo.\n- Diferenças de HTML/CSS sob o mesmo ID são detectadas, não mescladas silenciosamente.\n- Campos migrados têm versão e documentação; JSON antigo recebe tratamento explícito.","group":"parte1","sourceNumber":27},{"id":"sec-0014","title":"Pendências a homologar antes de consolidar o schema","markdown":"1. **Estrutura fina de estados e variantes de componentes:** onde morarão seleção inicial, estados por instância, condições e variações de listas. Respeitar primeiro o que já existe em `estados`, `componentes` e `variantes`.\n2. **Modelo de interação local:** distinção concreta entre `alterar_estado_local`, `exibir_overlay`, `substituir_itens` e `navegar`, sem atrelar o formato ao motor de Jornada.\n3. **Pacotes intermodulares:** exportação/importação de uma tela versus conjunto de telas e manifesto derivado.\n4. **Grafo de Fluxo:** transições envolvendo múltiplas ocorrências da mesma tela, estados internos, condições e bifurcações.\n5. **Identidade compartilhada:** estratégia para detectar divergência entre cópias embutidas do mesmo componente, sem exigir dependência de arquivo externo.\n6. **Mocks:** contrato mínimo do cenário, referências a dados, seleção de estados e efeitos simulados.\n7. **Possíveis divergências entre nome físico e identidade interna:** resolver mapeamento `arquivo → chave raiz <telaId>` antes de migrar/renomear.\n8. **Compatibilidade entre formatos de contrato em circulação:** estabelecer transformação sem perda entre os JSONs existentes que usam `identidade.id` interno e o **modelo recuperado** `<telaId> → { tela, componentes }`, caso ambos continuem sendo aceitos.\n\nAté essas decisões serem aprovadas, **não** tornar os exemplos deste documento campos obrigatórios de produção.","group":"parte1","sourceNumber":28},{"id":"sec-0015","title":"Sequência de trabalho — produto primeiro, motor depois","markdown":"**Fase 1 — Direção do Workspace.** Aprovar composição do `index`, menu e padrão de inserção de módulos, com a hierarquia módulo → subitem → item dinâmico e ações contextuais.\n\n**Fase 2 — Finalidades por módulo.** Especificar o que Fluxo, Jornadas, Protótipos, Banco e Contrato/Catálogo precisam **mostrar e permitir fazer** em cada subitem. Produzir imagens e fichas de UX para homologar sem exigir implementação.\n\n**Fase 3 — Telas e relações.** Revisar jornadas reais; incluir, retirar, combinar e alterar telas. Declarar IDs, componentes, estados, ações, participação, conexões e vínculos com dados, sem os deduzir.\n\n**Fase 4 — Revisão do JSON.** Para cada requisito, confirmar onde a informação mora. Preservar o que é necessário, consolidar redundâncias e separar política de documentação.\n\n**Fase 5 — Contratos de módulos e aceitação.** Definir subitens dinâmicos, importação/exportação, relatórios e funcionamento observável; testar integridade de dados e fidelidade visual.\n\n**Fase 6 — Motores.** Só então implementar ou refatorar carregadores, renderizadores, editores e integrações para entregar o fluxo definido.\n\n**Regra:** não autorizar migração massiva nem fixar campos definitivos antes de um conjunto representativo de telas e módulos ter sido homologado.","group":"parte1","sourceNumber":29},{"id":"sec-0016","title":"Decisão-síntese do padrão de chegada","markdown":"> **O index define onde cada funcionalidade aparece; o módulo define o que o usuário consegue fazer; o JSON define os dados e vínculos explícitos necessários; o motor apenas executa a leitura e as operações previstas.**\n>\n> O Workspace usa menu padronizado com módulos e subitens expansíveis. Fluxo tem **Campos utilizados** e **Visualização do fluxo**. Jornadas tem **Campos utilizados** e **Visualização de jornadas**, com jornadas dinâmicas. Protótipos tem **Campos utilizados** e o laboratório interativo, incluindo modos e roteiros. Banco e Contrato/Catálogo terão subitens definidos por suas finalidades reais. Nenhuma ferramenta preserva cabeçalhos/menus redundantes só por serem de uma implementação anterior.\n>\n> A modelagem de telas, classificação, comportamento e bancos deve ser explícita. A estrutura final do JSON e o trabalho dos motores são consequências dessas decisões, não seus determinantes.","group":"parte1","sourceNumber":30},{"id":"sec-0017","title":"Requisitos visuais e funcionais a homologar por área de trabalho","markdown":"**[DIREÇÃO DEFINIDA]** As interfaces são *formas de trabalho diferentes sobre o mesmo conteúdo contratual*. Não padronizar o layout dos módulos; padronizar os dados que os alimentam. As capturas mostram a organização visual pretendida e servem como referências de experiência de uso, sem homologar o código atual.\n\n### 17.1 Jornada: vitrine organizada das telas\n\n- Apresenta uma **sequência de prévias de telas**, horizontal ou em outra disposição definida pelo usuário, agrupadas por **jornada, subjornada e ordem**.\n- Permite **alternar Mobile / Desktop** sem criar outra identidade de tela. Dimensões e responsividade pertencem à composição/estilo/variante, não à identidade.\n- Oferece seleção, filtros e **detalhes**; no painel de detalhes, o usuário pode consultar o JSON integral da tela.\n- Permite **incluir ou reorganizar telas e jornadas**, com IDs e participações explícitas no JSON. A mesma tela pode participar em mais de um contexto sem exigir cópias com novas identidades.\n- A prévia admite **interação interna declarada**: abrir/fechar menu, mostrar itens, alternar aba local, expandir seção, mostrar modal local e selecionar estado visual. **Não navega** para outra tela, não executa produção e não altera o grafo apenas por clicar em um link.\n- Se o usuário editar composição, classificação, ordem ou outra informação do contrato, a exportação contém a alteração; uma mera interação de prévia pode ser temporária e **não** precisar editar o arquivo.\n\n### 17.2 Fluxo: mapa de caminhos, não carrossel de telas\n\n- A interface principal mostra **nós e conexões editáveis**: telas, estados, decisões, bifurcações, notificações e outros elementos formalmente definidos. Um nó de notificação **não deve ser confundido com uma tela**.\n- Suporta adicionar/retirar/reordenar visualmente nós, criar e modificar ligações, saídas condicionais e referências de estado. **A semântica da conexão é gravada no JSON**, enquanto a posição do nó no desenho é uma preocupação de apresentação.\n- Clicar no nó de tela abre **uma prévia visual daquela mesma tela** (como na captura da Splash). Interatividade interna opcional, desde que não execute navegação real; mostrar todo o JSON junto da prévia **não é requisito**.\n- A prévia reutiliza **identidade + composição + componentes + CSS/estilos + estado/variante**, como na Jornada. O Fluxo acrescenta **relações e condições**, não cria uma versão visual independente da tela.\n- As notificações e mudanças de estado vistas no fluxo precisam de **identificadores próprios** e referências explícitas para que o motor futuro não as deduza da posição, do texto de um botão ou do nome do nó.\n\n### 17.3 Protótipo: simulação posterior\n\n- Reutiliza a renderização visual da Jornada e as relações do Fluxo, acrescentando **cenários de mock, dados simulados, sessão simulada, estados derivados e resultados simulados**.\n- O mesmo componente/tela pode ser exercitado sob **múltiplos estados e cenários** com IDs próprios. Não transformar cada cenário numa tela distinta.\n- O comportamento do motor ainda está em avaliação: este documento descreve as capacidades e os vínculos que deverão ser suportados, **não** obriga a manter os dois laboratórios legados do experiência anterior.","group":"parte1","sourceNumber":31},{"id":"sec-0018","title":"Regra de identidade e referências como base comum","markdown":"**[DECIDIDO COMO OBJETIVO]** Todo elemento que possa ser referenciado, reutilizado, conectado, variado, auditado ou alterado em conjunto deve possuir um **ID estável**. O ID identifica o objeto lógico; o nome visível, a posição e a numeração editorial podem mudar sem alterar o ID.\n\n| Entidade | Exigência de identidade | Observação |\n|---|---|---|\n| Tela | Chave raiz `<telaId>` (por exemplo `advogado.home`) | Independente da ocorrência em uma jornada, sem duplicar o ID em `tela.identidade` |\n| Participação da tela na jornada | ID de participação | Referencia tela, jornada, subjornada e ordem |\n| Componente reutilizável | ID lógico do componente | A mesma definição funcional pode aparecer em várias telas |\n| Instância do componente | ID de instância | Identifica a ocorrência em uma tela, com suas props/estado |\n| Estado / variante | IDs distintos | Variantes não substituem a identidade do componente |\n| Evento / interação / ação | IDs identificáveis | Relacionam controle, gatilho e efeito |\n| Nó de fluxo / conexão / decisão / notificação | IDs próprios | Evitam depender do desenho ou da posição na árvore |\n| Cenário, conjunto de dados e referência de mock | IDs próprios | Relacionam sessão, variações e resultados simulados |\n| Campo lógico e alvo persistente | IDs próprios | Permitem a projeção do Banco a partir de várias telas |\n\n**[PROPOSTO]** Separar as referências por escopo: `telaRef`, `componenteRef`, `instanciaRef`, `estadoRef`, `varianteRef`, `acaoRef`, `relacaoRef`, `mockRef`, `campoRef`, `entidadeRef`, sempre que o tipo do objeto puder ser confundido. A grafia exata precisa ser conciliada com os nomes existentes nos blocos em revisão; exemplos aqui **não** homologam novas chaves.\n\n**[PROPOSTO]** Referências internas e entre telas devem ser validadas no pacote. IDs duplicados dentro do mesmo escopo, IDs ausentes, aliases ambíguos e IDs que apontam para definições incompatíveis devem gerar avisos explícitos; nunca consertar por adivinhação.","group":"parte1","sourceNumber":32},{"id":"sec-0019","title":"Mesmo componente em muitas telas: atualização por ID sem sincronização automática","markdown":"### 19.1 Há três operações diferentes\n\n1. **Alteração da instância:** mudar apenas o menu de uma tela (por exemplo, estado aberto, item ativo ou itens contextuais). Preserva `componenteRef` e não modifica outras telas.\n2. **Alteração da definição compartilhada:** mudar a estrutura, o CSS ou uma propriedade-padrão do **mesmo componente lógico**. Deve propagar a nova definição às telas que utilizam esse ID **no conjunto de contratos que o editor tem carregado**, preservando as personalizações de instância.\n3. **Alteração de token/tema:** mudar uma cor ou espaçamento compartilhado com referência explícita, afetando **todos os componentes que usam o mesmo token**. Não confundir token visual com ID de componente. A posição canônica exata dos tokens é pendente de homologação.\n\n### 19.2 Compatibilizar autocontenção com atualização em lote\n\n**[DIREÇÃO DEFINIDA]** Cada arquivo de tela permanece **autocontido para renderização**: sua definição visual necessária viaja junto do JSON da tela. **[REQUISITO AGORA EXPLICITADO]** Ainda assim, o ambiente de edição precisa reconhecer os vários registros que compartilham `componentes[componenteId]` (chave da definição).\n\n**[PROPOSTO] Procedimento de atualização compartilhada:**\n\n1. Selecionar definição por **ID lógico e versão** (não por nome de arquivo ou texto CSS).\n2. Distinguir **alterar só esta instância**, **alterar definição em todas as telas carregadas** e **alterar token visual comum**.\n3. Localizar todas as definições/instâncias referenciadas no pacote; identificar cópias divergentes e versões incompatíveis.\n4. Aplicar a alteração apenas ao escopo confirmado; atualizar os JSONs afetados **ou** produzir pacote de alterações identificadas, mantendo os JSONs autocontidos.\n5. Exportar contratos alterados e um relatório/índice de alterações; outros módulos passam a refletir a mudança **após importar os contratos atualizados**.\n\n**Limite técnico obrigatório:** duas cópias de um componente guardadas em arquivos independentes **não mudam por si só** quando apenas uma é editada. O efeito global por ID é uma **operação explícita do editor sobre o catálogo carregado ou uma aplicação de atualização na importação**, e não sincronização automática da raiz. Essa distinção precisa aparecer na interface para evitar falsas expectativas.\n\n**[ALERTA]** Nome de arquivo, caminho e rótulo visual não são identificadores canônicos. Propagação compartilhada exige conferir os IDs internos antes de qualquer atualização em lote.","group":"parte1","sourceNumber":33},{"id":"sec-0020","title":"Banco: projeção progressiva dos dados declarados em múltiplas telas","markdown":"**[DECIDIDO COMO OBJETIVO FUNCIONAL]** O Banco não é um visualizador isolado de formulário. Ele agrega informações dispersas por várias telas, como Identificação, Contato, Endereço e Segurança de um mesmo cadastro, para revelar **campos lógicos, entidades, possíveis vínculos e operações**.\n\n**[PENDENTE DE MODELAGEM]** A lista concreta de entidades e tabelas só será consolidada depois de identificar os campos, operações e relações reais das telas; o módulo Banco não deve apresentar entidades hipotéticas como definitivas.\n\n**[PROPOSTO] Regras de modelagem:**\n\n- Um input visual tem `id` próprio e pode apontar a um `campoRef` lógico; o campo lógico aponta, se definido, a um `entidadeRef` e a uma definição persistente. **Rótulo de input não determina sozinho coluna SQL.**\n- Duas ou mais telas podem apontar para o **mesmo campo lógico** sem duplicá-lo no modelo consolidado.\n- Os relacionamentos e a cardinalidade das entidades devem estar declarados ou permanecer marcados **pendentes**; reunir telas não autoriza inferir automaticamente chaves estrangeiras, tabelas de autenticação ou regras de retenção.\n- A projeção deve guardar **origem/proveniência**: tela(s), instância(s), campo(s) e status de decisão que fundamentaram cada elemento da representação do Banco.\n- Uma mudança de campo/ID deve permitir análise de impacto: quais telas, componentes, operações e relações são afetados.\n- A ferramenta Banco pode propor agregações e inconsistências, mas não deve reescrever silenciosamente os JSONs nem criar tabelas de produção sem validação.\n\n**Exemplo conceitual, não schema aprovado:** `auth.cadastro.identificacao` declara o campo lógico de nome; `auth.cadastro.contato` declara o e-mail; `auth.cadastro.endereco` declara o endereço. O Banco agrega esses vínculos para examinar se pertencem à mesma entidade e a quais campos persistentes se relacionam. A associação depende de `campoRef` e `entidadeRef`, **não** da proximidade das telas na Jornada.","group":"parte1","sourceNumber":34},{"id":"sec-0021","title":"Interoperabilidade sem duplicar a fonte de dados","markdown":"**[DIREÇÃO DEFINIDA]** Os módulos devem reconhecer identidades e vínculos comuns em uma família de contratos de tela; nenhum módulo se torna autoridade sobre os campos que não edita.\n\n**[PROPOSTO]** Dois níveis de transporte quando necessários: **tela individual** e **pacote de trabalho** com índice derivado. Não existe obrigação de conservar determinado número de campos de primeiro nível: o conjunto final depende da revisão funcional documentada.\n\n**[PROPOSTO]** Uma importação segura valida IDs, versões e referências, exibe diferenças e permite confirmar adição, substituição ou mesclagem por ID. Não elimina, por exemplo, condições do Fluxo após edição visual de uma Jornada ou cenários do Protótipo após inspeção do Banco.\n\n**[PENDENTE]** A experiência do usuário para atualização entre módulos (conjunto compartilhado carregado no Workspace, importação/exportação ou ambas) precisa de definição. A **visibilidade da tela recém-inserida no conjunto atual** é requisito de UX; a persistência/sincronização entre arquivos ou sessões ainda é pendente.","group":"parte1","sourceNumber":35},{"id":"sec-0022","title":"Estados, variantes e mocks: evolução sem duplicar telas","markdown":"**[DECIDIDO COMO OBJETIVO]** Uma mesma Home pode mudar opções do menu, visibilidade de ações e composição conforme condição de usuário/OAB/sessão, **mantendo a mesma identidade da tela e do menu**.\n\n**[PROPOSTO]** Cada estado, variante e cenário deve carregar um ID, referência à entidade à qual se aplica, seleção/restrições e os efeitos que altera (por exemplo, visibilidade dos itens, modo aberto/fechado, item ativo, conteúdo do card, opções disponíveis). Preferir *diferenças declaradas* e dados por instância à duplicação integral do HTML/CSS do componente por estado.\n\n| Dimensão | Exemplo | Regra |\n|---|---|---|\n| Estado local | menu fechado/aberto | Pode ser exercitado na Jornada sem navegar |\n| Estado de negócio simulado | OAB pendente/aprovada | Precisa de referência e regra; não é uma permissão real |\n| Variante visual | menu reduzido/completo | Mesma identidade do componente, variação declarada |\n| Dados de instância | itens do menu, contadores | Podem variar por tela e contexto |\n| Cenário de mock | usuário com OAB pendente | Seleciona dados/estados para simulação posterior |\n| Efeito do Fluxo | clicar em botão leva a tela X sob condição Y | Relação identificada, editável no editor de Fluxo |\n\n**[PENDENTE]** Os detalhes finais do contrato de sessão, transições temporais, precedência entre variantes/estados e sintaxe de condições compostas precisam ser homologados com casos reais, especialmente antes do novo Protótipo.","group":"parte1","sourceNumber":36},{"id":"sec-0023","title":"Testes mínimos de aceitação do padrão (independentes do motor)","markdown":"1. **Troca da prévia:** a mesma tela renderiza em Mobile/Desktop na Jornada e na prévia do Fluxo, com o mesmo ID e sem perdas de com

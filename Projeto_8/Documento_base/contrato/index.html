<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>AdvogadoJá · Contrato JSON Completo e Documentação</title>
<style>
:root{color-scheme:light;--navy:#10233f;--text:#263448;--sub:#62748a;--edge:#dce4ed;--page:#f4f6fa;--gold:#ac7b2e;--focus:#bd8c36}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--text);font:14px/1.52 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header.top{background:var(--navy);color:#fff;padding:19px max(16px,calc((100vw - 1220px)/2))}.top h1{font-size:19px;margin:0;letter-spacing:-.02em}.top p{font-size:12px;color:#cbd8e8;margin:5px 0 0}
main{max-width:1240px;margin:auto;padding:18px 16px 34px}.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
.tab{border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;background:transparent;color:#5e6d7f;font-weight:730;padding:11px 16px;position:relative;top:1px}
.tab:hover{background:#eaf0f7}.tab[aria-selected="true"]{background:#fff;border-color:var(--edge);color:var(--navy);box-shadow:inset 0 3px var(--gold)}
.panel{background:#fff;border:1px solid var(--edge);border-radius:0 12px 12px 12px;box-shadow:0 9px 24px #172b4508;overflow:hidden}.panel[hidden]{display:none}
.frame{display:block;width:100%;height:max(620px,calc(100vh - 180px));border:0;background:#fff}
@media(max-width:650px){.top{padding:16px 13px}.top h1{font-size:16px}main{padding:11px 7px 24px}.tab{flex:1;padding:9px 8px;text-align:center;font-size:11px}.panel{border-radius:0 0 10px 10px}.frame{height:calc(100vh - 160px);min-height:490px}}
</style></head><body>
<header class="top"><h1>AdvogadoJá · Contrato modular completo e documentação</h1><p>Tela + componentes · modelo com explicações · Home do Advogado · documentação estruturada</p></header>
<main><div class="tabs" role="tablist" aria-label="Modelo, exemplo e documentação">
 <button class="tab" role="tab" type="button" id="tab-estrutura" aria-controls="p-estrutura" aria-selected="true" tabindex="0">01 · Modelo explicado</button>
 <button class="tab" role="tab" type="button" id="tab-home" aria-controls="p-home" aria-selected="false" tabindex="-1">02 · Home do Advogado</button>
 <button class="tab" role="tab" type="button" id="tab-doc" aria-controls="p-doc" aria-selected="false" tabindex="-1">03 · Documentação</button>
</div>
<section id="p-estrutura" class="panel" role="tabpanel" aria-labelledby="tab-estrutura"><iframe class="frame" title="Modelo explicado" src="Modelo_explicado/index.html?embed=1" loading="eager"></iframe></section>
<section id="p-home" class="panel" role="tabpanel" aria-labelledby="tab-home" hidden><iframe class="frame" title="Home do Advogado" data-src="Home_do_Advogado/index.html?embed=1" loading="lazy"></iframe></section>
<section id="p-doc" class="panel" role="tabpanel" aria-labelledby="tab-doc" hidden><iframe class="frame" title="Documentação" data-src="Documentacao/index.html?embed=1" loading="lazy"></iframe></section>
</main><script>
'use strict';
const tabs=[...document.querySelectorAll('[role="tab"]')];
const panels=tabs.map(t=>document.getElementById(t.getAttribute('aria-controls')));
function activate(i,focus=false){tabs.forEach((t,j)=>{const active=i===j;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;panels[j].hidden=!active});const f=panels[i].querySelector('iframe');if(!f.src&&f.dataset.src)f.src=f.dataset.src;if(focus)tabs[i].focus()}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>activate(i));t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();activate((i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length,true)}})});
</script></body></html>

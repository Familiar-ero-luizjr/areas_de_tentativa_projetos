name: Atualizar biblioteca V2.1.1 (execução única)
on:
  push:
    branches: [main]
    paths:
      - 'Projeto_9/Bibliotecas/versao2_1/_patch_v211.py'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install --quiet beautifulsoup4
      - name: Reconstruir catálogo e verificar hash
        run: python Projeto_9/Bibliotecas/versao2_1/_patch_v211.py .
      - name: Publicar correção e retirar ferramenta temporária
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/corrigir-versao2_1.yml
          git rm Projeto_9/Bibliotecas/versao2_1/_patch_v211.py
          git add Projeto_9/Bibliotecas/versao2_1/
          git commit -m "fix(Projeto_9): corrigir coleções e templates da versão 2.1.1"
          git push origin HEAD:main

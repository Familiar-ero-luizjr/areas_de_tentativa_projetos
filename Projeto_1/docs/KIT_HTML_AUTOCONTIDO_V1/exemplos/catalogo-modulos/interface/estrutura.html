<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITULO}}</title>
  <style>
{{ESTILOS}}
  </style>
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="heading">
        <div class="eyebrow">HTML AUTOCONTIDO · COMPARTIMENTADO</div>
        <h1 id="appTitle">{{TITULO}}</h1>
        <p id="appDescription">Dados, visual e comportamento organizados. Visualização local sem servidor.</p>
      </div>
      <span class="mode-pill" id="modePill">Offline</span>
    </header>
    <section class="bar" aria-label="Ferramentas de navegação">
      <label class="search-box">
        <span class="sr-only">Pesquisar itens</span>
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Pesquisar título, descrição, palavras-chave ou conteúdo…">
        <button id="clearSearch" type="button" title="Limpar pesquisa" aria-label="Limpar pesquisa">×</button>
      </label>
      <label class="filter-control">Buscar em
        <select id="searchMode">
          <option value="all">Tudo</option>
          <option value="name">Nome / caminho</option>
          <option value="content">Conteúdo</option>
        </select>
      </label>
      <button id="expandAll" class="btn" type="button">Expandir 1 nível</button>
      <button id="collapseAll" class="btn" type="button">Recolher</button>
      <button id="importData" class="btn" type="button">Importar JSON</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
      <button id="exportData" class="btn" type="button">Exportar JSON</button>
    </section>
    <div class="status" id="status" role="status" aria-live="polite">Carregando…</div>
    <div class="columns">
      <main class="items-panel" aria-label="Conteúdo principal">
        <div id="content" class="content"></div>
        <button id="showMore" class="btn btn-more" type="button" hidden>Mostrar mais resultados</button>
      </main>
      <aside class="details" aria-label="Detalhes do item selecionado">
        <div id="detailsContent"><div class="details-empty">Selecione um item para ver detalhes e metadados.</div></div>
      </aside>
    </div>
    <footer class="footer">Fonte JSON canônica com IDs estáveis · Renderização progressiva · Nenhuma dependência externa obrigatória</footer>
  </div>
  <script id="app-data" type="application/json">{{DADOS_JSON}}</script>
  <script>
{{COMPORTAMENTOS}}
  </script>
</body>
</html>

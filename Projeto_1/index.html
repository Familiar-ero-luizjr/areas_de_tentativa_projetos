<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Laboratório funcional Advogado Já e seus artefatos publicados." />
    <title>Projeto 1 — Catálogo HTML</title>
    <style>
      :root { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #172b46; background: #f2f6fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { padding: 2rem max(1.25rem, calc((100vw - 1100px) / 2)); background: #112c4b; color: white; }
      header a { color: #c8dcf7; } h1 { margin: .7rem 0 .45rem; font-size: clamp(1.9rem, 4vw, 3rem); }
      header p { margin: 0; color: #c9d7e8; max-width: 60rem; line-height: 1.55; }
      main { width: min(1100px, 100%); margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
      .tools { display: flex; gap: .8rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1.25rem; }
      input { width: min(30rem, 100%); border: 1px solid #becce0; border-radius: .7rem; padding: .75rem .9rem; font: inherit; }
      #count { color: #52667e; font-size: .92rem; }
      .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .85rem; }
      .item { display: block; padding: 1rem; background: white; border: 1px solid #d6e0ed; border-radius: .8rem; color: inherit; text-decoration: none; box-shadow: 0 2px 12px #152f4a0a; }
      .item:hover, .item:focus-visible { border-color: #3979c5; box-shadow: 0 8px 20px #152f4a1c; outline: 3px solid #9ac4fb; outline-offset: 2px; }
      .name { display: block; font-weight: 750; overflow-wrap: anywhere; }
      .path { display: block; margin-top: .45rem; color: #62758d; font: .76rem/1.45 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
      .empty { color: #66788e; padding: 2rem 0; }
    </style>
  </head>
  <body>
    <header>
      <a href="../">← Todos os projetos</a>
      <h1>Projeto 1</h1>
      <p>Laboratório funcional Advogado Já e seus artefatos publicados. Selecione um arquivo para abri-lo em uma nova aba.</p>
    </header>
    <main>
      <div class="tools">
        <input id="filter" type="search" placeholder="Filtrar por nome ou caminho…" aria-label="Filtrar arquivos HTML" />
        <span id="count"></span>
      </div>
      <section id="list" class="list" aria-label="Arquivos HTML publicados"></section>
      <p id="empty" class="empty" hidden>Nenhum arquivo corresponde ao filtro.</p>
    </main>
    <script>
      const files = ["laboratorio_funcional.html","inventario.html","aplicacoes/index.html","aplicacoes/advogadoja-mock-services/index.html","aplicacoes/advogadoja-mock-services/mock-data/reference-planned-data/index.html","aplicacoes/flutter/docs/ARVORE_LIB_FUNCTIONS.html","aplicacoes/flutter/docs/ARVORE_LIB_HISTORICA.html","aplicacoes/flutter/web/index.html","definicao/index.html","docs/KIT_HTML_AUTOCONTIDO_V1/exemplos/aplicacao-painel/interface/estrutura.html","docs/KIT_HTML_AUTOCONTIDO_V1/exemplos/aplicacao-painel/saida/aplicacao-painel.html","docs/KIT_HTML_AUTOCONTIDO_V1/exemplos/arvore-repositorio/interface/estrutura.html","docs/KIT_HTML_AUTOCONTIDO_V1/exemplos/arvore-repositorio/saida/arvore-repositorio.html","docs/KIT_HTML_AUTOCONTIDO_V1/exemplos/catalogo-modulos/interface/estrutura.html","docs/KIT_HTML_AUTOCONTIDO_V1/exemplos/catalogo-modulos/saida/catalogo-modulos.html","docs/KIT_HTML_AUTOCONTIDO_V1/modelos/projeto_base/interface/estrutura.html","docs/KIT_HTML_AUTOCONTIDO_V1/modelos/projeto_base/saida/exemplo-canonico.html","jornadas/administrador.html","jornadas/advogado_joao.html","jornadas/cliente_maria.html","jornadas/estudante_ana.html","legado/index.html","legado/mapa_aplicacao_homologacao.html","legado/mapa_aplicacao_homologacao_v2.html","legado/mapa_aplicacao_producao.html","legado/modelagem_banco_homologacao.html","legado/modelagem_banco_homologacao_v2.html","legado/modelagem_banco_producao.html","modelos/modelagem_banco_todas_telas.html","orquestracao/index.html","planejamento/index.html","prototipo/index.html","referencias/mapa_aplicacao_todas_jornadas.html"];
      const list = document.querySelector("#list");
      const filter = document.querySelector("#filter");
      const count = document.querySelector("#count");
      const empty = document.querySelector("#empty");
      function label(path) { return path.split("/").pop().replace(/\.html$/i, "").replace(/[_-]+/g, " "); }
      function render() {
        const term = filter.value.trim().toLocaleLowerCase("pt-BR");
        const visible = files.filter((path) => path.toLocaleLowerCase("pt-BR").includes(term));
        list.replaceChildren(...visible.map((path) => {
          const link = document.createElement("a");
          link.className = "item"; link.href = path; link.target = "_blank"; link.rel = "noopener";
          const name = document.createElement("span"); name.className = "name"; name.textContent = label(path);
          const detail = document.createElement("span"); detail.className = "path"; detail.textContent = path;
          link.append(name, detail); return link;
        }));
        count.textContent = `${visible.length} de ${files.length} arquivos`;
        empty.hidden = visible.length !== 0;
      }
      filter.addEventListener("input", render); render();
    </script>
  </body>
</html>

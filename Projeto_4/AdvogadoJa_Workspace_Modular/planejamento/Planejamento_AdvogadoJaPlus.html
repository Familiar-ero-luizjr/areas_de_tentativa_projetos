ollapse:collapse;font-size:12px;line-height:1.5}.doc-table th{text-align:left;background:#e9f3f0;color:#28544f}.doc-table th,.doc-table td{border:1px solid #dbe8e5;padding:10px 12px;vertical-align:top}.doc-table tr:nth-child(even){background:#fafdfc}.doc-diagram{border:1px solid #dce8e6;border-radius:11px;padding:14px;margin:18px 0 24px}.doc-diagram h4{font-size:13px;margin:0 0 12px}.doc-section .diagram-surface{background-color:#fbfdfd}.doc-edit{flex:none}.document-end{padding-top:25px;text-align:center;color:#7e949c;font-size:11px}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brandmark">AJ</span><div><strong>ADVOGADO JÁ <span style="color:#75dcc0">/ WORKSPACE</span></strong><small>Editor visual de planejamento · offline</small></div></div>
    <div class="toolbar"><span class="save-indicator" id="saveState"><span class="dot"></span>Pronto</span><span class="source-indicator">Fonte inicial: <code>planejamento_inicial.json</code></span><button class="btn dark" data-act="reload-initial">↻ JSON inicial</button><button class="btn dark" data-act="import-json">↥ Importar JSON</button><button class="btn dark" data-act="import-md">↥ Importar MD</button><button class="btn dark" data-act="export-md">↧ MD</button><button class="btn primary" data-act="export-json">↧ Exportar JSON</button></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Áreas do editor"><button class="tab active" data-tab="document">▤ Documento completo</button><button class="tab" data-tab="overview">◫ Visão geral</button><button class="tab" data-tab="sections">☷ Seções e blocos</button><button class="tab" data-tab="diagrams">◇ Diagramas</button><button class="tab" data-tab="json">{ } JSON</button></nav>
  <div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main" id="main"></main><aside class="inspector" id="inspector"></aside></div>
</div>
<input id="fileJSON" class="hidden" type="file" accept=".json,application/json">
<input id="fileMD" class="hidden" type="file" accept=".md,.markdown,text/markdown,text/plain">
<div id="modalHost"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const INITIAL_DOCUMENT_URL = './planejamento_inicial.json';
const SCHEMA='advogadoja.plano.visual';
const CURRENT_VERSION=1;
const STORAGE_KEY='aj.plano-visual.v1';
const IDB_NAME='advogadoja-plano-visual';
const BLOCK_NAMES={text:'Texto',list:'Lista',table:'Tabela',quote:'Destaque',code:'Código',diagram:'Diagrama'};
const ICONS={text:'☰',list:'☷',table:'▦',quote:'❝',code:'⌘',diagram:'◇'};
let doc=null,tab='document',selectedSection=null,selectedBlock=null,selectedNode=null,filterText='',saveTimer=null,dragInfo=null,db=null,toastTimer=null;
const $=s=>document.querySelector(s);
const h=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const uid=(prefix='id')=>prefix+'_'+(globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2));
function slug(v){return String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'item';}
function freshId(seed,used){let base=slug(seed),value=base,n=2;while(used.has(value))value=base+'-'+n++;used.add(value);return value;}
function debounceSave(){setSave('Alterações pendentes',true);clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,400);}
function setSave(v,warn=false){$('#saveState').innerHTML='<span class="dot '+(warn?'warn':'')+'"></span>'+h(v);}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200);}
function openDB(){return new Promise(resolve=>{try{if(typeof indexedDB==='undefined'){resolve(null);return}const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('documents');r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null);}catch(e){resolve(null)}});}
function readIDB(){return new Promise(resolve=>{if(!db){resolve(null);return}const t=db.transaction('documents','readonly'),r=t.objectStore('documents').get('active');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null);});}
function putIDB(value){return new Promise(resolve=>{if(!db){resolve(false);return}const t=db.transaction('documents','readwrite');t.objectStore('documents').put(value,'active');t.oncomplete=()=>resolve(true);t.onerror=()=>resolve(false);});}
async function saveNow(){clearTimeout(saveTimer);if(!doc)return;doc.updatedAt=new Date().toISOString();const json=JSON.stringify(doc);let localOk=false;try{localStorage.setItem(STORAGE_KEY,json);localOk=true}catch(e){}const dbOk=await putIDB(doc);setSave(localOk||dbOk?'Salvo neste navegador':'Falha ao salvar',!localOk&&!dbOk);}
function change(){debounceSave();renderTab();}
function sectionDescendants(id){const ids=new Set([id]);let changed=true;while(changed){changed=false;for(const s of doc.sections)if(s.parentId&&ids.has(s.parentId)&&!ids.has(s.id)){ids.add(s.id);changed=true}}return ids;}
function depth(s){let n=0,seen=new Set(),p=s.parentId;while(p&&!seen.has(p)){seen.add(p);n++;p=doc.sections.find(x=>x.id===p)?.parentId;if(n>12)break}return n;}
function getSection(id){return doc.sections.find(x=>x.id===id)}
function getBlock(id){for(const s of doc.sections){const b=s.blocks.find(x=>x.id===id);if(b)return {section:s,block:b}}return null;}
function allDiagrams(){return doc.sections.flatMap(s=>s.blocks.filter(b=>b.type==='diagram').map(block=>({section:s,block})));}
function makeBlock(type){const common={id:uid('bloco'),type};if(type==='text')return {...common,content:''};if(type==='quote')return {...common,content:''};if(type==='list')return {...common,ordered:false,items:['Novo item']};if(type==='table')return {...common,headers:['Campo','Descrição'],rows:[['','']]};if(type==='code')return {...common,language:'text',content:''};if(type==='diagram')return {...common,title:'Novo diagrama',nodes:[{id:uid('no'),title:'Novo bloco',x:75,y:75,kind:'default'}],edges:[]};return {...common,content:''};}

function parseMarkdown(source){const lines=source.replace(/\r\n/g,'\n').split('\n');const result={schema:SCHEMA,version:CURRENT_VERSION,title:'Plano do Workspace — Advogado Já',description:'Documento de planejamento convertido para edição visual.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),sections:[]};let sec={id:'apresentacao',title:'Apresentação',parentId:null,blocks:[]};result.sections.push(sec);const seen=new Set([sec.id]),stack=[];let i=0;

function validateDoc(v){const errors=[];if(!v||typeof v!=='object'||Array.isArray(v))return ['O JSON precisa ser um objeto.'];if(v.schema!==SCHEMA)errors.push('schema incompatível (esperado '+SCHEMA+').');if(v.version!==CURRENT_VERSION)errors.push('versão incompatível.');if(!Array.isArray(v.sections))return [...errors,'sections precisa ser uma lista.'];if(typeof v.title!=='string')errors.push('title precisa ser texto.');const sectionIds=new Set(),blockIds=new Set();for(const s of v.sections){if(!s||typeof s.id!=='string'||typeof s.title!=='string'||!Array.isArray(s.blocks)){errors.push('Seção incompleta: id, title e blocks são necessários.');continue}if(sectionIds.has(s.id))errors.push('ID de seção duplicado: '+s.id);sectionIds.add(s.id);for(const b of s.blocks){if(!b||typeof b.id!=='string'||!BLOCK_NAMES[b.type]){errors.push('Bloco com tipo ou ID inválido em '+s.title);continue}if(blockIds.has(b.id))errors.push('ID de bloco duplicado: '+b.id);blockIds.add(b.id);if(b.type==='list'&&!Array.isArray(b.items))errors.push('Lista inválida: '+b.id);if(b.type==='table'&&(!Array.isArray(b.headers)||!Array.isArray(b.rows)))errors.push('Tabela inválida: '+b.id);if(b.type==='diagram'){if(!Array.isArray(b.nodes)||!Array.isArray(b.edges)){errors.push('Diagrama incompleto: '+b.id);continue}const ns=new Set();for(const n of b.nodes){if(!n||typeof n.id!=='string'||typeof n.title!=='string'||!Number.isFinite(n.x)||!Number.isFinite(n.y))errors.push('Nó inválido no diagrama '+b.id);else if(ns.has(n.id))errors.push('Nó repetido: '+n.id);else ns.add(n.id)}for(const e of b.edges)if(!ns.has(e.from)||!ns.has(e.to))errors.push('Conexão aponta para nó inexistente em '+b.id)}}}for(const s of v.sections){if(s.parentId&&!sectionIds.has(s.parentId))errors.push('Seção pai inexistente em '+s.id);let p=s.parentId,visited=new Set([s.id]);while(p){if(visited.has(p)){errors.push('Hierarquia circular em '+s.id);break}visited.add(p);p=v.sections.find(x=>x.id===p)?.parentId}}return errors;}
function orderedSections(){const out=[],seen=new Set();function visit(pid){for(const s of doc.sections.filter(x=>x.parentId===pid)){if(seen.has(s.id))continue;seen.add(s.id);out.push(s);visit(s.id)}}visit(null);for(const s of doc.sections)if(!seen.has(s.id))out.push(s);return out;}

function readInline(value){
  let content=h(value);
  content=content.replace(/`([^`]+)`/g,'<code>$1</code>');
  content=content.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  content=content.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  content=content.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return content;
}
function readBlock(block){

ss="btn small" data-act="table-row-add" data-id="'+h(b.id)+'">+ Linha</button><button class="btn small" data-act="table-column-add" data-id="'+h(b.id)+'">+ Coluna</button><button class="btn small" data-act="table-column-delete" data-id="'+h(b.id)+'">− Última coluna</button></div>'}else if(b.type==='diagram'){inner='<p class="block-intro">'+h(b.nodes.length)+' nós · '+h(b.edges.length)+' conexões. Edite visualmente no painel de diagramas.</p><div class="inline-tools"><button class="btn primary small" data-act="open-diagram" data-id="'+h(b.id)+'">◇ Editar diagrama</button></div>'}return '<div class="block-card '+(selectedBlock===b.id?'selected':'')+'" data-block="'+h(b.id)+'"><div class="block-head"><div class="left"><span class="tag">'+ICONS[b.type]+' '+BLOCK_NAMES[b.type]+'</span><span class="muted" style="font-size:10px">#'+(i+1)+'</span></div>'+blockButtons(b.id)+'</div>'+inner+'</div>';}
function renderDiagramSurface(b){const surfaceWidth=900,surfaceHeight=430;const map=new Map(b.nodes.map(n=>[n.id,n]));const edgeMarkup=b.edges.map(e=>{const a=map.get(e.from),z=map.get(e.to);if(!a||!z)return '';const x1=Math.max(30,Math.min(surfaceWidth-30,a.x+65)),y1=a.y+27,x2=Math.max(30,Math.min(surfaceWidth-30,z.x+65)),y2=z.y+27;return '<path d="M '+x1+' '+y1+' C '+x1+' '+(y1+y2)/2+', '+x2+' '+(y1+y2)/2+', '+x2+' '+y2+'" fill="none" stroke="#609e9b" stroke-width="2" marker-end="url(#arrow)"></path>'}).join('');return '<div class="diagram-wrap"><div class="diagram-surface" data-diagram="'+h(b.id)+'"><svg width="900" height="430" viewBox="0 0 900 430" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#609e9b" stroke-width="1.4"></path></marker></defs>'+edgeMarkup+'</svg>'+b.nodes.map(n=>'<div class="diagram-node '+(selectedNode===n.id?'active':'')+'" data-node="'+h(n.id)+'" data-kind="'+h(n.kind||'default')+'" style="left:'+Math.max(0,Math.min(770,n.x))+'px;top:'+Math.max(0,Math.min(375,n.y))+'px">'+h(n.title)+'</div>').join('')+'</div></div>';}
function renderDiagrams(){let items=allDiagrams();if(!selectedBlock||!items.some(x=>x.block.id===selectedBlock))selectedBlock=items[0]?.block.id||null;const current=items.find(x=>x.block.id===selectedBlock);$('#main').innerHTML='<div class="page-head"><div><div class="eyebrow">Editor de relações</div><h1>Diagramas</h1><p>Arraste os blocos para reorganizar a arquitetura. Clique em um nó para alterar suas propriedades.</p></div></div>'+(items.length?'<div class="panel"><div class="field"><label>Diagrama ativo</label><select id="diagramPicker">'+items.map((x,i)=>'<option value="'+h(x.block.id)+'" '+(x.block.id===selectedBlock?'selected':'')+'>'+h(x.block.title||'Diagrama '+(i+1))+' — '+h(x.section.title)+'</option>').join('')+'</select></div></div>':'<div class="empty">Ainda não há diagramas. Crie um bloco "Diagrama" em uma seção.</div>');if(!current)return;const b=current.block;$('#main').innerHTML+='<div class="panel"><div class="panel-head"><h2 style="margin:0">'+h(b.title||'Diagrama')+'</h2><span class="pill">'+b.nodes.length+' nós · '+b.edges.length+' relações</span></div><div class="diagram-toolbar" style="margin-top:14px"><button class="btn small primary" data-act="node-add">+ Nó</button><button class="btn small" data-act="edge-add">+ Conexão</button><button class="btn small" data-act="diagram-rename">Renomear</button><button class="btn small" data-act="go-diagram-section">Abrir seção</button><span class="smallhelp">Arraste dentro da área quadriculada</span></div>'+renderDiagramSurface(b)+'</div><div class="panel"><h2>Nós e conexões</h2><div class="diagram-gallery"><div class="row-items">'+b.nodes.map(n=>'<button class="btn small" style="justify-content:flex-start" data-act="node-select" data-id="'+h(n.id)+'">◇ '+h(n.title)+'</button>').join('')+'</div><div class="row-items">'+b.edges.map(e=>'<div class="row-edit"><span class="pill">'+h(b.nodes.find(n=>n.id===e.from)?.title||e.from)+' → '+h(b.nodes.find(n=>n.id===e.to)?.title||e.to)+'</span><button class="btn small" data-act="edge-delete" data-id="'+h(e.id)+'">×</button></div>').join('')+'</div></div></div>';
}
function renderJSON(){$('#main').innerHTML='<div class="page-head"><div><div class="eyebrow">Dados estruturados</div><h1>JSON do planejamento</h1><p>A representação abaixo corresponde ao estado atual do editor.</p></div><div class="page-actions"><button class="btn" data-act="copy-json">Copiar</button><button class="btn primary" data-act="export-json">Exportar JSON</button></div></div><div class="info-strip">A edição recomendada é pelas seções e diagramas. Este JSON é uma visualização de leitura; para substituir o documento, use Importar JSON com validação.</div><pre class="code-preview">'+h(JSON.stringify(doc,null,2))+'</pre>';}
function renderInspector(){let html='<div class="eyebrow">Propriedades</div>';const s=getSection(selectedSection);if(tab==='sections'&&s){html+='<div class="inspector-section"><h3>Seção selecionada</h3><p>'+h(s.title)+'</p><div class="field"><label>Seção pai</label><select id="sectionParent"><option value="">Raiz (principal)</option>'+doc.sections.filter(x=>!sectionDescendants(s.id).has(x.id)).map(x=>'<option value="'+h(x.id)+'" '+(s.parentId===x.id?'selected':'')+'>'+h(x.title)+'</option>').join('')+'</select></div><div class="btn-group"><button class="btn small" data-act="section-up">↑ Subir</button><button class="btn small" data-act="section-down">↓ Descer</button></div><div class="btn-group" style="margin-top:7px"><button class="btn small" data-act="add-child" data-id="'+h(s.id)+'">+ Subseção</button><button class="btn small danger" data-act="section-delete">Excluir</button></div></div><div class="inspector-section"><h4>Sobre a estrutura</h4><p>A posição visual e o parentesco são editáveis. Os IDs continuam estáveis para preservar referências.</p></div>'}else if(tab==='diagrams'){const item=allDiagrams().find(x=>x.block.id===selectedBlock);const b=item?.block,n=b?.nodes.find(x=>x.id===selectedNode);if(b){html+='<div class="inspector-section"><h3>Diagrama selecionado</h3><div class="field"><label>Título</label><input id="diagramTitle" value="'+h(b.title||'')+'"></div></div>';if(n){html+='<div class="inspector-section"><h4>Nó selecionado</h4><div class="field"><label>Nome</label><input id="nodeTitle" value="'+h(n.title)+'"></div><div class="field"><label>Estilo</label><select id="nodeKind"><option value="default" '+((n.kind||'default')==='default'?'selected':'')+'>Padrão</option><option value="source" '+(n.kind==='source'?'selected':'')+'>Fonte / definição</option><option value="output" '+(n.kind==='output'?'selected':'')+'>Projeção / saída</option></select></div><div class="btn-group"><button class="btn small danger" data-act="node-delete">Excluir nó</button></div><p>Excluir um nó também remove as conexões dele.</p></div>'}else html+='<div class="inspector-section"><p>Selecione um nó no diagrama para editar seu nome ou estilo.</p></div>'}if(b)html+='<div class="inspector-section"><h4>Conexões</h4><div class="field"><label>Origem</label><select id="edgeFrom">'+b.nodes.map(x=>'<option value="'+h(x.id)+'">'+h(x.title)+'</option>').join('')+'</select></div><div class="field"><label>Destino</label><select id="edgeTo">'+b.nodes.map(x=>'<option value="'+h(x.id)+'">'+h(x.title)+'</option>').join('')+'</select></div><button class="btn small" data-act="edge-create">+ Criar conexão</button></div>'}else html+='<div class="inspector-section"><h3>Plano estruturado</h3><p>Selecione Seções ou Diagramas para editar atributos. Importação e exportação estão disponíveis no topo.</p></div><div class="inspector-section"><h4>Atalhos</h4><div class="btn-group"><button class="btn small" data-act="go-edit">Seções</button><button class="btn small" data-act="go-diagrams">Diagramas</button></div></div>';$('#inspector').innerHTML=html;}
function setTab(value){tab=value;renderAll();window.scrollTo({top:0,behavior:'smooth'});}
function moveSection(direction){const s=getSection(selectedSection);if(!s)return;const siblings=doc.sections.filter(x=>x.parentId===s.parentId);let i=siblings.indexOf(s),other=siblings[i+direction];if(!other)return;const a=doc.sections.indexOf(s),b=doc.sections.indexOf(other);doc.sections[a]=other;doc.sections[b]=s;change();renderSidebar()}
function modifyBlock(id,fn,repaint=true){const item=getBlock(id);if(!item)return;fn(item.block,item.section);debounceSave();if(repaint)renderTab();}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Arquivo gerado: '+name);}
function fileName(ext){return slug(doc.title)+'_'+new Date().toISOString().slice(0,10)+'.'+ext;}
function exportMarkdown(){let out='# '+doc.title+'\n\n';for(const s of orderedSections()){const level=Math.min(6,2+depth(s));out+='#'.repeat(level)+' '+s.title+'\n\n';for(const b of s.blocks){if(b.type==='text')out+=b.content+'\n\n';else if(b.type==='quote')out+=b.content.split('\n').map(x=>'> '+x).join('\n')+'\n\n';else if(b.type==='list')out+=b.items.map((x,i)=>(b.ordered?(i+1)+'. ':'- ')+x).join('\n')+'\n\n';else if(b.type==='table'){const row=r=>'| '+r.map(x=>String(x).replaceAll('|','\\|')).join(' | ')+' |';out+=row(b.headers)+'\n'+row(b.headers.map(()=>'---'))+'\n'+b.rows.map(row).join('\n')+'\n\n'}else if(b.type==='code'){out+='```'+(b.language||'text')+'\n'+b.content+'\n```\n\n'}else if(b.type==='diagram'){out+='**'+(b.title||'Diagrama')+'**\n\n```mermaid\nflowchart TD\n'+b.nodes.map(n=>'  '+mermaidId(n.id)+'["'+n.title.replaceAll('"',"'")+'"]\n').join('')+b.edges.map(e=>'  '+mermaidId(e.from)+' --> '+mermaidId(e.to)+'\n').join('')+'```\n\n'}}}return out;}
function mermaidId(s){return 'n_'+slug(s).replaceAll('-','_')}
function modal(title,body,accept,acceptLabel='Confirmar',danger=false){return new Promise(resolve=>{const host=$('#modalHost');host.innerHTML='<div class="modal-cover"><div class="modal" role="dialog" aria-modal="true"><h2>'+h(title)+'</h2><p>'+body+'</p><div class="actions"><button class="btn" id="modalCancel">Cancelar</button><button class="btn '+(danger?'danger':'primary')+'" id="modalAccept">'+h(acceptLabel)+'</button></div></div></div>';const end=result=>{host.innerHTML='';resolve(result)};$('#modalCancel').onclick=()=>end(false);$('#modalAccept').onclick=()=>end(true);$('.modal-cover').addEventListener('click',e=>{if(e.target.classList.contains('modal-cover'))end(false)})})}
async function importJSON(file){if(!file)return;let raw;try{raw=JSON.parse(await file.text())}catch(e){toast('JSON inválido: não foi possível ler o arquivo.');return}const errors=validateDoc(raw);if(errors.length){await modal('Importação bloqueada',h(errors.slice(0,7).join(' · ')),null,'Entendi');return}const currentCount=doc.sections.length,newCount=raw.sections.length;const ok=await modal('Substituir o plano atual?', 'O arquivo contém <b>'+newCount+' seções</b> e <b>'+raw.sections.reduce((a,s)=>a+s.blocks.length,0)+' blocos</b>. O documento atual tem <b>'+currentCount+' seções</b>. A importação substituirá a versão em edição. Recomendamos exportar o JSON atual antes de continuar.',null,'Importar e substituir',true);if(!ok)return;doc=raw;selectedSection=doc.sections[0]?.id||null;selectedBlock=null;selectedNode=null;await saveNow();renderAll();toast('JSON importado com sucesso.');}
async function restoreInitialDocument(){const ok=await modal('Restaurar JSON inicial?', 'O arquivo <code>planejamento_inicial.json</code> será relido e substituirá o rascunho que está aberto. Exporte o JSON atual antes se quiser guardá-lo.',null,'Restaurar JSON inicial',true);if(!ok)return;try{doc=await loadInitialDocument();selectedSection=doc.sections.find(s=>s.title.startsWith('3. '))?.id||doc.sections[0]?.id;selectedBlock=null;selectedNode=null;await saveNow();renderAll();toast('JSON inicial restaurado.');}catch(e){toast(e.message);}}
async function importMD(file){if(!file)return;const raw=await file.text(),candidate=parseMarkdown(raw);const ok=await modal('Importar Markdown?', 'Foram identificadas <b>'+candidate.sections.length+' seções</b> e <b>'+candidate.sections.reduce((a,s)=>a+s.blocks.length,0)+' blocos</b>. Esta conversão é estruturada, mas diagramas Markdown complexos podem ser mantidos como código. O documento atual será substituído.',null,'Importar Markdown',true);if(!ok)return;doc=candidate;selectedSection=doc.sections[0]?.id||null;selectedBlock=null;selectedNode=null;await saveNow();renderAll();toast('Markdown convertido para o editor.');}
function currentDiagram(){return allDiagrams().find(x=>x.block.id===selectedBlock)?.block;}
function createEdge(){const b=currentDiagram(),from=$('#edgeFrom')?.value,to=$('#edgeTo')?.value;if(!b||!from||!to){toast('Selecione dois nós.');return}if(from===to){toast('Escolha nós diferentes.');return}if(b.edges.some(x=>x.from===from&&x.to===to)){toast('Essa conexão já existe.');return}b.edges.push({id:uid('aresta'),from,to});change();}
function eventAction(el){const act=el.dataset.act,id=el.dataset.id,section=getSection(selectedSection),blockId=el.dataset.id||selectedBlock;switch(act){
case 'select-section':selectedSection=id;if(tab==='document'){renderSidebar();document.getElementById('doc-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});}else{selectedBlock=null;setTab('sections');}break;
case 'go-edit':case 'expand-sections':setTab('sections');break;case 'go-diagrams':setTab('diagrams');break;case 'go-json':setTab('json');break;
case 'print-document':window.print();break;case 'reload-initial':restoreInitialDocument();break;
case 'import-json':$('#fileJSON').click();break;case 'import-md':$('#fileMD').click();break;
case 'export-json':download(fileName('json'),JSON.stringify(doc,null,2),'application/json;charset=utf-8');break;
case 'export-md':download(fileName('md'),exportMarkdown(),'text/markdown;charset=utf-8');break;
case 'copy-json':navigator.clipboard?.writeText(JSON.stringify(doc,null,2)).then(()=>toast('JSON copiado.')).catch(()=>toast('Copie pelo painel de JSON.'));break;
case 'add-section':{const name=prompt('Título da nova seção:','Nova seção');if(!name?.trim())break;const used=new Set(doc.sections.map(x=>x.id)),s={id:freshId(name,used),title:name.trim(),parentId:null,blocks:[]};doc.sections.push(s);selectedSection=s.id;change();renderSidebar();setTab('sections');break}
case 'add-child':{const name=prompt('Nome da subseção:','Nova subseção');if(!name?.trim())break;const used=new Set(doc.sections.map(x=>x.id)),s={id:freshId(name,used),title:name.trim(),parentId:id,blocks:[]};doc.sections.push(s);selectedSection=s.id;change();renderSidebar();setTab('sections');break}
case 'section-up':moveSection(-1);break;case 'section-down':moveSection(1);break;
case 'section-delete':{if(!section)break;const ids=sectionDescendants(section.id);modal('Excluir seção?', 'A exclusão removerá <b>'+ids.size+' seção(ões)</b> e todos os blocos contidos nelas. Exporte o JSON antes se quiser guardar uma cópia.',null,'Excluir seção',true).then(ok=>{if(!ok)return;doc.sections=doc.sections.filter(s=>!ids.has(s.id));selectedSection=doc.sections[0]?.id||null;change();renderSidebar()});break}
case 'add-block':if(!section)return;section.blocks.push(makeBlock(el.dataset.type));selectedBlock=section.blocks.at(-1).id;change();break;
case 'block-up':case 'block-down':{const found=getBlock(id);if(!found)return;const a=found.section.blocks,index=a.indexOf(found.block),next=index+(act==='block-up'?-1:1);if(next<0||next>=a.length)return;[a[index],a[next]]=[a[next],a[index]];change();break}
case 'block-duplicate':{const found=getBlock(id);if(!found)return;const clone=structuredClone(found.block);clone.id=uid('bloco');if(clone.type==='diagram'){const map=new Map();clone.nodes.forEach(n=>{const newId=uid('no');map.set(n.id,newId);n.id=newId});clone.edges.forEach(e=>{e.id=uid('aresta');e.from=map.get(e.from);e.to=map.get(e.to)})}found.section.blocks.splice(found.section.blocks.indexOf(found.block)+1,0,clone);change();break}
case 'block-delete':{const found=getBlock(id);if(!found)return;modal('Excluir bloco?', 'Este bloco será removido da seção <b>'+h(found.section.title)+'</b>.',null,'Excluir bloco',true).then(ok=>{if(!ok)return;found.section.blocks=found.section.blocks.filter(x=>x.id!==id);change()});break}
case 'item-add':modifyBlock(id,b=>b.items.push('Novo item'));break;
case 'item-delete':modifyBlock(id,b=>b.items.splice(Number(el.dataset.index),1));break;
case 'table-row-add':modifyBlock(id,b=>b.rows.push(b.headers.map(()=>'')));break;
case 'table-row-delete':modifyBlock(id,b=>b.rows.splice(Number(el.dataset.index),1));break;
case 'table-column-add':modifyBlock(id,b=>{b.headers.push('Nova coluna');b.rows.forEach(r=>r.push(''))});break;
case 'table-column-delete':modifyBlock(id,b=>{if(b.headers.length<=1)return;b.headers.pop();b.rows.forEach(r=>r.pop())});break;
case 'open-diagram':selectedBlock=id;selectedNode=null;setTab('diagrams');break;
case 'node-select':selectedNode=id;renderTab();break;
case 'node-add':{const b=currentDiagram();if(!b)return;const node={id:uid('no'),title:'Novo bloco',x:Math.min(700,90+b.nodes.length*55),y:Math.min(360,70+b.nodes.length*40),kind:'default'};b.nodes.push(node);selectedNode=node.id;change();break}
case 'node-delete':{const b=currentDiagram();if(!b||!selectedNode)return;b.nodes=b.nodes.filter(x=>x.id!==selectedNode);b.edges=b.edges.filter(e=>e.from!==selectedNode&&e.to!==selectedNode);selectedNode=null;change();break}
case 'edge-add':case 'edge-create':createEdge();break;
case 'edge-delete':{const b=currentDiagram();if(!b)return;b.edges=b.edges.filter(x=>x.id!==id);change();break}
case 'diagram-rename':{const b=currentDiagram();if(!b)return;const name=prompt('Título do diagrama:',b.title||'Diagrama');if(!name?.trim())return;b.title=name.trim();change();break}
case 'go-diagram-section':{const s=allDiagrams().find(x=>x.block.id===selectedBlock)?.section;if(s){selectedSection=s.id;setTab('sections')}break}
default:break}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){e.preventDefault();eventAction(el)}const t=e.target.closest('[data-tab]');if(t){e.preventDefault();setTab(t.dataset.tab)}});
document.addEventListener('input',e=>{const el=e.target,id=el.dataset.id;if(el.id==='searchSections'){filterText=el.value;const focusPos=el.selectionStart;renderSidebar();const search=$('#searchSections');search.focus();search.setSelectionRange(focusPos,focusPos);return}if(el.dataset.field==='section-title'){const s=getSection(id);if(s){s.title=el.value;debounceSave();renderSidebar();renderInspector()}return}if(el.dataset.blockField){modifyBlock(id,b=>b[el.dataset.blockField]=el.dataset.blockField==='ordered'?el.value==='true':el.value,false);return}if(el.dataset.itemIndex!==undefined){modifyBlock(id,b=>b.items[Number(el.dataset.itemIndex)]=el.value,false);return}if(el.dataset.tableHeader!==undefined){modifyBlock(id,b=>b.headers[Number(el.dataset.tableHeader)]=el.value,false);return}if(el.dataset.tableRow!==undefined){modifyBlock(id,b=>{const r=b.rows[Number(el.dataset.tableRow)];r[Number(el.dataset.tableCol)]=el.value},false);return}if(el.id==='diagramTitle'){const b=currentDiagram();if(b){b.title=el.value;debounceSave()}return}if(el.id==='nodeTitle'){const n=currentDiagram()?.nodes.find(x=>x.id===selectedNode);if(n){n.title=el.value;debounceSave();const node=$('[data-node="'+CSS.escape(n.id)+'"]');if(node)node.textContent=el.value}return}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='sectionParent'){const s=getSection(selectedSection);if(!s)return;const next=el.value||null;if(next&&sectionDescendants(s.id).has(next)){toast('Não é possível criar hierarquia circular.');return}s.parentId=next;change();renderSidebar()}if(el.id==='diagramPicker'){selectedBlock=el.value;selectedNode=null;renderTab()}if(el.id==='nodeKind'){const n=currentDiagram()?.nodes.find(x=>x.id===selectedNode);if(n){n.kind=el.value;change()}}if(el.dataset.blockField==='ordered')renderTab()});
function beginDrag(e){const node=e.target.closest('.diagram-node');if(!node||tab!=='diagrams')return;const b=currentDiagram(),n=b?.nodes.find(x=>x.id===node.dataset.node);if(!n)return;selectedNode=n.id;dragInfo={nodeId:n.id,startX:e.clientX,startY:e.clientY,originalX:n.x,originalY:n.y,pointerId:e.pointerId,el:node};node.setPointerCapture(e.pointerId);document.querySelectorAll('.diagram-node').forEach(x=>x.classList.toggle('active',x.dataset.node===n.id));renderInspector();}
document.addEventListener('pointerdown',beginDrag);
document.addEventListener('pointermove',e=>{if(!dragInfo||dragInfo.pointerId!==e.pointerId)return;const b=currentDiagram(),n=b?.nodes.find(x=>x.id===dragInfo.nodeId);if(!n)return;n.x=Math.max(0,Math.min(770,Math.round(dragInfo.originalX+e.clientX-dragInfo.startX)));n.y=Math.max(0,Math.min(375,Math.round(dragInfo.originalY+e.clientY-dragInfo.startY)));dragInfo.el.style.left=n.x+'px';dragInfo.el.style.top=n.y+'px';const svg=$('.diagram-surface svg');if(svg){const temp=document.createElement('div');temp.innerHTML=renderDiagramSurface(b);const newSvg=temp.querySelector('svg');if(newSvg)svg.innerHTML=newSvg.innerHTML}});
document.addEventListener('pointerup',e=>{if(!dragInfo||dragInfo.pointerId!==e.pointerId)return;dragInfo=null;debounceSave()});
$('#fileJSON').addEventListener('change',async e=>{await importJSON(e.target.files[0]);e.target.value=''});
$('#fileMD').addEventListener('change',async e=>{await importMD(e.target.files[0]);e.target.value=''});
window.addEventListener('pagehide',()=>{if(doc){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(doc))}catch(e){}}});
init();
</script>

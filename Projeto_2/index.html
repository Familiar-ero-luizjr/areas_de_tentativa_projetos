function crumbs(parts){return `<nav class="crumbs" aria-label="Caminho de navegação">${parts.map((p,i)=>i===parts.length-1?`<strong>${esc(p.name)}</strong>`:`<button data-open-type="${esc(p.type)}" data-id="${esc(p.id)}">${esc(p.name)}</button><span>›</span>`).join('')}</nav>`}
function trailFor(type,key){const list=[{type:'home',id:'',name:'Organizador de Vida'}];if(type==='module'||type==='central')return list.concat({type,id:key,name:displayName(type,key)});const page=type==='page'?get('page',key):get('page',get('feature',key)?.pageId);if(page){const m=page.moduleId?get('module',page.moduleId):get('central',page.centralContextId);if(m)list.push({type:page.moduleId?'module':'central',id:m.id,name:m.name});list.push({type:'page',id:page.id,name:page.name});}if(type==='feature'){const f=get('feature',key);if(f)upChain(f).forEach(a=>list.push({type:'feature',id:a.id,name:a.name}))}return list;}
function menu(type,key){const thing=get(type,key),protectedItem=thing?.protected===true;return `<details class="menu"><summary aria-label="Mais ações para ${esc(thing?.name||'item')}">⋯</summary><div class="menu-content">${!protectedItem?`<button data-action="edit" data-type="${type}" data-id="${key}">✎ Editar</button>`:`<button data-action="edit" data-type="${type}" data-id="${key}">✎ Editar descrição</button>`}${['page','feature'].includes(type)?`<button data-action="duplicate" data-type="${type}" data-id="${key}">⧉ Duplicar</button><button data-action="move" data-type="${type}" data-id="${key}">↗ Mover</button>`:''}${['page','feature'].includes(type)?`<button data-action="reorder" data-direction="up" data-type="${type}" data-id="${key}">↑ Subir</button><button data-action="reorder" data-direction="down" data-type="${type}" data-id="${key}">↓ Descer</button>`:''}${!protectedItem?`<button data-action="archive" data-type="${type}" data-id="${key}">${thing?.archived?'↩ Desarquivar':'▤ Arquivar'}</button><button class="danger-text" data-action="delete" data-type="${type}" data-id="${key}">✕ Remover</button>`:''}</div></details>`}
function listItem(type,obj,desc=null){const children=type==='page'?countFeatures(obj.id):type==='feature'?data.features.filter(f=>f.parentFeatureId===obj.id).length:0;return `<article class="item"><div class="item-icon">${type==='module'?esc(obj.icon||'◈'):ico(type)}</div><div class="item-main"><div class="item-title">${esc(obj.name)}</div><div class="item-description">${esc(short(desc??obj.description??'',155))}</div><div class="item-meta">${badge(obj.decisionStatus)}${obj.specStatus?badge(obj.specStatus,true):''}${obj.pageKind?`<span class="pill">${esc(obj.pageKind==='specialized'?'Especializada':obj.pageKind==='universal'?'Universal':obj.pageKind)}</span>`:''}${obj.archived?`<span class="pill archived">Arquivado</span>`:''}${children?`<span class="pill">${children} ${type==='page'?'funções':'subfunções'}</span>`:''}</div></div><div class="item-actions"><button class="btn small" data-open-type="${type}" data-id="${esc(obj.id)}">Abrir →</button>${menu(type,obj.id)}</div></article>`}
function empty(title,body,action=''){return `<div class="empty"><div style="font-size:30px">◎</div><strong>${esc(title)}</strong><p>${esc(body)}</p>${action}</div>`}
function renderHome(){const groups=[{name:'Painéis Gerais',type:'central',values:data.centralContexts,desc:'Consolidação transversal, sem criar um módulo de vida.'},{name:'Módulos de Vida',type:'module',values:data.modules.filter(x=>x.kind==='life'),desc:'Alimentação e Financeiro são fixos; os demais usam lógica extensível.'},{name:'Módulos Personalizados',type:'module',values:data.modules.filter(x=>x.kind==='custom'),desc:'Estruturas configuráveis criadas no catálogo.',action:button('new-module','＋ Novo módulo')},{name:'Áreas Técnicas',type:'module',values:data.modules.filter(x=>x.kind==='technical'),desc:'Apoio estrutural, separado das áreas da vida.'}];return header('Mapa do produto','Escolha uma área. Cada clique aprofunda um nível: módulo, página, funcionalidade e especificação.',button('show-tree','◫ Árvore completa','',''))+`<div class="info-banner">Você está criando o <b>catálogo das funcionalidades</b> — não as telas finais. Exemplos em levantamento são explicitamente identificados e não devem ser considerados implementados.</div>`+groups.map(g=>`<section class="group-block"><div class="group-title"><div><h2>${g.name}</h2><div class="muted small">${g.desc}</div></div>${g.action||''}</div>${g.values.length?`<div class="cards">${g.values.map(m=>`<article class="tile"><div class="tile-top"><div class="tile-emoji">${esc(m.icon||'◈')}</div><span class="pill">${countPages(m.id)} pág.</span></div><h3>${esc(m.name)}</h3><p>${esc(short(m.description||'Páginas a inventariar.',120))}</p><div class="tile-bottom"><span>${m.implementationMode==='fixed'?'Fixo':m.implementationMode==='extensible'?'Extensível':m.kind==='central'?'Transversal':m.kind==='technical'?'Técnico':'Personalizado'}</span><button class="btn small" data-open-type="${g.type}" data-id="${m.id}">Abrir →</button></div></article>`).join('')}</div>`:empty('Nenhum módulo personalizado','Crie apenas quando precisar documentar outra área do produto.',button('new-module','＋ Novo módulo'))}</section>`).join('')}
function modulePages(moduleId){return data.pages.filter(p=>p.moduleId===moduleId||p.centralContextId===moduleId).sort((a,b)=>(a.order||0)-(b.order||0))}
function renderModule(type,key){const m=get(type,key);if(!m)return renderNotFound();const pages=modulePages(key);const desc=m.description||'Não há descrição cadastrada';let actions=button('new-page','＋ Página',`data-parent-type="${type}" data-parent-id="${key}"`,'primary')+button('edit','✎ Editar',`data-type="${type}" data-id="${key}"`);return crumbs(trailFor(type,key))+header((m.icon||'◈')+' '+m.name,desc,actions)+`<div class="kv-grid" style="margin-bottom:20px"><div class="metric"><strong>${pages.length}</strong><span>Páginas inventariadas</span></div><div class="metric"><strong>${pages.reduce((n,p)=>n+countFeatures(p.id),0)}</strong><span>Funcionalidades catalogadas</span></div><div class="metric"><strong>${pages.filter(p=>p.decisionStatus==='defined').length}</strong><span>Páginas definidas</span></div></div><section class="panel"><div class="panel-header"><div><h2>Páginas deste contexto</h2><div class="small muted">Abra uma página para consultar apenas suas funcionalidades.</div></div></div><div class="panel-body"><div class="list">${pages.length?pages.map(p=>listItem('page',p)).join(''):empty('Páginas ainda não inventariadas','Este contexto existe, mas suas páginas específicas precisam de levantamento.',button('new-page','＋ Adicionar página',`data-parent-type="${type}" data-parent-id="${key}"`))}</div></div></section>${m.kind==='life'&&m.id==='mod_profissional'?`<div class="info-banner"><b>Taxonomia oficial:</b> este módulo permite somente as 19 subcategorias profissionais aprovadas. <button class="small-link" data-action="show-prof-categories">Ver lista</button></div>`:''}${m.implementationMode==='fixed'?`<div class="info-banner">Este módulo tem identificação técnica <b>fixa</b> na arquitetura planejada. O catálogo permite especificá-lo, mas protege sua identidade oficial.</div>`:''}`}
function renderPage(key){const p=get('page',key);if(!p)return renderNotFound();const features=allPageFeatures(p.id);const actions=button('new-feature','＋ Funcionalidade',`data-page-id="${p.id}"`,'primary')+button('edit','✎ Editar página',`data-type="page" data-id="${key}"`);let tmpl=(p.templateRefs||[]).map(t=>get('template',t)).filter(Boolean);return crumbs(trailFor('page',key))+header('▣ '+p.name,p.description,actions)+`<div class="split"><div><section class="panel"><div class="panel-header"><div><h2>Funcionalidades</h2><div class="small muted">${countFeatures(p.id)} capacidades catalogadas, incluindo subfuncionalidades.</div></div></div><div class="panel-body"><div class="list">${features.length?features.map(f=>listItem('feature',f)).join(''):empty('Ainda sem funcionalidades','Cadastre capacidades que esta página precisa oferecer.',button('new-feature','＋ Criar funcionalidade',`data-page-id="${p.id}"`))}</div></div></section>${tmpl.length?`<section class="panel"><div class="panel-header"><h3>Herdado da Biblioteca Universal</h3></div><div class="panel-body"><div class="info-banner">O conteúdo abaixo é definido na biblioteca central. Mudanças locais devem ser registradas como especializações, sem copiar as funções herdadas.</div>${tmpl.map(t=>`<div class="fact"><div class="row"><b>${esc(t.name)}</b><span class="pill">v${esc(t.version||1)}</span><button class="small-link" data-open-type="template" data-id="${t.id}">Ver modelo ↗</button></div><ul>${(t.capabilities||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`).join('')}</div></section>`:''}<details class="details"><summary>Especificações próprias desta página</summary><div class="details-content">${pageSpecFields.map(([k,label])=>`<div class="spec-section"><h3>${esc(label)}</h3>${specValue(p.specification?.[k])}</div>`).join('')}<div class="row">${button('edit','✎ Editar especificação',`data-type="page" data-id="${key}"`,'small')}</div></div></details></div><aside><section class="panel"><div class="panel-header"><h3>Sobre a página</h3></div><div class="panel-body">${fact('Estado da decisão',badge(p.decisionStatus))}${fact('Especificação',badge(p.specStatus,true))}${fact('Tipo',esc(p.pageKind||'Não classificada'))}${fact('Rota no app final',esc(p.route?.value||'Não definida')+' · '+esc(p.route?.status||'a validar'))}${fact('Origem',esc(p.source?.reference||p.source?.kind||'Não informada'))}${fact('Observações',esc(p.notes||'Nenhuma'))}</div></section>${relationSidebar(p.id)}</aside></div>`}
function fact(label,value){return `<div class="fact"><div class="fact-label">${esc(label)}</div><div class="fact-value">${value||'—'}</div></div>`}
function relationSidebar(key){const rs=data.relations.filter(r=>r.fromId===key||r.toId===key);return `<section class="panel"><div class="panel-header"><h3>Vínculos (${rs.length})</h3>${button('new-relation','＋',`data-from-id="${key}"`,'small')}</div><div class="panel-body">${rs.length?rs.map(r=>{const other=r.fromId===key?r.toId:r.fromId;return `<div class="fact"><div class="fact-label">${esc(r.fromId===key?relationTypes[r.type]||r.type:'É destino de: '+(relationTypes[r.type]||r.type))}</div><button class="small-link" data-action="open-any" data-id="${other}">${esc(identify(other)?.item?.name||other)} ↗</button></div>`}).join(''):'<p class="small muted">Nenhuma relação cadastrada.</p>'}</div></section>`}
function specValue(val){return Array.isArray(val)?val.length?`<ul>${val.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<span class="muted">Ainda não documentado.</span>':val?`<p>${simpleText(val)}</p>`:'<span class="muted">Ainda não documentado.</span>'}
function renderFeature(key){const f=get('feature',key);if(!f)return renderNotFound();const children=allPageFeatures(f.pageId,f.id);const spec=f.specification||{};const parent=parentForFeature(f);const act=button('new-feature','＋ Subfuncionalidade',`data-page-id="${f.pageId}" data-parent-id="${f.id}"`,'primary')+button('edit','✎ Editar',`data-type="feature" data-id="${key}"`)+button('move','↗ Mover',`data-type="feature" data-id="${key}"`);const tabs=[['overview','Visão geral'],['detail','Especificação detalhada'],['relations','Dependências']];let content='';if(state.sub==='detail'){content=`<section class="panel"><div class="panel-header"><h2>Especificação do comportamento</h2>${button('edit','✎ Completar',`data-type="feature" data-id="${key}"`,'small')}</div><div class="panel-body">${specFields.map(([name,label])=>`<div class="spec-section"><h3>${esc(label)}</h3>${specValue(spec[name])}</div>`).join('')}</div></section>`}else if(state.sub==='relations'){content=relationsFor(key,true)}else{content=`<div class="split"><div><section class="panel"><div class="panel-header"><h2>Subfuncionalidades</h2></div><div class="panel-body"><div class="list">${children.length?children.map(c=>listItem('feature',c)).join(''):empty('Não há subfuncionalidades','Isso pode estar correto: a profundidade é opcional e não deve ser artificial.',button('new-feature','＋ Adicionar subfuncionalidade',`data-page-id="${f.pageId}" data-parent-id="${f.id}"`))}</div></div></section><section class="panel"><div class="panel-header"><h2>Resultado esperado</h2>${button('edit','✎ Editar especificação',`data-type="feature" data-id="${key}"`,'small')}</div><div class="panel-body">${fact('Objetivo',simpleText(spec.purpose||f.description||'Ainda não documentado'))}${fact('Entradas',specValue(spec.inputs))}${fact('Saídas',specValue(spec.outputs))}${fact('Questões abertas',specValue(spec.openQuestions))}</div></section></div><aside><section class="panel"><div class="panel-header"><h3>Identificação</h3></div><div class="panel-body">${fact('Estado da decisão',badge(f.decisionStatus))}${fact('Completude',badge(f.specStatus,true))}${fact('Identificador',esc(f.id))}${f.categoryId?fact('Subcategoria',esc(get('category',f.categoryId)?.name||'Inexistente')):''}${fact('Origem',esc(f.source?.reference||f.source?.kind||'Não informada'))}</div></section>${relationSidebar(key)}</aside></div>`}return crumbs(trailFor('feature',key))+header('⚙ '+f.name,f.description||spec.purpose,act)+`<div class="info-banner">Esta é uma <b>definição funcional</b> de ${esc(parent?.name||'página')}. Não significa que uma tela separada será criada no aplicativo final.</div><nav class="subnav" aria-label="Detalhamento da funcionalidade">${tabs.map(([k,t])=>`<button class="${state.sub===k?'active':''}" data-action="feature-tab" data-sub="${k}">${t}</button>`).join('')}</nav>`+content}
function relationsFor(key=null,compact=false){let rel=data.relations.filter(r=>!key||r.fromId===key||r.toId===key);return `<section class="panel"><div class="panel-header"><div><h2>${compact?'Relacionamentos deste item':'Relações documentadas'}</h2><div class="muted small">Hierarquia de páginas e dependências são conceitos independentes.</div></div>${button('new-relation','＋ Relacionamento',key?`data-from-id="${key}"`:'','primary')}</div><div class="panel-body">${!key?`<div class="toolbar"><input id="relation-filter" class="field" style="max-width:300px" placeholder="Buscar origem, destino ou motivo" value="${esc(state.relFilter||'')}"><select class="select" id="relation-type-filter"><option value="">Todos os tipos</option>${Object.entries(relationTypes).map(([v,t])=>`<option value="${v}" ${state.relType===v?'selected':''}>${t}</option>`).join('')}</select></div>`:''}<div class="node-map">${rel.filter(r=>(!state.relType||key||r.type===state.relType)&&(!state.relFilter||key||[r.reason,identify(r.fromId)?.item?.name,identify(r.toId)?.item?.name].join(' ').toLowerCase().includes(state.relFilter.toLowerCase()))).map(r=>`<article class="relation-line"><div class="relation-text"><button class="inline-link" data-action="open-any" data-id="${r.fromId}">${esc(identify(r.fromId)?.item?.name||r.fromId)}</button><span class="relation-arrow"> — ${esc(relationTypes[r.type]||r.type)} → </span><button class="inline-link" data-action="open-any" data-id="${r.toId}">${esc(identify(r.toId)?.item?.name||r.toId)}</button><div class="muted small">${esc(r.reason||'Sem justificativa')} · ${esc(decisionLabels[r.decisionStatus]||'A validar')}</div></div>${button('edit-relation','Editar',`data-id="${r.id}"`,'small')}${button('delete-relation','✕',`data-id="${r.id}"`,'small danger')}</article>`).join('')||empty('Nenhuma relação encontrada','Crie uma ligação entre dois itens usando IDs estáveis.')}</div></div></section>`}
function renderRelations(){return header('Relacionamentos','Consulte e edite ligações entre quaisquer itens, inclusive de diferentes módulos.',button('new-relation','＋ Nova relação','','primary'))+`<div class="info-banner">Exemplo: <b>Cardápio → depende de → Receitas</b>. Este vínculo não transforma Receitas em uma subpágina de Cardápio.</div>`+relationsFor()}
function renderLibrary(){if(state.kind==='template'){const t=get('template',state.id);if(!t)return renderNotFound();const users=data.pages.filter(p=>(p.templateRefs||[]).includes(t.id));return header('◆ '+t.name,t.description,button('edit','✎ Editar modelo',`data-type="template" data-id="${t.id}"`,'primary'))+`<div class="info-banner">Capacidades compartilhadas são definidas aqui. As páginas consumidoras devem apenas <b>referenciar</b> este contrato e registrar suas especializações.</div><div class="split"><section class="panel"><div class="panel-header"><h2>Capacidades do modelo</h2><span class="pill">v${esc(t.version||1)}</span></div><div class="panel-body">${(t.capabilities||[]).length?`<div class="list">${t.capabilities.map((c,i)=>`<div class="item"><div class="item-icon">${i+1}</div><div class="item-main"><strong>${esc(c)}</strong></div></div>`).join('')}</div>`:empty('Contrato a detalhar','Adicione as capacidades reutilizáveis na edição do modelo.')}</div></section><aside><section class="panel"><div class="panel-header"><h3>Páginas que reutilizam</h3></div><div class="panel-body">${users.length?users.map(p=>`<div class="fact"><button class="small-link" data-open-type="page" data-id="${p.id}">${esc(p.name)} ↗</button></div>`).join(''):empty('Sem consumidores','Vincule este modelo à página adequada.')}</div></section></aside></div>`}return header('Biblioteca Universal','Contratos compartilhados de Dashboard, Painel de Atividades e Metas, sem replicar implementações.',button('new-template','＋ Modelo universal','','primary'))+`<div class="cards">${data.templates.map(t=>`<article class="tile"><div class="tile-top"><div class="tile-emoji">◆</div><span class="pill">v${esc(t.version||1)}</span></div><h3>${esc(t.name)}</h3><p>${esc(t.description||'Contrato em especificação')}</p><div class="tile-bottom"><span>${data.pages.filter(p=>(p.templateRefs||[]).includes(t.id)).length} consumidores</span><button class="btn small" data-open-type="template" data-id="${t.id}">Abrir →</button></div></article>`).join('')}</div>`}
function renderData(){const tabs=[['entities','Entidades e dados'],['categories','Subcategorias'],['json','JSON e backups'],['audit','Auditoria'],['document','Documento de referência']];let nav=`<nav class="subnav">${tabs.map(([key,label])=>`<button data-action="data-tab" data-sub="${key}" class="${state.dataTab===key?'active':''}">${label}</button>`).join('')}</nav>`;let content='';if(state.dataTab==='entities'){const e=state.kind==='entity'?get('entity',state.id):null;content=e?`<div class="row" style="margin-bottom:15px">${button('all-entities','← Entidades')}${button('edit','✎ Editar',`data-type="entity" data-id="${e.id}"`,'primary')}</div><section class="panel"><div class="panel-header"><h2>${esc(e.name)}</h2></div><div class="panel-body"><p>${esc(e.description||'Não definido')}</p>${e.fields?.length?`<div class="list">${e.fields.map(f=>`<div class="item"><div class="item-main"><strong>${esc(f.name)}</strong><p class="muted small">${esc(f.type)} · ${esc(f.required?'Obrigatório':'Opcional')} ${esc(f.description||'')}</p></div></div>`).join('')}</div>`:empty('Campos ainda não especificados','Reveja os contratos de dados.')}<p class="footnote">${esc(e.source?.reference||'Campos a confirmar em levantamento')}</p></div></section>`:`<div class="row" style="margin-bottom:12px"><span class="muted small">Entidades representam dados, não necessariamente páginas.</span><span class="spacer"></span>${button('new-entity','＋ Entidade','','primary')}</div><div class="list">${data.entities.map(e=>listItem('entity',e)).join('')||empty('Nenhuma entidade','Adicione um contrato de dados.')}</div>`}else if(state.dataTab==='categories'){const prof=data.categories.filter(c=>c.moduleId==='mod_profissional');content=`<div class="info-banner">A lista oficial do <b>Profissional</b> contém exatamente <b>19 subcategorias</b>. Elas são classificações de registros e não obrigam a criar 19 páginas.</div><section class="panel"><div class="panel-header"><h2>Profissional — taxonomia aprovada</h2><span class="pill defined">Lista protegida</span></div><div class="panel-body"><div class="cards">${prof.map(c=>`<div class="fact"><div class="row"><span>${esc(c.icon)}</span><b>${esc(c.name)}</b></div></div>`).join('')}</div></div></section><section class="panel"><div class="panel-header"><h2>Outras taxonomias</h2>${button('new-category','＋ Subcategoria','','small')}</div><div class="panel-body">${data.categories.filter(c=>c.moduleId!=='mod_profissional').map(c=>listItem('category',c)).join('')||'<p class="muted small">Ainda não inventariadas. Não são inventadas automaticamente.</p>'}</div></section>`}else if(state.dataTab==='json'){content=`<div class="split"><section class="panel"><div class="panel-header"><h2>Exportação e restauração</h2></div><div class="panel-body"><p class="muted small">O arquivo JSON integral inclui todas as coleções, relações, versões e estados — independentemente da tela atual.</p><div class="row" style="margin:16px 0">${button('export','↓ Exportar catálogo completo','','primary')}${button('import','↑ Importar JSON')}${button('export-module','↓ Exportar módulo')}</div><div class="warn-banner"><b>Importação:</b> só substitui o catálogo depois de prévia, validação e confirmação. A cópia anterior fica disponível em backup local, se o navegador permitir.</div><div class="row">${button('restore-backup','↶ Restaurar backup')}${button('reset','Restaurar exemplo inicial','','danger')}</div><p class="small muted" style="margin-top:12px">Não existe sincronização em nuvem nesta versão local. Salvar neste navegador não substitui exportar uma cópia.</p></div></section><aside><section class="panel"><div class="panel-header"><h3>Estrutura do arquivo</h3></div><div class="panel-body"><pre class="code-preview">schemaVersion\nproduct\nmetadata\nmodules[]\ncentralContexts[]\npages[]\nfeatures[]\ntemplates[]\nentities[]\ncategories[]\nrelations[]\ndecisions[]</pre></div></section></aside></div>`}else if(state.dataTab==='audit'){let check=validate(data),all=data.pages.concat(data.features),defined=all.filter(x=>x.decisionStatus==='defined').length,review=all.filter(x=>x.decisionStatus==='in-review'||x.decisionStatus==='proposed').length;content=`<div class="kv-grid" style="margin-bottom:18px"><div class="metric"><strong>${data.modules.length}</strong><span>Módulos cadastrados</span></div><div class="metric"><strong>${data.pages.length}</strong><span>Páginas</span></div><div class="metric"><strong>${data.features.length}</strong><span>Funções e subfunções</span></div><div class="metric"><strong>${data.relations.length}</strong><span>Relações</span></div><div class="metric"><strong>${defined}</strong><span>Itens definidos</span></div><div class="metric"><strong>${review}</strong><span>Em revisão / propostas</span></div></div><section class="panel"><div class="panel-header"><h2>Integridade estrutural</h2><span class="pill ${check.errors.length?'proposed':'defined'}">${check.errors.length} erros</span></div><div class="panel-body">${check.errors.length?`<ul>${check.errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<div class="info-banner">IDs, pais, referências e escopos obrigatórios passaram pela validação estrutural.</div>`}${check.warnings.length?`<h3>Avisos e pendências</h3><ul>${check.warnings.slice(0,45).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted small">Sem avisos de integridade.</p>'}<div class="row">${button('export-audit','↓ Exportar relatório')}</div></div></section>`}else if(state.dataTab==='document'){content=`<div class="split"><div class="panel"><div class="panel-header"><h2>Especificação Mestre — texto integral</h2></div><div class="panel-body source-doc" id="source-doc">${$('#source-content').innerHTML}</div></div><aside><section class="panel"><div class="panel-header"><h3>Navegação no documento</h3></div><div class="panel-body document-toc">${$('#source-toc').innerHTML}</div></section></aside></div>`}return header('Dados e Controle','Entidades, taxonomias, integridade referencial, docum function renderTree(){const group=data.modules.concat(data.centralContexts);function featureTree(pageId,parent=null){const set=allPageFeatures(pageId,parent);return set.length?`<div class="tree-depth">${set.map(f=>`<details class="tree-node"><summary><button data-open-type="feature" data-id="${f.id}">⚙ ${esc(f.name)}</button></summary>${featureTree(pageId,f.id)}</details>`).join('')}</div>`:''}return header('Árvore completa de auditoria','Uma visualização opcional para pesquisa e conferência; não substitui o fluxo por níveis.',button('back-home','← Voltar ao catálogo'))+`<section class="panel"><div class="panel-body">${group.map(m=>{const type=m.kind==='central'?'central':'module';return `<details class="details"><summary>${esc(m.icon||'◈')} <button class="small-link" data-open-type="${type}" data-id="${m.id}">${esc(m.name)}</button> · ${countPages(m.id)} páginas</summary><div class="details-content tree-depth">${modulePages(m.id).map(p=>`<details class="tree-node"><summary><button data-open-type="page" data-id="${p.id}">▣ ${esc(p.name)}</button></summary>${featureTree(p.id)}</details>`).join('')||'<span class="muted small">A levantar</span>'}</div></details>`}).join('')}</div></section>`}

let confirmCallback=null;
function confirmBox(title,body,callback,label='Confirmar',style='primary'){confirmCallback=callback;dialogOpen(title,body,`<button class="btn" data-action="dialog-close">Cancelar</button><button class="btn ${style}" data-action="confirm">${esc(label)}</button>`)}
function moveItem(type,key){const item=get(type,key);if(!item)return;let targets=[];if(type==='page'){targets=data.modules.map(m=>[m.id,'Módulo: '+m.name]).concat(data.centralContexts.map(m=>[m.id,'Geral: '+m.name]));}else if(type==='feature'){const childIds=new Set(subtreeIds(type,key));targets=data.pages.map(p=>['page:'+p.id,'Página: '+p.name+' — '+(get('module',p.moduleId)?.name||get('central',p.centralContextId)?.name||'')]);targets.push(...data.features.filter(f=>!childIds.has(f.id)).map(f=>['feature:'+f.id,'Subfunção de: '+f.name+' — '+(get('page',f.pageId)?.name||'')]))}else{return}const body=`<p class="small muted">Os IDs permanecem estáveis. Os vínculos externos serão preservados quando compatíveis.</p><form id="move-form" data-type="${type}" data-id="${key}">${selectField('destination','Novo destino',targets,targets[0]?.[0]||'',true)}<div class="warn-banner">Mover uma funcionalidade para outro módulo pode ser bloqueado caso sua classificação pertença à taxonomia de origem. Corrija a classificação antes de mover.</div></form>`;dialogOpen('Mover: '+item.name,body,`<button class="btn" data-action="dialog-close">Cancelar</button><button class="btn primary" type="submit" form="move-form">Mover item</button>`)}
function saveMove(form){const type=form.dataset.type,item=get(type,form.dataset.id),dst=(new FormData(form)).get('destination');if(!item||!dst)return;let ok;if(type==='page'){const dest=get('module',dst)||get('central',dst);if(!dest)return;const isMod=!!get('module',dst);ok=mutation(()=>{item.moduleId=isMod?dst:null;item.centralContextId=isMod?null:dst;item.parentId=null;item.order=modulePages(dst).length*10+10;for(const f of data.features.filter(f=>f.pageId===item.id)){if(f.categoryId){const cat=get('category',f.categoryId);if(cat?.moduleId!==(isMod?dst:null))throw Error('Existem subcategorias incompatíveis. Remapeie-as antes de mover.')}}},'Página movida');}else{const [kind,destId]=String(dst).split(':');const par=kind==='page'?get('page',destId):get('feature',destId);const newPage=kind==='page'?par:get('page',par?.pageId);if(!par||!newPage)return;const sub=[item.id,...childFeatureIds(item.id)];if(sub.includes(destId)){toast('Não é possível mover para um descendente.');return}const previous=get('page',item.pageId);ok=mutation(()=>{for(const fid of sub){const f=get('feature',fid);if(f.categoryId&&get('category',f.categoryId)?.moduleId!==newPage.moduleId)throw Error('Subcategoria do módulo de origem incompatível: '+f.name);f.pageId=newPage.id}item.parentFeatureId=kind==='feature'?destId:null;item.order=allPageFeatures(newPage.id,item.parentFeatureId).length*10+10},'Funcionalidade movida');}if(ok){dialogClose();open(type,item.id)}}
function reorder(type,key,direction){const item=get(type,key);if(!item)return;const peers=(type==='page'?data.pages.filter(p=>(p.moduleId||p.centralContextId)===(item.moduleId||item.centralContextId)&&p.parentId===item.parentId):data.features.filter(f=>f.pageId===item.pageId&&(f.parentFeatureId||null)===(item.parentFeatureId||null))).sort((a,b)=>(a.order||0)-(b.order||0));const index=peers.findIndex(x=>x.id===key),other=peers[index+(direction==='up'?-1:1)];if(!other){toast('Este item já está no limite desta lista.');return}mutation(()=>{let a=item.order||((index+1)*10),b=other.order||((index+(direction==='up'?0:2))*10);item.order=b;other.order=a},'Ordem alterada')}
function duplicate(type,key){const item=get(type,key);if(!item)return;let target=null;let copyName=item.name+' (cópia)';const ok=mutation(()=>{const map=new Map();if(type==='page'){const all=data.features.filter(f=>f.pageId===key).map(clone);target={...clone(item),id:id('page'),name:copyName,order:(item.order||0)+1,decisionStatus:'proposed',source:{kind:'proposal',reference:'Duplicada de '+key}};data.pages.push(target);map.set(key,target.id);for(const f of all)map.set(f.id,id('feature'));for(const f of all){const newF={...f,id:map.get(f.id),pageId:target.id,parentFeatureId:f.parentFeatureId?map.get(f.parentFeatureId):null,source:{kind:'proposal',reference:'Cópia de '+f.id}};data.features.push(newF)}}else{const keys=[key,...childFeatureIds(key)];const all=keys.map(k=>clone(get('feature',k)));for(const f of all)map.set(f.id,id('feature'));for(const f of all){const newF={...f,id:map.get(f.id),name:f.id===key?copyName:f.name,parentFeatureId:map.get(f.parentFeatureId)||f.parentFeatureId,decisionStatus:'proposed',source:{kind:'proposal',reference:'Cópia de '+f.id}};if(f.id===key)target=newF;data.features.push(newF)}}// Copiar somente vínculos inteiramente internos da subárvore duplicada.
for(const r of [...data.relations])if(map.has(r.fromId)&&map.has(r.toId))data.relations.push({...r,id:id('relation'),fromId:map.get(r.fromId),toId:map.get(r.toId),decisionStatus:'proposed'})},'Item duplicado com novos IDs');if(ok&&target)open(type,target.id)}
function download(name,content,type='application/json'){const blob=new Blob([content],{type:type+';charset=utf-8'}),link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function exportAll(){let snap=clone(data);snap.metadata={...snap.metadata,exportedAt:new Date().toISOString(),scope:'full'};const stamp=new Date().toISOString().slice(0,10);download(`organizador-de-vida_catalogo_${stamp}.json`,JSON.stringify(snap,null,2));toast('Exportado o catálogo completo.')}
function exportModule(){const current=state.kind==='module'?state.id:'mod_alimentacao';let options=data.modules.map(x=>[x.id,x.name]);dialogOpen('Exportar recorte de módulo',`<div class="warn-banner"><b>Exportação parcial:</b> o arquivo é para revisão/compartilhamento, <b>não</b> equivale a backup completo e não deve substituir o catálogo principal.</div><form id="partial-form">${selectField('moduleId','Escolha o módulo',options,current,true)}</form>`,`<button class="btn" data-action="dialog-close">Cancelar</button><button class="btn primary" type="submit" form="partial-form">Exportar recorte</button>`)}
function doExportModule(form){const mid=new FormData(form).get('moduleId'),mod=get('module',mid);if(!mod)return;const pages=data.pages.filter(p=>p.moduleId===mid),features=data.features.filter(f=>pages.some(p=>p.id===f.pageId)),categories=data.categories.filter(c=>c.moduleId===mid),usedTemplates=data.templates.filter(t=>pages.some(p=>(p.templateRefs||[]).includes(t.id)));const set=new Set([...pages,...features,...categories,...usedTemplates,mod].map(x=>x.id));const relations=data.relations.filter(r=>set.has(r.fromId)&&set.has(r.toId));const output={schemaVersion:data.schemaVersion,metadata:{scope:'module',moduleId:mid,exportedAt:new Date().toISOString(),note:'Recorte somente para leitura e revisão; não é backup completo.'},product:data.product,modules:[mod],pages,features,categories,templates:usedTemplates,relations,centralContexts:[],entities:[],decisions:[]};download('organizador-de-vida_modulo_'+mid+'.json',JSON.stringify(output,null,2));dialogClose();toast('Recorte de módulo exportado.')}
async function importFile(file){if(!file)return;let parsed;try{parsed=JSON.parse(await file.text())}catch(e){dialogOpen('Importação rejeitada',`<div class="warn-banner">Não foi possível ler um JSON válido. ${esc(e.message)}</div>`,button('dialog-close','Fechar'));return}const res=validate(parsed);if(parsed?.metadata?.scope==='module')res.errors.unshift('Exportações parciais não podem substituir o catálogo completo.');if(parsed?.metadata?.scope&&parsed.metadata.scope!=='full'&&parsed.metadata.scope!=='module')res.warnings.push('Escopo do arquivo não declarado como integral.');const counts=(col)=>`${(parsed[col]||[]).length} / ${data[col].length}`;const body=`<p>Confira o arquivo <b>${esc(file.name)}</b> antes de confirmar a substituição do catálogo atual.</p><div class="kv-grid">${[['Módulos','modules'],['Páginas','pages'],['Funções','features'],['Relações','relations']].map(([n,k])=>`<div class="metric"><strong>${esc((parsed[k]||[]).length)}</strong><span>${n} no arquivo (atual: ${data[k].length})</span></div>`).join('')}</div>${res.errors.length?`<div class="warn-banner"><b>${res.errors.length} erro(s) bloqueante(s):</b><ul>${res.errors.slice(0,24).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:`<div class="info-banner">Estrutura e referências validadas. Uma cópia do estado atual será guardada localmente antes da substituição, se disponível.</div>`}${res.warnings.length?`<details class="details"><summary>${res.warnings.length} pendências/avisos no conteúdo</summary><div class="details-content"><ul>${res.warnings.slice(0,25).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div></details>`:''}`;confirmCallback=()=>{const before=clone(data);let backupOK=true;try{localStorage.setItem(BACKUP,JSON.stringify({...before,metadata:{...before.metadata,backupAt:new Date().toISOString()}}))}catch(e){backupOK=false}if(!backupOK){download('organizador-de-vida_backup_antes_importacao.json',JSON.stringify(before,null,2));}undoStack.push(before);data=parsed;data.metadata={...(data.metadata||{}),importedAt:new Date().toISOString(),scope:'full'};doSave();dialogClose();state.search='';$('#global-search').value='';change('catalog','home');toast(backupOK?'Catálogo importado; backup anterior guardado.':'Catálogo importado; backup anterior exportado em arquivo. Exporte seu trabalho ao concluir.')};dialogOpen('Prévia de importação',body,`<button class="btn" data-action="dialog-close">Cancelar</button>${res.errors.length?'':`<button class="btn primary" data-action="confirm">Confirmar substituição</button>`}`)}
function restoreBackup(){let text;try{text=localStorage.getItem(BACKUP)}catch(e){}if(!text){toast('Não existe backup de importação neste navegador.');return}let copy;try{copy=JSON.parse(text)}catch(e){toast('Backup inválido.');return}const res=validate(copy);if(res.errors.length){toast('Backup rejeitado: '+res.errors[0]);return}confirmBox('Restaurar backup','<p>Substituir o catálogo atual pela cópia local salva antes da última importação?</p><div class="warn-banner">Exporte o estado atual antes de restaurar, se quiser mantê-lo.</div>',()=>{const old=clone(data);mutation(()=>{data=copy},'Backup restaurado');try{localStorage.setItem(BACKUP,JSON.stringify(old))}catch(e){}dialogClose();change('catalog','home')},'Restaurar')}
function undo(){if(!undoStack.length)return;data=undoStack.pop();doSave();render();toast('Última alteração desfeita')}
function auditExport(){const v=validate(data);const report={generatedAt:new Date().toISOString(),counts:{modules:data.modules.length,pages:data.pages.length,features:data.features.length,relations:data.relations.length},errors:v.errors,warnings:v.warnings};download('organizador-de-vida_pendencias.json',JSON.stringify(report,null,2));toast('Relatório exportado.')}
function resetExample(){confirmBox('Restaurar catálogo inicial','<div class="warn-banner">Esta ação substituirá todas as alterações neste navegador pelos exemplos iniciais. Exporte um backup manual antes de continuar.</div>',()=>{mutation(()=>{data=clone(initial)},'Base inicial restaurada');dialogClose();change('catalog','home')},'Restaurar exemplos','danger')}
function newCategory(){const modList=data.modules.filter(m=>m.id!=='mod_profissional');if(!modList.length)return;openEditor('category',null,{})}
// Todos os cliques são delegados para funcionar após renderizações parciais.
document.addEventListener('click',event=>{const nav=event.target.closest('[data-area]');if(nav){state.search='';$('#global-search').value='';state.dataTab='entities';change(nav.dataset.area);return}const link=event.target.closest('[data-open-type]');if(link){if(link.dataset.openType==='home')change('catalog','home');else open(link.dataset.openType,link.dataset.id);return}const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,type=el.dataset.type,key=el.dataset.id;switch(action){case'dialog-close':dialogClose();break;case'confirm':if(confirmCallback){const f=confirmCallback;confirmCallback=null;f()}break;case'new-module':openEditor('module');break;case'new-page':openEditor('page',null,{parentType:el.dataset.parentType||state.kind,parentId:el.dataset.parentId||state.id});break;case'new-feature':openEditor('feature',null,{pageId:el.dataset.pageId,featureParent:el.dataset.parentId||null});break;case'new-template':openEditor('template');break;case'new-entity':openEditor('entity');break;case'new-category':newCategory();break;case'edit':openEditor(type,key);break;case'edit-relation':newRelation(key);break;case'new-relation':newRelation(null,el.dataset.fromId||null);break;case'delete-relation':{const r=get('relation',key);if(r)confirmBox('Remover relacionamento',`Excluir vínculo entre ${esc(identify(r.fromId)?.item?.name||r.fromId)} e ${esc(identify(r.toId)?.item?.name||r.toId)}?`,()=>{mutation(()=>data.relations=data.relations.filter(x=>x.id!==key),'Vínculo removido');dialogClose()},'Remover vínculo','danger');break}case'edit-module':openEditor('module',key);break;case'delete':removeItem(type,key);break;case'move':moveItem(type,key);break;case'reorder':reorder(type,key,el.dataset.direction);break;case'archive':mutation(()=>{const obj=get(type,key);obj.archived=!obj.archived},'Estado de arquivamento atualizado');break;case'duplicate':duplicate(type,key);break;case'feature-tab':state.sub=el.dataset.sub;render();break;case'data-tab':state.dataTab=el.dataset.sub;state.kind='home';state.id=null;render();break;case'all-entities':state.dataTab='entities';state.kind='home';state.id=null;render();break;case'show-prof-categories':state.dataTab='categories';change('data');break;case'show-tree':change('catalog','tree');break;case'back-home':change('catalog','home');break;case'open-any':{const identified=identify(key);if(identified)open(identified.type,key);else toast('Referência não localizada');break}case'export':exportAll();break;case'import':$('#json-input').click();break;case'export-module':exportModule();break;case'restore-backup':restoreBackup();break;case'reset':resetExample();break;case'undo':undo();break;case'export-audit':auditExport();break;case'help':dialogOpen('Como usar o catálogo',`<p>1. Comece no <b>Catálogo</b> e abra um módulo.<br>2. Selecione uma página para ver suas funções.<br>3. Abra uma função para registrar requisitos, subfunções e dependências.<br>4. Use <b>Biblioteca Universal</b> para contratos comuns.<br>5. Em <b>Dados e Controle</b>, revise pendências e exporte um backup JSON.</p><div class="info-banner">Itens propostos ou em levantamento são exemplos para validação. O catálogo documenta o aplicativo, mas não é o próprio aplicativo final.</div>`,button('dialog-close','Entendi'));break;}}
);
document.addEventListener('submit',event=>{const form=event.target;if(!['record-form','relation-form','move-form','partial-form'].includes(form.id))return;event.preventDefault();if(form.id==='record-form')submitRecord(form);else if(form.id==='relation-form')saveRelation(form);else if(form.id==='move-form')saveMove(form);else if(form.id==='partial-form')doExportModule(form)});
$('#json-input').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(file)await importFile(file)});
$('#global-search').addEventListener('input',e=>{state.search=e.target.value;state.area='catalog';state.kind='home';render()});
document.addEventListener('input',e=>{if(e.target.id==='relation-filter'){state.relFilter=e.target.value;const pos=e.target.selectionStart;render();let x=$('#relation-filter');x?.focus();x?.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='relation-type-filter'){state.relType=e.target.value;render()}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))dialogClose()});
render();
})();
</script>
</body></html>

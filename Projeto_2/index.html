<blockquote>
<p><strong>Tipo de documento:</strong> requisitos de produto, organização de informação e especificação do HTML de catalogação funcional.<br/>
<strong>Produto:</strong> Organizador de Vida.<br/>
<strong>Versão do documento:</strong> 1.0 — base para implementação e refinamento.<br/>
<strong>Situação:</strong> proposta de arquitetura do catálogo consolidada a partir das definições desta conversa; <strong>não</strong> representa inventário exaustivo e validado de todas as funcionalidades do aplicativo.<br/>
<strong>Objetivo imediato:</strong> construir um HTML autocontido, editável e navegável que permita descobrir, organizar, especificar e relacionar tudo o que o Organizador de Vida deve fazer, antes de produzir as telas finais em outra aplicação de design.</p>
</blockquote>
<hr/>
<h2 id="sec-1-visao-executiva-1">1. Visão executiva</h2>
<p>O produto a construir <strong>agora</strong> não é o aplicativo final Organizador de Vida: é o <strong>Catálogo Funcional Mestre</strong>, uma ferramenta para documentar a definição funcional do aplicativo.</p>
<p>Sua finalidade é responder, de maneira rastreável:</p>
<ol>
<li><strong>Quais módulos existem?</strong></li>
<li><strong>Quais páginas pertencem a cada módulo?</strong></li>
<li><strong>Quais funcionalidades pertencem a cada página?</strong></li>
<li><strong>Quais subfuncionalidades, comportamentos, campos, regras e estados pertencem a cada funcionalidade?</strong></li>
<li><strong>De quais páginas, funcionalidades e dados cada item depende?</strong></li>
<li><strong>Quais comportamentos são compartilhados entre módulos e quais são especializados?</strong></li>
<li><strong>O que já foi confirmado, o que está em levantamento e o que é apenas uma proposta?</strong></li>
<li><strong>O que falta especificar para ser possível implementar a aplicação com segurança?</strong></li>
<li><strong>Como exportar todo esse conhecimento em um JSON íntegro, legível e reutilizável?</strong></li>
</ol>
<h3 id="sec-decisao-principal-2">Decisão principal</h3>
<p>A interface deve seguir <strong>navegação progressiva por profundidade</strong>:</p>
<p><strong>Catálogo do produto → Módulo → Página → Funcionalidade → Subfuncionalidade → Especificação.</strong></p>
<p>Cada nível dá acesso ao próximo <strong>sem exibir toda a hierarquia de uma vez</strong>. Os relacionamentos são registrados à parte, associados por IDs estáveis, e podem atravessar módulos e níveis diferentes.</p>
<h3 id="sec-o-que-este-documento-especifica-3">O que este documento especifica</h3>
<ul>
<li>Arquitetura de informação, terminologia e distinções entre conceitos.</li>
<li>Navegação, comportamento visual e princípios de experiência de uso.</li>
<li>Cadastro, edição, duplicação, ordenação, movimentação e exclusão.</li>
<li>Profundidade de especificação funcional.</li>
<li>Modelos universais e especializações por módulo.</li>
<li>Relações, dependências e contratos de dados.</li>
<li>Estrutura canônica do JSON, importação, exportação e versionamento.</li>
<li>Critérios de qualidade, testes e plano de implantação da ferramenta.</li>
<li>Exemplos, sobretudo Alimentação, Metas e Profissional.</li>
</ul>
<h3 id="sec-o-que-este-documento-nao-pretende-fazer-4">O que este documento NÃO pretende fazer</h3>
<ul>
<li>Definir o design final de cada tela do aplicativo de produção.</li>
<li>Afirmar que exemplos ilustrativos já são funcionalidades aprovadas.</li>
<li>Decidir backend, banco, autenticação e infraestrutura final do aplicativo.</li>
<li>Confundir o <strong>editor de catálogo</strong> com o aplicativo que será criado a partir dele.</li>
<li>Inventar requisitos de módulos ainda não levantados.</li>
</ul>
<hr/>
<h2 id="sec-2-problema-que-o-novo-html-precisa-resolver-5">2. Problema que o novo HTML precisa resolver</h2>
<p>O HTML anterior apresentava simultaneamente lista de módulos, extensa árvore de páginas e funções, métricas, abas técnicas, relacionamentos e um inspetor distante do item selecionado. A proposta acumulava informações de naturezas diferentes em uma mesma superfície.</p>
<h3 id="sec-2-1-diagnostico-dos-principais-problemas-6">2.1. Diagnóstico dos principais problemas</h3>
<table>
<thead>
<tr>
<th>Problema observado</th>
<th>Consequência</th>
<th>Solução prescrita</th>
</tr>
</thead>
<tbody>
<tr>
<td>Tudo aparece ao mesmo tempo</td>
<td>Sobrecarga cognitiva e pouca clareza</td>
<td>Apresentar um nível por vez</td>
</tr>
<tr>
<td>Módulos de vida e técnicos têm o mesmo peso visual</td>
<td>Confusão sobre responsabilidades</td>
<td>Separar por natureza/contexto</td>
</tr>
<tr>
<td>Páginas, funções e subfunções são visualmente parecidas</td>
<td>Dificuldade de entender hierarquia</td>
<td>Tipos explícitos, títulos e breadcrumbs</td>
</tr>
<tr>
<td>Inspetor aparece longe da seleção</td>
<td>Rolagem excessiva</td>
<td>Detalhe contextual na própria etapa ou painel próximo</td>
</tr>
<tr>
<td>Árvore cresce indefinidamente</td>
<td>Navegação e manutenção difíceis</td>
<td>Visão por nível + busca + filtros</td>
</tr>
<tr>
<td>Dependência e parentesco podem ser confundidos</td>
<td>Estrutura técnica incorreta</td>
<td>Modelar hierarquia e relação como conceitos separados</td>
</tr>
<tr>
<td>Modelos universais aparecem como termos abstratos</td>
<td>Dificuldade de compreender o reuso</td>
<td>Exibir funcionalidades herdadas e especializações reais</td>
</tr>
<tr>
<td>Status pouco elucidativos</td>
<td>Propostas podem parecer aprovadas</td>
<td>Status de decisão e de especificação distintos</td>
</tr>
<tr>
<td>Importação/exportação pouco orientadas</td>
<td>Risco de perda de dados</td>
<td>Prévia, validação, cópia de segurança e confirmação</td>
</tr>
<tr>
<td>Mobile tenta compactar o desktop</td>
<td>Baixa legibilidade</td>
<td>Navegação de uma coluna, ações contextuais</td>
</tr>
</tbody>
</table>
<h3 id="sec-2-2-objetivo-de-usabilidade-7">2.2. Objetivo de usabilidade</h3>
<p>Uma pessoa deve conseguir, sem treinamento técnico:</p>
<ol>
<li>Abrir <strong>Alimentação</strong>.</li>
<li>Ver imediatamente as <strong>páginas</strong> do módulo.</li>
<li>Abrir <strong>Receitas</strong>.</li>
<li>Ver as <strong>funcionalidades</strong> da página.</li>
<li>Abrir <strong>Cadastrar receita</strong>.</li>
<li>Ler ou editar campos, validações, regras, estados, fluxos e dependências.</li>
<li>Voltar até qualquer ponto pelo caminho visível.</li>
<li>Exportar tudo para um JSON, sem perder referências.</li>
</ol>
<p>A ferramenta deve comportar poucas páginas e também centenas delas sem exigir que o usuário leia uma árvore gigantesca.</p>
<hr/>
<h2 id="sec-3-principios-obrigatorios-8">3. Princípios obrigatórios</h2>
<ol>
<li><strong>Um foco por vez:</strong> cada tela de trabalho deve dar prioridade ao nível selecionado.</li>
<li><strong>Profundidade quando necessária:</strong> nenhum item precisa ter obrigatoriamente cinco níveis; a profundidade pode variar.</li>
<li><strong>IDs estáveis:</strong> nomes e posições podem mudar sem invalidar relações.</li>
<li><strong>Hierarquia não é dependência:</strong> estar dentro de uma página não equivale a depender dela operacionalmente.</li>
<li><strong>Modelo universal sem duplicação:</strong> definição compartilhada fica em uma biblioteca central; módulo guarda referência e especialização.</li>
<li><strong>Escopo próprio por módulo:</strong> um painel profissional não deve listar categorias exclusivas de Alimentação ou Financeiro.</li>
<li><strong>Separação entre definido e sugerido:</strong> toda informação tem grau de validação e origem.</li>
<li><strong>Edição intuitiva:</strong> adicionar, editar, mover, reordenar e remover devem estar acessíveis no contexto do item.</li>
<li><strong>Integridade referencial:</strong> importação, movimentação e exclusão não podem deixar links silenciosamente quebrados.</li>
<li><strong>JSON como contrato portátil:</strong> a versão exportada precisa permitir reconstruir todo o inventário e as relações.</li>
<li><strong>Acessibilidade e responsividade:</strong> a ferramenta deve funcionar em celular e desktop sem texto minúsculo.</li>
<li><strong>Previsibilidade:</strong> operações importantes devem oferecer prévia, confirmação quando destrutivas e feedback claro.</li>
<li><strong>Rastreabilidade:</strong> cada decisão pode indicar fonte, justificativa e status de revisão.</li>
<li><strong>Neutralidade visual:</strong> a ferramenta documenta funcionalidades; não força o design que será usado no produto final.</li>
<li><strong>Evolução controlada:</strong> alterações de modelos compartilhados devem indicar quais módulos/páginas são afetados.</li>
</ol>
<hr/>
<h2 id="sec-4-vocabulario-e-modelo-mental-9">4. Vocabulário e modelo mental</h2>
<p><strong>Produto:</strong> Organizador de Vida, o sistema completo a ser construído.</p>
<p><strong>Contexto central:</strong> conjunto de painéis que consolidam informações vindas de diferentes módulos; não deve ser confundido com um módulo de vida.</p>
<p><strong>Módulo:</strong> domínio ou área funcional, por exemplo, Alimentação ou Profissional.</p>
<p><strong>Página:</strong> local de navegação/experiência do aplicativo final, por exemplo, Receitas ou Cardápio. Uma página pode conter várias funcionalidades.</p>
<p><strong>Funcionalidade:</strong> capacidade observável pelo usuário ou pelo sistema, por exemplo, cadastrar receita ou concluir atividade.</p>
<p><strong>Subfuncionalidade:</strong> decomposição de uma funcionalidade em comportamentos menores, quando isso melhora a clareza; pode ter outras subfuncionalidades.</p>
<p><strong>Especificação:</strong> descrição estruturada do comportamento e dos requisitos de um item, incluindo dados, regras, estados, ações, restrições, cenários e critérios de aceite. <strong>Especificação não precisa ser um novo nível de navegação do aplicativo final.</strong></p>
<p><strong>Entidade/contrato de dados:</strong> informação persistida ou transmitida, como Receita, Meta, Atividade ou Cardápio, com seus campos e relações.</p>
<p><strong>Taxonomia/subcategoria:</strong> conjunto controlado de classificações que organiza registros, por exemplo, Reunião, Entrega ou Documentação no módulo Profissional. <strong>Categoria não é automaticamente uma página.</strong></p>
<p><strong>Modelo universal:</strong> definição de funcionalidade ou página comum, como Metas, Dashboard ou Painel de Atividades.</p>
<p><strong>Especialização:</strong> regras, dados, componentes ou comportamentos próprios de um módulo sobre um modelo universal.</p>
<p><strong>Relacionamento:</strong> vínculo entre dois itens identificados por IDs, como <code>usa</code>, <code>depende de</code>, <code>contribui para</code>, <code>navega para</code>, <code>especializa</code> ou <code>compartilha dados com</code>.</p>
<p><strong>Hierarquia:</strong> vínculo de contenção/organização (pai/filho), separado dos relacionamentos operacionais.</p>
<p><strong>Origem/proveniência:</strong> fonte de uma definição: decisão aprovada, HTML existente, código revisado, documentação, proposta, inferência a validar etc.</p>
<p><strong>Estado de definição:</strong> nível de aprovação da ideia; diferente do estado de implementação em código.</p>
<hr/>
<h2 id="sec-5-estrutura-geral-do-organizador-de-vida-10">5. Estrutura geral do Organizador de Vida</h2>
<h3 id="sec-5-1-contextos-centrais-11">5.1. Contextos centrais</h3>
<p>Os painéis transversais consolidados são:</p>
<ul>
<li><strong>Dashboard Geral:</strong> indicadores e resumos intermodulares.</li>
<li><strong>Painel de Atividades Geral:</strong> atividades de múltiplos módulos, preservando a origem de cada registro.</li>
<li><strong>Metas Geral:</strong> visão integrada das metas vinculadas aos diversos módulos.</li>
</ul>
<p>Devem ficar visualmente agrupados como <strong>Painéis Gerais</strong>, e não como um décimo módulo de vida.</p>

<p><strong>Regra de arquitetura do aplicativo futuro:</strong> Alimentação e Financeiro são módulos <strong>fixos de tratamento técnico explícito</strong>. Os demais módulos de vida devem seguir lógica <strong>extensível/dinâmica</strong>, mesmo quando aparecem como opções predefinidas de produto. Essa distinção é técnica e não deve tornar a interface do catálogo desigual.</p>
<h3 id="sec-5-3-modulos-personalizados-13">5.3. Módulos personalizados</h3>
<p>O catálogo admite módulos criados e configurados pelo usuário do editor. Um módulo personalizado pode conter páginas, funcionalidades, entidades, categorias e relações sem alterar a lista oficial de módulos fixos.</p>
<h3 id="sec-5-4-areas-tecnicas-e-estruturais-14">5.4. Áreas técnicas e estruturais</h3>
<ul>
<li>Administração.</li>
<li>Inteligência Artificial (IA).</li>
<li>Integrações.</li>
<li>Notificações.</li>
<li>Usuário.</li>
<li>Sistema.</li>
</ul>
<p>Essas áreas devem ter <strong>aba ou agrupamento próprios</strong>, pois não representam áreas da vida.</p>
<h3 id="sec-5-5-modelos-transversais-iniciais-15">5.5. Modelos transversais iniciais</h3>
<p>A biblioteca universal começa com <strong>Dashboard</strong>, <strong>Painel de Atividades</strong> e <strong>Metas</strong>, mantendo a possibilidade de cadastrar outros modelos <strong>somente após identificação real de reuso</strong>.</p>
<p><strong>Atenção:</strong> ter uma página com o mesmo nome em dois módulos não prova que tudo nela é idêntico. O contrato comum precisa ser explicitado; o restante é especialização.</p>
<hr/>
<h2 id="sec-6-arquitetura-de-navegacao-progressiva-16">6. Arquitetura de navegação progressiva</h2>
<h3 id="sec-6-1-fluxo-principal-17">6.1. Fluxo principal</h3>
<pre><code class="language-text">CATÁLOGO DO ORGANIZADOR DE VIDA
│
├── Painéis Gerais
├── Áreas da Vida
│   ├── Alimentação
│   ├── Saúde
│   ├── Financeiro
│   ├── Profissional
│   └── ...
├── Módulos Personalizados
└── Áreas Técnicas

Selecionar: Alimentação
    ↓
PÁGINAS DO MÓDULO
    ├── Dashboard
    ├── Cardápio (Painel de Atividades)
    ├── Metas
    ├── Receitas
    └── Planejamento Alimentar

Selecionar: Receitas
    ↓
FUNCIONALIDADES DA PÁGINA
    ├── Cadastrar receita
    ├── Editar receita
    ├── Consultar receitas
    └── Selecionar receita

Selecionar: Cadastrar receita
    ↓
SUBFUNCIONALIDADES (QUANDO EXISTIREM)
    ├── Informar ingredientes
    ├── Definir quantidades/unidades
    ├── Registrar modo de preparo
    └── Validar e salvar

Selecionar: Validar e salvar
    ↓
ESPECIFICAÇÃO DO COMPORTAMENTO
    ├── Entradas e campos
    ├── Validações
    ├── Estados e exceções
    ├── Dados e integrações
    ├── Dependências
    ├── Regras e permissões
    └── Critérios de aceite
</code></pre>
<p><strong>A árvore acima é um exemplo conceitual de aprofundamento.</strong> Nem todas as páginas/funcionalidades listadas estão aprovadas. Em particular, o desdobramento fino do cadastro de receita deverá ser validado no levantamento.</p>
<h3 id="sec-6-2-breadcrumbs-caminho-de-navegacao-18">6.2. Breadcrumbs (caminho de navegação)</h3>
<p>Exemplo:</p>
<p><code>Organizador de Vida / Alimentação / Receitas / Cadastrar receita / Validar e salvar</code></p>
<p>Regras:</p>
<ul>
<li>Cada trecho deve ser clicável, exceto o trecho atual.</li>
<li>Voltar ao nível pai não perde alterações já salvas.</li>
<li>Voltar não exclui nem altera vínculos.</li>
<li>Nomes podem mudar; os IDs sustentam a navegação.</li>
<li>A URL interna pode representar o item aberto, mas a estrutura de URL do <strong>editor</strong> não obriga a mesma rota no <strong>aplicativo final</strong>.</li>
</ul>

<h3 id="sec-6-4-profundidade-flexivel-20">6.4. Profundidade flexível</h3>
<p>Uma funcionalidade simples pode ir diretamente a <strong>Especificação</strong>, sem criar subfunções artificiais. Outra pode conter diferentes níveis de decomposição. O editor não deve impor uma profundidade fixa ou obrigar filhos vazios.</p>
<h3 id="sec-6-5-visao-de-conjunto-sem-poluicao-21">6.5. Visão de conjunto sem poluição</h3>
<p>Manter uma opção separada <strong>“Ver árvore completa”</strong> para auditoria, busca geral e exportação, <strong>não como área de trabalho inicial</strong>. Nessa visão deve ser possível recolher nós, filtrar tipos e localizar o item na navegação progressiva.</p>

<h3 id="sec-7-5-acoes-contextuais-27">7.5. Ações contextuais</h3>
<p>A tela principal apresenta <strong>Abrir</strong> e <strong>Adicionar</strong>. Ações menos frequentes ficam em menu <code>⋯</code> com: Editar, Duplicar, Mover, Reordenar, Relacionar, Arquivar e Remover, conforme as permissões e o tipo de item.</p>
<h3 id="sec-7-6-metricas-28">7.6. Métricas</h3>
<p>Indicadores como <code>5 páginas</code>, <code>8 funcionalidades</code>, <code>3 modelos reutilizados</code> e <code>% especificado</code> podem aparecer em cabeçalho resumido <strong>recolhível</strong>, sem dominar a tela.</p>
<h3 id="sec-7-7-desktop-tablet-e-celular-29">7.7. Desktop, tablet e celular</h3>
<p><strong>Desktop:</strong> largura confortável, lista de itens como elemento principal; painel de detalhes lateral apenas quando houver espaço e sem afastar demais a seleção.<br/>
<strong>Tablet:</strong> lista e detalhe alternáveis, sem compressão de texto.<br/>
<strong>Celular:</strong> navegação em uma coluna; selecionar item <strong>abre uma nova etapa</strong>, com voltar e breadcrumbs compactos. Ações em menu contextual; formulários em página/modal integral.</p>
<p><strong>Não</strong> reproduzir sidebar desktop minúscula no celular. Garantir controles clicáveis, contraste, tipografia legível, navegação por teclado, foco visível e rótulos acessíveis. Recomenda-se área de toque de aproximadamente 44 × 44 px.</p>
<hr/>
<h2 id="sec-8-as-quatro-grandes-areas-de-trabalho-30">8. As quatro grandes áreas de trabalho</h2>
<h3 id="sec-8-1-catalogo-31">8.1. Catálogo</h3>
<p>Reúne a hierarquia organizacional:</p>
<p><strong>Módulos → Páginas → Funcionalidades → Subfuncionalidades → Especificações.</strong></p>
<p>É a área padrão para leitura, criação, ordenação e edição contextual.</p>
<h3 id="sec-8-2-relacionamentos-32">8.2. Relacionamentos</h3>
<p>Mostra vínculos <strong>entre quaisquer itens</strong>, inclusive de módulos distintos. Deve oferecer:</p>
<ul>
<li>Lista de relações com busca e filtros por origem, destino, tipo e módulo.</li>
<li>Visão gráfica opcional (mapa de dependências) — complementar, não obrigatória para registrar um vínculo.</li>
<li>Relações de entrada e saída de um item.</li>
<li>Impacto de mover, arquivar ou excluir itens relacionados.</li>
<li>Detecção de referências ausentes e ciclos inválidos para relações que exijam aciclicidade.</li>
</ul>
<h3 id="sec-8-3-biblioteca-universal-33">8.3. Biblioteca Universal</h3>
<p>Centraliza contratos de comportamentos comuns, evitando copiar a mesma definição em cada módulo.</p>
<p>Ao abrir <code>Metas</code>, por exemplo, o editor precisa exibir:</p>
<ol>
<li>O que pertence ao modelo universal.</li>
<li>Quais módulos utilizam esse modelo.</li>
<li>Quais especializações cada módulo adicionou.</li>
<li>Quais funcionalidades foram alteradas em uma nova versão do modelo.</li>
<li>Quais instâncias precisam revisar o impacto da atualização.</li>
</ol>
<h3 id="sec-8-4-dados-e-controle-34">8.4. Dados e Controle</h3>
<p>Área técnica de manutenção do catálogo:</p>
<ul>
<li>Entidades e contratos de dados.</li>
<li>Exportação/importação do JSON mestre.</li>
<li>Visualização de subconjunto por módulo (sem confundir com exportação completa).</li>
<li>Backup e restauração.</li>
<li>Validação de estrutura e referências.</li>
<li>Relatórios de completude, alterações e pendências.</li>
<li>Versão do catálogo e histórico de decisões.</li>
</ul>
<p><strong>Não transformar cada área técnica em uma aba dentro de toda página.</strong> A página pode expor links contextuais, enquanto o gerenciamento completo fica na área apropriada.</p>
<hr/>
<h2 id="sec-9-especificacao-detalhada-dos-itens-35">9. Especificação detalhada dos itens</h2>
<p>Cada item tem uma parte <strong>comum</strong> e uma parte <strong>própria do seu tipo</strong>. O formulário apresenta primeiro o essencial, depois seções avançadas expansíveis.</p>

</tr>
<tr>
<td><code>version</code> / <code>updatedAt</code></td>
<td>Revisão e rastreabilidade</td>
</tr>
</tbody>
</table>
<h3 id="sec-9-2-especificacao-de-modulo-37">9.2. Especificação de módulo</h3>
<ul>
<li>Identidade, código, descrição e objetivo.</li>
<li>Natureza: vida, central, técnico ou personalizado.</li>
<li>Estratégia: fixo ou extensível, conforme a arquitetura.</li>
<li>Páginas existentes, relações e modelos utilizados.</li>
<li>Restrições de escopo e taxonomias permitidas.</li>
<li>Regras de acesso, caso já documentadas — sem presumir implementação de autenticação.</li>
<li>Questões abertas e fontes das definições.</li>
</ul>
<h3 id="sec-9-3-especificacao-de-pagina-38">9.3. Especificação de página</h3>
<ul>
<li>Responsabilidade funcional e público/escopo.</li>
<li>Rota <strong>proposta ou confirmada</strong> do aplicativo final.</li>
<li>Forma de acesso/navegação e estados de disponibilidade.</li>
<li>Funcionalidades filhas e modelo universal utilizado.</li>
<li>Dados lidos e escritos; páginas relacionadas.</li>
<li>Estados: vazio, carregando, erro, sem permissão, com dados etc.</li>
<li>Ações principais, filtros, busca e comportamentos.</li>
<li>Critérios de aceite da experiência da página.</li>
</ul>
<h3 id="sec-9-4-especificacao-de-funcionalidade-ou-subfuncionalidade-39">9.4. Especificação de funcionalidade ou subfuncionalidade</h3>
<p>Uma funcionalidade deve poder registrar:</p>
<ol>
<li><strong>Objetivo:</strong> por que existe e qual resultado entrega.</li>
<li><strong>Ator e permissão:</strong> quem pode acioná-la.</li>
<li><strong>Gatilho:</strong> clique, evento, horário, integração, alteração de estado etc.</li>
<li><strong>Pré-condições:</strong> o que precisa existir ou estar válido.</li>
<li><strong>Entradas:</strong> dados, campos e parâmetros.</li>
<li><strong>Ações/etapas:</strong> sequência normal de execução.</li>
<li><strong>Regras de negócio:</strong> limites, cálculos, bloqueios e exceções.</li>
<li><strong>Validações:</strong> obrigatoriedade, formatos, intervalos e mensagens.</li>
<li><strong>Saídas:</strong> registros, eventos, estado de tela e mensagens.</li>
<li><strong>Estados:</strong> rascunho, agendado, em andamento, concluído etc., <strong>quando pertinentes</strong>.</li>
<li><strong>Exceções:</strong> falha de rede, ausência de dependência, permissão negada e outros casos.</li>
<li><strong>Dependências:</strong> outras funções, páginas, entidades e serviços.</li>
<li><strong>Efeitos colaterais:</strong> o que muda em outros pontos.</li>
<li><strong>Recorrência/temporalidade:</strong> somente quando aplicável.</li>
<li><strong>Auditoria:</strong> eventos que precisam de histórico.</li>
<li><strong>Critérios de aceite:</strong> condições objetivas para considerar funcionalidade implementada.</li>
<li><strong>Cenários de teste:</strong> fluxo feliz e casos negativos.</li>
<li><strong>Questões pendentes:</strong> decisões ainda não tomadas.</li>
</ol>
<p><strong>Regra:</strong> campos não aplicáveis devem ser omitidos ou marcados como <code>não se aplica</code>; não inventar conteúdo para preencher formulário.</p>
<h3 id="sec-9-5-campos-contratos-e-dados-40">9.5. Campos, contratos e dados</h3>
<p>Distinguir:</p>
<ul>
<li><strong>Campo de interface:</strong> apresentado ou editado em tela.</li>
<li><strong>Campo persistido:</strong> armazenado na entidade.</li>
<li><strong>Dado derivado:</strong> calculado a partir de outros dados.</li>
<li><strong>Validação:</strong> condição de aceitação.</li>
<li><strong>Dependência de dados:</strong> referência por ID, e não cópia indiscriminada.</li>
</ul>
<p>Exemplo em Receita: <code>nome</code> pode ser campo de entrada e campo persistido; <code>ingredientes[]</code> é estrutura de dados; <code>rendimento</code> pode influenciar cálculos. A definição exata ainda deve ser aprovada no levantamento.</p>
<hr/>
<h2 id="sec-10-regras-de-criacao-edicao-e-organizacao-41">10. Regras de criação, edição e organização</h2>
<h3 id="sec-10-1-acoes-obrigatorias-42">10.1. Ações obrigatórias</h3>
<p>O editor deve permitir, para tipos compatíveis:</p>
<ul>
<li><strong>Adicionar:</strong> criar novo módulo autorizado, página, função, subfunção, entidade ou vínculo.</li>
<li><strong>Abrir:</strong> navegar até o conteúdo do item.</li>
<li><strong>Editar:</strong> nome, descrição e especificações.</li>
<li><strong>Duplicar:</strong> copiar um item e, opcionalmente, sua subárvore com <strong>novos IDs</strong>, sem copiar relações externas inadvertidamente.</li>
<li><strong>Reordenar:</strong> mover para cima/baixo entre irmãos; drag-and-drop pode complementar, nunca ser a única opção.</li>
<li><strong>Mover:</strong> mudar de pai, página ou módulo, respeitando regras e impacto.</li>
<li><strong>Arquivar:</strong> retirar de uso sem destruir o histórico.</li>
<li><strong>Remover:</strong> excluir após conferir filhos e relações.</li>
<li><strong>Relacionar/desvincular:</strong> criar ou remover dependência independentemente da hierarquia.</li>
</ul>
<h3 id="sec-10-2-regras-da-hierarquia-43">10.2. Regras da hierarquia</h3>
<ul>
<li>Módulo contém páginas.</li>
<li>Página contém funcionalidades e, se validado pelo catálogo, pode conter subpáginas; essa opção deve ser explícita.</li>
<li>Funcionalidade contém subfuncionalidades do mesmo tipo lógico.</li>
<li>Entidades e modelos universais vivem em coleções próprias e são <strong>referenciados</strong>, não filhos obrigatórios da página.</li>
<li>Não permitir que um item seja ancestral de si mesmo.</li>
<li>Impedir pai incompatível com o tipo (por exemplo, categoria como pai de uma página, salvo decisão futura explícita de nova modelagem).</li>
<li>Mudanças de hierarquia devem alterar <code>parentId</code> e <code>order</code>, mas <strong>preservar o ID</strong> do item.</li>
</ul>
<h3 id="sec-10-3-mover-entre-paginas-ou-modulos-44">10.3. Mover entre páginas ou módulos</h3>
<p>Antes de confirmar:</p>
<ol>
<li>Exibir origem e novo destino.</li>
<li>Informar quais filhos serão movidos junto.</li>
<li>Verificar se há categoria/taxonomia incompatível com o módulo de destino.</li>
<li>Verificar modelos universais e escopos afetados.</li>
<li>Verificar vínculos externos; manter os válidos e sinalizar os inválidos.</li>
<li>Confirmar a movimentação e registrar histórico.</li>
</ol>
<p><strong>Exemplo:</strong> mover uma atividade documentada no Profissional para Alimentação não pode manter uma subcategoria exclusiva como <code>Workshop</code> sem revisão; a ferramenta deve bloquear ou solicitar remapeamento, nunca ajustar silenciosamente.</p>
<h3 id="sec-10-4-exclusao-com-seguranca-45">10.4. Exclusão com segurança</h3>
<p>Quando um item tem filhos ou dependentes, mostrar:</p>
<ul>
<li>Quantidade de descendentes.</li>
<li>Relações externas que apontam para ele.</li>
<li>Modelos e páginas impactados.</li>
<li>Opções permitidas: cancelar, arquivar, mover filhos ou excluir em cascata <strong>apenas após confirmação explícita</strong>.</li>
</ul>
<p>Nenhuma referência órfã deve ficar no JSON aceito como íntegro.</p>
<h3 id="sec-10-5-salvamento-46">10.5. Salvamento</h3>
<ul>
<li>Salvar alterações localmente após edição confirmada (por exemplo, <code>IndexedDB</code> ou <code>localStorage</code> conforme tamanho e complexidade).</li>
<li>Exibir indicador de <code>Salvo</code>, <code>Alterações não salvas</code> ou <code>Erro ao salvar</code>.</li>
<li>Permitir backup/exportação manual sempre.</li>
<li>Oferecer desfazer quando factível, ao menos para operações comuns e não destrutivas.</li>
<li>Não afirmar que há sincronização em nuvem sem backend configurado.</li>
</ul>
<hr/>
<h2 id="sec-11-hierarquia-versus-relacionamento-diferenca-decisiva-47">11. Hierarquia versus relacionamento: diferença decisiva</h2>
<h3 id="sec-11-1-exemplo-de-hierarquia-48">11.1. Exemplo de hierarquia</h3>
<pre><code class="language-text">Alimentação
  └── Receitas
       └── Cadastrar receita
            └── Informar ingredientes
</code></pre>
<p>Aqui a relação é de <strong>organização documental</strong>: <code>Receitas</code> é a página que abriga <code>Cadastrar receita</code>.</p>
<h3 id="sec-11-2-exemplo-de-relacionamento-independente-49">11.2. Exemplo de relacionamento independente</h3>
<pre><code class="language-text">Cardápio ──usa──&gt; Receitas
Cardápio ──persiste em──&gt; Entidade Cardápio
Receitas ──persiste em──&gt; Entidade Receita
Atividade ──contribui para──&gt; Meta
Metas de Alimentação ──especializam──&gt; Modelo Universal de Metas
</code></pre>
<p>Um item pode depender de vários outros itens em módulos distintos, sem precisar ser filho deles.</p>
<h3 id="sec-11-3-tipos-iniciais-de-vinculo-50">11.3. Tipos iniciais de vínculo</h3>
<table>
<thead>
<tr>
<th>Tipo</th>
<th>Significado</th>
<th>Exemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>depends_on</code></td>
<td>Requer outra capacidade/dado</td>
<td>Cardápio depende de seleção de Receitas</td>
</tr>
<tr>
<td><code>uses_data</code></td>
<td>Lê ou escreve entidade</td>
<td>Cadastrar receita usa entidade Receita</td>
</tr>
<tr>
<td><code>navigates_to</code></td>
<td>Permite acesso a outra página</td>
<td>Cardápio abre Receitas</td>
</tr>
<tr>
<td><code>specializes</code></td>
<td>Estende contrato compartilhado</td>
<td>Cardápio especializa Painel de Atividades</td>
</tr>
<tr>
<td><code>contributes_to</code></td>
<td>Influencia progresso/resultado</td>
<td>Atividade contribui para Meta</td>
</tr>
<tr>
<td><code>triggers</code></td>
<td>Aciona outro processo</td>
<td>Conclusão aciona cálculo — se regra aprovada</td>
</tr>
<tr>
<td><code>shares_with</code></td>
<td>Compartilha informação controlada</td>
<td>Metas de módulo com Metas Geral</td>
</tr>
<tr>
<td><code>related_to</code></td>
<td>Associação informativa sem dependência</td>
<td>Página ligada a referência documental</td>
</tr>
</tbody>
</table>
<p>Cada relação precisa de <code>fromId</code>, <code>toId</code>, <code>type</code>, justificativa e, quando aplicável, condições. A semântica deve estar clara: <code>A depends_on B</code> significa que <strong>A depende de B</strong>.</p>
<h3 id="sec-11-4-validacao-dos-vinculos-51">11.4. Validação dos vínculos</h3>
<ul>
<li>IDs de origem e destino precisam existir.</li>
<li>Tipos precisam pertencer ao catálogo controlado de relações.</li>
<li>Vínculos podem atravessar módulos se permitidos.</li>
<li>Dependências circulares <strong>operacionais</strong> devem ser destacadas e avaliadas; a regra de proibição precisa ser definida por tipo de vínculo. Não proibir automaticamente relações legítimas de navegação bidirecional.</li>
<li>Ao editar um item, mostrar: <strong>“Depende de”</strong>, <strong>“É utilizado por”</strong>, <strong>“Navega para”</strong> e <strong>“É especializado por”</strong>.</li>
</ul>
<h3 id="sec-11-5-visao-de-impacto-52">11.5. Visão de impacto</h3>
<p>Selecionar <code>Receitas</code> deve permitir ver rapidamente:</p>
<ul>
<li>Páginas/funcionalidades que utilizam receitas.</li>
<li>Entidades associadas.</li>
<li>Modelos e regras impactados.</li>
<li>Referências recebidas.</li>
</ul>
<p>Isso torna a refatoração documental e depois técnica muito mais segura.</p>
<hr/>
<h2 id="sec-12-biblioteca-universal-e-especializacao-por-modulo-53">12. Biblioteca universal e especialização por módulo</h2>
<h3 id="sec-12-1-regra-fundamental-54">12.1. Regra fundamental</h3>
<p>A <strong>biblioteca universal define o contrato mínimo comum</strong>. Cada módulo a utiliza por referência e adiciona apenas o que for próprio.</p>
<p>Exemplo:</p>
<pre><code class="language-text">Biblioteca Universal
  └── Painel de Atividades (contrato comum)
       ├── Visualizar atividades por período
       ├── Criar, editar, concluir e adiar (onde aplicável)
       ├── Filtrar por contexto
       ├── Relacionar tarefas e metas
       └── Tratar estado/recorrência (se aplicável)

Instância no módulo Alimentação
  └── Cardápio
       ├── Usa contrato do Painel de Atividades
       └── Especializa: refeições, receitas e período alimentar

Instância no módulo Profissional
  └── Painel de Atividades Profissional
       ├── Usa contrato do Painel de Atividades
       ├── Especializa: subcategorias profissionais
       └── Layout: accordion + Big Calendar
</code></pre>
<p>A definição exata do contrato comum deve ser refinada para evitar forçar ações impróprias a certos tipos de ocorrência.</p>
<h3 id="sec-12-2-como-mostrar-na-interface-55">12.2. Como mostrar na interface</h3>
<p>Na página que reutiliza um modelo, exibir duas seções separadas:</p>
<ul>
<li><strong>Herdado da Biblioteca Universal:</strong> itens somente leitura no contexto local, com link para sua definição de origem.</li>
<li><strong>Especializações deste módulo:</strong> itens editáveis do módulo (adicionar/alterar/remover conforme permissão).</li>
</ul>
<p>Alterações no modelo original devem gerar aviso de impacto sobre as páginas consumidoras.</p>
<h3 id="sec-12-3-evitar-duplicidade-56">12.3. Evitar duplicidade</h3>
<p>Não criar versões independentes de <code>Cadastrar meta</code> em todos os módulos só porque cada um tem uma tela Metas. Em vez disso, reutilizar a definição universal e registrar campos/regras particulares quando necessários.</p>
<h3 id="sec-12-4-controle-de-excecoes-57">12.4. Controle de exceções</h3>
<p>Se um módulo não suportar uma capacidade universal, <strong>registrar a exceção e sua justificativa</strong>, em vez de apagar silenciosamente a funcionalidade universal ou manter um botão impossível de executar.</p>
<hr/>
<h2 id="sec-13-exemplo-aprofundado-metas-58">13. Exemplo aprofundado — Metas</h2>
<h3 id="sec-13-1-conceito-59">13.1. Conceito</h3>
<p>Metas constituem uma capacidade transversal, podendo ter instância Geral e visões por módulo. <strong>A hierarquia de metas não é a mesma hierarquia de páginas do catálogo.</strong> O catálogo documenta a funcionalidade; o produto final armazena metas reais em uma hierarquia de dados.</p>
<h3 id="sec-13-2-capacidades-a-especificar-60">13.2. Capacidades a especificar</h3>
<table>
<thead>
<tr>
<th>Capacidade</th>
<th>Perguntas e regras a definir</th>
</tr>
</thead>
<tbody>
<tr>
<td>Criar meta</td>
<td>Nome, descrição, prazo, escopo, estado e responsável?</td>
</tr>
<tr>
<td>Horizonte</td>
<td>Curto, médio e longo prazo: quais limites temporais?</td>
</tr>
<tr>
<td>Hierarquia de metas</td>
<td>Uma meta pode conter submetas? Quantas camadas?</td>
</tr>
<tr>
<td>Planejamento</td>
<td>Etapas, marcos e períodos relacionados?</td>
</tr>
<tr>
<td>Vincular atividades</td>
<td>Uma atividade pode contribuir para uma ou várias metas?</td>
</tr>
<tr>
<td>Progresso</td>
<td>Manual, por tarefas, ponderado ou combinação?</td>
</tr>
<tr>
<td>Acompanhamento</td>
<td>Indicadores, alertas, histórico e revisão?</td>
</tr>
<tr>
<td>Conclusão</td>
<td>Como validar uma meta atingida?</td>
</tr>
<tr>
<td>Replanejamento</td>
<td>O que acontece ao adiar ou alterar prazo?</td>
</tr>
<tr>
<td>Generalização</td>
<td>Como a visão Geral agrega metas sem duplicar dados?</td>
</tr>
</tbody>
</table>
<p>Os itens acima são a <strong>estrutura de levantamento funcional</strong>, e não decisões detalhadas já aprovadas sobre cálculos, prazos ou permissões.</p>
<h3 id="sec-13-3-exemplo-de-hierarquia-de-metas-do-aplicativo-final-61">13.3. Exemplo de hierarquia de metas do aplicativo final</h3>
<pre><code class="language-text">Meta de longo prazo: Evolução profissional
  ├── Meta de médio prazo: Obter uma certificação
  │     ├── Meta de curto prazo: Concluir módulo de estudos
  │     └── Meta de curto prazo: Fazer simulados
  └── Meta de médio prazo: Consolidar portfólio
        └── Meta de curto prazo: Documentar projeto
</code></pre>
<p><strong>Exemplo ilustrativo</strong>, não cadastro de metas do usuário.</p>
<h3 id="sec-13-4-regras-funcionais-a-especificar-62">13.4. Regras funcionais a especificar</h3>
<ul>
<li>Identificador próprio por meta (<code>metaId</code>) e vínculo opcional à meta pai (<code>parentMetaId</code>).</li>
<li>Prevenir ciclos de meta pai/filha.</li>
<li>Permitir metas sem filhas.</li>
<li>Manter origem do módulo.</li>
<li>Definir explicitamente cálculo e arredondamento de progresso; <strong>não assumir que a média das filhas é sempre correta</strong>.</li>
<li>Registrar regras para uma meta concluída com filha pendente, exclusão de uma submeta e alteração de prazo.</li>
<li>Considerar histórico das mudanças importantes e efeitos em atividades vinculadas.</li>
</ul>
<h3 id="sec-13-5-relacao-com-o-painel-de-atividades-63">13.5. Relação com o Painel de Atividades</h3>
<p>Uma atividade pode estar vinculada a uma meta. O catálogo deve descrever se e como <code>Concluir atividade</code> altera o progresso da meta. Se o avanço depender de confirmação manual ou pesos, isso precisa ficar declarado.</p>
<h3 id="sec-13-6-especializacao-por-modulo-64">13.6. Especialização por módulo</h3>
<p><code>Metas Geral</code> é uma visão consolidada. <code>Metas de Alimentação</code>, <code>Metas Profissionais</code> e outras instâncias utilizam a mesma entidade ou contrato comum com filtros e extensões próprias. <strong>Evitar cadastrar a mesma meta duas vezes</strong> em bancos lógicos diferentes só porque ela aparece em duas páginas.</p>
<hr/>
<h2 id="sec-14-exemplo-aprofundado-alimentacao-65">14. Exemplo aprofundado — Alimentação</h2>
<h3 id="sec-14-1-modulo-e-paginas-identificadas-como-ponto-de-partida-66">14.1. Módulo e páginas identificadas como ponto de partida</h3>
<ul>
<li><strong>Dashboard</strong> — visão do módulo, de origem universal.</li>
<li><strong>Cardápio</strong> — especialização do Painel de Atividades.</li>
<li><strong>Metas</strong> — visão de metas do módulo, de origem universal.</li>
<li><strong>Receitas</strong> — página especializada, detalhes em levantamento.</li>
<li><strong>Planejamento Alimentar</strong> — página citada na versão inicial do catálogo; responsabilidade e possível sobreposição com Cardápio ainda precisam ser validadas.</li>
</ul>
<p><strong>Importante:</strong> <code>Cardápio</code> e <code>Planejamento Alimentar</code> podem acabar sendo uma única página ou telas distintas. O catálogo deve registrar a decisão, não supor que ambas precisam existir.</p>
<h3 id="sec-14-2-por-que-cardapio-nao-e-apenas-uma-lista-de-tarefas-67">14.2. Por que Cardápio não é apenas uma lista de tarefas</h3>
<p>O <strong>Painel de Atividades universal</strong> representa ações e ocorrências ao longo do tempo. Na Alimentação, a visualização é especializada como <strong>Cardápio</strong>, organizada por refeições/dias/períodos e vinculada às receitas. O usuário percebe o planejamento alimentar, e não um calendário profissional com nomes trocados.</p>
<h3 id="sec-14-3-pagina-receitas-estrutura-de-levantamento-68">14.3. Página Receitas — estrutura de levantamento</h3>
<pre><code class="language-text">Alimentação / Receitas
  ├── Cadastrar receita
  │   ├── Dados básicos
  │   ├── Ingredientes e quantidades
  │   ├── Modo de preparo
  │   └── Validação e salvamento
  ├── Editar receita
  ├── Consultar receitas
  └── Selecionar receita para uso no Cardápio
</code></pre>
<p>Os desdobramentos são <strong>exemplos de especificação</strong>; campos e fluxos precisam de validação.</p>
<h3 id="sec-14-4-dependencias-ilustrativas-69">14.4. Dependências ilustrativas</h3>
<pre><code class="language-text">Cardápio ──usa──&gt; Receitas
Cardápio ──usa_dados──&gt; Entidade Cardápio
Receitas ──usa_dados──&gt; Entidade Receita
Cardápio ──especializa──&gt; Painel de Atividades Universal
Metas de Alimentação ──especializa──&gt; Metas Universal
</code></pre>
<h3 id="sec-14-5-exemplo-de-especificacao-de-uma-funcionalidade-70">14.5. Exemplo de especificação de uma funcionalidade</h3>
<p><strong>Nome:</strong> Selecionar receita para Cardápio.<br/>
<strong>Objetivo:</strong> associar um registro de receita existente a uma posição planejada no cardápio.<br/>
<strong>Pré-condição candidata:</strong> receita válida já cadastrada.<br/>
<strong>Entrada candidata:</strong> receita selecionada, dia/período/refeição de destino.<br/>
<strong>Saída esperada:</strong> vínculo entre programação alimentar e receita.<br/>
<strong>Dependência:</strong> entidade Receita e funcionalidade Cardápio.<br/>
<strong>Perguntas pendentes:</strong> receita pode ser reutilizada várias vezes? Como lidar com edição posterior ou remoção de receita? Existem porções ajustáveis? Quem calcula ingredientes?<br/>
<strong>Status:</strong> exemplo para validação, não decisão final.</p>

<h2 id="sec-17-estrutura-json-recomendada-77">17. Estrutura JSON recomendada</h2>
<h3 id="sec-17-1-principio-78">17.1. Princípio</h3>
<p>O JSON exportado deve representar o <strong>estado completo</strong> do catálogo, não somente os itens visíveis na tela no momento da exportação. Deve preservar:</p>
<ul>
<li>Versão do formato.</li>
<li>Identidade do produto.</li>
<li>Módulos e contextos centrais.</li>
<li>Páginas, funções e subfunções com seus pais e ordens.</li>
<li>Modelos universais.</li>
<li>Entidades, campos e contratos.</li>
<li>Subcategorias e regras de escopo.</li>
<li>Relacionamentos por IDs.</li>
<li>Status, proveniência e pendências.</li>
<li>Metadados necessários para reimportar o catálogo.</li>
</ul>
<h3 id="sec-17-2-proposta-de-colecoes-79">17.2. Proposta de coleções</h3>
<pre><code class="language-text">catalog
├── schemaVersion
├── product
├── metadata
├── modules[]
├── centralContexts[]
├── pages[]
├── features[]
├── templates[]
├── entities[]
├── categories[]
├── relations[]
└── decisions[]
</code></pre>
<p><strong>Nota:</strong> esta é a proposta para a próxima versão do catálogo, não o esquema final já implantado no HTML anterior. A migração entre formatos precisará ser testada.</p>

<h3 id="sec-17-4-por-que-separar-colecoes-81">17.4. Por que separar coleções</h3>
<p><code>modules[]</code>, <code>pages[]</code> e <code>features[]</code> em coleções distintas permitem buscas, validações e referências cruzadas. A navegação é reconstruída a partir de <code>moduleId</code>, <code>parentId</code>, <code>pageId</code>, <code>parentFeatureId</code> e <code>order</code>, não pela posição física no arquivo.</p>
<h3 id="sec-17-5-ids-versus-nomes-82">17.5. IDs versus nomes</h3>
<ul>
<li>Nome pode ser alterado.</li>
<li>Ordem pode ser alterada.</li>
<li>Página pode migrar de módulo após validações.</li>
<li>Referências continuam apontando para o <strong>mesmo ID</strong>.</li>
<li>IDs não devem ser reutilizados após exclusão de outro item.</li>
</ul>
<h3 id="sec-17-6-status-separados-83">17.6. Status separados</h3>
<p><strong>Decisão funcional (<code>decisionStatus</code>)</strong> — por exemplo:</p>
<ul>
<li><code>defined</code>: aprovado/definido.</li>
<li><code>proposed</code>: proposta a avaliar.</li>
<li><code>in-review</code>: em levantamento ou revisão.</li>
<li><code>rejected</code>: rejeitado, preservado para histórico quando necessário.</li>
</ul>
<p><strong>Completude da especificação (<code>specStatus</code>)</strong> — por exemplo:</p>
<ul>
<li><code>not-started</code>.</li>
<li><code>partial</code>.</li>
<li><code>complete</code>.</li>
<li><code>validated</code>.</li>
</ul>
<p><strong>Status de implementação (<code>implementationStatus</code>)</strong>, se vier a ser usado após confrontar o código real, deve ser <strong>um terceiro atributo independente</strong>. Uma ideia aprovada não implica que o código exista.</p>
<h3 id="sec-17-7-fonte-de-cada-afirmacao-84">17.7. Fonte de cada afirmação</h3>
<p>Atribuir, sempre que possível:</p>
<pre><code class="language-json">{
  "source": {
    "kind": "decision|uploaded-file|code-audit|prototype|proposal",
    "reference": "Documento, arquivo ou decisão rastreável",
    "notes": "Justificativa ou divergência encontrada"
  }
}
</code></pre>
<p>Assim, o leitor sabe se um requisito foi herdado de um protótipo, aprovado em conversa ou apenas sugerido na catalogação.</p>
<hr/>
<h2 id="sec-18-importacao-exportacao-e-persistencia-85">18. Importação, exportação e persistência</h2>
<h3 id="sec-18-1-exportar-json-mestre-86">18.1. Exportar JSON mestre</h3>
<ul>
<li>Um botão inequívoco: <strong>Exportar catálogo completo</strong>.</li>
<li>Nome sugerido: <code>organizador-de-vida_catalogo_YYYY-MM-DD.json</code>.</li>
<li>JSON legível, UTF-8, com versão e metadados.</li>
<li>Incluir <strong>todas</strong> as coleções do catálogo, independentemente de filtros ou página selecionada.</li>
<li>Não incluir dados pessoais reais ou segredos de produção.</li>
</ul>
<h3 id="sec-18-2-exportacoes-opcionais-87">18.2. Exportações opcionais</h3>
<ul>
<li><strong>Exportar apenas módulo</strong> para leitura, compartilhamento ou revisão.</li>
<li><strong>Exportar relatório de pendências</strong>, como JSON ou Markdown.</li>
<li><strong>Exportar mapa de dependências</strong> para outra ferramenta.</li>
</ul>
<p><strong>A exportação parcial não deve ser confundida com backup completo</strong> e deve incluir metadados informando seu escopo.</p>
<h3 id="sec-18-3-importar-json-88">18.3. Importar JSON</h3>
<p>Fluxo recomendado:</p>
<ol>
<li>Selecionar arquivo.</li>
<li>Analisar <code>schemaVersion</code> e estrutura.</li>
<li>Validar obrigatoriedade e tipos.</li>
<li>Verificar unicidade de IDs.</li>
<li>Verificar pais e relações apontando para itens existentes.</li>
<li>Verificar regras de taxonomia e integridade dos módulos oficiais.</li>
<li>Mostrar <strong>prévia de alterações</strong>: módulos, páginas, funções, relações, conflitos.</li>
<li>Permitir <strong>substituir</strong> o catálogo atual com backup prévio; mesclar somente em operação separada, definida e testada.</li>
<li>Solicitar confirmação.</li>
<li>Persistir de forma atômica, com possibilidade de recuperar a versão anterior.</li>
</ol>
<h3 id="sec-18-4-mesclagem-89">18.4. Mesclagem</h3>
<p>Importar e <strong>mesclar</strong> é mais complexo que importar e substituir, pois exige política para IDs iguais, versões divergentes, itens removidos e relacionamentos. Na primeira versão, é aceitável oferecer <strong>somente substituição segura</strong>, deixando mesclagem para uma etapa posterior documentada.</p>
<h3 id="sec-18-5-persistencia-local-90">18.5. Persistência local</h3>
<p>Um HTML autocontido pode persistir usando recursos do navegador. Para maior volume e versões, <strong>IndexedDB</strong> tende a ser preferível; <code>localStorage</code> é suficiente apenas para cenários pequenos e simples. Exportação manual continua indispensável.</p>
<p>O catálogo deve distinguir:</p>
<ul>
<li><strong>Salvo neste navegador</strong>: persistência local.</li>
<li><strong>Arquivo exportado</strong>: cópia portátil.</li>
<li><strong>Sincronizado na nuvem</strong>: somente se for construída infraestrutura própria.</li>
</ul>
<p>Recarregar a página não deve descartar alterações confirmadas.</p>
<h3 id="sec-18-6-migracao-de-esquema-91">18.6. Migração de esquema</h3>
<p>Se o JSON antigo não seguir o contrato novo, o editor deve migrá-lo de maneira controlada, preservando IDs quando possível, registrando incompatibilidades e bloqueando importação destrutiva em caso de erro. Nunca fingir compatibilidade silenciosa.</p>
<hr/>
<h2 id="sec-19-busca-filtros-rastreabilidade-e-relatorios-92">19. Busca, filtros, rastreabilidade e relatórios</h2>
<h3 id="sec-19-1-busca-global-93">19.1. Busca global</h3>
<p>Buscar por:</p>
<ul>
<li>Nome de módulo, página, funcionalidade ou entidade.</li>
<li>Descrição e palavras-chave.</li>
<li>ID.</li>
<li>Status.</li>
<li>Relações e referências.</li>
</ul>
<p>O resultado deve indicar o caminho completo e permitir <strong>Abrir neste contexto</strong>, por exemplo: <code>Alimentação › Receitas › Cadastrar receita</code>.</p>
<h3 id="sec-19-2-filtros-uteis-94">19.2. Filtros úteis</h3>
<ul>
<li>Apenas páginas, funcionalidades, entidades ou relações.</li>
<li>Módulo.</li>
<li>Definido / em levantamento / proposto.</li>
<li>Especificação completa/incompleta.</li>
<li>Com ou sem dependências.</li>
<li>Com perguntas pendentes.</li>
<li>Universal ou especializado.</li>
</ul>
<h3 id="sec-19-3-relatorio-de-completude-95">19.3. Relatório de completude</h3>
<p>Por módulo, página e funcionalidade, mostrar:</p>
<ul>
<li>Quantos itens existem.</li>
<li>Quantos estão aprovados.</li>
<li>Quantos têm descrição objetiva.</li>
<li>Quantos têm regras e critérios de aceite quando necessários.</li>
<li>Quantos referenciam dados e relações válidos.</li>
<li>Quantos têm perguntas em aberto.</li>
<li>Quantos dependem de definições ainda não aprovadas.</li>
</ul>
<p><strong>Evitar percentuais ilusórios.</strong> A regra de cálculo da completude deve ser documentada, sensível ao tipo de item e a campos não aplicáveis.</p>
<h3 id="sec-19-4-historico-e-decisoes-96">19.4. Histórico e decisões</h3>
<p>Idealmente cada alteração relevante registra: quando, tipo de mudança, item afetado, valor anterior/novo, justificativa e origem. Em HTML somente local, isso não equivale a auditoria imutável de servidor; ainda assim é útil para rastrear decisões.</p>
<hr/>
<h2 id="sec-20-permissoes-e-limites-da-ferramenta-97">20. Permissões e limites da ferramenta</h2>
<p>O catálogo deve documentar <strong>permissões do aplicativo final</strong>, mas essas regras não devem ser confundidas com a segurança real do <strong>editor HTML</strong>.</p>
<p>Caso o catálogo seja usado por várias pessoas no futuro, prever papéis como leitor, editor e aprovador. Entretanto:</p>
<ul>
<li>Um HTML local não é controle de acesso seguro para dados compartilhados.</li>
<li>Esconder botão não substitui autorização em backend.</li>
<li>Aprovar ou bloquear edição de requisitos oficiais requer uma política de produto explícita.</li>
<li>As listas fixas/taxonomias oficiais devem ter alteração intencional, registrada e revisável.</li>
</ul>
<p>Na primeira versão local, o mínimo é impedir modificações <strong>acidentais</strong> em itens protegidos, sinalizando claramente os motivos.</p>
<hr/>
<h2 id="sec-21-criterios-de-aceitacao-do-novo-html-98">21. Critérios de aceitação do novo HTML</h2>
<p>O novo arquivo só deve ser considerado funcionalmente satisfatório quando os cenários abaixo funcionarem:</p>
<h3 id="sec-21-1-navegacao-99">21.1. Navegação</h3>
<ul>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Entrar no catálogo e identificar imediatamente módulos de vida, painéis gerais e áreas técnicas.</li>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Abrir Alimentação e ver suas páginas <strong>sem mostrar todas as funções de todas as páginas</strong>.</li>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Abrir Receitas e ver apenas suas funcionalidades.</li>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Abrir Cadastrar receita e acessar especificação e subfunções.</li>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Navegar pelo breadcrumb sem perder o estado salvo.</li>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Encontrar item via busca global e abrir no contexto correto.</li>
</ul>
<h3 id="sec-21-2-crud-e-hierarquia-100">21.2. CRUD e hierarquia</h3>
<ul>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Adicionar uma página ao módulo.</li>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Adicionar uma função à página.</li>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Adicionar uma subfunção à função.</li>
<li class="task-list-item"><input class="task-list-item-checkbox" disabled="" type="checkbox"/>Editar nomes, descrições, status e detalhes.</li>

<h2 id="sec-22-plano-de-construcao-em-fases-104">22. Plano de construção em fases</h2>
<h3 id="sec-fase-1-estrutura-canonica-105">Fase 1 — Estrutura canônica</h3>
<ol>
<li>Consolidar contrato JSON, tipos, IDs, hierarquia e relações.</li>
<li>Criar validador de esquema e integridade referencial.</li>
<li>Preparar migração do arquivo HTML/JSON inicial.</li>
<li>Preservar conteúdo já catalogado e sinalizar possíveis divergências.</li>
</ol>
<p><strong>Saída:</strong> dados confiáveis, sem interface complexa.</p>
<h3 id="sec-fase-2-navegacao-progressiva-106">Fase 2 — Navegação progressiva</h3>
<ol>
<li>Página Catálogo com cards por grupo.</li>
<li>Página de Módulo com lista de páginas.</li>
<li>Página com lista de funcionalidades.</li>
<li>Funcionalidade com subfunções e especificações.</li>
<li>Breadcrumbs, voltar, busca e estado vazio.</li>
<li>Interface responsiva real para mobile.</li>
</ol>
<p><strong>Saída:</strong> fluxo principal claro e utilizável.</p>
<h3 id="sec-fase-3-editor-e-operacoes-107">Fase 3 — Editor e operações</h3>
<ol>
<li>CRUD contextual.</li>
<li>Movimentação e reordenação seguras.</li>
<li>Duplicação, arquivamento e exclusão com análise de impacto.</li>
<li>Persistência local.</li>
<li>Importação/exportação integral com validação e backup.</li>
</ol>
<p><strong>Saída:</strong> catálogo editável sem perda silenciosa de dados.</p>
<h3 id="sec-fase-4-conhecimento-funcional-profundo-108">Fase 4 — Conhecimento funcional profundo</h3>
<ol>
<li>Especificações completas por tipo.</li>
<li>Biblioteca Universal e especializações.</li>
<li>Entidades e contratos.</li>
<li>Mapa de relações.</li>
<li>Proveniência, estados e decisões.</li>
</ol>
<p><strong>Saída:</strong> conteúdo utilizável como contrato para desenvolvimento.</p>
<h3 id="sec-fase-5-inventario-completo-por-modulo-109">Fase 5 — Inventário completo por módulo</h3>
<p>Ordem sugerida, <strong>não obrigatória</strong>:</p>
<ol>
<li>Alimentação: resolver Cardápio, Receitas, Planejamento e Metas.</li>
<li>Financeiro: auditar páginas e funcionalidades existentes no projeto real.</li>
<li>Profissional: documentar o Painel, as 19 subcategorias e restantes páginas.</li>
<li>Demais módulos de vida.</li>
<li>Contextos gerais.</li>
<li>Áreas técnicas e módulos personalizados.</li>
<li>Auditoria final de reuso, cobertura e dependências.</li>
</ol>
<p>Para cada módulo, confrontar protótipos, código, rotas e decisões disponíveis. Marcar explicitamente os itens sem prova de implementação ou sem aprovação funcional.</p>
<h3 id="sec-fase-6-entrega-para-a-ferramenta-de-design-desenvolvimento-110">Fase 6 — Entrega para a ferramenta de design/desenvolvimento</h3>
<p>Produzir:</p>
<ul>
<li>JSON mestre validado.</li>
<li>Relatório de páginas e funcionalidades por módulo.</li>
<li>Contratos universais e especializações.</li>
<li>Mapa de dependências.</li>
<li>Pendências e decisões ainda abertas.</li>
<li>Guia de interpretação do catálogo.</li>
</ul>
<p>A outra aplicação poderá utilizar esse material para produzir design e código <strong>sem confundir exemplos de protótipo com requisitos confirmados</strong>.</p>
<hr/>
<h2 id="sec-23-regras-para-manter-a-documentacao-coerente-no-futuro-111">23. Regras para manter a documentação coerente no futuro</h2>
<ol>
<li><strong>Nova página:</strong> sempre pertence a um módulo/contexto explícito, tem ID, responsabilidade, status e origem.</li>
<li><strong>Nova funcionalidade:</strong> sempre pertence a uma página/função, tem resultado esperado e pode receber especificação progressiva.</li>
<li><strong>Nova subcategoria:</strong> deve pertencer à taxonomia autorizada daquele módulo.</li>
<li><strong>Novo comportamento universal:</strong> só deve ser promovido à biblioteca após confirmar reuso real entre módulos relevantes.</li>
<li><strong>Nova especialização:</strong> fica no módulo consumidor; não altera silenciosamente o contrato central.</li>
<li><strong>Mudança de dependência:</strong> registrar relação tipada, com motivo e IDs válidos.</li>
<li><strong>Exclusão:</strong> verificar descendentes e dependentes.</li>
<li><strong>Mudança de nome ou ordem:</strong> não recriar IDs.</li>
<li><strong>Novo dado:</strong> descrever entidade e contrato; evitar duplicação de registros em diferentes páginas.</li>
<li><strong>Importação:</strong> validar e comparar antes de substituir.</li>
<li><strong>Aprovação:</strong> status só muda mediante revisão explícita; não confundir “preenchido” com “aprovado”.</li>
<li><strong>Entrega:</strong> catálogo sem referências órfãs, com relatório de pendências e backup exportado.</li>
</ol>
<hr/>
<h2 id="sec-24-decisoes-consolidadas-e-decisoes-ainda-abertas-112">24. Decisões consolidadas e decisões ainda abertas</h2>
<h3 id="sec-24-1-decisoes-consolidadas-nesta-especificacao-113">24.1. Decisões consolidadas nesta especificação</h3>
<ul>
<li>O HTML será um <strong>Catálogo Funcional Mestre</strong>, não a interface final do aplicativo.</li>
<li>Navegação <strong>por profundidade progressiva</strong>, evitando árvore integral permanente.</li>
<li>Organização por módulos, páginas, funcionalidades, subfuncionalidades e especificações.</li>
<li>Hierarquia e dependências são estruturas independentes.</li>
<li>CRUD completo, movimentação e reordenação sem perda de IDs.</li>
<li>Importação/exportação JSON como recurso fundamental.</li>
<li>Biblioteca de modelos universais com extensões por módulo.</li>
<li>Painéis gerais separados dos módulos de vida.</li>
<li>Alimentação e Financeiro com tratamento técnico fixo; demais módulos com arquitetura extensível.</li>
<li>Cardápio como especialização do Painel de Atividades em Alimentação.</li>
<li>Painel Profissional: accordion à esquerda e Big Calendar à direita no desktop; calendário acima ao estreitar.</li>
<li>Taxonomia do Profissional restrita às 19 subcategorias informadas.</li>
<li>Exemplos em levantamento não devem ganhar status de aprovados automaticamente.</li>
</ul>
<h3 id="sec-24-2-decisoes-abertas-para-a-etapa-seguinte-114">24.2. Decisões abertas para a etapa seguinte</h3>
<ol>
<li>Inventário realmente completo de páginas por módulo, a partir de arquivos/código.</li>
<li>Definição final de sobreposição entre <code>Cardápio</code> e <code>Planejamento Alimentar</code>.</li>
<li>Campos obrigatórios e regras detalhadas de Receita, Cardápio e demais entidades.</li>
<li>Critérios temporais oficiais de curto, médio e longo prazo em Metas.</li>
<li>Algoritmo de cálculo/propagação de progresso das metas.</li>
<li>Contratos e exceções definitivos de cada modelo universal.</li>
<li>Páginas especializadas do Financeiro, sem assumir candidatas como confirmadas.</li>
<li>Regras formais de permissão e aprovação dentro do catálogo compartilhado.</li>
<li>Política de migração/mesclagem de catálogos independentes.</li>
<li>Rotas definitivas do aplicativo final, distintas das rotas internas do editor.</li>
<li>Se haverá auditoria colaborativa ou apenas histórico local.</li>
<li>Estilo visual definitivo do <strong>editor</strong>; o padrão pode se inspirar no Organizador de Vida Web Unificado, sem comprometer usabilidade e legibilidade.</li>
</ol>
<hr/>
<h2 id="sec-25-entregavel-final-esperado-115">25. Entregável final esperado</h2>
<p>O resultado deverá ser um <strong>HTML autocontido e operacional</strong> que permita administrar o conhecimento funcional do Organizador de Vida com:</p>
<ul>
<li>Visão inicial simples dos módulos e contextos.</li>
<li>Navegação progressiva até qualquer detalhe de uma funcionalidade.</li>
<li>CRUD e organização flexível, com controles de integridade.</li>
<li>Relações e dependências consultáveis de qualquer nível.</li>
<li>Biblioteca universal, especializações e contratos de dados.</li>
<li>Evidência do que está definido e do que ainda não está.</li>
<li>Importação, exportação, backup e validação JSON.</li>
<li>Comportamento adequado no desktop e no celular.</li>
<li>Estrutura pronta para servir de insumo ao desenvolvimento futuro.</li>
</ul>
<h3 id="sec-sintese-final-116">Síntese final</h3>
<p><strong>O Organizador de Vida deve ser compreendido de fora para dentro: do módulo à menor regra funcional necessária.</strong> A navegação visual pode permanecer simples porque o modelo de dados preservará toda a profundidade, as relações, as especializações e as evidências.</p>
<blockquote>
<p><strong>A meta é entender e especificar a aplicação inteira, sem transformar sua documentação numa aplicação mais difícil de usar do que o produto que ela pretende organizar.</strong></p>
</blockquote>

ese final</a><a href="#sec-apendice-a-checklist-de-levantamento-de-uma-pagina-117">Apêndice A — Checklist de levantamento de uma página</a><a href="#sec-apendice-b-checklist-de-auditoria-antes-de-gerar-a-aplicacao-118">Apêndice B — Checklist de auditoria antes de gerar a aplicação</a></template><script>(()=>{'use strict';

function clone(v){return JSON.parse(JSON.stringify(v));}

function upChain(f){const chain=[];let next=f;const seen=new Set();while(next&&!seen.has(next.id)){seen.add(next.id);chain.unshift(next);next=next.parentFeatureId?get('feature',next.parentFeatureId):null}return chain}
function simpleText(s){return esc(s||'Não especificado').replace(/\n/g,'<br>')}

function mutation(fn,msg){const old=clone(data);undoStack.push(old);if(undoStack.length>20)undoStack.shift();try{fn();let v=validate(data);if(v.errors.length){data=old;undoStack.pop();toast('Alteração bloqueada: '+v.errors[0]);return false}data.metadata.updatedAt=new Date().toISOString();doSave();render();toast(msg||'Alterações salvas');return true}catch(e){data=old;undoStack.pop();toast('Não foi possível aplicar: '+e.message);return false}}

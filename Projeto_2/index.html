-review"},{"id":"rel_card_entity","fromId":"page_cardapio","toId":"entity_cardapio","type":"uses_data","reason":"Cardápio utiliza seu contrato de dados.","decisionStatus":"in-review"},{"id":"rel_meta_tpl","fromId":"page_alim_metas","toId":"tpl_metas","type":"specializes","reason":"Visão de metas alimentares especializa modelo universal.","decisionStatus":"defined"},{"id":"rel_prof_tpl","fromId":"page_prof_activities","toId":"tpl_activities","type":"specializes","reason":"Painel profissional utiliza contrato universal.","decisionStatus":"defined"}],"decisions":[]}</script>
<script>
(() => {
  const STORAGE_KEY = "organizador-de-vida-catalogo-v2";
  const REQUIRED = ["modules","centralContexts","pages","features","templates","entities","categories","relations","decisions"];
  const seed = JSON.parse(document.getElementById("seed").textContent);
  let state;
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    state = saved ? JSON.parse(saved) : structuredClone(seed);
  } catch(e) { state = structuredClone(seed); }
  for (const k of REQUIRED) if (!Array.isArray(state[k])) state[k] = [];
  let area = "catalog";
  let query = "";

  const view = document.getElementById("view");
  const status = document.getElementById("save-status");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);
  const save = () => {
    state.metadata = state.metadata || {};
    state.metadata.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    status.textContent = "Alterações salvas localmente";
  };
  const countPages = id => state.pages.filter(p=>p.moduleId===id).length;
  const countFeatures = id => {
    const pids = new Set(state.pages.filter(p=>p.moduleId===id).map(p=>p.id));
    return state.features.filter(f=>pids.has(f.pageId)).length;
  };
  const matches = obj => !query || JSON.stringify(obj).toLowerCase().includes(query.toLowerCase());

  function moduleCard(m) {
    return `<article class="tile">
      <div class="tile-top"><div class="tile-emoji">${esc(m.icon||"◫")}</div><span class="pill ${esc(m.kind)}">${m.kind==="technical"?"técnico":"funcional"}</span></div>
      <h3>${esc(m.name)}</h3>
      <p>${esc(m.description||"")}</p>
      <div class="meta">${countPages(m.id)} página(s) · ${countFeatures(m.id)} funcionalidade(s)</div>
    </article>`;
  }

  function renderCatalog() {
    const functional = state.modules.filter(m=>m.kind==="life" && matches(m)).sort((a,b)=>(a.catalogOrder||999)-(b.catalogOrder||999));
    const technical = state.modules.filter(m=>m.kind==="technical" && matches(m)).sort((a,b)=>(a.catalogOrder||999)-(b.catalogOrder||999));
    view.innerHTML = `
      <section class="page-intro"><div><h1>Catálogo Funcional Mestre</h1><p>Inventário organizado do Organizador de Vida. Os módulos funcionais representam áreas da vida; os módulos técnicos ficam separados da experiência funcional.</p></div></section>
      <section class="group-block"><div class="group-title"><h2>Módulos funcionais</h2><span class="muted small">${functional.length} módulos</span></div><div class="cards">${functional.map(moduleCard).join("")||'<div class="empty">Nenhum módulo encontrado.</div>'}</div></section>
      <section class="group-block"><div class="group-title"><h2>Módulos técnicos e estruturais</h2><span class="muted small">${technical.length} módulos</span></div><div class="cards">${technical.map(moduleCard).join("")||'<div class="empty">Nenhum módulo encontrado.</div>'}</div></section>`;
  }

  function renderRelations() {
    const rows = state.relations.filter(matches).map(r=>{
      const findName=id=>[...state.modules,...state.pages,...state.features,...state.templates,...state.entities].find(x=>x.id===id)?.name||id;
      return `<div class="item"><strong>${esc(findName(r.fromId))} → ${esc(findName(r.toId))}</strong><div>${esc(r.reason||"")}</div><div class="meta">${esc(r.type||"relation")} · ${esc(r.decisionStatus||"")}</div></div>`;
    }).join("");
    view.innerHTML=`<section class="page-intro"><div><h1>Relacionamentos</h1><p>Dependências e vínculos registrados entre páginas, funcionalidades, entidades e modelos.</p></div></section><div class="panel"><div class="panel-body">${rows||'<div class="empty">Nenhum relacionamento encontrado.</div>'}</div></div>`;
  }

  function renderLibrary() {
    const rows=state.templates.filter(matches).map(t=>`<div class="item"><strong>${esc(t.name)}</strong><div>${esc(t.description||"")}</div><div class="meta">${(t.capabilities||[]).length} capacidades · versão ${esc(t.version||1)}</div></div>`).join("");
    view.innerHTML=`<section class="page-intro"><div><h1>Biblioteca Universal</h1><p>Modelos transversais reutilizados por diferentes módulos.</p></div></section><div class="panel"><div class="panel-body">${rows||'<div class="empty">Nenhum modelo universal cadastrado.</div>'}</div></div>`;
  }

  function renderData() {
    const c={modules:state.modules.length,pages:state.pages.length,features:state.features.length,templates:state.templates.length,entities:state.entities.length,categories:state.categories.length,relations:state.relations.length};
    view.innerHTML=`<section class="page-intro"><div><h1>Dados e Controle</h1><p>Resumo da base atual carregada no catálogo.</p></div></section>
    <div class="kv-grid">${Object.entries(c).map(([k,v])=>`<div class="metric"><strong>${v}</strong><span>${esc(k)}</span></div>`).join("")}</div>
    <section class="group-block"><div class="panel"><div class="panel-header"><h2>Base local</h2></div><div class="panel-body"><p class="muted">Este HTML usa uma chave nova de armazenamento local para iniciar com o catálogo atualizado. Importações futuras substituem a base local após validação.</p><button class="btn danger" id="reset-seed">Restaurar seed atualizado</button></div></div></section>`;
    document.getElementById("reset-seed")?.addEventListener("click",()=>{ if(confirm("Restaurar o catálogo interno atualizado?")){state=structuredClone(seed);save();render();} });
  }

  function render() {
    document.querySelectorAll("[data-area]").forEach(b=>b.classList.toggle("active",b.dataset.area===area));
    if(area==="relations") renderRelations(); else if(area==="library") renderLibrary(); else if(area==="data") renderData(); else renderCatalog();
  }

  document.querySelectorAll("[data-area]").forEach(b=>b.addEventListener("click",()=>{area=b.dataset.area;render();}));
  document.getElementById("global-search").addEventListener("input",e=>{query=e.target.value.trim();render();});
  document.getElementById("export-btn").addEventListener("click",()=>{
    const exportData=structuredClone(state); exportData.metadata=exportData.metadata||{}; exportData.metadata.exportedAt=new Date().toISOString();
    const blob=new Blob([JSON.stringify(exportData,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="organizador-de-vida_catalogo_exportado.json";a.click();URL.revokeObjectURL(a.href);
  });
  const input=document.getElementById("json-input");
  document.getElementById("import-btn").addEventListener("click",()=>input.click());
  input.addEventListener("change",async()=>{
    const f=input.files[0]; if(!f) return;
    try {
      const incoming=JSON.parse(await f.text());
      if(!String(incoming.schemaVersion||"").startsWith("1.")) throw new Error("schemaVersion incompatível.");
      for(const k of REQUIRED) if(!Array.isArray(incoming[k])) throw new Error("Coleção obrigatória ausente: "+k);
      const ids=new Set(); const duplicates=[];
      for(const k of REQUIRED) for(const x of incoming[k]) if(x?.id){if(ids.has(x.id))duplicates.push(x.id);ids.add(x.id);}
      if(duplicates.length) throw new Error("IDs duplicados: "+duplicates.slice(0,8).join(", "));
      if(!confirm("Importar este JSON e substituir a base local atual?")) return;
      state=incoming; save(); render(); alert("JSON importado com sucesso.");
    } catch(e) { alert("Falha na importação: "+e.message); }
    finally {input.value="";}
  });
  render();
})();
</script>
</body>
</html>

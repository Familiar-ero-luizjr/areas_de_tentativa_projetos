<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Padrão arquitetural para aplicações HTML autocontidas, com conteúdo gerenciado por JSON."
    />
    <title>Arquitetura de HTML Autocontido · Referência</title>
    <style id="app-css">
      :root {
        --canvas: #f4f6fa;
        --surface: #fff;
        --surface-alt: #f8faff;
        --ink: #162338;
        --ink-2: #44526b;
        --muted: #71809a;
        --brand: #3359d9;
        --brand-soft: #eaf0ff;
        --border: #e3e9f1;
        --code-bg: #111e31;
        --code-ink: #d8e8ff;
        --success: #168066;
        --warn: #995d16;
        --radius: 14px;
        --shadow: 0 8px 32px rgba(20, 37, 65, 0.035);
        --sans:
          Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        --mono:
          "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono",
          monospace;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #0c1321;
        --surface: #142033;
        --surface-alt: #1a2a41;
        --ink: #eff5ff;
        --ink-2: #bfccdd;
        --muted: #95a6c0;
        --brand: #8dadff;
        --brand-soft: #25395c;
        --border: #2a3c56;
        --code-bg: #0b1421;
        --code-ink: #dbe9ff;
        --success: #5ad0aa;
        --warn: #f6bd64;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.55;
        font-size: 14px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .topbar {
        height: 77px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 32px;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 270px;
        text-decoration: none;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        border-radius: 11px;
        width: 40px;
        height: 40px;
        background: #273d88;
        color: white;
        font-family: var(--mono);
        font-weight: 800;
        font-size: 13px;
        box-shadow: 0 7px 16px rgba(34, 70, 154, 0.18);
      }
      .brand-label {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
        gap: 3px;
      }
      .brand-label strong {
        font-size: 15px;
        letter-spacing: 0.015em;
      }
      .brand-dot {
        color: var(--brand);
      }
      .brand-label small {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.035em;
      }
      .top-tabs {
        display: flex;
        align-self: stretch;
        gap: 12px;
      }
      .top-tabs button {
        height: 100%;
        min-width: 135px;
        color: var(--muted);
        font-weight: 700;
        font-size: 13px;
        appearance: none;
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        padding: 0 12px;
      }
      .top-tabs button[aria-selected="true"] {
        color: var(--brand);
        border-color: var(--brand);
      }
      .tab-icon {
        font-size: 17px;
        margin-right: 7px;
        font-weight: 700;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .state-marker {
        color: var(--success);
        background: color-mix(in srgb, var(--success) 9%, transparent);
        border-radius: 100px;
        padding: 6px 11px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }
      .state-marker.dirty {
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 10%, transparent);
      }
      .primary-button,
      .secondary-button,
      .ghost-button,
      .icon-button,
      .danger-button {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        border-radius: 9px;
        padding: 9px 13px;
        font-weight: 700;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }
      .primary-button {
        color: #fff;
        background: #355cdd;
        border-color: #355cdd;
      }
      .secondary-button {
        color: var(--brand);
        border-color: color-mix(in srgb, var(--brand) 28%, var(--border));
        background: var(--brand-soft);
      }
      .ghost-button {
        border-color: transparent;
        background: transparent;
        color: var(--ink-2);
      }
      .danger-button {
        color: #b43b3b;
        border-color: color-mix(in srgb, #b43b3b 25%, var(--border));
        background: transparent;
      }
      .icon-button {
        font-size: 20px;
        padding: 5px 11px;
        min-width: 36px;
      }
      .primary-button:hover {
        background: #284ac2;
      }
      .secondary-button:hover,
      .ghost-button:hover,
      .icon-button:hover {
        background: var(--brand-soft);
      }
      .workspace {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: calc(100vh - 77px);
      }
      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 77px;
        max-height: calc(100vh - 77px);
      }
      .sidebar-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 30px 22px 17px;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: var(--muted);
      }
      .version-chip {
        font-size: 10px;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 3px 7px;
      }
      .search-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 18px 15px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface-alt);
        color: var(--muted);
      }
      .search-wrap > span {
        font-size: 22px;
      }
      .search-wrap input {
        background: transparent;
        outline: none;
        border: 0;
        color: var(--ink);
        width: 100%;
        min-height: 39px;
        min-width: 0;
        font-size: 12px;
      }
      .search-wrap kbd {
        font-size: 11px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 3px;
        padding: 1px 5px;
      }
      .sidebar-nav {
        overflow: auto;
        padding: 0 12px 24px;
        flex: 1;
      }
      .nav-group {
        margin: 14px 0 7px;
        padding: 0 10px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.12em;
        font-weight: 900;
        text-transform: uppercase;
      }
      .nav-link {
        display: block;
        text-decoration: none;
        font-size: 12.5px;
        color: var(--ink-2);
        padding: 9px 10px;
        border-radius: 8px;
        margin: 2px 0;
        line-height: 1.35;
      }
      .nav-link:hover {
        background: var(--surface-alt);
        color: var(--ink);
      }
      .nav-link.active {
        background: var(--brand-soft);
        color: var(--brand);
        font-weight: 750;
      }
      .nav-link .number {
        display: inline-block;
        width: 22px;
        color: var(--muted);
        font-size: 11px;
      }
      .sidebar-footer {
        padding: 19px 24px 28px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: flex-start;
        gap: 10px;
        color: var(--ink-2);
      }
      .sidebar-footer p {
        margin: 0;
        line-height: 1.45;
        font-size: 11px;
      }
      .sidebar-footer small {
        color: var(--muted);
      }
      .tip-bullet {
        height: 9px;
        width: 9px;
        background: var(--success);
        border-radius: 50%;
        margin-top: 5px;
        flex: none;
      }
      .main {
        min-width: 0;
        padding: 36px clamp(22px, 4vw, 70px) 70px;
      }
      .view {
        max-width: 1150px;
        margin: auto;
      }
      .view[hidden] {
        display: none;
      }
      .breadcrumb {
        color: var(--muted);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 2px 0 18px;
      }
      .crumb-sep {
        opacity: 0.5;
      }
      h1 {
        font-size: clamp(26px, 3.1vw, 42px);
        line-height: 1.19;
        letter-spacing: -0.035em;
        margin: 0 0 16px;
        font-weight: 800;
      }
      h2 {
        font-size: 21px;
        letter-spacing: -0.018em;
        margin: 0 0 14px;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
      }
      .lede {
        font-size: 15px;
        color: var(--ink-2);
        max-width: 820px;
        margin: 0 0 22px;
        line-height: 1.8;
      }
      .hero {
        border: 1px solid var(--border);
        background: linear-gradient(
          125deg,
          var(--surface) 50%,
          var(--brand-soft) 140%
        );
        border-radius: 18px;
        padding: 34px 36px;
        box-shadow: var(--shadow);
        margin-bottom: 25px;
        position: relative;
        overflow: hidden;
      }
      .hero:after {
        content: "</>";
        position: absolute;
        font-family: var(--mono);
        font-size: 135px;
        color: var(--brand);
        opacity: 0.055;
        right: 10px;
        top: 5px;
        font-weight: 900;
        pointer-events: none;
      }
      .hero .eyebrow {
        color: var(--brand);
        display: block;
        margin-bottom: 16px;
      }
      .hero p {
        color: var(--ink-2);
        font-size: 14px;
        max-width: 780px;
        line-height: 1.8;
        margin: 0;
      }
      .hero-actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        margin-top: 25px;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 26px;
      }
      .mini-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 17px;
      }
      .mini-card .kicker {
        font-size: 11px;
        color: var(--brand);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .mini-card h3 {
        margin: 8px 0 5px;
        font-size: 13px;
      }
      .mini-card p {
        font-size: 11px;
        color: var(--muted);
        margin: 0;
        line-height: 1.65;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin: 10px 0 24px;
      }
      .section-head h1 {
        font-size: clamp(24px, 2.7vw, 34px);
      }
      .section-head p {
        font-size: 14px;
        color: var(--ink-2);
        max-width: 800px;
        margin: 0;
        line-height: 1.75;
      }
      .section-tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .document-block {
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 14px;
        padding: 24px;
        margin: 15px 0;
      }
      .document-block > h3 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 13px;
      }
      .block-icon {
        background: var(--brand-soft);
        color: var(--brand);
        border-radius: 7px;
        display: grid;
        place-items: center;
        width: 25px;
        height: 25px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 900;
      }
      .document-block p {
        color: var(--ink-2);
        line-height: 1.75;
        white-space: pre-line;
        margin: 0;
      }
      .document-block ul {
        margin: 0;
        padding-left: 21px;
        color: var(--ink-2);
      }
      .document-block li {
        margin: 8px 0;
        line-height: 1.7;
      }
      .document-block pre {
        position: relative;
        margin: 0;
        padding: 18px 20px;
        background: var(--code-bg);
        color: var(--code-ink);
        border-radius: 9px;
        white-space: pre;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.7;
        tab-size: 2;
        max-height: 560px;
      }
      .document-block pre.diagram {
        background: var(--surface-alt);
        border: 1px dashed var(--border);
        color: var(--ink);
        max-height: none;
      }
      .document-block.note {
        background: color-mix(in srgb, var(--brand-soft) 64%, var(--surface));
        border-color: color-mix(in srgb, var(--brand) 18%, var(--border));
      }
      .document-block.note p {
        color: var(--ink);
      }
      .block-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin: 0 0 12px;
      }
      .block-meta h3 {
        margin: 0;
      }
      .small-tag {
        color: var(--muted);
        background: var(--surface-alt);
        border: 1px solid var(--border);
        padding: 3px 8px;
        border-radius: 5px;
        font-family: var(--mono);
        font-size: 10px;
      }
      .copy-inline {
        font-size: 11px;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--ink-2);
        border-radius: 6px;
        padding: 4px 8px;
      }
      .bottom-nav {
        margin-top: 32px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .bottom-nav a {
        flex: 1;
        text-decoration: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 17px;
        max-width: 340px;
      }
      .bottom-nav a strong {
        display: block;
        font-size: 12px;
      }
      .bottom-nav a span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-bottom: 5px;
      }
      .empty {
        text-align: center;
        background: var(--surface);
        padding: 30px;
        border-radius: 12px;
        border: 1px dashed var(--border);
        color: var(--muted);
      }
      .data-header {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 25px 28px;
        margin-bottom: 16px;
      }
      .data-header h1 {
        font-size: 29px;
        margin: 0 0 7px;
      }
      .data-header p {
        color: var(--ink-2);
        margin: 0;
        max-width: 850px;
        font-size: 13px;
        line-height: 1.7;
      }
      .json-topline {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        margin: 20px 0 12px;
      }
      .json-selector {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .json-selector select {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 10px 11px;
        color: var(--ink);
        border-radius: 9px;
        min-width: 190px;
        font-size: 12px;
      }
      .json-editor-box {
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--surface);
        padding: 16px;
        box-shadow: var(--shadow);
      }
      .editor-info {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 0 2px 12px;
        font-size: 11px;
        color: var(--muted);
      }
      .editor-info strong {
        font-weight: 800;
        color: var(--ink);
      }
      #json-editor {
        display: block;
        width: 100%;
        min-height: 480px;
        height: 55vh;
        max-height: 760px;
        resize: vertical;
        white-space: pre;
        tab-size: 2;
        outline: none;
        border: 1px solid #2d415e;
        background: var(--code-bg);
        color: var(--code-ink);
        font: 12px/1.65 var(--mono);
        padding: 18px;
        border-radius: 8px;
      }
      .editor-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .action-stack {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .json-hint {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.7;
        margin: 13px 3px;
      }
      .validation-box {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 13px 16px;
        font-size: 12px;
        color: var(--ink-2);
        margin-top: 14px;
        white-space: pre-wrap;
      }
      .validation-box.error {
        border-color: #d85c5c;
        color: #c44747;
        background: color-mix(in srgb, #d85c5c 7%, var(--surface));
      }
      .validation-box.success {
        border-color: color-mix(in srgb, var(--success) 45%, var(--border));
        color: var(--success);
      }
      .json-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 14px;
      }
      .json-stat {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 11px;
        color: var(--muted);
      }
      .json-stat strong {
        display: block;
        font-size: 18px;
        color: var(--ink);
        font-family: var(--mono);
      }
      .callout {
        border-left: 3px solid var(--brand);
        background: var(--brand-soft);
        border-radius: 0 10px 10px 0;
        padding: 12px 15px;
        margin: 14px 0;
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1.75;
      }
      .toast {
        position: fixed;
        right: 26px;
        bottom: 24px;
        max-width: min(430px, calc(100vw - 48px));
        background: var(--ink);
        color: var(--surface);
        padding: 12px 17px;
        border-radius: 10px;
        box-shadow: 0 16px 45px #0003;
        z-index: 50;
        font-size: 12px;
        font-weight: 700;
      }
      .toast[hidden] {
        display: none;
      }
      @media (max-width: 1150px) {
        .summary-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .brand {
          min-width: auto;
        }
        .brand-label small {
          display: none;
        }
        .topbar {
          padding: 0 20px;
        }
        .state-marker {
          display: none;
        }
      }
      @media (max-width: 860px) {
        .workspace {
          display: block;
        }
        .sidebar {
          position: static;
          max-height: none;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        .sidebar-top,
        .sidebar-footer {
          display: none;
        }
        .sidebar-nav {
          max-height: 135px;
        }
        .sidebar-nav .nav-group {
          margin-top: 8px;
        }
        .main {
          padding: 25px 15px 60px;
        }
        .topbar {
          gap: 8px;
        }
        .brand-label {
          display: none;
        }
        .top-tabs {
          gap: 0;
        }
        .top-tabs button {
          min-width: 0;
          font-size: 12px;
          padding: 0 9px;
        }
        .top-actions .primary-button {
          font-size: 0;
          gap: 0;
        }
        .top-actions .primary-button span {
          font-size: 15px;
        }
        .hero {
          padding: 23px;
        }
        .document-block {
          padding: 16px;
        }
        .section-head {
          flex-direction: column;
        }
        .section-tools {
          justify-content: flex-start;
        }
        .json-stats {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 480px) {
        .topbar {
          height: 65px;
          padding: 0 10px;
        }
        .brand-mark {
          height: 32px;
          width: 32px;
        }
        .workspace {
          min-height: calc(100vh - 65px);
        }
        .sidebar {
          top: 65px;
        }
        .summary-grid {
          grid-template-columns: 1fr;
        }
        .top-tabs button {
          font-size: 11px;
        }
        .tab-icon {
          display: none;
        }
        .top-actions {
          gap: 3px;
        }
        .json-stats {

          "source": "aplicacao/\n├── app.manifest.json          # identidade e montagem\n├── interface/\n│   ├── shell.html             # estrutura global\n│   ├── paginas/               # telas independentes\n│   └── componentes/           # fragmentos HTML reutilizáveis\n├── estilos/\n│   ├── tokens.css             # cores, espaçamento, tipografia\n│   ├── base.css               # reset, acessibilidade\n│   ├── layout.css             # grade, navegação, shell\n│   └── componentes/           # estilos por componente\n├── dados/\n│   ├── schema/                # contratos e validação\n│   ├── seeds/                 # dados padrão editáveis\n│   └── catalogos/             # conteúdo e listas estáticas\n├── mocks/                     # OPCIONAL\n│   ├── cenarios.json          # cenários de dados fictícios\n│   └── handlers.js            # respostas simuladas\n├── relacoes/\n│   ├── relacoes.json          # arestas e regras declarativas\n│   └── engine.js              # indexação e consulta\n├── runtime/\n│   ├── bootstrap.js           # ordem de inicialização\n│   ├── registry.js            # módulos/componentes/serviços\n│   ├── router.js              # navegação por hash\n│   ├── store.js               # estado em memória\n│   └── event-bus.js           # eventos com contratos\n├── servicos/\n│   ├── clientes.service.js    # lógica por domínio\n│   └── adapters/              # mock / API real, se aplicável\n├── assets/                    # SVG, imagens, ícones, fontes licenciadas\n├── tests/                     # validação automatizada\n├── ferramentas/build.py       # incorpora CSS/JS/JSON/assets\n└── dist/aplicacao.html        # ARQUIVO FINAL AUTÔNOMO",
          "final": "\u003c!doctype html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\n  \u003ctitle\u003eMinha aplicação\u003c/title\u003e\n  \u003cstyle id=\"bundle-css\"\u003e/* CSS agrupado por camada */\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cdiv id=\"app\" role=\"application\"\u003e\u003c/div\u003e\n  \u003cscript id=\"bundle-data\" type=\"application/json\"\u003e\n    {\"manifest\":{},\"pages\":[],\"entities\":[],\"mocks\":{},\"relations\":[]}\n  \u003c/script\u003e\n  \u003cscript\u003e/* JS compilado em ordem definida no manifesto */\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e",

          "data": "{\n  \"schemaVersion\": 1,\n  \"entities\": {\n    \"clientes\": [\n      {\"id\":\"cli-001\",\"name\":\"Cliente Exemplo\",\"status\":\"ativo\"}\n    ],\n    \"pedidos\": [\n      {\"id\":\"ped-001\",\"clienteId\":\"cli-001\",\"total\":180}\n    ]\n  }\n}",
          "mock": "{\n  \"enabled\": true,\n  \"scenario\": \"demonstracao\",\n  \"latencyMs\": 100,\n  \"datasets\": {\n    \"demonstracao\": {\n      \"clientes\": [{\"id\":\"cli-001\",\"name\":\"Cliente Exemplo\"}],\n      \"pedidos\": [{\"id\":\"ped-001\",\"clienteId\":\"cli-001\"}]\n    },\n    \"vazio\": {\"clientes\":[],\"pedidos\":[]}\n  }\n}",
          "adapters": "// Contrato idêntico no mock e na integração real:\nconst clienteRepository = {\n  list: () =\u003e Promise.resolve([]),\n  getById: (id) =\u003e Promise.resolve(null)\n};\n\n// Escolha do adaptador em configuração:\n// adapter = config.mode === 'mock' ? mockAdapter : apiAdapter;\n// IMPORTANTE: uma API real exige servidor e conexão; file:// não a simula.",
          "relations": "{\n  \"relations\": [\n    {\"id\":\"rel-01\",\"kind\":\"belongsTo\",\"from\":\"pedidos.clienteId\",\"to\":\"clientes.id\",\"required\":true},\n    {\"id\":\"rel-02\",\"kind\":\"navigatesTo\",\"from\":\"page.home\",\"to\":\"page.clients\"}\n  ]\n}",
          "relationengine": "// Esboço do contrato (não código de execução importado):\nindexById(\"clientes\", clientes);       // O(1) por ID médio\nvalidateForeignKeys(relations, entities); // relatórios de ausências\ngetRelated(\"cli-001\", \"pedidos\");    // consulta orientada a índices\n// NUNCA usar eval em expressões salvas no JSON.",

          "router": "NAVEGAÇÃO EM HTML ÚNICO (file://)\n\n#/inicio                  → page.home\n#/clientes                → page.clients\n#/clientes/cli-001        → page.client.detail\n\nO roteador lê location.hash, procura a rota no registro,\ndesmonta a página anterior e monta a próxima no mesmo #app.\nNão requer múltiplos HTMLs nem rewrites de servidor.",
          "assets": "{\n  \"assets\": [\n    {\"id\":\"logo\",\"source\":\"assets/logo.svg\",\"mime\":\"image/svg+xml\",\"mode\":\"inline\"},\n    {\"id\":\"icone\",\"source\":\"assets/icon.png\",\"mime\":\"image/png\",\"mode\":\"data-uri\"}\n  ]\n}",
          "bootstrap": "1. Ler e validar o manifest + JSON embutido\n2. Instalar tratamento global de erros\n3. Criar registries (componentes/serviços)\n4. Iniciar storage e state store\n5. Carregar dados e selecionar adapter (mock / local)\n6. Criar índices / validar relações\n7. Registrar componentes, páginas e eventos\n8. Iniciar router por hash\n9. Montar layout + página inicial\n10. Exibir estado pronto (ou erro recuperável)",
          "build": "FONTE EDITÁVEL\n  HTML fragmentos  +  CSS modular  +  JS modular  +  JSON  +  assets\n               │\n               ▼\n  validar contratos → ordenar módulos → incorporar recursos\n               │\n               ▼\n           dist/aplicacao.html\n               │\n               ▼\n    testar com file:// e dados realistas",
          "checklist": "[ ] Nenhum arquivo externo obrigatório (CDN, import, fetch local)\n[ ] Nenhum segredo incorporado\n[ ] JSON válido e IDs únicos; referências resolvidas\n[ ] Rotas cadastradas; página inexistente tratada\n[ ] Eventos registrados e listeners removidos ao desmontar\n[ ] HTML dinâmico escapado; CSP compatível quando possível\n[ ] Testes de import/export/reset/persistência\n[ ] Busca e listas grandes sem travamento perceptível\n[ ] Layout legível em mobile e teclado\n[ ] Abrir dist/aplicacao.html diretamente (file://)",
          "flow": "ALTERAR OU CRIAR UM RECURSO\n        │\n        ├── Só muda conteúdo? → editar dados/*.json\n        ├── Só muda visual?   → editar estilos/* e componentes\n        ├── Nova tela?       → interface/paginas + pages.json\n        ├── Nova lógica?     → servicos/* ou runtime/modules\n        ├── Nova relação?    → relacoes.json + validação\n        └── Novo mock?       → mocks/cenarios.json + adapter\n        │\n        ▼\n validar → recompilar → testar o HTML final",
          "versioning": "{\n  \"schemaVersion\": \"2.0.0\",\n  \"dataVersion\": 5,\n  \"migrations\": [\n    {\"from\":4,\"to\":5,\"id\":\"mig-004-005\",\"reason\":\"renomeia cliente.nome\"}\n  ]\n}"
        },

                "type": "list",

          {

          "text",
          "diagram",
          "list",
          "note",
          "example",
        ]);
        const idPattern = /^[a-z0-9][a-z0-9_-]*$/;

        function validate(input) {
          const errors = [];

            x !== null && typeof x === "object" && !Array.isArray(x);

            !record(input.manifest) ||
            typeof input.manifest.title !== "string" ||

            errors.push("groups deve ser uma lista não vazia.");
          if (!Array.isArray(input.sections))
            errors.push("sections deve ser uma lista.");
          if (!record(input.examples))
            errors.push("examples deve ser um objeto de códigos/textos.");
          if (!Array.isArray(input.principles))
            errors.push("principles deve ser uma lista.");
          if (!record(input.settings))
            errors.push("settings deve ser um objeto.");

          input.groups.forEach((g, i) => {
            if (
              !record(g) ||
              !idPattern.test(g.id || "") ||
              typeof g.label !== "string" ||
              !g.label.trim()

              errors.push("groups[" + i + "] precisa de id minúsculo e label.");
            else if (groupIds.has(g.id))
              errors.push("Grupo duplicado: " + g.id);
            else groupIds.add(g.id);
          });

            if (!record(s)) {
              errors.push("sections[" + i + "] deve ser objeto.");
              return;
            }
            if (typeof s.id !== "string" || !idPattern.test(s.id))
              errors.push(
                "sections[" +
                  i +
                  "].id deve ser único e conter letras minúsculas, números, _ ou -.",
              );
            else if (sectionIds.has(s.id))
              errors.push("Seção duplicada: " + s.id);
            else sectionIds.add(s.id);
            if (!groupIds.has(s.group))
              errors.push(
                "Grupo desconhecido em " + (s.id || i) + ": " + s.group,
              );
            if (typeof s.title !== "string" || !s.title.trim())
              errors.push("Título ausente em " + (s.id || i));
            if (typeof s.summary !== "string")
              errors.push("summary deve ser texto em " + (s.id || i));
            if (s.enabled !== undefined && typeof s.enabled !== "boolean")
              errors.push("enabled deve ser boolean em " + (s.id || i));
            if (!Array.isArray(s.blocks)) {
              errors.push("blocks deve ser lista em " + (s.id || i));
              return;
            }
            s.blocks.forEach((b, j) => {

              if (!record(b) || !ALLOWED_BLOCKS.has(b.type)) {

                return;
              }
              if (typeof b.title !== "string")
                errors.push(at + ": title precisa ser texto.");
              if (
                ["text", "diagram", "note"].includes(b.type) &&
                typeof b.text !== "string"
              )
                errors.push(at + ": text precisa ser texto.");
              if (
                b.type === "list" &&
                (!Array.isArray(b.items) ||
                  b.items.some((item) => typeof item !== "string"))

                errors.push(at + ": items deve ser lista de textos.");

                b.type === "example" &&
                (typeof b.exampleId !== "string" ||
                  typeof input.examples[b.exampleId] !== "string")

                errors.push(at + ": exampleId deve existir em examples.");
            });
          });

            if (typeof body !== "string")

                ) + " caracteres";
          }
        });
        window.addEventListener("hashchange", () => {
          if (revertHash) {
            revertHash = false;
            return;
          }
          if (!keepDraft()) {
            revertHash = true;
            const old = A.routeUrl(A.route.tab, A.route.key);
            history.replaceState(null, "", old);
            return;
          }
          A.editorDirty = false;
          A.render();
          window.scrollTo({ top: 0, behavior: "instant" });
        });
        $("theme-toggle").addEventListener("click", () => {
          A.data.settings.theme =
            A.data.settings.theme === "light" ? "dark" : "light";
          A.save();
          document.documentElement.dataset.theme = A.data.settings.theme;
          A.updateStateMarker();
        });
        document.addEventListener("keydown", (event) => {
          const tag = (document.activeElement?.tagName || "").toLowerCase();
          if (
            event.key === "/" &&
            !["input", "textarea", "select"].includes(tag)
          ) {
            event.preventDefault();
            $("nav-search").focus();
          }
          if (
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase() === "s"
          ) {
            event.preventDefault();
            A.download(A.data, "padrao-html-autocontido-dados.json");
            A.toast("JSON exportado.");
          }
        });
        if (!location.hash)
          history.replaceState(null, "", A.routeUrl("doc", "visao"));
        A.render();
      })();
    </script>
  </body>
</html>
